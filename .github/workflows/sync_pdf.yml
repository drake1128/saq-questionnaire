name: Sync PDFs from Google Drive

# ----------------------------------------------------
# 1. 定義何時觸發這個工作流程 (Workflow)
# ----------------------------------------------------
on:
  # 排程觸發：設定每天定時執行
  # Cron 語法 '0 0 * * *' 表示每天 UTC 00:00 執行
  # (UTC 00:00 等同於台灣時間 (UTC+8) 的早上 8 點)
  schedule:
    - cron: '0 0 * * *'
    
  # 手動觸發：允許您隨時在 GitHub 網頁上手動啟動這個工作流程
  workflow_dispatch:

jobs:
  sync:
    # 這個工作 (job) 會在最新的 Ubuntu 虛擬機上執行
    runs-on: ubuntu-latest
    
    # ----------------------------------------------------
    # 2. 將 GitHub Secrets 傳遞給 Python 腳本
    # ----------------------------------------------------
    # env 區塊將 Secrets 轉換成環境變數，Python 腳本 (sync_pdfs.py) 才能讀取
    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      PDF_FOLDER_ID: ${{ secrets.PDF_FOLDER_ID }}

    steps:
    # 步驟 1: 取得儲存庫程式碼
    - name: Checkout code
      uses: actions/checkout@v4
      # 為了讓 git-auto-commit-action 能夠提交變更，需要完整的 fetch
      with:
        fetch-depth: 0 

    # 步驟 2: 設定 Python 環境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 步驟 3: 安裝必要的函式庫
    - name: Install dependencies
      # 安裝 Google API Python Client
      run: pip install google-api-python-client

    # 步驟 4: 執行 Python 同步腳本，並生成 index.html
    - name: Run sync script and generate index.html
      run: python sync_pdfs.py

    # 步驟 5: 自動提交並推送變更到儲存庫
    - name: Commit and Push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Docs: Auto-sync PDF list from Google Drive [skip ci]"
        # 僅提交 sync_pdfs.py 產生的 index.html
        file_pattern: index_pdf.html
        # [skip ci] 標記可以避免這次提交再次觸發 Actions，造成無限循環
