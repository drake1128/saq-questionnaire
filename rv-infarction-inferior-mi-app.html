<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>右心室梗塞 vs 下壁梗塞｜原理與右側導程</title>
<meta name="description" content="RV infarction 與 inferior MI 的解剖、電學、血流動力學原理，以及為什麼一定要做 V4R。">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1e3a5f; --primary-light:#2d5a87; --accent:#e74c3c; --accent-light:#ff6b5b;
  --success:#27ae60; --warning:#f39c12; --bg-cream:#faf8f5; --bg-card:#ffffff;
  --text-dark:#2c3e50; --text-muted:#7f8c8d; --border:#ecf0f1; --shadow:0 4px 20px rgba(0,0,0,.08);
  --rv:#e74c3c; --lv:#8e44ad;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg-cream);color:var(--text-dark);line-height:1.78;font-size:16px}
.app{max-width:780px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;
  padding:20px 18px 16px;display:flex;align-items:flex-start;gap:12px}
header .htxt{flex:1;min-width:0}
header h1{margin:0;font-size:19px;font-weight:700;line-height:1.4}
header .sub{margin:4px 0 0;font-size:13px;opacity:.88;font-weight:300}
.sharebtn{flex:0 0 auto;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
  color:#fff;border-radius:11px;min-width:48px;min-height:48px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;cursor:pointer;font-family:inherit;
  font-size:10px;font-weight:600;padding:4px 6px}
.sharebtn:active{background:rgba(255,255,255,.3)}
.sharebtn svg{width:19px;height:19px;fill:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:rgba(30,58,95,.95);
  color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;z-index:50;box-shadow:var(--shadow);
  max-width:90%;text-align:center}
main{padding:16px 14px}
.card{background:var(--bg-card);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 10px;color:var(--primary);font-weight:700}
.card h3{font-size:15px;margin:18px 0 8px;color:var(--primary-light);font-weight:600}
.card h3:first-child{margin-top:0}
p{margin:0 0 10px}
.muted{color:var(--text-muted);font-size:13px}
.keyline{border-left:4px solid var(--accent);background:#fff8f7;border-radius:0 12px 12px 0;
  padding:14px 16px;margin-bottom:14px;font-size:15.5px;font-weight:500}
.datum{background:#f4f8fb;border-radius:9px;padding:10px 12px;margin:9px 0;font-size:14px}
.datum b{color:var(--primary)}
.danger{background:#fdeeec;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
  padding:11px 13px;margin:10px 0;font-size:14px}
.danger b{color:var(--accent)}
.impl{background:#f0f9f3;border-left:3px solid var(--success);border-radius:0 8px 8px 0;
  padding:10px 12px;margin:10px 0;font-size:13.8px}
.impl b{color:var(--success)}
.warn{background:#fef7ea;border-left:3px solid var(--warning);border-radius:0 8px 8px 0;
  padding:10px 12px;margin:10px 0;font-size:13.8px}
.warn b{color:#b9770e}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
th,td{border-bottom:1px solid var(--border);padding:9px 6px;text-align:left;vertical-align:top}
th{color:var(--primary);font-weight:600;background:#f7fafc;font-size:13px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll table{min-width:520px}
svg.dia{width:100%;height:auto;display:block;margin:6px 0}
.segbtns{display:flex;gap:8px;margin:10px 0 4px}
.segbtn{flex:1;min-height:52px;border:1.5px solid var(--border);border-radius:11px;background:#fff;
  font-family:inherit;font-size:13.5px;font-weight:600;color:var(--text-muted);cursor:pointer;
  padding:8px 6px;line-height:1.35}
.segbtn.on{border-color:var(--accent);background:#fdeeec;color:var(--accent)}
.segbtn.on2{border-color:var(--primary-light);background:#eef3f8;color:var(--primary-light)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--text-muted);margin-top:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{position:relative;padding-left:34px;margin-bottom:12px;font-size:14.5px}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:2px;
  width:24px;height:24px;border-radius:8px;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.pill{display:inline-block;background:#eef3f8;color:var(--primary-light);border-radius:99px;
  padding:2px 10px;font-size:12px;font-weight:600;margin:0 6px 4px 0}
.pill.red{background:#fdeeec;color:var(--accent)}
.pill.grn{background:#eff9f3;color:var(--success)}
.qopt{width:100%;text-align:left;min-height:48px;border:1.5px solid var(--border);border-radius:11px;
  background:#fff;font-family:inherit;font-size:14.5px;color:var(--text-dark);
  padding:12px 14px;margin-bottom:8px;cursor:pointer;line-height:1.5}
.qopt.correct{border-color:var(--success);background:#eff9f3;font-weight:600}
.qopt.wrong{border-color:var(--accent);background:#fdeeec}
.expl{background:#f4f8fb;border-radius:11px;padding:13px;margin-top:10px;font-size:14px}
.progress{height:6px;border-radius:99px;background:var(--border);overflow:hidden;margin-bottom:14px}
.progress>div{height:100%;background:var(--primary-light);transition:width .3s}
.result{border-radius:14px;padding:18px;text-align:center}
.result.good{background:#eff9f3;border:2px solid var(--success)}
.result.mid{background:#fef7ea;border:2px solid var(--warning)}
.result.low{background:#fdeeec;border:2px solid var(--accent)}
.result .big{font-size:40px;font-weight:700;line-height:1.1}
.btn{width:100%;min-height:50px;border:none;border-radius:12px;background:var(--primary);color:#fff;
  font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;padding:12px}
.btn.ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn.accent{background:var(--accent)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20;box-shadow:0 -2px 14px rgba(0,0,0,.06)}
nav button{flex:1;min-height:60px;border:none;background:none;font-family:inherit;font-size:11.5px;
  font-weight:600;color:var(--text-muted);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;padding:6px 2px}
nav button.on{color:var(--primary)}
nav .dot{width:20px;height:20px;border-radius:7px;background:currentColor;opacity:.18}
nav button.on .dot{opacity:1}
footer{padding:20px 16px 30px;text-align:center;font-size:12px;color:var(--text-muted);line-height:1.9}
footer .sig{color:var(--text-dark);font-weight:600;font-size:13px}
@media print{nav,.btn,.sharebtn{display:none!important}body{background:#fff}
  .card{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}}

/* 血管攝影圖 */
.fig{background:#f7fafc;border:1px solid var(--border);border-radius:12px;padding:10px;margin:12px 0}
.fig img{width:100%;height:auto;display:block;border-radius:8px;background:#000}
.fig figcaption{font-size:12.8px;color:var(--text-muted);margin-top:8px;line-height:1.6}
.fig figcaption b{color:var(--text-dark)}
/* Share */
.shovl{position:fixed;inset:0;z-index:200;background:rgba(15,36,64,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px}
.shovl.on{display:flex}
.shbox{background:#fff;border-radius:16px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.shhead{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.shhead b{font-size:16px}
.shhead button{background:none;border:0;color:#fff;font-size:26px;line-height:1;cursor:pointer;padding:0 4px}
.shbody{padding:16px 20px 20px}
.shbody p{margin:0 0 12px;font-size:13.5px;color:var(--text-muted)}
.qrwrap{text-align:center;background:#faf8f5;border-radius:12px;padding:12px;margin-bottom:10px}
.qrwrap img{width:150px;height:150px;border-radius:8px}
.qrwrap small{display:block;color:var(--text-muted);font-size:12px;margin-top:6px}
.shbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:8px 0;padding:12px 16px;border:1px solid var(--border);border-radius:11px;background:#faf8f5;color:var(--text-dark);font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;transition:border-color .15s,background .15s}
.shbtn:hover,.shbtn.ok{border-color:var(--accent-light);background:#fdeeec}
.shbtn .ic{font-size:19px;flex-shrink:0;width:24px;text-align:center}
.shbtn small{display:block;font-weight:400;font-size:12px;color:var(--text-muted);margin-top:1px}
@media print{.shovl{display:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

/* ===== 分享 ===== */
const SHARE_TITLE = "右心室梗塞 vs 下壁梗塞：原理與右側導程";
const SHARE_TEXT  = "RV infarction 不是另一種梗塞，是「下壁梗塞的病灶有多近端」的標記。為什麼 12 導程看不到 RV、為什麼 NTG 之前一定要做 V4R——解剖、電學與血流動力學的完整說明。";

const ShareButton = () => {
  const doShare = () => { if (window.shOpen) window.shOpen(); };
  return (
    <button className="sharebtn" onClick={doShare} aria-label="分享">
      <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
      分享
    </button>
  );
};

/* ===== 圖一：RCA 分支與阻塞位置 ===== */
const RcaDiagram = () => {
  const [site, setSite] = useState("prox");
  const prox = site === "prox";
  const rvHit = prox;                 // RV free wall 只有近端阻塞才受影響
  const lvHit = true;                 // 兩種都會有下壁
  const avHit = true;                 // 兩種都影響 AV node（PDA 之前）
  const DEAD = "#e74c3c", LIVE = "#c9d6e2", TXT = "#2c3e50";
  const vesselAfter = DEAD;           // 阻塞點以下的血管

  return (
    <div>
      <div className="segbtns">
        <button className={"segbtn"+(prox?" on":"")} onClick={()=>setSite("prox")}>
          A. 近端 RCA 阻塞<br/><span style={{fontWeight:400,fontSize:12}}>acute marginal 之前</span>
        </button>
        <button className={"segbtn"+(!prox?" on2":"")} onClick={()=>setSite("dist")}>
          B. 遠端 RCA 阻塞<br/><span style={{fontWeight:400,fontSize:12}}>acute marginal 之後</span>
        </button>
      </div>

      <svg className="dia" viewBox="0 0 360 310" xmlns="http://www.w3.org/2000/svg">
        {/* 主動脈 */}
        <rect x="20" y="24" width="52" height="20" rx="6" fill="#95a5a6"/>
        <text x="46" y="38" textAnchor="middle" fontSize="11" fill="#fff" fontWeight="600">Aorta</text>

        {/* RCA 主幹：阻塞點以上正常 */}
        <path d="M46 44 L46 96" stroke={LIVE} strokeWidth="9" fill="none" strokeLinecap="round"/>
        {/* 近端段（A 與 B 之間）：A 阻塞時死，B 阻塞時活 */}
        <path d="M46 96 L46 152" stroke={prox?DEAD:LIVE} strokeWidth="9" fill="none" strokeLinecap="round"/>
        {/* 遠端段 + PDA：兩種都死 */}
        <path d="M46 152 L46 214 Q46 250 92 258 L176 272" stroke={DEAD} strokeWidth="9" fill="none" strokeLinecap="round"/>

        {/* 分支 */}
        <path d="M46 60 L104 52" stroke={LIVE} strokeWidth="5" fill="none" strokeLinecap="round"/>
        <text x="110" y="52" fontSize="11" fill={TXT}>Conus br.</text>

        <path d="M46 80 L104 74" stroke={LIVE} strokeWidth="5" fill="none" strokeLinecap="round"/>
        <text x="110" y="77" fontSize="11" fill={TXT}>SA nodal br.</text>

        {/* Acute marginal → RV free wall */}
        <path d="M46 128 L128 128" stroke={rvHit?DEAD:LIVE} strokeWidth="6" fill="none" strokeLinecap="round"/>
        <text x="110" y="120" fontSize="11" fill={rvHit?DEAD:TXT} fontWeight="600">Acute marginal br.</text>

        {/* AV nodal */}
        <path d="M46 196 L112 202" stroke={avHit?DEAD:LIVE} strokeWidth="5" fill="none" strokeLinecap="round"/>
        <text x="118" y="200" fontSize="11" fill={avHit?DEAD:TXT}>AV nodal br.</text>
        <text x="118" y="213" fontSize="10" fill="#7f8c8d">約 90% 來自 RCA</text>

        {/* PDA 標籤 */}
        <text x="120" y="288" fontSize="11" fill={DEAD} fontWeight="600">PDA</text>

        {/* RV free wall 區塊 */}
        <rect x="200" y="104" width="146" height="50" rx="10"
              fill={rvHit?"#fdeeec":"#f4f7fa"} stroke={rvHit?DEAD:"#c9d6e2"} strokeWidth="2"/>
        <text x="273" y="126" textAnchor="middle" fontSize="12.5" fontWeight="700"
              fill={rvHit?DEAD:"#8fa3b5"}>RV free wall</text>
        <text x="273" y="143" textAnchor="middle" fontSize="11"
              fill={rvHit?DEAD:"#8fa3b5"}>{rvHit ? "梗塞 → V4R 抬高" : "未受影響"}</text>

        {/* LV inferior wall 區塊 */}
        <rect x="200" y="248" width="146" height="50" rx="10"
              fill="#fdeeec" stroke={DEAD} strokeWidth="2"/>
        <text x="273" y="270" textAnchor="middle" fontSize="12.5" fontWeight="700" fill={DEAD}>LV 下壁</text>
        <text x="273" y="287" textAnchor="middle" fontSize="11" fill={DEAD}>梗塞 → II、III、aVF 抬高</text>

        {/* 阻塞標記 */}
        <g>
          <circle cx="46" cy="96" r="11" fill={prox?"#c0392b":"#fff"} stroke="#c0392b" strokeWidth="2.5"/>
          <text x="46" y="100" textAnchor="middle" fontSize="12" fontWeight="700"
                fill={prox?"#fff":"#c0392b"}>A</text>
        </g>
        <g>
          <circle cx="46" cy="152" r="11" fill={!prox?"#2d5a87":"#fff"} stroke="#2d5a87" strokeWidth="2.5"/>
          <text x="46" y="156" textAnchor="middle" fontSize="12" fontWeight="700"
                fill={!prox?"#fff":"#2d5a87"}>B</text>
        </g>
      </svg>

      <div className="legend">
        <span><i style={{background:"#e74c3c"}}/>缺血／梗塞區</span>
        <span><i style={{background:"#c9d6e2"}}/>灌流正常</span>
      </div>

      <div className={prox ? "danger" : "impl"} style={{marginTop:12}}>
        {prox
          ? <><b>近端阻塞：</b>acute marginal 被截斷，<b>RV free wall 與 LV 下壁一起梗塞</b>。V4R 會抬高，血流動力學進入 preload-dependent 狀態，AV block 風險同時升高。</>
          : <><b>遠端阻塞：</b>acute marginal 已分出，<b>RV 逃過一劫，只有下壁梗塞</b>。V4R 不會抬高，血流動力學通常穩定，處置回到標準 STEMI 路徑。</>}
      </div>
    </div>
  );
};

/* ===== 圖二：導程位置 ===== */
const LeadDiagram = () => (
  <div>
    <svg className="dia" viewBox="0 0 360 250" xmlns="http://www.w3.org/2000/svg">
      {/* 軀幹 */}
      <path d="M70 26 Q180 4 290 26 L302 210 Q180 232 58 210 Z" fill="#fdf1ee" stroke="#e0c3bb" strokeWidth="2"/>
      {/* 胸骨中線 */}
      <line x1="180" y1="14" x2="180" y2="222" stroke="#d8c2bb" strokeWidth="1.5" strokeDasharray="5 5"/>
      <text x="180" y="246" textAnchor="middle" fontSize="10.5" fill="#a1887f">胸骨中線</text>

      {/* 標準左側導程 V1-V6 */}
      {[["V1",164,106],["V2",196,106],["V3",212,126],["V4",228,146],["V5",254,150],["V6",278,154]].map(([l,x,y])=>(
        <g key={l}>
          <circle cx={x} cy={y} r="10" fill="#2d5a87"/>
          <text x={x} y={y+4} textAnchor="middle" fontSize="10" fill="#fff" fontWeight="700">{l}</text>
        </g>
      ))}
      {/* 右側導程 */}
      {[["V4R",132,146],["V5R",106,150],["V6R",82,154]].map(([l,x,y])=>(
        <g key={l}>
          <circle cx={x} cy={y} r="12" fill="#e74c3c"/>
          <text x={x} y={y+4} textAnchor="middle" fontSize="9.5" fill="#fff" fontWeight="700">{l}</text>
        </g>
      ))}
      {/* V4R 強調 */}
      <circle cx="132" cy="146" r="19" fill="none" stroke="#e74c3c" strokeWidth="2" strokeDasharray="4 3"/>
      <text x="132" y="185" textAnchor="middle" fontSize="11" fill="#c0392b" fontWeight="700">V4R</text>
      <text x="132" y="199" textAnchor="middle" fontSize="10" fill="#c0392b">右鎖骨中線・第五肋間</text>

      <text x="180" y="46" textAnchor="middle" fontSize="11" fill="#7f8c8d">（面向病人的視角：畫面左側＝病人右側為紅點側）</text>
    </svg>
    <div className="legend">
      <span><i style={{background:"#2d5a87"}}/>標準 V1–V6</span>
      <span><i style={{background:"#e74c3c"}}/>右側導程 V4R–V6R</span>
    </div>
    <div className="warn">
      <b>最省事的做法：</b>不必重貼一整組。<b>把 V4 移到 V4R 的位置，再記錄一次 12 導程即可</b>，並在紙上手寫註明「V4R」。若時間允許，完整記錄 V3R–V6R 更好。
    </div>
    <div className="danger">
      <b>一定要標註。</b>沒有標記的右側導程，下一位讀圖的人會把它當成前壁導程判讀，可能得出完全相反的結論。
    </div>
  </div>
);

/* ===== 小測驗 ===== */
const QUESTIONS = [
  {q:"下壁梗塞合併右心室梗塞，最主要反映的是什麼？",
   o:["兩條不同血管同時阻塞","RCA 阻塞位置較近端（acute marginal 之前）","左迴旋支為 dominant","冠狀動脈痙攣"],
   c:1,
   e:"RV free wall 由 RCA 的 acute marginal branches 供應。阻塞在其之前 → RV + 下壁；之後 → 只有下壁。所以「有沒有 RV」等同於「病灶多近端」。"},
  {q:"為什麼標準 12 導程常常看不出右心室梗塞？",
   o:["RV 沒有電活動","V1–V6 都在左前胸，RV 的 injury current 被 LV 向量淹沒","RV 梗塞不會產生 ST 變化","必須等 24 小時後才會顯現"],
   c:1,
   e:"RV 壁厚約為 LV 的三分之一，訊號小；且常合併的後壁 injury current 在 V1–V3 呈 ST 壓低，與 RV 的抬高方向相反，兩者可互相抵銷。"},
  {q:"V4R ST 抬高 ≥1mm 診斷 RV 梗塞的表現，何者較接近？",

const Quiz = () => {
  const [i,setI]=useState(0); const [sel,setSel]=useState(null);
  const [picks,setPicks]=useState([]); const [done,setDone]=useState(false);
  const q=QUESTIONS[i];
  const score=picks.filter((p,k)=>p===QUESTIONS[k].c).length;
  const answer=k=>{ if(sel!==null) return; setSel(k); setPicks([...picks,k]); };
  const next=()=>{ if(i<QUESTIONS.length-1){setI(i+1);setSel(null);} else setDone(true); };
  const restart=()=>{setI(0);setSel(null);setPicks([]);setDone(false);};

  if(done){
    const p=score/QUESTIONS.length;
    const cls=p>=.85?"good":p>=.6?"mid":"low";
    const band=p>=.85?"掌握良好":p>=.6?"大致理解":"建議重讀原理";
    return (
      <div className="card">
        <h2>測驗結果</h2>
        <div className={"result "+cls}>
          <div className="muted">答對題數</div>
          <div className="big">{score}<span style={{fontSize:20,color:"#7f8c8d"}}> / {QUESTIONS.length}</span></div>
          <div style={{fontWeight:700,fontSize:17}}>{band}</div>
        </div>
        <h3>逐題檢視</h3>
        {QUESTIONS.map((qq,k)=>{
          const ok=picks[k]===qq.c;
          return (
            <div key={k} style={{borderTop:"1px solid #ecf0f1",padding:"10px 0",fontSize:13.5}}>
              <div style={{fontWeight:600,marginBottom:3}}>{ok?"✅":"❌"} 第 {k+1} 題　{qq.q}</div>
              {!ok && <div style={{color:"#e74c3c"}}>你的作答：{qq.o[picks[k]]}</div>}
              <div style={{color:"#27ae60"}}>正解：{qq.o[qq.c]}</div>
              <div className="muted" style={{marginTop:3}}>{qq.e}</div>
            </div>
          );
        })}
        <button className="btn accent" onClick={restart}>重新測驗</button>
      </div>
    );
  }

  return (
    <div className="card">
      <h2>自我檢測（共 {QUESTIONS.length} 題）</h2>
      <div className="progress"><div style={{width:(i/QUESTIONS.length*100)+"%"}}/></div>
      <p className="muted" style={{marginBottom:12}}>第 {i+1} 題 / 共 {QUESTIONS.length} 題　·　目前答對 {score} 題</p>
      <p style={{fontWeight:600,fontSize:16,marginBottom:14}}>{q.q}</p>
      {q.o.map((opt,k)=>{
        let cls="qopt";
        if(sel!==null){ if(k===q.c) cls+=" correct"; else if(k===sel) cls+=" wrong"; }
        return <button key={k} className={cls} disabled={sel!==null} onClick={()=>answer(k)}>{opt}</button>;
      })}
      {sel!==null && (
        <div className="expl">
          <div style={{fontWeight:700,marginBottom:6,color:sel===q.c?"#27ae60":"#e74c3c"}}>
            {sel===q.c?"✅ 正確":"❌ 不正確"}
          </div>
          <div>{q.e}</div>
          <button className="btn" onClick={next}>{i<QUESTIONS.length-1?"下一題":"查看總分"}</button>
        </div>
      )}
    </div>
  );
};

            <h3>看攝影時要問的一個問題</h3>
            <p><b>Culprit lesion 在 RV branch 的近端還是遠端？</b>這就是圖一 A／B 的差別：</p>
            <div className="danger"><b>近端（RV branch 之前）：</b>RV free wall 一起缺血 → 下壁梗塞合併 RV 梗塞。V4R 抬高、低血壓、頸靜脈怒張、肺野清澈的組合就是從這裡來的。</div>
            <div className="impl"><b>遠端（RV branch 之後）：</b>只有下壁（± 後壁）。RV branch 仍有血流，血流動力學通常穩定得多。</div>
            <h3>三個常見的影像陷阱</h3>
            <ul style={{paddingLeft:20,margin:"0 0 6px",fontSize:14.5}}>
              <li style={{marginBottom:6}}><b>RV branch 常不只一條。</b>有的人是好幾條小的 acute marginal，單看一條「有沒有顯影」會誤判；要看的是 RV free wall 整體的供血。</li>
              <li style={{marginBottom:6}}><b>Conus branch 可能獨立開口。</b>約半數的人 conus branch 直接從主動脈開口，攝影時導管可能沒有 engage 到，不代表它閉塞。</li>
              <li><b>近端 RCA 完全閉塞時，遠端可能靠側枝顯影。</b>從 LAD 的 septal 側枝回填 PDA 時，容易誤以為病灶在遠端；要回頭找閉塞的「起點」。</li>
            </ul>
            <p className="muted">圖片來源：教學用示意圖與臨床攝影標註，僅供教育用途。</p>
          </div>
          <div className="card">
            <h2>第三種情況：LCx-dominant</h2>
            <p>約 10% 的人是 left dominant，下壁由 LCx 的 PDA 供應。這種下壁梗塞<b>不可能</b>合併 RV 梗塞——RV free wall 根本不歸 LCx 管。</p>
            <div className="impl"><b>反過來推：</b>下壁 STEMI 若 V4R 明顯抬高，幾乎可以確定是 <b>right dominant 的近端 RCA 病灶</b>。這在術前規劃時是有用的資訊。</div>
            <h3>從標準 12 導程先預判近端 RCA</h3>
            <div className="scroll"><table>
              <thead><tr><th>線索</th><th>意義</th></tr></thead>
              <tbody>
                <tr><td><b>III 抬高幅度 &gt; II</b></td><td>RCA 病灶（而非 LCx）；向量偏右</td></tr>
                <tr><td><b>I 與 aVL 出現 reciprocal 壓低</b></td><td>支持 RCA 而非 LCx</td></tr>
                <tr><td><b>V1 ST 抬高</b></td><td>近端 RCA、RV 侵犯的提示</td></tr>
                <tr><td><b>V1 等電位但 V2 明顯壓低</b></td><td>RV 抬高被後壁壓低抵銷的痕跡</td></tr>
                <tr><td><b>合併 AV block、bradycardia</b></td><td>AV nodal branch 受累，病灶偏近端</td></tr>
              </tbody>
            </table></div>
            <div className="warn"><b>但這些只是提高懷疑，不能取代 V4R。</b>看到這些線索應該更快去做右側導程，而不是用它們代替右側導程。</div>
          </div>
        </>}

        {tab==="ecg" && <>
          <div className="card">
            <h2>為什麼 12 導程看不到 RV</h2>
            <p>這是整個主題最反直覺的一段，有兩個獨立的機轉疊加。</p>
            <h3>機轉一：訊號被淹沒</h3>
            <p>V1 到 V6 全部貼在<b>左前胸</b>。即使 V1、V2 位於右側胸骨旁，它們的探測方向仍被巨大的 LV 電動勢主導。RV 壁厚只有 LV 的<b>三分之一</b>左右，其 injury current 太小，在標準導程上會被 LV 的向量蓋過去。</p>
            <h3>機轉二：訊號互相抵銷</h3>
            <p>下壁梗塞常合併<b>後壁（posterior wall）侵犯</b>。兩者在前胸導程的表現方向相反：</p>
            <div className="scroll"><table>
              <thead><tr><th>來源</th><th>在 V1–V3 的表現</th></tr></thead>
              <tbody>
                <tr><td>RV injury current</td><td style={{color:"#e74c3c",fontWeight:600}}>ST 抬高</td></tr>
                <tr><td>Posterior wall injury current</td><td style={{color:"#2d5a87",fontWeight:600}}>ST 壓低</td></tr>
                <tr><td>兩者並存</td><td><b>可能互相抵銷到看起來完全正常</b></td></tr>
              </tbody>
            </table></div>
            <div className="danger"><b>所以「V1 有沒有抬高」是個不可靠的指標。</b>V1 正常不能排除 RV 梗塞——它可能只是被後壁抵銷掉了。</div>
          </div>
          <div className="card">
            <h2>解法：把電極移到 RV 上方</h2>
            <p>唯一的辦法是讓電極直接面對 RV free wall。<b>V4R 位於右側鎖骨中線第五肋間</b>，正對 RV。</p>
            <LeadDiagram/>
          </div>
          <div className="card">
            <h2>判讀與時效</h2>
            <div className="datum"><b>V4R ST 抬高 ≥ 1 mm</b> 診斷 RV 梗塞：sensitivity 約 <b>88%</b>、specificity 約 <b>78%</b>（Zehender 等，NEJM 1993）。</div>
            <div className="danger">
              <b>最常被漏掉的一點：V4R 的 ST 抬高是短暫的。</b>它可能在症狀發作後 <b>10–12 小時內就消失</b>。所以這不是「有空再做」的檢查——做晚了會得到偽陰性，而偽陰性在這裡的代價是接下來的 NTG。
            </div>
            <div className="impl"><b>操作結論：</b>把「右側導程」放進 inferior STEMI 的 triage bundle，與第一份 12 導程幾乎同時完成，而不是放在醫囑清單的下半段。</div>
          </div>
        </>}

        {tab==="hemo" && <>
          <div className="card">
            <h2>真正非做不可的理由</h2>
            <p>如果只是為了知道病灶多近端，其實上台一打顯影劑就看到了，不必多此一舉。<b>真正的理由是它會立刻改變導管室之前的處置。</b></p>
            <p>RV 梗塞後，RV 從一個 active pump 變成<b>一根被動的管子</b>。此時 LV 的 preload 完全依賴「右心系統把血推過去」的能力，於是整個 cardiac output 變成 <b>preload-dependent</b>。</p>
            <div className="keyline" style={{fontSize:15}}>
              經典三聯徵：<br/>
              <b>低血壓　＋　頸靜脈怒張　＋　肺野清澈</b>
            </div>
            <p className="muted">「肺野清澈」是關鍵鑑別點——它把 RV 梗塞與 LV 衰竭造成的心因性休克分開。同樣是低血壓，處置方向完全相反。</p>
          </div>
          <div className="card">
            <h2>四個臨床後果</h2>
            <h3><span className="pill red">1</span>Nitrate、morphine、diuretics 會要命</h3>
            <p>這三樣都降 preload，在 RV 梗塞病人身上可以<b>在幾分鐘內把血壓打到底</b>。這就是為什麼「所有 inferior STEMI 給 NTG 之前先做右側導程」應該是一條硬規則，而不是建議。</p>

            <h3><span className="pill red">2</span>輸液不是無上限的</h3>
            <p>直覺上「preload-dependent 就一直灌」是錯的。RV 急性擴張會透過 <b>ventricular interdependence</b> 把 septum 往左推，加上心包的 constraint，反而壓迫 LV 使其填充更差。</p>
            <div className="impl"><b>操作方式：</b>500–1000 mL 後<b>重新評估</b>，沒反應就上 <b>dobutamine</b>，而不是一路灌下去。灌到 RV 撐大反而更糟。</div>

            <h3><span className="pill red">3</span>AV block 風險高</h3>
            <p>AV nodal artery 約 <b>90% 來自 RCA</b>。近端阻塞會同時打擊 RV 與傳導系統，所以 RV 梗塞常與 bradycardia、AV block 結伴出現。</p>

            <h3><span className="pill red">4</span>Atrial kick 特別重要</h3>
            <p>RV 梗塞的病人高度依賴心房收縮來充填僵硬的 RV。若需要 pacing，<b>AV sequential 遠優於 VVI</b>——這是少數 VVI 會讓病人明顯變壞的臨床情境。同理，新發生的 AF 在這類病人身上耐受性特別差。</p>
          </div>
          <div className="card">
            <h2>處置順序</h2>
            <ul className="steps">
              <li><b>右側導程</b>（在 NTG 之前）</li>
              <li><b>停用／避免</b> nitrate、morphine、diuretics</li>
              <li><b>輸液</b> 500–1000 mL，重新評估血壓與灌流</li>
              <li><b>無反應加 inotrope</b>（dobutamine）</li>
              <li><b>維持房室同步</b>；需 pacing 時用 AV sequential</li>
              <li><b>儘速再灌流</b>——這才是根本治療，前面五項都只是撐到打通為止</li>
            </ul>
          </div>
          <div className="card">
            <h2>順帶一提的好消息</h2>
            <p>RV 的預後其實不錯。壁薄、氧需求低、<b>收縮期與舒張期都有灌流</b>、側枝豐富，還可以從心腔直接經 Thebesian veins 取得部分氧供。血管打通後，RV 功能通常會實質恢復。</p>
            <div className="warn"><b>但急性期不要低估。</b>合併 RV 侵犯的下壁梗塞，院內死亡率大約是單純下壁梗塞的三到四倍。RV 是「撐過去就好」，不是「不用管」。</div>
          </div>
          <div className="card">
            <h2>實務上的三件事</h2>
            <ul className="steps">
              <li><b>每一個 inferior STEMI 都做右側導程，而且是在給 NTG 之前。</b>最簡便的做法是把 V4 移到 V4R 記錄一次，或完整記錄 V3R–V6R。</li>
              <li><b>記得標註。</b>沒標的話，下一位讀圖的人會把它讀成前壁。</li>
              <li><b>在標準 12 導程上先找近端 RCA 的線索：</b>III 抬高 &gt; II、I 與 aVL 有 reciprocal 壓低、V1 抬高（或 V1 等電位但 V2 壓低）。看到這些就更該做。</li>
            </ul>
          </div>
        </>}

        {tab==="quiz" && <Quiz/>}
      </main>

      <footer>
        <div className="sig">資料整理</div>
        <div className="sig">謝慕揚 醫師　MD, PhD, FESC</div>
        <div className="sig">結構性心臟病與介入心臟學</div>
        <div style={{marginTop:12}}>
          本內容為教學整理，未必涵蓋所有相關文獻<br/>
          僅供學術與教育用途，不代表任何單位之官方立場<br/>
          本內容未涉及任何利益衝突
        </div>
        <div style={{marginTop:10,fontSize:11}}>
          臨床處置應依病人個別狀況與當地治療準則判斷。本頁不儲存任何使用者資料。
        </div>
      </footer>

      {toast && <div className="toast">{toast}</div>}

      <nav>
        {TABS.map(t=>(
          <button key={t.id} className={tab===t.id?"on":""} onClick={()=>go(t.id)}>
            <div className="dot"/>{t.label}
          </button>
        ))}
      </nav>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
var SH_CANON="https://drake1128.github.io/saq-questionnaire/rv-infarction-inferior-mi-app.html";
var SH_PAGE=(location.protocol==="http:"||location.protocol==="https:")?location.href.split("#")[0]:SH_CANON;
var SH_TITLE="右心室梗塞 vs 下壁梗塞：原理與右側導程";
var SH_TEXT="RV infarction 不是另一種梗塞，是「下壁梗塞的病灶有多近端」的標記。為什麼 12 導程看不到 RV、為什麼 NTG 之前一定要做 V4R——解剖、電學與血流動力學的完整說明。";
document.getElementById("shLine").href="https://social-plugins.line.me/lineit/share?url="+encodeURIComponent(SH_PAGE);
document.getElementById("shMail").href="mailto:?subject="+encodeURIComponent(SH_TITLE)+"&body="+encodeURIComponent(SH_TEXT+"\n\n"+SH_PAGE);
document.getElementById("shQr").src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data="+encodeURIComponent(SH_PAGE);

function shOpen(){document.getElementById("shovl").classList.add("on");}
function shClose(){document.getElementById("shovl").classList.remove("on");}
document.addEventListener("keydown",function(e){if(e.key==="Escape")shClose();});
function shNativeGo(){navigator.share({title:SH_TITLE,text:SH_TEXT,url:SH_PAGE}).catch(function(){});}
function shCopy(url,id){
  var b=document.getElementById(id), sp=b.querySelector("span:last-child");
  var done=function(){var o=sp.innerHTML; b.classList.add("ok"); sp.innerHTML="已複製到剪貼簿 ✓"; setTimeout(function(){sp.innerHTML=o;b.classList.remove("ok");},1800);};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(url).then(done).catch(function(){shFallback(url,done);});}
  else{shFallback(url,done);}
}
function shFallback(url,done){
  var t=document.createElement("textarea"); t.value=url; t.style.position="fixed"; t.style.opacity="0";
  document.body.appendChild(t); t.select();
  try{document.execCommand("copy");done();}catch(e){prompt("請複製此連結：",url);}
  document.body.removeChild(t);
}
</script>
