<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCU 工作手冊 - 新竹台大分院心血管中心</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1a365d; --primary-light: #2c5282; --accent: #e53e3e;
            --success: #38a169; --warning: #d69e2e; --info: #3182ce;
            --purple: #805ad5; --teal: #319795; --orange: #dd6b20;
            --bg-dark: #0f172a; --bg-card: #1e293b; --bg-card-hover: #334155;
            --text-light: #f1f5f9; --text-muted: #94a3b8; --border-color: #334155;
        }
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark); color: var(--text-light);
            line-height: 1.7; min-height: 100vh; -webkit-font-smoothing: antialiased;
        }
        #root { min-height: 100vh; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const Icons = {
            Heart: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>,
            HeartPulse: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>,
            Check: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>,
            Arrow: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8-8-8z"/></svg>,
            Back: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>,
            Warning: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>,
            Quiz: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/></svg>,
            Medical: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M19 3H5c-1.1 0-1.99.9-1.99 2L3 19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/></svg>,
            Checklist: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>,
            Pill: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M4.22 11.29l9.07-9.07c1.17-1.17 3.07-1.17 4.24 0l4.25 4.25c1.17 1.17 1.17 3.07 0 4.24l-9.07 9.07c-1.17 1.17-3.07 1.17-4.24 0l-4.25-4.25c-1.17-1.17-1.17-3.07 0-4.24zm1.41 4.24l4.24 4.25 4.54-4.54-4.24-4.25-4.54 4.54z"/></svg>,
            Emergency: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/></svg>,
            Document: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>,
            Safety: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>,
            Clock: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>,
            Bed: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/></svg>,
            Book: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>,
            Info: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>,
            Expand: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>,
            ChevronRight: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>,
            Syringe: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M11.15 15.18l-1.77 1.77 2.83 2.83 1.77-1.77-2.83-2.83z"/></svg>,
            Heartbeat: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>,
            Stethoscope: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M19 8c-1.66 0-3 1.34-3 3 0 .55.15 1.06.4 1.5L15 14v-2c0-3.31-2.69-6-6-6h-.5V4.82C8.77 4.4 9 3.74 9 3c0-1.66-1.34-3-3-3S3 1.34 3 3c0 .74.23 1.4.5 1.82V6H3c-1.1 0-2 .9-2 2v2c0 3.31 2.69 6 6 6v4c0 1.1.9 2 2 2h4c1.1 0 2-.9 2-2v-1.5l1.6 1.1c.35.25.79.4 1.26.4 1.1 0 2-.9 2-2v-2.5c1.16-.44 2-1.55 2-2.86 0-1.66-1.34-3-3-3z"/></svg>,
            Hospital: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M19 3H5c-1.1 0-1.99.9-1.99 2L3 19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/></svg>,
            Refresh: () => <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        };

        const menuItems = [
            { id: 'daily-checklist', title: '每日工作檢查表', subtitle: 'Daily Checklist', icon: 'Checklist', color: '#3182ce', description: '查房前準備、交班重點、疾病認證' },
            { id: 'safety-cases', title: '安全案例宣導', subtitle: 'Safety Cases', icon: 'Safety', color: '#e53e3e', description: '用藥錯誤、併發症預防' },
            { id: 'acs-orders', title: 'ACS 常規醫囑', subtitle: 'ACS Orders', icon: 'HeartPulse', color: '#dd6b20', description: '檢查、藥物、心導管前後照護' },
            { id: 'hf-certification', title: '心衰竭疾病認證', subtitle: 'HF Certification', icon: 'Heart', color: '#805ad5', description: '收案條件、文字醫囑、病程紀錄' },
            { id: 'special-care', title: '特殊術後照護', subtitle: 'Special Care', icon: 'Bed', color: '#319795', description: '頸動脈支架、暫時性心律調節器' },
            { id: 'drugs-reference', title: '常用藥物速查', subtitle: 'Drug Reference', icon: 'Pill', color: '#38a169', description: '抗血小板、抗凝血藥物劑量' },
            { id: 'emergency', title: '緊急情況處理', subtitle: 'Emergency', icon: 'Emergency', color: '#c53030', description: '心跳停止、STEMI、心因性休克' },
            { id: 'chart-writing', title: '病歷寫作指引', subtitle: 'Chart Writing', icon: 'Document', color: '#2c5282', description: '診斷、病史、理學檢查記錄' },
            { id: 'quiz', title: '自我測驗', subtitle: 'Self Quiz', icon: 'Quiz', color: '#d69e2e', description: '測試你的 CCU 工作知識' }
        ];

        const Header = ({ title, subtitle, onBack, showBack = true }) => (
            <div style={{ background: 'linear-gradient(135deg, #1a365d 0%, #2c5282 100%)', padding: '20px', paddingTop: '40px', position: 'sticky', top: 0, zIndex: 100, boxShadow: '0 4px 20px rgba(0,0,0,0.3)' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                    {showBack && <button onClick={onBack} style={{ background: 'rgba(255,255,255,0.15)', border: 'none', borderRadius: '12px', padding: '10px', cursor: 'pointer', color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icons.Back /></button>}
                    <div style={{ flex: 1 }}>
                        <h1 style={{ fontSize: showBack ? '20px' : '24px', fontWeight: '700' }}>{title}</h1>
                        {subtitle && <p style={{ fontSize: '13px', opacity: 0.8, marginTop: '4px' }}>{subtitle}</p>}
                    </div>
                </div>
            </div>
        );

        const ExpandableSection = ({ title, icon, color, children, defaultExpanded = false }) => {
            const [isExpanded, setIsExpanded] = useState(defaultExpanded);
            const IconComponent = Icons[icon];
            return (
                <div style={{ background: 'var(--bg-card)', borderRadius: '16px', overflow: 'hidden', marginBottom: '12px', border: '1px solid var(--border-color)' }}>
                    <button onClick={() => setIsExpanded(!isExpanded)} style={{ width: '100%', padding: '16px 20px', background: 'transparent', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '12px', color: 'var(--text-light)' }}>
                        <div style={{ width: '40px', height: '40px', borderRadius: '12px', background: color + '20', display: 'flex', alignItems: 'center', justifyContent: 'center', color: color }}>{IconComponent && <IconComponent />}</div>
                        <span style={{ flex: 1, textAlign: 'left', fontWeight: '600', fontSize: '16px' }}>{title}</span>
                        <div style={{ transform: isExpanded ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.3s ease' }}><Icons.Expand /></div>
                    </button>
                    {isExpanded && <div style={{ padding: '0 20px 20px', animation: 'fadeIn 0.3s ease' }}>{children}</div>}
                </div>
            );
        };

        const ChecklistItem = ({ text, checked, onChange, highlight }) => (
            <div onClick={onChange} style={{ display: 'flex', alignItems: 'flex-start', gap: '12px', padding: '14px 16px', background: checked ? 'rgba(56, 161, 105, 0.1)' : 'rgba(255,255,255,0.03)', borderRadius: '12px', cursor: 'pointer', marginBottom: '8px', border: highlight ? '2px solid var(--warning)' : '1px solid transparent', transition: 'all 0.2s ease' }}>
                <div style={{ width: '24px', height: '24px', borderRadius: '8px', border: checked ? 'none' : '2px solid var(--text-muted)', background: checked ? 'var(--success)' : 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, marginTop: '2px' }}>{checked && <Icons.Check />}</div>
                <span style={{ flex: 1, fontSize: '15px', lineHeight: '1.5', color: checked ? 'var(--text-muted)' : 'var(--text-light)', textDecoration: checked ? 'line-through' : 'none' }}>{text}</span>
            </div>
        );

        const DrugTable = ({ drugs }) => (
            <div style={{ overflowX: 'auto' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '14px' }}>
                    <thead><tr style={{ background: 'rgba(255,255,255,0.05)' }}><th style={{ padding: '12px', textAlign: 'left', borderBottom: '1px solid var(--border-color)' }}>藥物</th><th style={{ padding: '12px', textAlign: 'left', borderBottom: '1px solid var(--border-color)' }}>Loading</th><th style={{ padding: '12px', textAlign: 'left', borderBottom: '1px solid var(--border-color)' }}>維持劑量</th><th style={{ padding: '12px', textAlign: 'left', borderBottom: '1px solid var(--border-color)' }}>注意</th></tr></thead>
                    <tbody>{drugs.map((drug, idx) => (<tr key={idx} style={{ background: idx % 2 === 0 ? 'transparent' : 'rgba(255,255,255,0.02)' }}><td style={{ padding: '12px', borderBottom: '1px solid var(--border-color)', fontWeight: '500' }}>{drug.name}</td><td style={{ padding: '12px', borderBottom: '1px solid var(--border-color)', color: 'var(--warning)' }}>{drug.loading}</td><td style={{ padding: '12px', borderBottom: '1px solid var(--border-color)' }}>{drug.maintenance}</td><td style={{ padding: '12px', borderBottom: '1px solid var(--border-color)', color: 'var(--text-muted)', fontSize: '13px' }}>{drug.note}</td></tr>))}</tbody>
                </table>
            </div>
        );

        const SafetyCaseCard = ({ caseNumber, title, content, lesson, severity = 'high' }) => (
            <div style={{ background: severity === 'high' ? 'linear-gradient(135deg, rgba(229, 62, 62, 0.15) 0%, rgba(197, 48, 48, 0.08) 100%)' : 'linear-gradient(135deg, rgba(214, 158, 46, 0.15) 0%, rgba(183, 121, 31, 0.08) 100%)', borderRadius: '16px', padding: '20px', marginBottom: '16px', border: '1px solid ' + (severity === 'high' ? 'rgba(229, 62, 62, 0.3)' : 'rgba(214, 158, 46, 0.3)') }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '12px' }}><div style={{ background: severity === 'high' ? 'var(--accent)' : 'var(--warning)', color: 'white', padding: '4px 12px', borderRadius: '20px', fontSize: '12px', fontWeight: '600' }}>案例 {caseNumber}</div><span style={{ fontSize: '14px', fontWeight: '600', color: severity === 'high' ? '#fc8181' : '#fbd38d' }}>{title}</span></div>
                <p style={{ fontSize: '14px', lineHeight: '1.7', marginBottom: '16px', color: 'var(--text-light)' }}>{content}</p>
                <div style={{ background: 'rgba(56, 161, 105, 0.15)', borderLeft: '3px solid var(--success)', padding: '12px 16px', borderRadius: '0 8px 8px 0' }}><p style={{ fontSize: '13px', fontWeight: '500', color: '#68d391' }}><strong>學習重點：</strong>{lesson}</p></div>
            </div>
        );

        const QuizSection = () => {
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [showResult, setShowResult] = useState(false);
            const [score, setScore] = useState(0);
            const [answered, setAnswered] = useState([]);
            const questions = [
                { question: "Brilinta (Ticagrelor) 的正確給藥頻率是？", options: ["QD", "BID", "TID", "Q8H"], correct: 1, explanation: "Brilinta 為 BID 劑型 (90mg bid)，開立錯誤成 QD 是常見的用藥錯誤。" },
                { question: "移除 femoral sheath 前，ACT 應該低於多少？", options: ["100 sec", "150 sec", "200 sec", "250 sec"], correct: 1, explanation: "移除前 ACT < 150 seconds 才可移除。" },
                { question: "Heparin 的標準 loading dose 是多少？", options: ["40 U/kg", "50 U/kg", "60 U/kg", "80 U/kg"], correct: 2, explanation: "Heparin 標準 loading dose 為 60 U/kg。" },
                { question: "已使用 DAPT 和 heparin，應避免在哪裡建立 arterial line？", options: ["Radial artery", "Brachial artery", "Femoral artery", "Dorsalis pedis"], correct: 1, explanation: "在 brachial artery 穿刺可能造成 compartment syndrome。" },
                { question: "STEMI 病患的 Door-to-balloon time 目標是？", options: ["< 60 分鐘", "< 90 分鐘", "< 120 分鐘", "< 180 分鐘"], correct: 1, explanation: "Door-to-balloon time 目標為 < 90 分鐘。" },
                { question: "移除 femoral sheath 後，沙袋加壓時間應該多久？", options: ["2-4 小時", "4-6 小時", "6-8 小時", "8-10 小時"], correct: 1, explanation: "2 公斤沙袋加壓 4-6 小時，平躺 6-8 小時。" },
                { question: "Efient (Prasugrel) 禁用於哪類病患？", options: ["糖尿病", "腎功能不全", "TIA/stroke 病史", "年齡 > 75 歲"], correct: 2, explanation: "Efient 不得用於有 TIA 或 stroke 病史的病患。" },
                { question: "Troponin-T 的正常值上限是？", options: ["< 0.01 ng/mL", "< 0.05 ng/mL", "< 0.1 ng/mL", "< 0.5 ng/mL"], correct: 2, explanation: "高敏感度 Troponin-T 正常值為 < 0.1 ng/mL。" },
                { question: "使用 heparin 輸注時，應該多久檢查一次 aPTT？", options: ["Q2H", "Q4H", "Q6H", "Q12H"], correct: 2, explanation: "使用 heparin 輸注時需 check aPTT q6h。" },
                { question: "頸動脈支架術後低血壓，NS hydration 速度應為？", options: ["100-200 ml/hr", "250-500 ml/hr", "500-750 ml/hr", "750-1000 ml/hr"], correct: 1, explanation: "0.9% NS hydration 速度為 250-500 ml/hour。" }
            ];
            const handleAnswer = (index) => { if (answered.includes(currentQuestion)) return; setSelectedAnswer(index); setAnswered([...answered, currentQuestion]); if (index === questions[currentQuestion].correct) setScore(score + 1); };
            const nextQuestion = () => { if (currentQuestion < questions.length - 1) { setCurrentQuestion(currentQuestion + 1); setSelectedAnswer(null); } else setShowResult(true); };
            const resetQuiz = () => { setCurrentQuestion(0); setSelectedAnswer(null); setShowResult(false); setScore(0); setAnswered([]); };

        const HFCertificationPage = ({ onBack }) => (<div className="fade-in"><Header title="心衰竭疾病認證" subtitle="HF Certification" onBack={onBack} /><div style={{ padding: '20px' }}><ExpandableSection title="評估收案條件" icon="Checklist" color="#805ad5" defaultExpanded={true}><div style={{ background: 'linear-gradient(135deg, rgba(49, 130, 206, 0.15) 0%, rgba(44, 82, 130, 0.1) 100%)', borderLeft: '4px solid var(--info)', borderRadius: '0 12px 12px 0', padding: '16px 20px' }}><p style={{ fontSize: '14px', lineHeight: '1.8' }}>臨床診斷心衰竭（NP/R 評估後請 VS 確認）：</p><ul style={{ fontSize: '14px', lineHeight: '1.8', paddingLeft: '20px', marginTop: '8px' }}><li>符合收案條件：心衰竭個管師會通知主要照顧之 R/NP 收案</li><li><strong style={{ color: 'var(--warning)' }}>EF &lt;40% 的病人，ICU 不收案，轉病房再收案（PAC）</strong></li></ul></div></ExpandableSection><ExpandableSection title="文字醫囑" icon="Document" color="#3182ce"><ol style={{ fontSize: '14px', lineHeight: '2', paddingLeft: '20px' }}><li>心衰竭疾病照護流程</li><li>給予家屬「心衰竭加護病房照護服務說明」</li></ol></ExpandableSection><ExpandableSection title="病程紀錄範本" icon="Book" color="#319795"><div style={{ background: 'rgba(255,255,255,0.03)', borderRadius: '12px', padding: '16px', fontFamily: 'monospace', fontSize: '12px', lineHeight: '1.7' }}><p><strong>診斷：</strong>( )HFpEF ( )HFmrEF ( )HFrEF</p><p>Status：( )Acute, ( )Chronic, ( )Acute on chronic</p><p>EF：( )preserved, ( )mid-range, ( )reduced</p><p>Stage: ( )A, ( )B, ( )C, ( )D</p><p>Functional class: ( )I, ( )II, ( )III, ( )IV</p><br/><p><strong>藥物治療：</strong></p><p>Diuretics / ACEI/ARB / Beta-blockers / ARNI / SGLT2i / MRA</p></div></ExpandableSection></div></div>);

        const SpecialCarePage = ({ onBack }) => (<div className="fade-in"><Header title="特殊術後照護" subtitle="Special Care" onBack={onBack} /><div style={{ padding: '20px' }}><ExpandableSection title="AMI 動脈導管建立原則" icon="Warning" color="#e53e3e" defaultExpanded={true}><div style={{ background: 'linear-gradient(135deg, rgba(229, 62, 62, 0.15) 0%, rgba(197, 48, 48, 0.1) 100%)', borderLeft: '4px solid var(--accent)', borderRadius: '0 12px 12px 0', padding: '16px 20px', marginBottom: '16px' }}><p style={{ fontSize: '14px', lineHeight: '1.8', color: '#fc8181', fontWeight: '500' }}>⚠️ 急性心肌梗塞患者為高出血風險族群（DAPT + 抗凝血劑），動脈導管穿刺可能造成 compartment syndrome，需緊急 fasciotomy！</p></div><div style={{ background: 'linear-gradient(135deg, rgba(56, 161, 105, 0.15) 0%, rgba(39, 103, 73, 0.1) 100%)', borderLeft: '4px solid var(--success)', borderRadius: '0 12px 12px 0', padding: '16px 20px', marginBottom: '16px' }}><h4 style={{ fontSize: '14px', fontWeight: '600', marginBottom: '8px', color: '#68d391' }}>✓ 血行動力學穩定個案</h4><p style={{ fontSize: '14px' }}>→ <strong>不需建置動脈導管</strong></p></div><div style={{ background: 'linear-gradient(135deg, rgba(214, 158, 46, 0.15) 0%, rgba(183, 121, 31, 0.1) 100%)', borderLeft: '4px solid var(--warning)', borderRadius: '0 12px 12px 0', padding: '16px 20px', marginBottom: '16px' }}><h4 style={{ fontSize: '14px', fontWeight: '600', marginBottom: '8px', color: '#fbd38d' }}>血行動力學不穩定或困難抽血個案</h4><ol style={{ fontSize: '14px', lineHeight: '2', paddingLeft: '20px' }}><li><strong>先詢問主治醫師</strong>是否有建立動脈導管的需求</li><li>優先考慮 <strong style={{ color: 'var(--info)' }}>橈動脈 (Radial artery)</strong></li><li>使用 <strong style={{ color: 'var(--warning)' }}>real-time echo-guided puncture</strong> 技術</li></ol></div><div style={{ background: 'linear-gradient(135deg, rgba(229, 62, 62, 0.15) 0%, rgba(197, 48, 48, 0.1) 100%)', borderLeft: '4px solid var(--accent)', borderRadius: '0 12px 12px 0', padding: '16px 20px', marginBottom: '16px' }}><h4 style={{ fontSize: '14px', fontWeight: '600', marginBottom: '8px', color: '#fc8181' }}>🚫 肱動脈 (Brachial artery) 穿刺限制</h4><ul style={{ fontSize: '14px', lineHeight: '1.8', paddingLeft: '20px' }}><li>若橈動脈建置不易，必須從肱動脈穿刺時：</li><li style={{ marginLeft: '20px' }}>需在 <strong>NP/ICU專責醫師/值班醫師監督下</strong> 進行</li><li style={{ marginLeft: '20px' }}>同時使用 <strong style={{ color: 'var(--warning)' }}>real-time echo-guided</strong> 技術</li><li><strong style={{ color: 'var(--accent)' }}>若病患正在服用 Brilinta/Prasugrel，不可自行在肱動脈進行穿刺！</strong></li></ul></div></ExpandableSection><ExpandableSection title="動脈導管移除後監測" icon="Medical" color="#3182ce"><div style={{ background: 'linear-gradient(135deg, rgba(49, 130, 206, 0.15) 0%, rgba(44, 82, 130, 0.1) 100%)', borderLeft: '4px solid var(--info)', borderRadius: '0 12px 12px 0', padding: '16px 20px', marginBottom: '16px' }}><h4 style={{ fontSize: '14px', fontWeight: '600', marginBottom: '12px', color: '#63b3ed' }}>使用 Brilinta/Prasugrel 個案</h4><ul style={{ fontSize: '14px', lineHeight: '1.8', paddingLeft: '20px' }}><li>移除後 <strong style={{ color: 'var(--warning)' }}>每 15 分鐘</strong> 規則檢測 <strong style={{ color: 'var(--accent)' }}>6P</strong></li><li>嚴密監測傷口情況 <strong style={{ color: 'var(--warning)' }}>1 小時</strong> 始可轉至普通病房</li></ul></div><div style={{ background: 'rgba(255,255,255,0.05)', borderRadius: '12px', padding: '16px', marginBottom: '16px' }}><h4 style={{ fontSize: '15px', fontWeight: '600', marginBottom: '12px', color: 'var(--warning)' }}>🔍 6P 監測項目</h4><div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '8px' }}><div style={{ background: 'rgba(229, 62, 62, 0.1)', padding: '10px', borderRadius: '8px', textAlign: 'center' }}><strong>Pain</strong><br/><span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>疼痛</span></div><div style={{ background: 'rgba(229, 62, 62, 0.1)', padding: '10px', borderRadius: '8px', textAlign: 'center' }}><strong>Paralysis</strong><br/><span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>麻痺</span></div><div style={{ background: 'rgba(229, 62, 62, 0.1)', padding: '10px', borderRadius: '8px', textAlign: 'center' }}><strong>Pallor</strong><br/><span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>蒼白</span></div><div style={{ background: 'rgba(229, 62, 62, 0.1)', padding: '10px', borderRadius: '8px', textAlign: 'center' }}><strong>Polar</strong><br/><span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>冰冷</span></div><div style={{ background: 'rgba(229, 62, 62, 0.1)', padding: '10px', borderRadius: '8px', textAlign: 'center' }}><strong>Paresthesia</strong><br/><span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>感覺異常</span></div><div style={{ background: 'rgba(229, 62, 62, 0.1)', padding: '10px', borderRadius: '8px', textAlign: 'center' }}><strong>Pulseless</strong><br/><span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>無脈搏</span></div></div></div><div style={{ background: 'linear-gradient(135deg, rgba(214, 158, 46, 0.15) 0%, rgba(183, 121, 31, 0.1) 100%)', borderLeft: '4px solid var(--warning)', borderRadius: '0 12px 12px 0', padding: '16px 20px' }}><p style={{ fontSize: '14px', fontWeight: '500' }}><strong>A-line 或 Sheath 拔除後：</strong></p><p style={{ fontSize: '14px', marginTop: '8px' }}>應 <strong style={{ color: 'var(--warning)' }}>15 分鐘觀察 6P</strong> 且 <strong style={{ color: 'var(--warning)' }}>1 小時後</strong> 才能轉出 ICU</p></div></ExpandableSection><ExpandableSection title="穿刺處腫脹處理" icon="Emergency" color="#c53030"><div style={{ background: 'linear-gradient(135deg, rgba(229, 62, 62, 0.15) 0%, rgba(197, 48, 48, 0.1) 100%)', borderLeft: '4px solid var(--accent)', borderRadius: '0 12px 12px 0', padding: '16px 20px', marginBottom: '16px' }}><h4 style={{ fontSize: '14px', fontWeight: '600', marginBottom: '12px', color: '#fc8181' }}>若動脈導管建置處發生腫脹</h4><ol style={{ fontSize: '14px', lineHeight: '2', paddingLeft: '20px' }}><li>若無動脈導管監測需求 → <strong>移除</strong>，密切監測傷口</li><li>服用 Brilinta/Prasugrel 或抗凝藥物者：<br/><strong style={{ color: 'var(--warning)' }}>徒手加壓止血 &gt; 20 分鐘</strong></li><li>特別注意 <strong style={{ color: 'var(--accent)' }}>遲發性出血</strong></li><li>腫脹時 → <strong>立即通知主治醫師</strong></li><li>以血管超音波排除 <strong>pseudoaneurysm</strong></li></ol></div><div style={{ background: 'linear-gradient(135deg, rgba(229, 62, 62, 0.2) 0%, rgba(197, 48, 48, 0.15) 100%)', borderRadius: '12px', padding: '16px', border: '2px solid var(--accent)' }}><h4 style={{ fontSize: '14px', fontWeight: '600', marginBottom: '8px', color: '#fc8181' }}>⚠️ 緊急狀況</h4><p style={{ fontSize: '14px' }}>若發現 <strong style={{ color: 'var(--accent)' }}>肢體末端發紺</strong>：</p><ul style={{ fontSize: '14px', lineHeight: '1.8', paddingLeft: '20px', marginTop: '8px' }}><li>量測手圍</li><li>觀察末端循環情況</li><li><strong>立即聯絡主治醫師</strong>進行後續評估</li></ul></div></ExpandableSection><ExpandableSection title="頸動脈支架術後照護" icon="Stethoscope" color="#319795"><div style={{ background: 'linear-gradient(135deg, rgba(49, 130, 206, 0.15) 0%, rgba(44, 82, 130, 0.1) 100%)', borderLeft: '4px solid var(--info)', borderRadius: '0 12px 12px 0', padding: '16px 20px', marginBottom: '16px' }}><ol style={{ fontSize: '14px', lineHeight: '2', paddingLeft: '20px' }}><li>傷口加壓及平躺時間</li><li>check GCS and pupil sizes <strong style={{ color: 'var(--warning)' }}>q1h</strong></li><li>ECG stat, keep goal BP</li></ol></div><div style={{ background: 'linear-gradient(135deg, rgba(229, 62, 62, 0.15) 0%, rgba(197, 48, 48, 0.1) 100%)', borderLeft: '4px solid var(--accent)', borderRadius: '0 12px 12px 0', padding: '16px 20px' }}><h4 style={{ fontSize: '14px', fontWeight: '600', marginBottom: '8px', color: '#fc8181' }}>⚠️ Call 值班主治醫師</h4><ul style={{ fontSize: '14px', lineHeight: '1.8', paddingLeft: '20px' }}><li>血壓持續在 goal BP 外 &gt; 15 分鐘</li><li>新的神經學異常</li></ul></div></ExpandableSection><ExpandableSection title="暫時性心律調節器 (TPM)" icon="Heartbeat" color="#805ad5"><ol style={{ fontSize: '14px', lineHeight: '2', paddingLeft: '20px' }}><li>on TPM with setting as: Rate, Output, Sensitivity</li><li>Change dressing, <strong style={{ color: 'var(--warning)' }}>q2d</strong></li><li>ECG stat, Chest x-ray stat</li></ol></ExpandableSection><ExpandableSection title="Volume Status Assessment" icon="Info" color="#3182ce"><ol style={{ fontSize: '14px', lineHeight: '2', paddingLeft: '20px' }}><li><strong>Body weight</strong>：每天的體重！</li><li>I/O and Urine output</li><li>Tongue dryness / oral mucosa</li><li>Lung crackles, Skin turgor</li><li>Leg pitting edema, IVC index</li></ol></ExpandableSection></div></div>);

        const DrugReferencePage = ({ onBack }) => (<div className="fade-in"><Header title="常用藥物速查" subtitle="Drug Reference" onBack={onBack} /><div style={{ padding: '20px' }}><ExpandableSection title="抗血小板藥物" icon="Pill" color="#38a169" defaultExpanded={true}><DrugTable drugs={[{ name: 'Aspirin (Bokey)', loading: '300mg', maintenance: '100mg qd', note: '基礎用藥' }, { name: 'Clopidogrel (Plavix)', loading: '300-600mg', maintenance: '75mg qd', note: '-' }, { name: 'Ticagrelor (Brilinta)', loading: '180mg', maintenance: '90mg bid', note: '⚠️ BID！' }, { name: 'Prasugrel (Efient)', loading: '20mg', maintenance: '3.75mg qd', note: '禁TIA/stroke' }]} /></ExpandableSection><ExpandableSection title="抗凝血藥物" icon="Syringe" color="#e53e3e"><DrugTable drugs={[{ name: 'Heparin', loading: '60 U/kg', maintenance: '12 U/kg/hr', note: 'aPTT q6h' }, { name: 'Enoxaparin (Clexane)', loading: '-', maintenance: '1mg/kg q12h', note: 'Total 4 doses' }]} /><div style={{ background: 'linear-gradient(135deg, rgba(49, 130, 206, 0.15) 0%, rgba(44, 82, 130, 0.1) 100%)', borderLeft: '4px solid var(--info)', borderRadius: '0 12px 12px 0', padding: '16px 20px', marginTop: '16px' }}><p style={{ fontSize: '14px' }}>Heparin 常規泡法: 25000U in N/S 250ml = <strong style={{ color: 'var(--warning)' }}>100 U/ml</strong></p></div></ExpandableSection><ExpandableSection title="心臟酵素正常值" icon="Medical" color="#3182ce"><div style={{ overflowX: 'auto' }}><table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '14px' }}><thead><tr style={{ background: 'rgba(255,255,255,0.05)' }}><th style={{ padding: '12px', textAlign: 'left', borderBottom: '1px solid var(--border-color)' }}>檢查項目</th><th style={{ padding: '12px', textAlign: 'left', borderBottom: '1px solid var(--border-color)' }}>正常值</th></tr></thead><tbody><tr><td style={{ padding: '12px', borderBottom: '1px solid var(--border-color)' }}>CK</td><td style={{ padding: '12px', borderBottom: '1px solid var(--border-color)', color: 'var(--success)' }}>30-200 U/L</td></tr><tr><td style={{ padding: '12px', borderBottom: '1px solid var(--border-color)' }}>CK-MB</td><td style={{ padding: '12px', borderBottom: '1px solid var(--border-color)', color: 'var(--success)' }}>&lt;25 U/L</td></tr><tr><td style={{ padding: '12px', borderBottom: '1px solid var(--border-color)' }}>Troponin-T</td><td style={{ padding: '12px', borderBottom: '1px solid var(--border-color)', color: 'var(--success)' }}>&lt;0.1 ng/mL</td></tr><tr><td style={{ padding: '12px', borderBottom: '1px solid var(--border-color)' }}>BNP</td><td style={{ padding: '12px', borderBottom: '1px solid var(--border-color)', color: 'var(--success)' }}>&lt;100 pg/mL</td></tr><tr><td style={{ padding: '12px', borderBottom: '1px solid var(--border-color)' }}>NT-proBNP</td><td style={{ padding: '12px', borderBottom: '1px solid var(--border-color)', color: 'var(--success)' }}>&lt;125 pg/mL</td></tr></tbody></table></div></ExpandableSection></div></div>);

        const EmergencyPage = ({ onBack }) => (<div className="fade-in"><Header title="緊急情況處理" subtitle="Emergency" onBack={onBack} /><div style={{ padding: '20px' }}><ExpandableSection title="心跳停止 / 心律不整" icon="Heartbeat" color="#e53e3e" defaultExpanded={true}><div style={{ background: 'linear-gradient(135deg, rgba(229, 62, 62, 0.15) 0%, rgba(197, 48, 48, 0.1) 100%)', borderLeft: '4px solid var(--accent)', borderRadius: '0 12px 12px 0', padding: '16px 20px' }}><h4 style={{ fontSize: '15px', fontWeight: '600', marginBottom: '12px', color: '#fc8181' }}>立即處理步驟</h4><ol style={{ fontSize: '14px', lineHeight: '2', paddingLeft: '20px' }}><li>確認病患意識狀態</li><li>檢查 pulse 和呼吸</li><li><strong style={{ color: 'var(--warning)' }}>立即 call 主治醫師</strong></li><li>準備 CPR 和電擊設備</li><li>依 ACLS protocol 處理</li></ol></div></ExpandableSection><ExpandableSection title="急性心肌梗塞 (STEMI)" icon="HeartPulse" color="#dd6b20"><div style={{ background: 'linear-gradient(135deg, rgba(214, 158, 46, 0.15) 0%, rgba(183, 121, 31, 0.1) 100%)', borderLeft: '4px solid var(--warning)', borderRadius: '0 12px 12px 0', padding: '16px 20px' }}><ol style={{ fontSize: '14px', lineHeight: '2', paddingLeft: '20px' }}><li>12-lead ECG 確認診斷</li><li><strong style={{ color: 'var(--accent)' }}>立即通知心導管室</strong></li><li>DAPT loading: Aspirin 300mg + P2Y12 inhibitor</li><li><strong style={{ color: 'var(--warning)' }}>Door-to-balloon time &lt; 90 分鐘</strong></li></ol></div></ExpandableSection><ExpandableSection title="心因性休克" icon="Emergency" color="#c53030"><div style={{ background: 'linear-gradient(135deg, rgba(229, 62, 62, 0.15) 0%, rgba(197, 48, 48, 0.1) 100%)', borderLeft: '4px solid var(--accent)', borderRadius: '0 12px 12px 0', padding: '16px 20px' }}><ol style={{ fontSize: '14px', lineHeight: '2', paddingLeft: '20px' }}><li>Hemodynamic parameters</li><li>Echocardiography</li><li>考慮 IABP 或 ECMO</li><li>緊急心導管評估</li></ol></div></ExpandableSection></div></div>);

        const ChartWritingPage = ({ onBack }) => (<div className="fade-in"><Header title="病歷寫作指引" subtitle="Chart Writing" onBack={onBack} /><div style={{ padding: '20px' }}><div style={{ background: 'linear-gradient(135deg, rgba(49, 130, 206, 0.15) 0%, rgba(44, 82, 130, 0.1) 100%)', borderLeft: '4px solid var(--info)', borderRadius: '0 12px 12px 0', padding: '16px 20px', marginBottom: '20px' }}><p style={{ fontSize: '14px', lineHeight: '1.8' }}>心臟科疾病分析面向：Etiology, Anatomy, Severity, Pathophysiology</p></div><ExpandableSection title="診斷寫作要點" icon="Document" color="#3182ce" defaultExpanded={true}><div style={{ background: 'linear-gradient(135deg, rgba(229, 62, 62, 0.15) 0%, rgba(197, 48, 48, 0.1) 100%)', borderLeft: '4px solid var(--accent)', borderRadius: '0 12px 12px 0', padding: '16px 20px', marginBottom: '16px' }}><p style={{ fontSize: '14px', color: '#fc8181' }}><strong>❌ 錯誤：</strong>僅寫 CAD 2VD</p></div><div style={{ background: 'linear-gradient(135deg, rgba(56, 161, 105, 0.15) 0%, rgba(39, 103, 73, 0.1) 100%)', borderLeft: '4px solid var(--success)', borderRadius: '0 12px 12px 0', padding: '16px 20px' }}><p style={{ fontSize: '14px', fontWeight: '500', color: '#68d391', marginBottom: '8px' }}>✓ 正確範例：</p><ul style={{ fontSize: '13px', lineHeight: '1.8', paddingLeft: '20px' }}><li>CAD, LM+2VD, s/p CABG</li><li>CAD, 2VD, with anterior STEMI, Killip IV, s/p POBAS to LAD</li></ul></div></ExpandableSection><ExpandableSection title="Physical Exam 寫作" icon="Stethoscope" color="#dd6b20"><h4 style={{ fontSize: '14px', fontWeight: '600', marginBottom: '8px', color: 'var(--warning)' }}>CV Physical Signs</h4><ul style={{ fontSize: '13px', lineHeight: '1.8', paddingLeft: '20px' }}><li><strong>Cardiac murmurs</strong></li><li><strong>Volume status:</strong> basilar crackles, pitting edema, dry oral mucosa</li><li><strong>Heart failure signs:</strong> JVE, S3, S4</li><li><strong>Low cardiac output:</strong> confusion, oliguria, cold limbs</li><li><strong>PAOD signs (5P):</strong> pallor, pulseless, pain, paralysis, paresthesia</li></ul></ExpandableSection></div></div>);

        const QuizPage = ({ onBack }) => (<div className="fade-in"><Header title="自我測驗" subtitle="Self Quiz" onBack={onBack} /><div style={{ padding: '20px' }}><div style={{ background: 'linear-gradient(135deg, rgba(49, 130, 206, 0.15) 0%, rgba(44, 82, 130, 0.1) 100%)', borderLeft: '4px solid var(--info)', borderRadius: '0 12px 12px 0', padding: '16px 20px', marginBottom: '24px' }}><p style={{ fontSize: '14px', lineHeight: '1.6' }}>測試你對 CCU 工作流程的了解程度。共 10 題選擇題，答完後會顯示成績與詳細解說。</p></div><QuizSection /></div></div>);

        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const renderPage = () => {
                switch (currentPage) {
                    case 'home': return <HomePage setCurrentPage={setCurrentPage} />;
                    case 'daily-checklist': return <DailyChecklistPage onBack={() => setCurrentPage('home')} />;
                    case 'safety-cases': return <SafetyCasesPage onBack={() => setCurrentPage('home')} />;
                    case 'acs-orders': return <ACSOrdersPage onBack={() => setCurrentPage('home')} />;
                    case 'hf-certification': return <HFCertificationPage onBack={() => setCurrentPage('home')} />;
                    case 'special-care': return <SpecialCarePage onBack={() => setCurrentPage('home')} />;
                    case 'drugs-reference': return <DrugReferencePage onBack={() => setCurrentPage('home')} />;
                    case 'emergency': return <EmergencyPage onBack={() => setCurrentPage('home')} />;
                    case 'chart-writing': return <ChartWritingPage onBack={() => setCurrentPage('home')} />;
                    case 'quiz': return <QuizPage onBack={() => setCurrentPage('home')} />;
                    default: return <HomePage setCurrentPage={setCurrentPage} />;
                }
            };
            return <div style={{ maxWidth: '480px', margin: '0 auto', minHeight: '100vh', background: 'var(--bg-dark)' }}>{renderPage()}</div>;
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
