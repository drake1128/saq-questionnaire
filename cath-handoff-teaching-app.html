<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>導管室護理教學 - 交班與照護</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #1e3a5f;
            --primary-light: #2d5a87;
            --accent: #e74c3c;
            --accent-light: #ff6b5b;
            --success: #27ae60;
            --warning: #f39c12;
            --info: #3498db;
            --purple: #9b59b6;
            --bg-cream: #faf8f5;
            --bg-card: #ffffff;
            --text-dark: #2c3e50;
            --text-muted: #7f8c8d;
            --border: #ecf0f1;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-cream);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        
        #root {
            min-height: 100vh;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
            75% { transform: scale(1.1); }
        }
        
        @keyframes flash {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.5; }
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        
        .slide-in {
            animation: slideIn 0.3s ease-out forwards;
        }
        
        .flash-alert {
            animation: flash 2s infinite;
        }
        
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==================== SVG ICONS ====================
        const Icons = {
            Heart: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            ),
            Clipboard: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                </svg>
            ),
            Warning: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
                </svg>
            ),
            Check: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                </svg>
            ),
            Arrow: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                    <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8-8-8z"/>
                </svg>
            ),
            Back: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            ),
            Quiz: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/>
                </svg>
            ),
            Clock: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
                </svg>
            ),
            Medical: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M19 3H5c-1.1 0-1.99.9-1.99 2L3 19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/>
                </svg>
            ),
            Pulse: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/>
                </svg>
            ),
            Person: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            ),
            AlertCircle: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
            ),
            Star: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
            ),
            Bed: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/>
                </svg>
            ),
            Document: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                </svg>
            ),
            Checklist: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
            ),
            Emergency: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M19 3H5c-1.1 0-1.99.9-1.99 2L3 19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/>
                </svg>
            ),
            Pills: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M4.22 11.29l6.07-6.07a4.5 4.5 0 0 1 6.36 6.37l-6.07 6.07a4.5 4.5 0 0 1-6.36-6.37zm1.42 4.95a2.5 2.5 0 0 0 3.53 0L12 13.41 10.59 12l-2.83 2.83a2.5 2.5 0 0 0 0 3.53v-.12zm14.14-11.02a4.5 4.5 0 0 0-6.36 0l-.71.71 6.37 6.37.71-.71a4.5 4.5 0 0 0 0-6.37z"/>
                </svg>
            ),
            Exchange: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/>
                </svg>
            ),
            Sandbag: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 16H4V8h16v12z"/>
                    <text x="12" y="16" textAnchor="middle" fontSize="8" fontWeight="bold" fill="currentColor">2kg</text>
                </svg>
            )
        };

        // ==================== CHECKLIST ITEM COMPONENT ====================
        const ChecklistItem = ({ checked, onChange, children, important = false, critical = false }) => (
            <div 
                onClick={() => onChange(!checked)}
                style={{
                    display: 'flex',
                    alignItems: 'flex-start',
                    gap: '12px',
                    padding: '14px 16px',
                    background: checked ? (critical ? '#fee2e2' : important ? '#fef3c7' : '#d1fae5') : 'white',
                    borderRadius: '12px',
                    marginBottom: '8px',
                    cursor: 'pointer',
                    border: `2px solid ${checked ? (critical ? '#fca5a5' : important ? '#fcd34d' : '#6ee7b7') : '#e5e7eb'}`,
                    transition: 'all 0.2s ease'
                }}
            >
                <div style={{
                    width: '24px',
                    height: '24px',
                    borderRadius: '6px',
                    border: `2px solid ${checked ? (critical ? '#dc2626' : important ? '#f59e0b' : '#10b981') : '#d1d5db'}`,
                    background: checked ? (critical ? '#dc2626' : important ? '#f59e0b' : '#10b981') : 'white',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    flexShrink: 0,
                    marginTop: '2px',
                    color: 'white'
                }}>
                    {checked && <Icons.Check />}
                </div>
                <div style={{ 
                    flex: 1,
                    color: checked ? '#374151' : '#6b7280',
                    fontSize: '15px',
                    lineHeight: '1.5'
                }}>
                    {children}
                </div>
            </div>
        );

        // ==================== INFO CARD COMPONENT ====================
        const InfoCard = ({ title, icon, color, children }) => (
            <div style={{
                background: 'white',
                borderRadius: '16px',
                padding: '20px',
                marginBottom: '16px',
                boxShadow: 'var(--shadow)',
                borderTop: `4px solid ${color}`
            }}>
                <h3 style={{ 
                    fontSize: '17px', 
                    fontWeight: '600', 
                    marginBottom: '16px',
                    color: '#1f2937',
                    display: 'flex',
                    alignItems: 'center',
                    gap: '10px'
                }}>
                    <span style={{ color }}>{icon}</span>
                    {title}
                </h3>
                {children}
            </div>
        );

        // ==================== TAG COMPONENT ====================
        const Tag = ({ children, color = '#3b82f6' }) => (
            <span style={{
                display: 'inline-block',
                padding: '4px 10px',
                background: `${color}15`,
                color: color,
                borderRadius: '6px',
                fontSize: '13px',
                fontWeight: '500',
                marginRight: '6px',
                marginBottom: '6px'
            }}>
                {children}
            </span>
        );

        // ==================== CRITICAL ALERT COMPONENT ====================
        const CriticalAlert = ({ children, icon = "⚠️" }) => (
            <div style={{
                background: 'linear-gradient(135deg, #dc2626 0%, #b91c1c 100%)',
                color: 'white',
                padding: '16px',
                borderRadius: '12px',
                marginBottom: '16px',
                display: 'flex',
                alignItems: 'flex-start',
                gap: '12px',
                boxShadow: '0 4px 15px rgba(220, 38, 38, 0.3)'
            }} className="flash-alert">
                <span style={{ fontSize: '24px' }}>{icon}</span>
                <div style={{ flex: 1 }}>{children}</div>
            </div>
        );

        // ==================== MAIN APP ====================
        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            
            // Pre-cath checklist state
            const [preCathChecks, setPreCathChecks] = useState({
                consent: false,
                allergies: false,
                clothes: false,
                dentures: false,
                hearingAid: false,
                noShaving: false,
                ivLine: false,
                sandbag: false
            });
            
            // Patient info state
            const [patientInfo, setPatientInfo] = useState({
                diagnosis: '',
                hasSTEMI: false,
                hasNSTEMI: false,
                hasUA: false,
                attendingMD: '',
                hasFever: false,
                creatinine: '',
                egfr: '',
                lvef: '',
                hasAS: false,
                hasMR: false,
                hasMS: false,
                thalliumResult: '',
                treadmillResult: ''
            });

            // Post-cath treatment state
            const [treatmentInfo, setTreatmentInfo] = useState({
                intervention: '',
                stentLocations: [],
                sheathSite: '',
                sheathRemoved: false,
                actCheckTime: '',
                actThreshold: '',
                compressionTime: '',
                bedRestHours: '',
                antiplateletLoading: [],
                maintenanceMeds: [],
                icuAdmission: false,
                icuHours: '',
                vitalSignsFreq: '',
                needECG: false,
                labCheckTime: '',
                ppiReminder: false
            });

            const menuItems = [
                { id: 'pre-cath', icon: <Icons.Checklist />, title: '術前準備', subtitle: 'Pre-Cath Checklist', color: '#3b82f6' },
                { id: 'patient-handoff', icon: <Icons.Person />, title: '病人交班', subtitle: '病史/生命徵象/用藥', color: '#8b5cf6' },
                { id: 'transfer-note', icon: <Icons.Document />, title: '交班單查核表', subtitle: 'Cath Lab Transfer Note', color: '#06b6d4' },
                { id: 'post-cath', icon: <Icons.Exchange />, title: '術後交班', subtitle: '治療結果與藥物', color: '#10b981' },
                { id: 'wound-care', icon: <Icons.Medical />, title: '傷口護理', subtitle: '加壓止血與評估', color: '#f59e0b' },
                { id: 'complications', icon: <Icons.Warning />, title: '併發症教學', subtitle: '血管併發症識別', color: '#ef4444' },
                { id: 'quiz', icon: <Icons.Quiz />, title: '自我測驗', subtitle: '綜合能力評量', color: '#ec4899' }
            ];

            // ==================== HEADER COMPONENT ====================
            const Header = ({ title, subtitle, showBack = false }) => (
                <div style={{
                    background: 'linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%)',
                    color: 'white',
                    padding: '20px',
                    paddingTop: '50px',
                    borderRadius: '0 0 30px 30px',
                    marginBottom: '20px',
                    position: 'relative'
                }}>
                    {showBack && (
                        <button
                            onClick={() => setCurrentPage('home')}
                            style={{
                                position: 'absolute',
                                top: '50px',
                                left: '15px',
                                background: 'rgba(255,255,255,0.2)',
                                border: 'none',
                                borderRadius: '50%',
                                width: '40px',
                                height: '40px',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                color: 'white',
                                cursor: 'pointer'
                            }}
                        >
                            <Icons.Back />
                        </button>
                    )}
                    <h1 style={{ 
                        textAlign: 'center', 
                        fontSize: '20px', 
                        fontWeight: '600',
                        marginBottom: subtitle ? '6px' : '0'
                    }}>
                        {title}
                    </h1>
                    {subtitle && (
                        <p style={{ textAlign: 'center', fontSize: '13px', opacity: 0.85 }}>{subtitle}</p>
                    )}
                </div>
            );

            // ==================== HOME PAGE ====================
            const HomePage = () => (
                <div className="fade-in">
                    <div style={{
                        background: 'linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%)',
                        color: 'white',
                        padding: '30px 20px',
                        paddingTop: '60px',
                        borderRadius: '0 0 40px 40px',
                        marginBottom: '25px',
                        textAlign: 'center'
                    }}>
                        <div style={{ 
                            fontSize: '50px', 
                            marginBottom: '15px',
                            animation: 'heartbeat 2s infinite'
                        }}>
                            🫀
                        </div>
                        <h1 style={{ fontSize: '24px', fontWeight: '700', marginBottom: '8px' }}>
                            導管室護理教學
                        </h1>
                        <p style={{ opacity: 0.9, fontSize: '14px' }}>
                            Cardiac Catheterization Nursing Education
                        </p>
                        <div style={{
                            marginTop: '20px',
                            padding: '10px 20px',
                            background: 'rgba(255,255,255,0.15)',
                            borderRadius: '20px',
                            display: 'inline-block',
                            fontSize: '13px'
                        }}>
                            📚 交班工作與術後護理
                        </div>
                    </div>
                    
                    <div style={{ padding: '0 16px' }}>
                        {menuItems.map((item, idx) => (
                            <button
                                key={item.id}
                                onClick={() => setCurrentPage(item.id)}
                                className="slide-in"
                                style={{
                                    width: '100%',
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '16px',
                                    padding: '18px 20px',
                                    background: 'white',
                                    border: 'none',
                                    borderRadius: '16px',
                                    marginBottom: '12px',
                                    boxShadow: 'var(--shadow)',
                                    cursor: 'pointer',
                                    textAlign: 'left',
                                    animationDelay: `${idx * 0.08}s`,
                                    transition: 'transform 0.2s ease'
                                }}
                            >
                                <div style={{
                                    width: '50px',
                                    height: '50px',
                                    borderRadius: '14px',
                                    background: `linear-gradient(135deg, ${item.color} 0%, ${item.color}dd 100%)`,
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    color: 'white',
                                    flexShrink: 0
                                }}>
                                    {item.icon}
                                </div>
                                <div style={{ flex: 1 }}>
                                    <div style={{ fontWeight: '600', fontSize: '16px', color: '#2c3e50' }}>
                                        {item.title}
                                    </div>
                                    <div style={{ fontSize: '13px', color: '#7f8c8d', marginTop: '2px' }}>
                                        {item.subtitle}
                                    </div>
                                </div>
                                <div style={{ color: '#bdc3c7' }}>
                                    <Icons.Arrow />
                                </div>
                            </button>
                        ))}
                        
                        <div style={{ 
                            textAlign: 'center', 
                            padding: '30px 0',
                            color: '#7f8c8d',
                            fontSize: '12px'
                        }}>
                            <div>心臟內科護理教學</div>
                            <div style={{ marginTop: '4px' }}>Based on Clinical Protocols</div>
                        </div>
                    </div>
                </div>
            );

            // ==================== PRE-CATH PAGE ====================
            const PreCathPage = () => {
                const updateCheck = (key) => {
                    setPreCathChecks(prev => ({ ...prev, [key]: !prev[key] }));
                };
                
                const allChecked = Object.values(preCathChecks).every(v => v);
                const checkedCount = Object.values(preCathChecks).filter(v => v).length;
                
                return (
                    <div className="fade-in">
                        <Header title="術前準備 Checklist" subtitle="Pre-Catheterization Preparation" showBack />
                        <div style={{ padding: '0 16px' }}>
                            {/* 砂包重要提醒 */}
                            <CriticalAlert icon="🏋️">
                                <div style={{ fontWeight: '700', fontSize: '16px', marginBottom: '4px' }}>
                                    請準備 2kg 砂包至導管室！
                                </div>
                                <div style={{ fontSize: '13px', opacity: 0.95 }}>
                                    術後 femoral sheath 需使用砂包加壓止血，請務必攜帶
                                </div>
                            </CriticalAlert>

                            {/* Progress */}
                            <div style={{
                                background: 'white',
                                borderRadius: '12px',
                                padding: '16px',
                                marginBottom: '20px',
                                boxShadow: 'var(--shadow)'
                            }}>
                                <div style={{ 
                                    display: 'flex', 
                                    justifyContent: 'space-between',
                                    marginBottom: '8px'
                                }}>
                                    <span style={{ fontWeight: '600', color: '#374151' }}>完成進度</span>
                                    <span style={{ color: '#3b82f6', fontWeight: '600' }}>{checkedCount}/8</span>
                                </div>
                                <div style={{ 
                                    height: '8px', 
                                    background: '#e5e7eb', 
                                    borderRadius: '4px',

                                    正確率: {percentage}%
                                </div>
                                <button
                                    onClick={resetQuiz}
                                    style={{
                                        padding: '14px 40px',
                                        background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                        color: 'white',
                                        border: 'none',
                                        borderRadius: '25px',
                                        fontSize: '16px',
                                        fontWeight: '600',
                                        cursor: 'pointer'
                                    }}
                                >
                                    重新測驗
                                </button>
                            </div>
                        </div>
                    );
                }
                
                const q = questions[currentQ];
                
                return (
                    <div className="fade-in">
                        <Header title="自我測驗" subtitle={`問題 ${currentQ + 1} / ${questions.length}`} showBack />
                        <div style={{ padding: '0 16px' }}>
                            {/* Progress */}
                            <div style={{ 
                                height: '6px', 
                                background: '#e5e7eb', 
                                borderRadius: '3px',
                                marginBottom: '20px',
                                overflow: 'hidden'
                            }}>
                                <div style={{
                                    height: '100%',
                                    width: `${((currentQ + 1) / questions.length) * 100}%`,
                                    background: 'linear-gradient(90deg, #667eea, #764ba2)',
                                    transition: 'width 0.3s ease'
                                }}/>
                            </div>
                            
                            {/* Question */}
                            <div style={{
                                background: 'white',
                                borderRadius: '16px',
                                padding: '20px',
                                marginBottom: '16px',
                                boxShadow: 'var(--shadow)'
                            }}>
                                <h3 style={{ fontSize: '17px', fontWeight: '600', lineHeight: '1.5' }}>
                                    {q.q}
                                </h3>
                            </div>
                            
                            {/* Options */}
                            {q.options.map((opt, idx) => {
                                let bgColor = 'white';
                                let borderColor = '#e5e7eb';
                                
                                if (showResult) {
                                    if (idx === q.correct) {
                                        bgColor = '#d1fae5';
                                        borderColor = '#10b981';
                                    } else if (idx === selected) {
                                        bgColor = '#fee2e2';
                                        borderColor = '#ef4444';
                                    }
                                } else if (idx === selected) {
                                    borderColor = '#667eea';
                                    bgColor = '#eef2ff';
                                }
                                
                                return (
                                    <button
                                        key={idx}
                                        onClick={() => handleAnswer(idx)}
                                        disabled={showResult}
                                        style={{
                                            width: '100%',
                                            padding: '16px',
                                            marginBottom: '10px',
                                            background: bgColor,
                                            border: `2px solid ${borderColor}`,
                                            borderRadius: '12px',
                                            textAlign: 'left',
                                            fontSize: '15px',
                                            cursor: showResult ? 'default' : 'pointer',
                                            display: 'flex',
                                            alignItems: 'center',
                                            gap: '12px'
                                        }}
                                    >
                                        <span style={{
                                            width: '28px',
                                            height: '28px',
                                            borderRadius: '50%',
                                            background: showResult && idx === q.correct ? '#10b981' : '#f3f4f6',
                                            color: showResult && idx === q.correct ? 'white' : '#6b7280',
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'center',
                                            fontWeight: '600',
                                            fontSize: '13px',
                                            flexShrink: 0
                                        }}>
                                            {String.fromCharCode(65 + idx)}
                                        </span>
                                        {opt}
                                    </button>
                                );
                            })}
                            
                            {/* Explanation */}
                            {showResult && (
                                <div style={{
                                    padding: '16px',
                                    background: selected === q.correct ? '#d1fae5' : '#fef3c7',
                                    borderRadius: '12px',
                                    borderLeft: `4px solid ${selected === q.correct ? '#10b981' : '#f59e0b'}`,
                                    marginBottom: '16px'
                                }} className="fade-in">
                                    <div style={{ fontWeight: '600', marginBottom: '6px' }}>
                                        {selected === q.correct ? '✓ 正確！' : '✗ 答錯了'}
                                    </div>
                                    <div style={{ fontSize: '14px', lineHeight: '1.5' }}>
                                        {q.explanation}
                                    </div>
                                </div>
                            )}
                            
                            {/* Next button */}
                            {showResult && (
                                <button
                                    onClick={nextQuestion}
                                    style={{
                                        width: '100%',
                                        padding: '16px',
                                        background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                        color: 'white',
                                        border: 'none',
                                        borderRadius: '12px',
                                        fontSize: '16px',
                                        fontWeight: '600',
                                        cursor: 'pointer',
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                        gap: '8px'
                                    }}
                                >
                                    {currentQ < questions.length - 1 ? '下一題' : '查看結果'}
                                    <Icons.Arrow />
                                </button>
                            )}
                        </div>
                    </div>
                );
            };

            // ==================== RENDER PAGE ====================
            const renderPage = () => {
                switch(currentPage) {
                    case 'home': return <HomePage />;
                    case 'pre-cath': return <PreCathPage />;
                    case 'patient-handoff': return <PatientHandoffPage />;
                    case 'transfer-note': return <TransferNotePage />;
                    case 'post-cath': return <PostCathPage />;
                    case 'wound-care': return <WoundCarePage />;
                    case 'complications': return <ComplicationsPage />;
                    case 'quiz': return <QuizPage />;
                    default: return <HomePage />;
                }
            };
            
            return (
                <div style={{ 
                    maxWidth: '480px', 
                    margin: '0 auto',
                    minHeight: '100vh',
                    background: 'var(--bg-cream)',
                    paddingBottom: '30px'
                }}>
                    {renderPage()}
                </div>
            );
        };
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
