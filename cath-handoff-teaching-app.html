<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>導管室護理教學 - 整合版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #1e3a5f;
            --primary-light: #2d5a87;
            --accent: #e74c3c;
            --success: #27ae60;
            --warning: #f39c12;
            --info: #3498db;
            --purple: #9b59b6;
            --bg-cream: #faf8f5;
            --bg-card: #ffffff;
            --text-dark: #2c3e50;
            --text-muted: #7f8c8d;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-cream);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        
        #root { min-height: 100vh; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
            75% { transform: scale(1.1); }
        }
        
        @keyframes flash {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.6; }
        }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .slide-in { animation: slideIn 0.3s ease-out forwards; }
        .flash-alert { animation: flash 2s infinite; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==================== SVG ICONS ====================
        const Icons = {
            Heart: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            ),
            Check: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                </svg>
            ),
            Arrow: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                    <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8-8-8z"/>
                </svg>
            ),
            Back: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            ),
            Warning: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
                </svg>
            ),
            Quiz: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/>
                </svg>
            ),
            Medical: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M19 3H5c-1.1 0-1.99.9-1.99 2L3 19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/>
                </svg>
            ),
            Person: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            ),
            Bed: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/>
                </svg>
            ),
            Checklist: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
            ),
            Exchange: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/>
                </svg>
            ),
            Pulse: () => (
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/>
                </svg>
            )
        };

        // ==================== MAIN APP ====================
        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            
            // 術前檢查清單
            const [preCathChecks, setPreCathChecks] = useState({
                sandbag: false,
                consent: false,
                allergies: false,
                clothes: false,
                dentures: false,
                hearingAid: false,
                noShaving: false,
                ivLine: false
            });

            // 測驗狀態
            const [quizState, setQuizState] = useState({
                currentQ: 0,
                score: 0,
                selected: null,
                showResult: false,
                completed: false
            });

            const menuItems = [
                { id: 'pre-cath', icon: <Icons.Checklist />, title: '術前準備', subtitle: 'Pre-Cath Checklist', color: '#3b82f6' },
                { id: 'patient-handoff', icon: <Icons.Person />, title: '病人交班', subtitle: '診斷與檢查結果', color: '#8b5cf6' },
                { id: 'procedure-handoff', icon: <Icons.Bed />, title: '術式交班', subtitle: '配合術式注意事項', color: '#06b6d4' },
                { id: 'post-cath', icon: <Icons.Exchange />, title: '術後交班', subtitle: '治療結果與照護', color: '#10b981' },
                { id: 'wound-care', icon: <Icons.Medical />, title: '傷口護理', subtitle: '加壓止血與評估', color: '#f59e0b' },
                { id: 'complications', icon: <Icons.Warning />, title: '併發症教學', subtitle: '血管併發症識別', color: '#ef4444' },
                { id: 'quiz', icon: <Icons.Quiz />, title: '自我測驗', subtitle: '綜合能力評量', color: '#ec4899' }
            ];

            // ==================== CRITICAL ALERT ====================
            const CriticalAlert = ({ icon, children }) => (
                <div style={{
                    background: 'linear-gradient(135deg, #dc2626 0%, #b91c1c 100%)',
                    borderRadius: '16px',
                    padding: '18px',
                    marginBottom: '20px',
                    color: 'white',
                    display: 'flex',
                    gap: '14px',
                    alignItems: 'flex-start',
                    boxShadow: '0 4px 15px rgba(220, 38, 38, 0.3)'
                }} className="flash-alert">
                    <span style={{ fontSize: '28px', flexShrink: 0 }}>{icon}</span>
                    <div style={{ flex: 1 }}>{children}</div>
                </div>
            );

            // ==================== CHECKLIST ITEM ====================
            const ChecklistItem = ({ checked, onChange, children, important = false, critical = false }) => (
                <div 
                    onClick={() => onChange(!checked)}
                    style={{
                        display: 'flex',
                        alignItems: 'flex-start',
                        gap: '12px',
                        padding: '14px 16px',
                        background: checked ? (critical ? '#fee2e2' : important ? '#fef3c7' : '#d1fae5') : 'white',
                        borderRadius: '12px',
                        marginBottom: '8px',
                        cursor: 'pointer',
                        border: `2px solid ${checked ? (critical ? '#fca5a5' : important ? '#fcd34d' : '#6ee7b7') : '#e5e7eb'}`,
                        transition: 'all 0.2s ease'
                    }}
                >
                    <div style={{
                        width: '24px',
                        height: '24px',
                        borderRadius: '6px',
                        border: `2px solid ${checked ? (critical ? '#dc2626' : important ? '#f59e0b' : '#10b981') : '#d1d5db'}`,
                        background: checked ? (critical ? '#dc2626' : important ? '#f59e0b' : '#10b981') : 'white',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        flexShrink: 0,
                        marginTop: '2px',
                        color: 'white'
                    }}>
                        {checked && <Icons.Check />}
                    </div>
                    <div style={{ 
                        flex: 1,
                        color: checked ? '#374151' : '#6b7280',
                        fontSize: '15px',
                        lineHeight: '1.5'
                    }}>
                        {children}
                    </div>
                </div>
            );

            // ==================== INFO CARD ====================
            const InfoCard = ({ title, icon, color, children }) => (
                <div style={{
                    background: 'white',
                    borderRadius: '16px',
                    padding: '20px',
                    marginBottom: '16px',
                    boxShadow: 'var(--shadow)',
                    borderTop: `4px solid ${color}`
                }}>
                    <h3 style={{ 
                        fontSize: '17px', 
                        fontWeight: '600', 
                        marginBottom: '16px',
                        color: '#1f2937',
                        display: 'flex',
                        alignItems: 'center',
                        gap: '10px'
                    }}>
                        <span style={{ color }}>{icon}</span>
                        {title}
                    </h3>
                    {children}
                </div>
            );

            // ==================== NOTE BOX ====================
            const NoteBox = ({ children, color = '#6b7280', bgColor = '#f3f4f6' }) => (
                <div style={{
                    padding: '12px 14px',
                    background: bgColor,
                    borderRadius: '10px',
                    fontSize: '13px',
                    color: color,
                    marginTop: '12px',
                    borderLeft: `3px solid ${color}`
                }}>
                    {children}
                </div>
            );

            // ==================== TOGGLE BUTTON ====================
            const ToggleButton = ({ active, onClick, children, color = '#3b82f6' }) => (
                <button
                    onClick={onClick}
                    style={{
                        padding: '12px 18px',
                        borderRadius: '10px',
                        border: `2px solid ${active ? color : '#e5e7eb'}`,
                        background: active ? `${color}15` : 'white',
                        color: active ? color : '#6b7280',
                        fontSize: '14px',
                        fontWeight: '500',
                        cursor: 'pointer',
                        transition: 'all 0.2s ease'
                    }}
                >
                    {active && '✓ '}{children}
                </button>
            );

            // ==================== HEADER ====================
            const Header = ({ title, subtitle, showBack = false }) => (
                <div style={{
                    background: 'linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%)',
                    color: 'white',
                    padding: '20px',
                    paddingTop: '50px',
                    borderRadius: '0 0 30px 30px',
                    marginBottom: '20px',
                    position: 'relative'
                }}>
                    {showBack && (
                        <button
                            onClick={() => setCurrentPage('home')}
                            style={{
                                position: 'absolute',
                                top: '50px',
                                left: '15px',
                                background: 'rgba(255,255,255,0.2)',
                                border: 'none',
                                borderRadius: '50%',
                                width: '40px',
                                height: '40px',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                color: 'white',
                                cursor: 'pointer'
                            }}
                        >
                            <Icons.Back />
                        </button>
                    )}
                    <h1 style={{ textAlign: 'center', fontSize: '20px', fontWeight: '600', marginBottom: subtitle ? '6px' : '0' }}>
                        {title}
                    </h1>
                    {subtitle && (
                        <p style={{ textAlign: 'center', fontSize: '13px', opacity: 0.85 }}>{subtitle}</p>
                    )}
                </div>
            );

            // ==================== HOME PAGE ====================
            const HomePage = () => (
                <div className="fade-in">
                    <div style={{
                        background: 'linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%)',
                        color: 'white',
                        padding: '40px 20px 50px',
                        borderRadius: '0 0 40px 40px',
                        marginBottom: '20px',
                        textAlign: 'center'
                    }}>
                        <div style={{ 
                            fontSize: '48px',
                            marginBottom: '12px',
                            animation: 'heartbeat 2s infinite'
                        }}>🫀</div>
                        <h1 style={{ fontSize: '24px', fontWeight: '700', marginBottom: '10px' }}>
                            導管室護理教學 - 整合版
                        </h1>
                        <div style={{
                            padding: '10px 20px',
                            background: 'rgba(255,255,255,0.15)',
                            borderRadius: '20px',
                            display: 'inline-block',
                            fontSize: '13px'
                        }}>
                            📚 交班工作與術後護理 - 整合版
                        </div>
                    </div>
                    
                    <div style={{ padding: '0 16px' }}>
                        {menuItems.map((item, idx) => (
                            <button
                                key={item.id}
                                onClick={() => setCurrentPage(item.id)}
                                className="slide-in"
                                style={{
                                    width: '100%',
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '16px',
                                    padding: '18px 20px',
                                    background: 'white',
                                    border: 'none',
                                    borderRadius: '16px',
                                    marginBottom: '12px',
                                    boxShadow: 'var(--shadow)',
                                    cursor: 'pointer',
                                    textAlign: 'left',
                                    animationDelay: `${idx * 0.08}s`
                                }}
                            >
                                <div style={{
                                    width: '50px',
                                    height: '50px',
                                    borderRadius: '14px',
                                    background: `linear-gradient(135deg, ${item.color} 0%, ${item.color}dd 100%)`,
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    color: 'white',
                                    flexShrink: 0
                                }}>
                                    {item.icon}
                                </div>
                                <div style={{ flex: 1 }}>
                                    <div style={{ fontWeight: '600', fontSize: '16px', color: '#2c3e50' }}>
                                        {item.title}
                                    </div>
                                    <div style={{ fontSize: '13px', color: '#7f8c8d', marginTop: '2px' }}>
                                        {item.subtitle}
                                    </div>
                                </div>
                                <div style={{ color: '#bdc3c7' }}>
                                    <Icons.Arrow />
                                </div>
                            </button>
                        ))}
                        
                        <div style={{ textAlign: 'center', padding: '20px 0', color: '#7f8c8d', fontSize: '12px' }}>
                            心臟內科護理教學 - 整合版
                        </div>
                    </div>
                </div>
            );

            // ==================== PRE-CATH PAGE ====================
            const PreCathPage = () => {
                const updateCheck = (key) => {
                    setPreCathChecks(prev => ({ ...prev, [key]: !prev[key] }));
                };
                
                const allChecked = Object.values(preCathChecks).every(v => v);
                const checkedCount = Object.values(preCathChecks).filter(v => v).length;
                
                return (
                    <div className="fade-in">
                        <Header title="術前準備 Checklist" subtitle="Pre-Catheterization Preparation" showBack />
                        <div style={{ padding: '0 16px' }}>
                            <CriticalAlert icon="🏋️">
                                <div style={{ fontWeight: '700', fontSize: '16px', marginBottom: '4px' }}>
                                    請準備 2kg 砂包至導管室！
                                </div>
                                <div style={{ fontSize: '13px', opacity: 0.95 }}>
                                    術後 femoral sheath 需使用砂包加壓止血
                                </div>
                            </CriticalAlert>

                            <div style={{
                                background: 'white',
                                borderRadius: '12px',
                                padding: '16px',
                                marginBottom: '20px',
                                boxShadow: 'var(--shadow)'
                            }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                                    <span style={{ fontWeight: '600' }}>完成進度</span>
                                    <span style={{ color: '#3b82f6', fontWeight: '600' }}>{checkedCount}/8</span>
                                </div>
                                <div style={{ height: '8px', background: '#e5e7eb', borderRadius: '4px', overflow: 'hidden' }}>
                                    <div style={{
                                        height: '100%',
                                        width: `${(checkedCount / 8) * 100}%`,
                                        background: allChecked ? '#10b981' : 'linear-gradient(90deg, #3b82f6, #8b5cf6)',
                                        transition: 'width 0.3s ease'
                                    }}/>
                                </div>
                            </div>
                            
                            <InfoCard title="物品準備" icon="📦" color="#dc2626">
                                <ChecklistItem checked={preCathChecks.sandbag} onChange={() => updateCheck('sandbag')} critical>
                                    <strong>⚠️ 準備 2kg 砂包</strong>
                                    <div style={{ fontSize: '12px', color: '#dc2626', marginTop: '4px' }}>
                                        【重要】攜帶至導管室，術後止血必備
                                    </div>
                                </ChecklistItem>
                            </InfoCard>

                            <InfoCard title="文件確認" icon="📋" color="#3b82f6">
                                <ChecklistItem checked={preCathChecks.consent} onChange={() => updateCheck('consent')} important>
                                    <strong>確認同意書</strong>已簽署完成
                                    <div style={{ fontSize: '12px', color: '#6b7280', marginTop: '4px' }}>
                                        包含：導管檢查/治療同意書、麻醉同意書
                                    </div>
                                </ChecklistItem>
                                
                                <ChecklistItem checked={preCathChecks.allergies} onChange={() => updateCheck('allergies')} critical>
                                    <strong>確認過敏史</strong>
                                    <div style={{ fontSize: '12px', color: '#6b7280', marginTop: '4px' }}>
                                        特別注意：顯影劑過敏、Iodine 過敏
                                    </div>
                                </ChecklistItem>
                            </InfoCard>
                            
                            <InfoCard title="病人準備" icon="👤" color="#8b5cf6">
                                <ChecklistItem checked={preCathChecks.clothes} onChange={() => updateCheck('clothes')}>
                                    <strong>更換手術衣</strong>
                                    <div style={{ fontSize: '12px', color: '#6b7280', marginTop: '4px' }}>
                                        脫除內衣褲，穿著醫院手術衣
                                    </div>
                                </ChecklistItem>
                                
                                <ChecklistItem checked={preCathChecks.dentures} onChange={() => updateCheck('dentures')}>
                                    <strong>取下假牙</strong>
                                    <div style={{ fontSize: '12px', color: '#6b7280', marginTop: '4px' }}>
                                        確認活動假牙已取下並妥善保管
                                    </div>
                                </ChecklistItem>
                                
                                <ChecklistItem checked={preCathChecks.hearingAid} onChange={() => updateCheck('hearingAid')}>
                                    <strong>確認助聽器</strong>
                                    <div style={{ fontSize: '12px', color: '#6b7280', marginTop: '4px' }}>
                                        評估是否需保留以利術中溝通
                                    </div>
                                </ChecklistItem>
                                
                                <ChecklistItem checked={preCathChecks.noShaving} onChange={() => updateCheck('noShaving')}>
                                    <strong>不需剃毛</strong>
                                    <div style={{ fontSize: '12px', color: '#6b7280', marginTop: '4px' }}>
                                        現行規範：穿刺部位不需事先剃毛
                                    </div>
                                </ChecklistItem>
                            </InfoCard>
                            
                            <InfoCard title="醫療準備" icon="💉" color="#10b981">
                                <ChecklistItem checked={preCathChecks.ivLine} onChange={() => updateCheck('ivLine')}>
                                    <strong>建立靜脈通路</strong>
                                    <div style={{ fontSize: '12px', color: '#6b7280', marginTop: '4px' }}>
                                        首選左手：20G 或更大，避免同側 AVF
                                    </div>
                                </ChecklistItem>
                            </InfoCard>

                            {/* 修改：術前交班重點 - 穿刺部位改為異常抽血檢驗報告 */}
                            <div style={{
                                background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                borderRadius: '16px',
                                padding: '20px',
                                color: 'white',
                                marginBottom: '20px'
                            }}>
                                <h3 style={{ fontWeight: '600', marginBottom: '12px' }}>📋 術前交班重點</h3>
                                <div style={{
                                    background: 'rgba(255,255,255,0.15)',
                                    borderRadius: '10px',
                                    padding: '14px',
                                    fontSize: '14px',
                                    lineHeight: '1.8'
                                }}>
                                    <div><strong>1.</strong> 異常抽血檢驗報告（含 Cr, anemia, PT）</div>
                                    <div><strong>2.</strong> 病患過去病史</div>
                                    <div><strong>3.</strong> 現服藥狀況</div>

                                color: '#f59e0b',
                                symptoms: ['足背脈搏消失', '肢端蒼白發冷', '劇烈疼痛', '感覺喪失'],
                                actions: ['立即通知醫師', '保持患肢平放', '避免加壓', '準備緊急處置']
                            }
                        ].map((comp, idx) => (
                            <InfoCard key={idx} title={comp.title} icon={comp.icon} color={comp.color}>
                                <div style={{ marginBottom: '12px' }}>
                                    <div style={{ fontSize: '14px', fontWeight: '600', marginBottom: '8px', color: '#dc2626' }}>
                                        🔔 警示症狀：
                                    </div>
                                    {comp.symptoms.map((s, i) => (
                                        <div key={i} style={{ 
                                            padding: '8px 12px', 
                                            background: '#fee2e2', 
                                            borderRadius: '8px', 
                                            marginBottom: '6px',
                                            fontSize: '14px'
                                        }}>
                                            • {s}
                                        </div>
                                    ))}
                                </div>
                                <div>
                                    <div style={{ fontSize: '14px', fontWeight: '600', marginBottom: '8px', color: '#059669' }}>
                                        ✅ 處置措施：
                                    </div>
                                    {comp.actions.map((a, i) => (
                                        <div key={i} style={{ 
                                            padding: '8px 12px', 
                                            background: '#d1fae5', 
                                            borderRadius: '8px', 
                                            marginBottom: '6px',
                                            fontSize: '14px'
                                        }}>
                                            {i + 1}. {a}
                                        </div>
                                    ))}
                                </div>
                            </InfoCard>
                        ))}
                    </div>
                </div>
            );

            // ==================== QUIZ PAGE ====================
            const QuizPage = () => {
                const { currentQ, score, selected, showResult, completed } = quizState;
                
                const questions = [
                    {
                        q: '術前準備時，需要攜帶什麼物品至導管室？',
                        options: ['1kg 砂包', '2kg 砂包', '3kg 砂包', '不需要砂包'],
                        correct: 1,
                        explanation: '需準備 2kg 砂包，用於 Femoral 穿刺術後加壓止血。'
                    },
                    {
                        q: 'Femoral 穿刺後，病患應採取什麼姿勢？',
                        options: ['可隨意活動', '平躺，患肢伸直', '側躺', '坐起休息'],
                        correct: 1,
                        explanation: 'Femoral 穿刺後需平躺且患肢伸直，避免出血。'
                    },
                    {
                        q: '術前交班重點包含以下哪項檢驗報告？',
                        options: ['只需要血型', '只需要肝功能', 'Cr、貧血、PT 凝血功能', '只需要胸部 X 光'],
                        correct: 2,
                        explanation: '術前需確認異常抽血檢驗報告，包含腎功能 Cr、貧血 anemia、凝血功能 PT。'
                    },
                    {
                        q: 'Radial 穿刺後，應使用什麼止血？',
                        options: ['砂包', 'TR-band', '一般紗布', '彈性繃帶'],
                        correct: 1,
                        explanation: 'Radial 穿刺後使用 TR-band 加壓止血，並監測手指循環。'
                    },
                    {
                        q: '傷口評估 5P 不包含以下哪項？',
                        options: ['Pain 疼痛', 'Pulse 脈搏', 'Pressure 壓力', 'Pallor 蒼白'],
                        correct: 2,
                        explanation: '5P 包含：Pain、Pulse、Pallor、Paresthesia、Paralysis，不包含 Pressure。'
                    },
                    {
                        q: '心導管檢查常見的心律不整診斷，下列何者正確？',
                        options: ['HTN 高血壓', 'DM 糖尿病', 'AF 心房顫動', 'COPD 慢性阻塞性肺病'],
                        correct: 2,
                        explanation: 'AF（心房顫動）是常見的心律不整診斷，其他選項不屬於心律不整。'
                    },
                    {
                        q: 'PAOD 介入術後通常去哪裡？',
                        options: ['必須進 ICU', '通常回一般病房', '必須進開刀房', '直接出院'],
                        correct: 1,
                        explanation: 'PAOD 介入術後通常回一般病房，去 ICU 機率較低，除非有特殊併發症。'
                    },
                    {
                        q: 'EPS 電生理檢查最需要注意的併發症是？',
                        options: ['腎功能惡化', '心包膜積液/心臟壓塞', '肺炎', '尿路感染'],
                        correct: 1,
                        explanation: 'EPS/Ablation 最需注意心包膜積液或心臟壓塞，這是可能危及生命的併發症。'
                    }
                ];
                
                const handleAnswer = (idx) => {
                    if (showResult) return;
                    setQuizState(prev => ({
                        ...prev,
                        selected: idx,
                        showResult: true,
                        score: idx === questions[currentQ].correct ? prev.score + 1 : prev.score
                    }));
                };
                
                const nextQuestion = () => {
                    if (currentQ < questions.length - 1) {
                        setQuizState(prev => ({
                            ...prev,
                            currentQ: prev.currentQ + 1,
                            selected: null,
                            showResult: false
                        }));
                    } else {
                        setQuizState(prev => ({ ...prev, completed: true }));
                    }
                };
                
                const resetQuiz = () => {
                    setQuizState({
                        currentQ: 0,
                        score: 0,
                        selected: null,
                        showResult: false,
                        completed: false
                    });
                };
                
                if (completed) {
                    const percentage = Math.round((score / questions.length) * 100);
                    return (
                        <div className="fade-in">
                            <Header title="測驗完成" subtitle="Quiz Complete" showBack />
                            <div style={{ padding: '0 16px' }}>
                                <div style={{
                                    background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                    borderRadius: '20px',
                                    padding: '30px',
                                    textAlign: 'center',
                                    color: 'white',
                                    marginBottom: '20px'
                                }}>
                                    <div style={{ fontSize: '60px', marginBottom: '10px' }}>
                                        {percentage >= 80 ? '🎉' : percentage >= 60 ? '👍' : '💪'}
                                    </div>
                                    <div style={{ fontSize: '48px', fontWeight: '700', marginBottom: '10px' }}>
                                        {score} / {questions.length}
                                    </div>
                                    <div style={{ fontSize: '18px', opacity: 0.9 }}>
                                        正確率 {percentage}%
                                    </div>
                                </div>
                                
                                <div style={{
                                    padding: '20px',
                                    background: percentage >= 80 ? '#d1fae5' : percentage >= 60 ? '#fef3c7' : '#fee2e2',
                                    borderRadius: '16px',
                                    textAlign: 'center',
                                    marginBottom: '20px'
                                }}>
                                    <div style={{ 
                                        fontSize: '16px', 
                                        fontWeight: '600',
                                        color: percentage >= 80 ? '#065f46' : percentage >= 60 ? '#92400e' : '#991b1b'
                                    }}>
                                        {percentage >= 80 ? '優秀！你已掌握重點知識' : 
                                         percentage >= 60 ? '不錯！建議複習未掌握的部分' : 
                                         '加油！建議重新閱讀教學內容'}
                                    </div>
                                </div>
                                
                                <button
                                    onClick={resetQuiz}
                                    style={{
                                        width: '100%',
                                        padding: '16px',
                                        background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                        color: 'white',
                                        border: 'none',
                                        borderRadius: '12px',
                                        fontSize: '16px',
                                        fontWeight: '600',
                                        cursor: 'pointer'
                                    }}
                                >
                                    重新測驗
                                </button>
                            </div>
                        </div>
                    );
                }
                
                const q = questions[currentQ];
                
                return (
                    <div className="fade-in">
                        <Header title="自我測驗" subtitle={`問題 ${currentQ + 1} / ${questions.length}`} showBack />
                        <div style={{ padding: '0 16px' }}>
                            <div style={{ 
                                height: '6px', 
                                background: '#e5e7eb', 
                                borderRadius: '3px',
                                marginBottom: '20px',
                                overflow: 'hidden'
                            }}>
                                <div style={{
                                    height: '100%',
                                    width: `${((currentQ + 1) / questions.length) * 100}%`,
                                    background: 'linear-gradient(90deg, #667eea, #764ba2)',
                                    transition: 'width 0.3s ease'
                                }}/>
                            </div>
                            
                            <div style={{
                                background: 'white',
                                borderRadius: '16px',
                                padding: '20px',
                                marginBottom: '16px',
                                boxShadow: 'var(--shadow)'
                            }}>
                                <h3 style={{ fontSize: '17px', fontWeight: '600', lineHeight: '1.5' }}>
                                    {q.q}
                                </h3>
                            </div>
                            
                            {q.options.map((opt, idx) => {
                                let bgColor = 'white';
                                let borderColor = '#e5e7eb';
                                
                                if (showResult) {
                                    if (idx === q.correct) {
                                        bgColor = '#d1fae5';
                                        borderColor = '#10b981';
                                    } else if (idx === selected) {
                                        bgColor = '#fee2e2';
                                        borderColor = '#ef4444';
                                    }
                                } else if (idx === selected) {
                                    borderColor = '#667eea';
                                    bgColor = '#eef2ff';
                                }
                                
                                return (
                                    <button
                                        key={idx}
                                        onClick={() => handleAnswer(idx)}
                                        disabled={showResult}
                                        style={{
                                            width: '100%',
                                            padding: '16px',
                                            marginBottom: '10px',
                                            background: bgColor,
                                            border: `2px solid ${borderColor}`,
                                            borderRadius: '12px',
                                            textAlign: 'left',
                                            fontSize: '15px',
                                            cursor: showResult ? 'default' : 'pointer',
                                            display: 'flex',
                                            alignItems: 'center',
                                            gap: '12px'
                                        }}
                                    >
                                        <span style={{
                                            width: '28px',
                                            height: '28px',
                                            borderRadius: '50%',
                                            background: showResult && idx === q.correct ? '#10b981' : '#f3f4f6',
                                            color: showResult && idx === q.correct ? 'white' : '#6b7280',
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'center',
                                            fontWeight: '600',
                                            fontSize: '13px',
                                            flexShrink: 0
                                        }}>
                                            {String.fromCharCode(65 + idx)}
                                        </span>
                                        {opt}
                                    </button>
                                );
                            })}
                            
                            {showResult && (
                                <div style={{
                                    padding: '16px',
                                    background: selected === q.correct ? '#d1fae5' : '#fef3c7',
                                    borderRadius: '12px',
                                    borderLeft: `4px solid ${selected === q.correct ? '#10b981' : '#f59e0b'}`,
                                    marginBottom: '16px'
                                }} className="fade-in">
                                    <div style={{ fontWeight: '600', marginBottom: '6px' }}>
                                        {selected === q.correct ? '✓ 正確！' : '✗ 答錯了'}
                                    </div>
                                    <div style={{ fontSize: '14px', lineHeight: '1.5' }}>
                                        {q.explanation}
                                    </div>
                                </div>
                            )}
                            
                            {showResult && (
                                <button
                                    onClick={nextQuestion}
                                    style={{
                                        width: '100%',
                                        padding: '16px',
                                        background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                        color: 'white',
                                        border: 'none',
                                        borderRadius: '12px',
                                        fontSize: '16px',
                                        fontWeight: '600',
                                        cursor: 'pointer',
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                        gap: '8px'
                                    }}
                                >
                                    {currentQ < questions.length - 1 ? '下一題' : '查看結果'}
                                    <Icons.Arrow />
                                </button>
                            )}
                        </div>
                    </div>
                );
            };

            // ==================== RENDER PAGE ====================
            const renderPage = () => {
                switch(currentPage) {
                    case 'home': return <HomePage />;
                    case 'pre-cath': return <PreCathPage />;
                    case 'patient-handoff': return <PatientHandoffPage />;
                    case 'procedure-handoff': return <ProcedureHandoffPage />;
                    case 'post-cath': return <PostCathPage />;
                    case 'wound-care': return <WoundCarePage />;
                    case 'complications': return <ComplicationsPage />;
                    case 'quiz': return <QuizPage />;
                    default: return <HomePage />;
                }
            };
            
            return (
                <div style={{ 
                    maxWidth: '480px', 
                    margin: '0 auto',
                    minHeight: '100vh',
                    background: 'var(--bg-cream)',
                    paddingBottom: '30px'
                }}>
                    {renderPage()}
                </div>
            );
        };
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
