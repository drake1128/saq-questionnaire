<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>導管室護理教學 - 整合版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1e3a5f; --primary-light: #2d5a87; --accent: #e74c3c;
            --success: #27ae60; --warning: #f39c12; --info: #3498db; --purple: #9b59b6;
            --bg-cream: #faf8f5; --bg-card: #ffffff; --text-dark: #2c3e50; --text-muted: #7f8c8d;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-cream); color: var(--text-dark); line-height: 1.6;
            min-height: 100vh; -webkit-font-smoothing: antialiased;
        }
        #root { min-height: 100vh; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 25% { transform: scale(1.1); } 50% { transform: scale(1); } 75% { transform: scale(1.1); } }
        @keyframes flash { 0%, 50%, 100% { opacity: 1; } 25%, 75% { opacity: 0.6; } }
        @keyframes copySuccess { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .slide-in { animation: slideIn 0.3s ease-out forwards; }
        .flash-alert { animation: flash 2s infinite; }
        .copy-success { animation: copySuccess 0.3s ease-out; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const Icons = {
            Check: () => (<svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>),
            Arrow: () => (<svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8-8-8z"/></svg>),
            Back: () => (<svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>),
            Warning: () => (<svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>),
            Quiz: () => (<svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/></svg>),
            Medical: () => (<svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M19 3H5c-1.1 0-1.99.9-1.99 2L3 19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/></svg>),
            Person: () => (<svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>),
            Bed: () => (<svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/></svg>),
            Checklist: () => (<svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>),
            Exchange: () => (<svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>),
            Copy: () => (<svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>),
            Email: () => (<svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>)
        };

        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [preCathChecks, setPreCathChecks] = useState({ sandbag: false, consent: false, allergies: false, clothes: false, dentures: false, hearingAid: false, noShaving: false, ivLine: false });
            const [quizState, setQuizState] = useState({ currentQ: 0, score: 0, selected: null, showResult: false, completed: false });

            const menuItems = [
                { id: 'pre-cath', icon: <Icons.Checklist />, title: '術前準備', subtitle: 'Pre-Cath Checklist', color: '#3b82f6' },
                { id: 'patient-handoff', icon: <Icons.Person />, title: '病人交班', subtitle: '診斷與檢查結果', color: '#8b5cf6' },
                { id: 'procedure-handoff', icon: <Icons.Bed />, title: '術式交班', subtitle: '配合術式注意事項', color: '#06b6d4' },
                { id: 'post-cath', icon: <Icons.Exchange />, title: '術後交班', subtitle: '治療結果與照護', color: '#10b981' },
                { id: 'wound-care', icon: <Icons.Medical />, title: '傷口護理', subtitle: '加壓止血與評估', color: '#f59e0b' },
                { id: 'complications', icon: <Icons.Warning />, title: '併發症教學', subtitle: '血管併發症識別', color: '#ef4444' },
                { id: 'quiz', icon: <Icons.Quiz />, title: '自我測驗', subtitle: '綜合能力評量', color: '#ec4899' }
            ];

            const CriticalAlert = ({ icon, children }) => (
                <div style={{ background: 'linear-gradient(135deg, #dc2626 0%, #b91c1c 100%)', borderRadius: '16px', padding: '18px', marginBottom: '20px', color: 'white', display: 'flex', gap: '14px', alignItems: 'flex-start', boxShadow: '0 4px 15px rgba(220, 38, 38, 0.3)' }} className="flash-alert">
                    <span style={{ fontSize: '28px', flexShrink: 0 }}>{icon}</span>
                    <div style={{ flex: 1 }}>{children}</div>
                </div>
            );

            const ChecklistItem = ({ checked, onChange, children, important = false, critical = false }) => (
                <div onClick={() => onChange(!checked)} style={{ display: 'flex', alignItems: 'flex-start', gap: '12px', padding: '14px 16px', background: checked ? (critical ? '#fee2e2' : important ? '#fef3c7' : '#d1fae5') : 'white', borderRadius: '12px', marginBottom: '8px', cursor: 'pointer', border: `2px solid ${checked ? (critical ? '#fca5a5' : important ? '#fcd34d' : '#6ee7b7') : '#e5e7eb'}`, transition: 'all 0.2s ease' }}>
                    <div style={{ width: '24px', height: '24px', borderRadius: '6px', border: `2px solid ${checked ? (critical ? '#dc2626' : important ? '#f59e0b' : '#10b981') : '#d1d5db'}`, background: checked ? (critical ? '#dc2626' : important ? '#f59e0b' : '#10b981') : 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, marginTop: '2px', color: 'white' }}>
                        {checked && <Icons.Check />}
                    </div>
                    <div style={{ flex: 1, color: checked ? '#374151' : '#6b7280', fontSize: '15px', lineHeight: '1.5' }}>{children}</div>
                </div>
            );

            const InfoCard = ({ title, icon, color, children }) => (
                <div style={{ background: 'white', borderRadius: '16px', padding: '20px', marginBottom: '16px', boxShadow: 'var(--shadow)', borderTop: `4px solid ${color}` }}>
                    <h3 style={{ fontSize: '17px', fontWeight: '600', marginBottom: '16px', color: '#1f2937', display: 'flex', alignItems: 'center', gap: '10px' }}>
                        <span style={{ color }}>{icon}</span>{title}
                    </h3>
                    {children}
                </div>
            );

            const NoteBox = ({ children, color = '#6b7280', bgColor = '#f3f4f6' }) => (
                <div style={{ padding: '12px 14px', background: bgColor, borderRadius: '10px', fontSize: '13px', color: color, marginTop: '12px', borderLeft: `3px solid ${color}` }}>{children}</div>
            );

            const ToggleButton = ({ active, onClick, children, color = '#3b82f6' }) => (
                <button onClick={onClick} style={{ padding: '12px 18px', borderRadius: '10px', border: `2px solid ${active ? color : '#e5e7eb'}`, background: active ? `${color}15` : 'white', color: active ? color : '#6b7280', fontSize: '14px', fontWeight: '500', cursor: 'pointer', transition: 'all 0.2s ease' }}>
                    {active && '✓ '}{children}
                </button>
            );

            const Header = ({ title, subtitle, showBack = false }) => (
                <div style={{ background: 'linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%)', color: 'white', padding: '20px', paddingTop: '50px', borderRadius: '0 0 30px 30px', marginBottom: '20px', position: 'relative' }}>
                    {showBack && (
                        <button onClick={() => setCurrentPage('home')} style={{ position: 'absolute', top: '50px', left: '15px', background: 'rgba(255,255,255,0.2)', border: 'none', borderRadius: '50%', width: '40px', height: '40px', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: 'white' }}>
                            <Icons.Back />
                        </button>
                    )}
                    <div style={{ textAlign: 'center', paddingLeft: showBack ? '40px' : '0', paddingRight: showBack ? '40px' : '0' }}>
                        <h1 style={{ fontSize: '22px', fontWeight: '700', marginBottom: '4px' }}>{title}</h1>
                        {subtitle && <div style={{ opacity: 0.85, fontSize: '14px' }}>{subtitle}</div>}
                    </div>
                </div>
            );

            const HomePage = () => (
                <div className="fade-in">
                    <div style={{ background: 'linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%)', color: 'white', padding: '40px 20px 50px', borderRadius: '0 0 40px 40px', marginBottom: '20px', textAlign: 'center' }}>
                        <div style={{ fontSize: '48px', marginBottom: '12px', animation: 'heartbeat 2s infinite' }}>🫀</div>
                        <h1 style={{ fontSize: '24px', fontWeight: '700', marginBottom: '10px' }}>導管室護理教學 - 整合版</h1>
                        <div style={{ padding: '10px 20px', background: 'rgba(255,255,255,0.15)', borderRadius: '20px', display: 'inline-block', fontSize: '13px' }}>📚 交班工作與術後護理</div>
                    </div>
                    <div style={{ padding: '0 16px' }}>
                        {menuItems.map((item, idx) => (
                            <button key={item.id} onClick={() => setCurrentPage(item.id)} className="slide-in" style={{ width: '100%', display: 'flex', alignItems: 'center', gap: '16px', padding: '18px 20px', background: 'white', border: 'none', borderRadius: '16px', marginBottom: '12px', boxShadow: 'var(--shadow)', cursor: 'pointer', textAlign: 'left', animationDelay: `${idx * 0.08}s` }}>
                                <div style={{ width: '50px', height: '50px', borderRadius: '14px', background: `linear-gradient(135deg, ${item.color} 0%, ${item.color}dd 100%)`, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', flexShrink: 0 }}>{item.icon}</div>
                                <div style={{ flex: 1 }}>
                                    <div style={{ fontWeight: '600', fontSize: '16px', color: '#2c3e50' }}>{item.title}</div>
                                    <div style={{ fontSize: '13px', color: '#7f8c8d', marginTop: '2px' }}>{item.subtitle}</div>
                                </div>
                                <div style={{ color: '#bdc3c7' }}><Icons.Arrow /></div>
                            </button>
                        ))}
                    </div>
                </div>
            );

            const PreCathPage = () => {
                const updateCheck = (key) => setPreCathChecks(prev => ({ ...prev, [key]: !prev[key] }));
                const allChecked = Object.values(preCathChecks).every(v => v);
                const checkedCount = Object.values(preCathChecks).filter(v => v).length;
                return (
                    <div className="fade-in">
                        <Header title="術前準備 Checklist" subtitle="Pre-Catheterization Preparation" showBack />
                        <div style={{ padding: '0 16px' }}>
                            <CriticalAlert icon="🏋️"><div style={{ fontWeight: '700', fontSize: '16px', marginBottom: '4px' }}>請準備 2kg 砂包至導管室！</div><div style={{ fontSize: '13px', opacity: 0.95 }}>術後 femoral sheath 需使用砂包加壓止血</div></CriticalAlert>
                            <div style={{ background: 'white', borderRadius: '12px', padding: '16px', marginBottom: '20px', boxShadow: 'var(--shadow)' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}><span style={{ fontWeight: '600' }}>完成進度</span><span style={{ color: '#3b82f6', fontWeight: '600' }}>{checkedCount}/8</span></div>
                                <div style={{ height: '8px', background: '#e5e7eb', borderRadius: '4px', overflow: 'hidden' }}><div style={{ height: '100%', width: `${(checkedCount / 8) * 100}%`, background: allChecked ? '#10b981' : 'linear-gradient(90deg, #3b82f6, #8b5cf6)', transition: 'width 0.3s ease' }}/></div>
                            </div>
                            <InfoCard title="物品準備" icon="📦" color="#dc2626"><ChecklistItem checked={preCathChecks.sandbag} onChange={() => updateCheck('sandbag')} critical><strong>⚠️ 準備 2kg 砂包</strong><div style={{ fontSize: '12px', color: '#dc2626', marginTop: '4px' }}>【重要】攜帶至導管室，術後止血必備</div></ChecklistItem></InfoCard>
                            <InfoCard title="文件確認" icon="📋" color="#3b82f6">
                                <ChecklistItem checked={preCathChecks.consent} onChange={() => updateCheck('consent')} important><strong>確認同意書</strong>已簽署完成</ChecklistItem>
                                <ChecklistItem checked={preCathChecks.allergies} onChange={() => updateCheck('allergies')} critical><strong>確認過敏史</strong>（顯影劑/Iodine）</ChecklistItem>
                            </InfoCard>
                            <InfoCard title="病人準備" icon="👤" color="#8b5cf6">
                                <ChecklistItem checked={preCathChecks.clothes} onChange={() => updateCheck('clothes')}><strong>更換手術衣</strong></ChecklistItem>
                                <ChecklistItem checked={preCathChecks.dentures} onChange={() => updateCheck('dentures')}><strong>確認假牙移除</strong></ChecklistItem>
                                <ChecklistItem checked={preCathChecks.hearingAid} onChange={() => updateCheck('hearingAid')}><strong>確認助聽器移除</strong></ChecklistItem>
                                <ChecklistItem checked={preCathChecks.noShaving} onChange={() => updateCheck('noShaving')} important><strong>不需常規剃毛</strong></ChecklistItem>
                                <ChecklistItem checked={preCathChecks.ivLine} onChange={() => updateCheck('ivLine')}><strong>確認點滴通路</strong>（20G以上）</ChecklistItem>
                            </InfoCard>
                            {allChecked && (<div style={{ background: 'linear-gradient(135deg, #10b981 0%, #059669 100%)', color: 'white', padding: '20px', borderRadius: '16px', textAlign: 'center', marginBottom: '20px' }} className="fade-in"><div style={{ fontSize: '32px', marginBottom: '10px' }}>✓</div><div style={{ fontWeight: '700', fontSize: '18px' }}>準備完成！可以前往導管室</div></div>)}
                        </div>
                    </div>
                );
            };

            const PatientHandoffPage = () => {
                const [patientData, setPatientData] = useState({ diagnosis: '', egfr: '', ef: '', isUrgent: false });
                return (
                    <div className="fade-in">
                        <Header title="病人交班" subtitle="Patient Information Handoff" showBack />
                        <div style={{ padding: '0 16px' }}>
                            <InfoCard title="診斷分類" icon="🩺" color="#dc2626">
                                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                                    {['Stable CAD', 'STEMI', 'NSTE-ACS', 'PAOD', 'TAVI'].map(item => (<ToggleButton key={item} active={patientData.diagnosis === item} onClick={() => setPatientData(prev => ({ ...prev, diagnosis: prev.diagnosis === item ? '' : item }))} color="#dc2626">{item}</ToggleButton>))}
                                </div>
                                {patientData.diagnosis === 'STEMI' && (<div style={{ marginTop: '12px', padding: '14px', background: '#fef2f2', borderRadius: '10px', borderLeft: '4px solid #dc2626' }}><strong style={{ color: '#dc2626' }}>🚨 STEMI：</strong> D2B &lt; 90分鐘</div>)}
                            </InfoCard>
                            <InfoCard title="重要檢驗" icon="📊" color="#3b82f6">
                                <div style={{ marginBottom: '16px' }}><div style={{ fontSize: '14px', fontWeight: '500', marginBottom: '8px' }}>eGFR</div><div style={{ display: 'flex', gap: '8px' }}>{['≥60', '30-59', '<30'].map(item => (<ToggleButton key={item} active={patientData.egfr === item} onClick={() => setPatientData(prev => ({ ...prev, egfr: prev.egfr === item ? '' : item }))} color={item === '<30' ? '#dc2626' : '#3b82f6'}>{item}</ToggleButton>))}</div>{patientData.egfr === '<30' && <NoteBox color="#dc2626" bgColor="#fef2f2">⚠️ CKD 4-5：減少顯影劑</NoteBox>}</div>
                                <div><div style={{ fontSize: '14px', fontWeight: '500', marginBottom: '8px' }}>EF</div><div style={{ display: 'flex', gap: '8px' }}>{['≥50%', '35-49%', '<35%'].map(item => (<ToggleButton key={item} active={patientData.ef === item} onClick={() => setPatientData(prev => ({ ...prev, ef: prev.ef === item ? '' : item }))} color={item === '<35%' ? '#dc2626' : '#3b82f6'}>{item}</ToggleButton>))}</div>{patientData.ef === '<35%' && <NoteBox color="#dc2626" bgColor="#fef2f2">⚠️ 嚴重心衰竭：備IABP/ECMO</NoteBox>}</div>
                            </InfoCard>
                        </div>
                    </div>
                );
            };

            const ProcedureHandoffPage = () => {
                const [goToICU, setGoToICU] = useState(null);
                const [bedPosition, setBedPosition] = useState('');
                return (
                    <div className="fade-in">
                        <Header title="術式交班" subtitle="Procedure-Based Care" showBack />
                        <div style={{ padding: '0 16px' }}>
                            <InfoCard title="術後去向" icon="🏥" color="#dc2626">
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                                    <button onClick={() => setGoToICU(true)} style={{ padding: '20px', background: goToICU === true ? '#fee2e2' : 'white', border: `2px solid ${goToICU === true ? '#ef4444' : '#e5e7eb'}`, borderRadius: '12px', cursor: 'pointer' }}><div style={{ fontSize: '28px', marginBottom: '8px' }}>🏥</div><div style={{ fontWeight: '600' }}>進 ICU/CCU</div></button>
                                    <button onClick={() => setGoToICU(false)} style={{ padding: '20px', background: goToICU === false ? '#d1fae5' : 'white', border: `2px solid ${goToICU === false ? '#10b981' : '#e5e7eb'}`, borderRadius: '12px', cursor: 'pointer' }}><div style={{ fontSize: '28px', marginBottom: '8px' }}>🛏️</div><div style={{ fontWeight: '600' }}>回病房</div></button>
                                </div>
                            </InfoCard>
                            <InfoCard title="術後臥床姿勢" icon="🛏️" color="#8b5cf6">
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '16px' }}>
                                    <button onClick={() => setBedPosition('supine')} style={{ padding: '16px', background: bedPosition === 'supine' ? '#ede9fe' : 'white', border: `2px solid ${bedPosition === 'supine' ? '#8b5cf6' : '#e5e7eb'}`, borderRadius: '12px', cursor: 'pointer' }}><div style={{ fontWeight: '600' }}>平躺</div><div style={{ fontSize: '12px', color: '#6b7280' }}>Femoral</div></button>
                                    <button onClick={() => setBedPosition('radial')} style={{ padding: '16px', background: bedPosition === 'radial' ? '#d1fae5' : 'white', border: `2px solid ${bedPosition === 'radial' ? '#10b981' : '#e5e7eb'}`, borderRadius: '12px', cursor: 'pointer' }}><div style={{ fontWeight: '600' }}>可坐起</div><div style={{ fontSize: '12px', color: '#6b7280' }}>Radial</div></button>
                                </div>
                                {bedPosition === 'supine' && (<div style={{ padding: '14px', background: '#fef3c7', borderRadius: '10px', borderLeft: '4px solid #f59e0b' }}><strong style={{ color: '#b45309' }}>📌 Femoral 注意：</strong>平躺臥床，患肢伸直，2kg砂包加壓</div>)}
                                {bedPosition === 'radial' && (<div style={{ padding: '14px', background: '#d1fae5', borderRadius: '10px', borderLeft: '4px solid #10b981' }}><strong style={{ color: '#065f46' }}>📌 Radial 注意：</strong>可坐起，TR-band加壓，觀察手指循環</div>)}
                            </InfoCard>
                        </div>
                    </div>
                );
            };

            // ==================== POST-CATH PAGE - 含匯出功能 ====================
            const PostCathPage = () => {
                const [postData, setPostData] = useState({

                        if (postData.pciLocation.length > 0) text += `• 介入位置：${postData.pciLocation.join(', ')}\n`;

                    }

                    if (mt.length > 0) text += `• 維持：${mt.join('、')}\n`;
                    text += `\n【術後醫囑】\n`;
                    if (postData.icuAdmission) text += `• ⚠️ ICU Admission\n`;

                };

                    catch (err) { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-999999px'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); setCopySuccess(true); setTimeout(() => setCopySuccess(false), 2000); } catch (e) { alert('複製失敗'); } document.body.removeChild(ta); }
                };
                const sendEmail = () => { const text = generateHandoffText(); const subject = encodeURIComponent(`心導管術後交班 - ${new Date().toLocaleDateString('zh-TW')}`); const body = encodeURIComponent(text); window.location.href = `mailto:?subject=${subject}&body=${body}`; };

                                <div style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '12px', background: '#f3f4f6', borderRadius: '10px' }}><span>血管病變：</span>{['1', '2', '3'].map(n => (<button key={n} onClick={() => updatePost('vesselDisease', postData.vesselDisease === n ? '' : n)} style={{ width: '40px', height: '40px', borderRadius: '50%', border: `2px solid ${postData.vesselDisease === n ? '#8b5cf6' : '#e5e7eb'}`, background: postData.vesselDisease === n ? '#ede9fe' : 'white', color: postData.vesselDisease === n ? '#7c3aed' : '#6b7280', fontWeight: '700', cursor: 'pointer' }}>{n}</button>))}<span style={{ fontSize: '14px', color: '#6b7280' }}>VD</span></div>

                                <ChecklistItem checked={postData.labCheck} onChange={() => updatePost('labCheck', !postData.labCheck)}><strong>Check Labs</strong>（CK/CKMB/TropI/Hb/aPTT）</ChecklistItem>

                            </div>

                        </div>
                    </div>

                            </InfoCard>

                            </InfoCard>
                        </div>
                    </div>
                );
            };

            const ComplicationsPage = () => (
                <div className="fade-in">
                    <Header title="併發症教學" subtitle="Vascular Complications" showBack />
                    <div style={{ padding: '0 16px' }}>
                        {[{ title: '血腫 Hematoma', icon: '🩸', color: '#dc2626', signs: ['穿刺部位腫脹', '疼痛加劇', '瘀青擴大'], actions: ['標記範圍', '加強壓迫', '通知醫師'] },
                          { title: '假性動脈瘤', icon: '💢', color: '#f59e0b', signs: ['搏動性腫塊', '觸診震顫', '聽診雜音'], actions: ['避免按壓', '超音波確認', '可能需手術'] },
                          { title: '腹膜後血腫', icon: '🚨', color: '#ef4444', signs: ['低血壓', '腹脹/腰痛', 'Hb下降'], actions: ['緊急CT', '輸血準備', '血管攝影'] }
                        ].map((comp, idx) => (<InfoCard key={idx} title={comp.title} icon={comp.icon} color={comp.color}><div style={{ marginBottom: '12px' }}><div style={{ fontWeight: '600', fontSize: '14px', marginBottom: '8px' }}>⚠️ 警示徵象：</div><div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>{comp.signs.map((sign, i) => (<span key={i} style={{ padding: '6px 12px', background: `${comp.color}15`, color: comp.color, borderRadius: '20px', fontSize: '13px' }}>{sign}</span>))}</div></div><div><div style={{ fontWeight: '600', fontSize: '14px', marginBottom: '8px' }}>🏥 處置：</div><div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>{comp.actions.map((action, i) => (<span key={i} style={{ padding: '6px 12px', background: '#f3f4f6', color: '#374151', borderRadius: '20px', fontSize: '13px' }}>{action}</span>))}</div></div></InfoCard>))}

            const QuizPage = () => {
                const { currentQ, score, selected, showResult, completed } = quizState;
                const questions = [
                    { q: '術前最重要必須攜帶到導管室的物品？', options: ['病歷', '2kg 砂包', '血壓計', '氧氣筒'], correct: 1, explanation: '2kg 砂包是術後股動脈穿刺加壓止血的必備物品。' },
                    { q: 'STEMI 病患 D2B 時間目標？', options: ['30分鐘', '60分鐘', '90分鐘', '120分鐘'], correct: 2, explanation: 'STEMI D2B 目標為 90 分鐘內。' },
                    { q: 'Femoral 穿刺後應採取什麼姿勢？', options: ['坐起休息', '平躺，患肢伸直', '側躺', '隨意活動'], correct: 1, explanation: 'Femoral 穿刺後需平躺臥床，患肢伸直勿彎曲。' },
                    { q: '傷口評估 5P 不包含？', options: ['Pain', 'Pulse', 'Pressure', 'Pallor'], correct: 2, explanation: '5P 包含 Pain, Pulse, Pallor, Paresthesia, Paralysis。' },
                    { q: '使用 DAPT 時，哪種病患建議併用 PPI？', options: ['年齡<40歲', '年齡≥65歲', '男性', '首次PCI'], correct: 1, explanation: '年齡 ≥ 65 歲建議併用 PPI。' }
                ];
                const handleAnswer = (idx) => { if (showResult) return; setQuizState(prev => ({ ...prev, selected: idx, showResult: true, score: idx === questions[currentQ].correct ? prev.score + 1 : prev.score })); };
                const nextQuestion = () => { if (currentQ < questions.length - 1) { setQuizState(prev => ({ ...prev, currentQ: prev.currentQ + 1, selected: null, showResult: false })); } else { setQuizState(prev => ({ ...prev, completed: true })); } };
                const restartQuiz = () => { setQuizState({ currentQ: 0, score: 0, selected: null, showResult: false, completed: false }); };
                
                if (completed) {
                    const percentage = Math.round((score / questions.length) * 100);
                    return (<div className="fade-in"><Header title="測驗結果" subtitle="Quiz Results" showBack /><div style={{ padding: '0 16px', textAlign: 'center' }}><div style={{ background: percentage >= 80 ? 'linear-gradient(135deg, #10b981, #059669)' : percentage >= 60 ? 'linear-gradient(135deg, #f59e0b, #d97706)' : 'linear-gradient(135deg, #ef4444, #dc2626)', borderRadius: '20px', padding: '40px 20px', color: 'white', marginBottom: '20px' }}><div style={{ fontSize: '64px', marginBottom: '10px' }}>{percentage >= 80 ? '🎉' : percentage >= 60 ? '👍' : '📚'}</div><div style={{ fontSize: '48px', fontWeight: '700' }}>{score}/{questions.length}</div><div style={{ fontSize: '18px', marginTop: '10px' }}>正確率 {percentage}%</div></div><button onClick={restartQuiz} style={{ width: '100%', padding: '16px', background: 'linear-gradient(135deg, #667eea, #764ba2)', color: 'white', border: 'none', borderRadius: '12px', fontSize: '16px', fontWeight: '600', cursor: 'pointer' }}>重新測驗</button></div></div>);
                }
                const q = questions[currentQ];
                return (
                    <div className="fade-in">
                        <Header title="自我測驗" subtitle={`問題 ${currentQ + 1} / ${questions.length}`} showBack />
                        <div style={{ padding: '0 16px' }}>
                            <div style={{ height: '6px', background: '#e5e7eb', borderRadius: '3px', marginBottom: '20px', overflow: 'hidden' }}><div style={{ height: '100%', width: `${((currentQ + 1) / questions.length) * 100}%`, background: 'linear-gradient(90deg, #667eea, #764ba2)', transition: 'width 0.3s ease' }}/></div>
                            <div style={{ background: 'white', borderRadius: '16px', padding: '20px', marginBottom: '16px', boxShadow: 'var(--shadow)' }}><h3 style={{ fontSize: '17px', fontWeight: '600', lineHeight: '1.5' }}>{q.q}</h3></div>
                            {q.options.map((opt, idx) => { let bgColor = 'white'; let borderColor = '#e5e7eb'; if (showResult) { if (idx === q.correct) { bgColor = '#d1fae5'; borderColor = '#10b981'; } else if (idx === selected) { bgColor = '#fee2e2'; borderColor = '#ef4444'; } } else if (idx === selected) { borderColor = '#667eea'; bgColor = '#eef2ff'; } return (<button key={idx} onClick={() => handleAnswer(idx)} disabled={showResult} style={{ width: '100%', padding: '16px', marginBottom: '10px', background: bgColor, border: `2px solid ${borderColor}`, borderRadius: '12px', textAlign: 'left', fontSize: '15px', cursor: showResult ? 'default' : 'pointer', display: 'flex', alignItems: 'center', gap: '12px' }}><span style={{ width: '28px', height: '28px', borderRadius: '50%', background: showResult && idx === q.correct ? '#10b981' : '#f3f4f6', color: showResult && idx === q.correct ? 'white' : '#6b7280', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '600', fontSize: '13px', flexShrink: 0 }}>{String.fromCharCode(65 + idx)}</span>{opt}</button>); })}
                            {showResult && (<div style={{ padding: '16px', background: selected === q.correct ? '#d1fae5' : '#fef3c7', borderRadius: '12px', borderLeft: `4px solid ${selected === q.correct ? '#10b981' : '#f59e0b'}`, marginBottom: '16px' }} className="fade-in"><div style={{ fontWeight: '600', marginBottom: '6px' }}>{selected === q.correct ? '✓ 正確！' : '✗ 答錯了'}</div><div style={{ fontSize: '14px', lineHeight: '1.5' }}>{q.explanation}</div></div>)}
                            {showResult && (<button onClick={nextQuestion} style={{ width: '100%', padding: '16px', background: 'linear-gradient(135deg, #667eea, #764ba2)', color: 'white', border: 'none', borderRadius: '12px', fontSize: '16px', fontWeight: '600', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px' }}>{currentQ < questions.length - 1 ? '下一題' : '查看結果'}<Icons.Arrow /></button>)}
                        </div>
                    </div>
                );
            };

            const renderPage = () => {
                switch(currentPage) {
                    case 'home': return <HomePage />;
                    case 'pre-cath': return <PreCathPage />;
                    case 'patient-handoff': return <PatientHandoffPage />;
                    case 'procedure-handoff': return <ProcedureHandoffPage />;
                    case 'post-cath': return <PostCathPage />;
                    case 'wound-care': return <WoundCarePage />;
                    case 'complications': return <ComplicationsPage />;
                    case 'quiz': return <QuizPage />;
                    default: return <HomePage />;
                }
            };
            
            return (<div style={{ maxWidth: '480px', margin: '0 auto', minHeight: '100vh', background: 'var(--bg-cream)', paddingBottom: '30px' }}>{renderPage()}</div>);
        };
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
