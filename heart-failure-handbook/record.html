<h1>心臟衰竭自我監測紀錄表</h1>
<p>每日固定時間量測（建議順序：<strong>早上起床 → 如廁 → 量體重</strong>）；體重請穿著相同衣物或輕便衣物。<strong>若出現體重短期上升、明顯喘或不適，請儘早回診或聯絡醫療人員。</strong></p>
<div class="table-wrapper">
<table class="record fullwidth">

  <th>日期</th><th>時間</th><th>收縮壓<br><span class="unit">mmHg</span></th><th>舒張壓<br><span class="unit">mmHg</span></th><th>心跳<br><span class="unit">次/分</span></th><th>體重<br><span class="unit">kg</span></th><th class="sym">症狀記錄<br><span class="unit">喘／咳／水腫／頭暈等</span></th>
</tr></thead>
