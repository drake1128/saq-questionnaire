                                </Section>

                                <Section title="Clinical Pearls" icon="💎" color={caseData.color}>
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                                        {caseData.clinicalPearls.map((pearl, idx) => (
                                            <div key={idx} style={{
                                                padding: '12px',
                                                background: `${caseData.color}15`,
                                                borderRadius: '10px',
                                                fontSize: '14px',
                                                lineHeight: '1.6',
                                                borderLeft: `4px solid ${caseData.color}`
                                            }}>
                                                {pearl}
                                            </div>
                                        ))}
                                    </div>
                                </Section>

                                <div style={{
                                    background: 'linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%)',
                                    borderRadius: '16px',
                                    padding: '20px',
                                    marginBottom: '16px'
                                }}>
                                    <div style={{ fontSize: '14px', fontWeight: '600', marginBottom: '12px' }}>
                                        📌 本案例核心教訓
                                    </div>
                                    <div style={{
                                        fontSize: '16px',
                                        fontWeight: '700',
                                        lineHeight: '1.6'
                                    }}>
                                        {caseData.keyLesson}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Quiz Tab */}
                        {activeTab === 'quiz' && (
                            <div className="fade-in">
                                <Section title="自我測驗" icon="✏️" color={caseData.color}>
                                    <QuizSection quiz={caseData.quiz} caseColor={caseData.color} />
                                </Section>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Home Page
        const HomePage = ({ onSelectCase }) => (
            <div className="fade-in">
                <Header 
                    title="心導管併發症案例教學"
                    subtitle="PCI Complications Case-Based Learning"
                />
                <div style={{ padding: '0 16px' }}>
                    <div style={{
                        background: 'linear-gradient(135deg, #dc2626 0%, #b91c1c 100%)',
                        borderRadius: '16px',
                        padding: '20px',
                        marginBottom: '20px'
                    }}>
                        <div style={{ fontSize: '14px', opacity: 0.9, marginBottom: '8px' }}>📚 學習目標</div>
                        <div style={{ fontSize: '15px', lineHeight: '1.7' }}>
                            透過 6 個真實案例，學習心導管術後常見併發症的識別、處理與預防，強化臨床照護能力。
                        </div>
                    </div>

                    <div style={{ fontSize: '14px', color: 'var(--text-muted)', marginBottom: '12px', fontWeight: '600' }}>
                        選擇案例開始學習
                    </div>

                    {casesData.map(caseData => (
                        <CaseCard 
                            key={caseData.id}
                            caseData={caseData}
                            onClick={() => onSelectCase(caseData)}
                        />
                    ))}

                    <div style={{
                        background: 'var(--bg-card)',
                        borderRadius: '16px',
                        padding: '20px',
                        marginTop: '20px',
                        border: '1px solid var(--border)'
                    }}>
                        <div style={{ fontSize: '15px', fontWeight: '600', marginBottom: '12px' }}>
                            📋 六大併發症重點整理
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '10px' }}>
                            {[
                                { icon: '💊', text: 'DAPT 藥物衛教' },
                                { icon: '📊', text: '生命徵象監測' },
                                { icon: '⚡', text: '電解質平衡' },
                                { icon: '🫘', text: '腎功能保護' },
                                { icon: '🧠', text: '神經學監測' },
                                { icon: '🦵', text: '週邊循環檢查' }
                            ].map((item, idx) => (
                                <div key={idx} style={{
                                    padding: '12px',
                                    background: 'var(--bg-dark)',
                                    borderRadius: '10px',
                                    fontSize: '13px',
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '8px'
                                }}>
                                    <span style={{ fontSize: '18px' }}>{item.icon}</span>
                                    {item.text}
                                </div>
                            ))}
                        </div>
                    </div>

                    <div style={{
                        textAlign: 'center',
                        padding: '20px',
                        fontSize: '12px',
                        color: 'var(--text-muted)'
                    }}>
                        台大醫院新竹分院 心血管中心<br/>
                        PCI Complications Case Teaching v1.0
                    </div>
                </div>
            </div>
        );

        // Main App
        const App = () => {
            const [selectedCase, setSelectedCase] = useState(null);

            if (selectedCase) {
                return <CaseDetailPage caseData={selectedCase} onBack={() => setSelectedCase(null)} />;
            }

            return <HomePage onSelectCase={setSelectedCase} />;
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
      function initShareButtons() { const pageUrl = window.location.href; const pageTitle = document.title; const encodedUrl = encodeURIComponent(pageUrl); const qrCodeImg = document.getElementById('qrCode'); if (qrCodeImg) qrCodeImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodedUrl}`; const lineShare = document.getElementById('lineShare'); if (lineShare) lineShare.href = `https://social-plugins.line.me/lineit/share?url=${encodedUrl}`; const emailShare = document.getElementById('emailShare'); if (emailShare) { const emailSubject = encodeURIComponent(`分享：${pageTitle}`); const emailBody = encodeURIComponent(`我想和您分享這個頁面：\n\n${pageTitle}\n\n${pageUrl}`); emailShare.href = `mailto:?subject=${emailSubject}&body=${emailBody}`; } }
      function toggleShareMenu() { const menu = document.getElementById('shareMenu'); if (menu) menu.classList.toggle('active'); }
      function copyPageUrl() { const pageUrl = window.location.href; navigator.clipboard.writeText(pageUrl).then(() => { alert('連結已複製到剪貼簿！'); }).catch(() => { const textArea = document.createElement('textarea'); textArea.value = pageUrl; document.body.appendChild(textArea); textArea.select(); document.execCommand('copy'); document.body.removeChild(textArea); alert('連結已複製到剪貼簿！'); }); }
      document.addEventListener('click', function(event) { const shareButton = document.querySelector('.share-button'); const shareMenu = document.getElementById('shareMenu'); if (shareButton && shareMenu && !shareButton.contains(event.target) && shareMenu.classList.contains('active')) shareMenu.classList.remove('active'); });
      document.addEventListener('DOMContentLoaded', initShareButtons);
    </script>
</body>
</html>
