        // Main App Component
        function App() {
            const [currentView, setCurrentView] = useState('home');
            const [selectedChapter, setSelectedChapter] = useState(null);

                currentQuestion: 0,
                answers: [],
                showResult: false
            });
            const [showAbbreviations, setShowAbbreviations] = useState(false);

            const handleChapterSelect = (chapter) => {
                setSelectedChapter(chapter);
                setCurrentView('chapter');
            };

            const handleStartQuiz = (chapter) => {
                setSelectedChapter(chapter);
                setQuizState({
                    currentQuestion: 0,
                    answers: [],
                    showResult: false
                });
                setCurrentView('quiz');
            };

            const handleQuizAnswer = (answerIndex) => {
                const newAnswers = [...quizState.answers, answerIndex];
                if (newAnswers.length < selectedChapter.quiz.length) {
                    setQuizState({
                        ...quizState,
                        currentQuestion: quizState.currentQuestion + 1,
                        answers: newAnswers
                    });
                } else {
                    setQuizState({
                        ...quizState,
                        answers: newAnswers,
                        showResult: true
                    });
                }
            };

            const calculateScore = () => {
                let correct = 0;
                quizState.answers.forEach((answer, index) => {
                    if (answer === selectedChapter.quiz[index].correct) {
                        correct++;
                    }
                });
                return correct;
            };

            return (
                <div className="min-h-screen bg-slate-50">
                    {/* Header */}

                            <p className="text-slate-500 mt-2">
                                {score === chapter.quiz.length ? '太厲害了！全對！' :
                                 score >= chapter.quiz.length / 2 ? '做得不錯，繼續加油！' : '多複習一下內容吧！'}
                            </p>
                        </div>

                        <div className="space-y-3">
                            {chapter.quiz.map((q, index) => (
                                <div key={index} className="bg-white rounded-xl p-4 shadow-sm">
                                    <p className="font-medium text-slate-800 mb-2">
                                        {index + 1}. {q.question}
                                    </p>
                                    <div className="space-y-2">
                                        {q.options.map((option, optIndex) => (
                                            <div
                                                key={optIndex}
                                                className={`p-2 rounded-lg text-sm ${
                                                    optIndex === q.correct
                                                        ? 'bg-green-100 text-green-800'
                                                        : optIndex === quizState.answers[index]
                                                            ? 'bg-red-100 text-red-800'
                                                            : 'bg-slate-50 text-slate-600'
                                                }`}
                                            >
                                                {optIndex === q.correct && '✓ '}
                                                {optIndex === quizState.answers[index] && optIndex !== q.correct && '✗ '}
                                                {option}
                                            </div>
                                        ))}
                                    </div>
                                    <p className="text-sm text-slate-500 mt-2 bg-slate-50 p-2 rounded">
                                        💡 {q.explanation}
                                    </p>
                                </div>
                            ))}
                        </div>

                        <button
                            onClick={onBack}
                            className="w-full bg-slate-600 hover:bg-slate-700 text-white py-3 rounded-xl font-medium transition-colors"
                        >
                            返回章節列表
                        </button>
                    </div>
                );
            }

            return (
                <div className="space-y-4">
                    <div className="flex items-center justify-between">
                        <button
                            onClick={onBack}
                            className="text-slate-600 hover:text-slate-800 transition-colors"
                        >
                            ← 返回
                        </button>
                        <span className="text-slate-500">
                            {quizState.currentQuestion + 1} / {chapter.quiz.length}
                        </span>
                    </div>

                    <div className="bg-white rounded-xl p-6 shadow-sm">
                        <div className="w-full bg-slate-200 rounded-full h-2 mb-6">
                            <div
                                className="bg-indigo-600 h-2 rounded-full transition-all"
                                style={{ width: `${((quizState.currentQuestion + 1) / chapter.quiz.length) * 100}%` }}
                            />
                        </div>

                        <h3 className="text-lg font-medium text-slate-800 mb-4">
                            {currentQ.question}
                        </h3>

                        <div className="space-y-3">
                            {currentQ.options.map((option, index) => (
                                <button
                                    key={index}
                                    onClick={() => onAnswer(index)}
                                    className="w-full p-4 text-left border-2 border-slate-200 rounded-xl quiz-option"
                                >
                                    <span className="inline-block w-8 h-8 rounded-full bg-slate-100 text-center leading-8 mr-3 text-slate-600">
                                        {String.fromCharCode(65 + index)}
                                    </span>
                                    {option}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // Abbreviation Modal Component
        function AbbreviationModal({ abbreviations, onClose }) {
            const [searchTerm, setSearchTerm] = useState('');

            const filteredAbbr = abbreviations.filter(item =>
                item.abbr.toLowerCase().includes(searchTerm.toLowerCase()) ||
                item.full.toLowerCase().includes(searchTerm.toLowerCase()) ||
                item.chinese.includes(searchTerm)
            );

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-2xl max-w-lg w-full max-h-[80vh] overflow-hidden">
                        <div className="p-4 border-b border-slate-200">
                            <div className="flex items-center justify-between mb-3">
                                <h3 className="text-lg font-bold text-slate-800">📖 縮寫對照表</h3>
                                <button
                                    onClick={onClose}
                                    className="text-slate-400 hover:text-slate-600"
                                >
                                    ✕
                                </button>
                            </div>
                            <input
                                type="text"
                                placeholder="搜尋縮寫..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            />
                        </div>
                        <div className="overflow-y-auto max-h-[60vh] p-4">
                            <div className="space-y-2">
                                {filteredAbbr.map((item, index) => (
                                    <div key={index} className="bg-slate-50 rounded-lg p-3">
                                        <div className="flex items-center gap-2">
                                            <span className="font-bold text-indigo-600">{item.abbr}</span>
                                            <span className="text-slate-400">-</span>
                                            <span className="text-slate-700">{item.full}</span>
                                        </div>
                                        <p className="text-sm text-slate-500 mt-1">{item.chinese}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script>
  function initShareButtons() { const pageUrl = window.location.href; const pageTitle = document.title; const encodedUrl = encodeURIComponent(pageUrl); const qrCodeImg = document.getElementById('qrCode'); if (qrCodeImg) qrCodeImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodedUrl}`; const lineShare = document.getElementById('lineShare'); if (lineShare) lineShare.href = `https://social-plugins.line.me/lineit/share?url=${encodedUrl}`; const emailShare = document.getElementById('emailShare'); if (emailShare) { const emailSubject = encodeURIComponent(`分享：${pageTitle}`); const emailBody = encodeURIComponent(`我想和您分享這個頁面：\n\n${pageTitle}\n\n${pageUrl}`); emailShare.href = `mailto:?subject=${emailSubject}&body=${emailBody}`; } }
  function toggleShareMenu() { const menu = document.getElementById('shareMenu'); if (menu) menu.classList.toggle('active'); }
  function copyPageUrl() { const pageUrl = window.location.href; navigator.clipboard.writeText(pageUrl).then(() => { alert('連結已複製到剪貼簿！'); }).catch(() => { const textArea = document.createElement('textarea'); textArea.value = pageUrl; document.body.appendChild(textArea); textArea.select(); document.execCommand('copy'); document.body.removeChild(textArea); alert('連結已複製到剪貼簿！'); }); }
  document.addEventListener('click', function(event) { const shareButton = document.querySelector('.share-button'); const shareMenu = document.getElementById('shareMenu'); if (shareButton && shareMenu && !shareButton.contains(event.target) && shareMenu.classList.contains('active')) shareMenu.classList.remove('active'); });
  document.addEventListener('DOMContentLoaded', initShareButtons);
</script>
</body>
</html>
