          setSvg(iconData.toSvg({ width: size, height: size, class: className }));

      }, [name, className, size]);

                  ['呼吸變化', 'MV E 變化 < 25%', 'MV E 變化 ≥ 25%'],
                  ['肝靜脈', '舒張期逆流增加', '呼氣時舒張期逆流增加'],
                ]
              },

    const abbreviations = [
      { abbr: 'DCM', full: 'Dilated Cardiomyopathy', chinese: '擴張型心肌病' },
      { abbr: 'HCM', full: 'Hypertrophic Cardiomyopathy', chinese: '肥厚型心肌病' },
      { abbr: 'RCM', full: 'Restrictive Cardiomyopathy', chinese: '限制型心肌病' },
      { abbr: 'SAM', full: 'Systolic Anterior Motion', chinese: '收縮期前移' },
      { abbr: 'LVOT', full: 'LV Outflow Tract', chinese: '左心室流出道' },
      { abbr: 'ASH', full: 'Asymmetric Septal Hypertrophy', chinese: '非對稱性室間隔肥厚' },
      { abbr: 'GLS', full: 'Global Longitudinal Strain', chinese: '全球縱向應變' },
      { abbr: 'LGE', full: 'Late Gadolinium Enhancement', chinese: '延遲釓增強' },
      { abbr: 'CMR', full: 'Cardiac MRI', chinese: '心臟磁振造影' },
      { abbr: 'AL', full: 'Amyloid Light-chain', chinese: '輕鏈澱粉樣變' },
      { abbr: 'ATTR', full: 'Transthyretin Amyloidosis', chinese: '轉甲狀腺素澱粉樣變' },
      { abbr: 'TTR', full: 'Transthyretin', chinese: '轉甲狀腺素' },
      { abbr: 'DT', full: 'Deceleration Time', chinese: '減速時間' },
    ];

    function CardiomyopathyApp() {
      const [currentView, setCurrentView] = useState('home');
      const [selectedChapter, setSelectedChapter] = useState(null);
      const [selectedSection, setSelectedSection] = useState(0);
      const [quizMode, setQuizMode] = useState(false);
      const [quizIndex, setQuizIndex] = useState(0);
      const [quizAnswer, setQuizAnswer] = useState(null);
      const [quizScore, setQuizScore] = useState(0);
      const [quizComplete, setQuizComplete] = useState(false);
      const [showAbbrModal, setShowAbbrModal] = useState(false);

      const chapterList = Object.values(chapters);

      const startQuiz = (chapter) => {
        setSelectedChapter(chapter);
        setQuizMode(true);
        setQuizIndex(0);
        setQuizAnswer(null);
        setQuizScore(0);
        setQuizComplete(false);
      };

      const handleQuizAnswer = (index) => {
        if (quizAnswer !== null) return;
        setQuizAnswer(index);
        if (index === selectedChapter.quiz[quizIndex].correct) {
          setQuizScore(prev => prev + 1);
        }
      };

      const nextQuestion = () => {
        if (quizIndex < selectedChapter.quiz.length - 1) {
          setQuizIndex(prev => prev + 1);
          setQuizAnswer(null);
        } else {
          setQuizComplete(true);
        }
      };

      const renderContentItem = (item, idx) => {
        switch (item.type) {
          case 'heading':
            return (
              <h3 key={idx} className="text-lg font-bold text-slate-800 mt-6 mb-3 flex items-center gap-2">
                <div className="w-1 h-5 bg-gradient-to-b from-pink-500 to-orange-500 rounded-full"></div>
                {item.text}
              </h3>
            );
          case 'step':
            return (
              <div key={idx} className="flex gap-3 my-2 items-start">
                <div className="w-6 h-6 rounded-full bg-pink-100 text-pink-600 flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">✓</div>
                <p className="text-slate-700 leading-relaxed">{item.text}</p>
              </div>
            );
          case 'point':
            return <p key={idx} className="my-2 text-slate-700 pl-4 border-l-2 border-pink-200">{item.text}</p>;
          case 'formula':
            return (
              <div key={idx} className="my-3 bg-gradient-to-r from-amber-50 to-orange-50 p-4 rounded-xl border border-amber-200 font-mono text-sm text-amber-900 overflow-x-auto">
                {item.text}
              </div>
            );
          case 'tip':
            return <div key={idx} className="my-3 bg-gradient-to-r from-emerald-50 to-teal-50 p-4 rounded-xl border border-emerald-200 text-emerald-800">{item.text}</div>;
          case 'warning':
            return <div key={idx} className="my-3 bg-gradient-to-r from-red-50 to-rose-50 p-4 rounded-xl border border-red-200 text-red-800">{item.text}</div>;
          case 'table':
            return (
              <div key={idx} className="my-4 overflow-x-auto rounded-xl border border-slate-200 shadow-sm">
                <table className="w-full text-sm">
                  <thead className="bg-gradient-to-r from-pink-50 to-orange-50">
                    <tr>{item.headers.map((h, i) => <th key={i} className="px-4 py-3 text-left font-semibold text-slate-700 border-b border-slate-200">{h}</th>)}</tr>
                  </thead>
                  <tbody>
                    {item.rows.map((row, i) => (
                      <tr key={i} className="hover:bg-pink-50/50 transition-colors">
                        {row.map((cell, j) => <td key={j} className="px-4 py-3 border-b border-slate-100 text-slate-700">{cell}</td>)}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            );
          default:
            return null;
        }
      };

      const renderHome = () => (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 via-pink-50 to-orange-50">
          <div className="bg-gradient-to-r from-pink-600 via-pink-500 to-orange-500 text-white px-4 py-6 shadow-lg">
            <div className="flex items-center justify-between mb-2">
              <a href="tsoc-echo-learning-2025.html" className="p-2 hover:bg-white/10 rounded-lg transition-colors flex items-center gap-2">
                <Icon name="arrow-left" size={20} /><span className="text-sm">返回主頁</span>
              </a>
              <button onClick={() => setShowAbbrModal(true)} className="p-2 hover:bg-white/10 rounded-lg transition-colors">
                <Icon name="bookmark" size={24} />
              </button>
            </div>
            <h1 className="text-2xl font-bold text-center">💔 心肌病變</h1>
            <p className="text-pink-100 text-sm text-center mt-1">Chapters 05-07: DCM, HCM, RCM</p>
          </div>

          <div className="px-4 py-6 space-y-4">
            <h2 className="text-lg font-bold text-slate-800 mb-4">選擇章節</h2>
            {chapterList.map((chapter) => (
              <button
                key={chapter.id}
                onClick={() => { setSelectedChapter(chapter); setSelectedSection(0); setCurrentView('chapter'); }}
                className="w-full bg-white rounded-2xl p-4 shadow-sm hover:shadow-lg transition-all border border-slate-100 text-left group"
              >
                <div className="flex items-center gap-4">
                  <div className="w-14 h-14 rounded-xl flex items-center justify-center text-2xl shadow-sm" style={{ backgroundColor: `${chapter.color}15` }}>{chapter.icon}</div>
                  <div className="flex-1">
                    <h3 className="font-bold text-slate-800 group-hover:text-pink-600 transition-colors">{chapter.title}</h3>
                    <p className="text-sm text-slate-500">{chapter.titleEn}</p>
                    <div className="flex items-center gap-4 mt-2 text-xs text-slate-400">
                      <span>📄 {chapter.sections.length} 小節</span>
                      <span>🏆 {chapter.quiz.length} 題測驗</span>
                    </div>
                  </div>
                  <Icon name="chevron-right" className="text-slate-400 group-hover:text-pink-600" size={20} />
                </div>
              </button>
            ))}
          </div>

          <div className="px-4 pb-6">
            <h2 className="text-lg font-bold text-slate-800 mb-4">🔗 相關主題</h2>
            <div className="grid grid-cols-2 gap-3">
              <a href="echo-hemodynamics.html" className="bg-white rounded-xl p-3 shadow-sm hover:shadow-md transition-all border border-slate-100 flex items-center gap-2">
                <span className="text-lg">💨</span><span className="text-sm font-medium text-slate-700">舒張功能</span>
              </a>
              <a href="echo-ischemic.html" className="bg-white rounded-xl p-3 shadow-sm hover:shadow-md transition-all border border-slate-100 flex items-center gap-2">
                <span className="text-lg">🩺</span><span className="text-sm font-medium text-slate-700">缺血性心病</span>
              </a>
            </div>
          </div>
        </div>
      );

      const renderChapter = () => {
        if (!selectedChapter) return null;
        const section = selectedChapter.sections[selectedSection];
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-50 via-pink-50 to-orange-50">
            <div className="sticky top-0 z-10 px-4 py-4 shadow-lg" style={{ background: `linear-gradient(135deg, ${selectedChapter.color}, ${selectedChapter.color}dd)` }}>
              <div className="flex items-center justify-between text-white">
                <button onClick={() => setCurrentView('home')} className="p-2 hover:bg-white/10 rounded-lg transition-colors flex items-center gap-1"><Icon name="chevron-left" size={20} /><span className="text-sm">返回</span></button>
                <h1 className="font-bold text-lg flex-1 text-center px-2 truncate">{selectedChapter.title}</h1>
                <a href="tsoc-echo-learning-2025.html" className="p-2 hover:bg-white/10 rounded-lg transition-colors"><Icon name="home" size={20} /></a>
              </div>
            </div>
            <div className="overflow-x-auto bg-white border-b border-slate-100 shadow-sm">
              <div className="flex p-2 gap-2 min-w-max">
                {selectedChapter.sections.map((sec, idx) => (
                  <button key={sec.id} onClick={() => setSelectedSection(idx)}
                    className={`px-4 py-2 rounded-full text-sm whitespace-nowrap transition-all ${selectedSection === idx ? 'text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                    style={selectedSection === idx ? { backgroundColor: selectedChapter.color } : {}}>
                    {sec.title}
                  </button>
                ))}
              </div>
            </div>
            <div className="px-4 py-6">
              <h2 className="text-xl font-bold text-slate-800 mb-4">{section.title}</h2>
              <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                {section.content.map((item, idx) => renderContentItem(item, idx))}
              </div>
            </div>
            <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-3 flex items-center justify-between shadow-lg">
              <button onClick={() => setSelectedSection(prev => Math.max(0, prev - 1))} disabled={selectedSection === 0}
                className="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-100 text-slate-700 disabled:opacity-50 hover:bg-slate-200 transition-colors">
                <Icon name="chevron-left" size={20} />上一節
              </button>
              <button onClick={() => startQuiz(selectedChapter)} className="flex items-center gap-2 px-4 py-2 rounded-xl text-white shadow-md hover:shadow-lg transition-all" style={{ backgroundColor: selectedChapter.color }}>🏆 測驗</button>
              <button onClick={() => setSelectedSection(prev => Math.min(selectedChapter.sections.length - 1, prev + 1))} disabled={selectedSection === selectedChapter.sections.length - 1}
                className="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-100 text-slate-700 disabled:opacity-50 hover:bg-slate-200 transition-colors">
                下一節<Icon name="chevron-right" size={20} />
              </button>
            </div>
            <div className="h-20"></div>
          </div>
        );
      };

      const renderQuiz = () => {
        if (!selectedChapter?.quiz) return null;
        const currentQuestion = selectedChapter.quiz[quizIndex];
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-50 via-purple-50 to-indigo-50">
            <div className="bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-4 py-4 shadow-lg">
              <div className="flex items-center justify-between">
                <button onClick={() => { setQuizMode(false); setCurrentView('chapter'); }} className="p-2 hover:bg-white/10 rounded-lg transition-colors"><Icon name="x" size={24} /></button>
                <h1 className="font-bold text-lg">{selectedChapter.title} - 測驗</h1>
                <div className="w-10"></div>
              </div>
              <div className="mt-4 flex items-center gap-2">
                <div className="flex-1 h-2 bg-white/20 rounded-full overflow-hidden">
                  <div className="h-full bg-white rounded-full transition-all duration-300" style={{ width: `${((quizIndex + 1) / selectedChapter.quiz.length) * 100}%` }}></div>
                </div>
                <span className="text-sm text-white/80">{quizIndex + 1}/{selectedChapter.quiz.length}</span>
              </div>
            </div>
            {quizComplete ? (
              <div className="px-4 py-8 text-center">
                <div className="w-24 h-24 mx-auto mb-6 rounded-full bg-gradient-to-br from-purple-500 to-indigo-500 flex items-center justify-center shadow-lg text-4xl">🏆</div>
                <h2 className="text-2xl font-bold text-slate-800 mb-2">測驗完成！</h2>
                <p className="text-slate-600 mb-6">你的得分：<span className="text-3xl font-bold text-purple-600 mx-2">{quizScore}</span>/ {selectedChapter.quiz.length}</p>
                <div className="space-y-3">
                  <button onClick={() => { setQuizIndex(0); setQuizAnswer(null); setQuizScore(0); setQuizComplete(false); }} className="w-full py-3 rounded-xl bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-semibold shadow-md">🔄 重新測驗</button>
                  <button onClick={() => { setQuizMode(false); setCurrentView('chapter'); }} className="w-full py-3 rounded-xl bg-slate-100 text-slate-700 font-semibold">返回章節</button>
                </div>
              </div>
            ) : (
              <div className="px-4 py-6">
                <div className="bg-white rounded-2xl p-6 shadow-lg border border-slate-100 mb-6">
                  <h3 className="text-lg font-bold text-slate-800 mb-6 leading-relaxed">{currentQuestion.q}</h3>
                  <div className="space-y-3">
                    {currentQuestion.options.map((option, idx) => {
                      const isCorrect = idx === currentQuestion.correct;
                      const isSelected = quizAnswer === idx;
                      let buttonStyle = 'bg-slate-50 border-slate-200 text-slate-700';
                      if (quizAnswer !== null) {
                        if (isCorrect) buttonStyle = 'bg-emerald-50 border-emerald-500 text-emerald-700';
                        else if (isSelected) buttonStyle = 'bg-red-50 border-red-500 text-red-700';
                      }
                      return (
                        <button key={idx} onClick={() => handleQuizAnswer(idx)} disabled={quizAnswer !== null}
                          className={`w-full p-4 rounded-xl border-2 text-left transition-all ${buttonStyle} ${quizAnswer === null ? 'hover:border-purple-300 hover:bg-purple-50' : ''}`}>
                          <div className="flex items-center gap-3">
                            <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm ${quizAnswer !== null && isCorrect ? 'bg-emerald-500 text-white' : quizAnswer !== null && isSelected ? 'bg-red-500 text-white' : 'bg-slate-200 text-slate-600'}`}>
                              {quizAnswer !== null && isCorrect ? '✓' : quizAnswer !== null && isSelected ? '✗' : String.fromCharCode(65 + idx)}
                            </div>
                            <span className="font-medium">{option}</span>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
                {quizAnswer !== null && (
                  <>
                    <div className="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-2xl p-5 border border-blue-200 mb-6 animate-fade-in">
                      <h4 className="font-bold text-blue-800 mb-2">💡 解釋</h4>
                      <p className="text-blue-700">{currentQuestion.explanation}</p>
                    </div>
                    <button onClick={nextQuestion} className="w-full py-4 rounded-xl bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-bold shadow-md">
                      {quizIndex < selectedChapter.quiz.length - 1 ? '下一題 →' : '查看結果 →'}
                    </button>
                  </>
                )}
              </div>
            )}
          </div>
        );
      };

      const renderAbbrModal = () => (
        <div className={`fixed inset-0 z-50 transition-all duration-300 ${showAbbrModal ? 'visible' : 'invisible'}`}>
          <div className={`absolute inset-0 bg-black/50 transition-opacity ${showAbbrModal ? 'opacity-100' : 'opacity-0'}`} onClick={() => setShowAbbrModal(false)}></div>
          <div className={`absolute inset-4 md:inset-10 bg-white rounded-2xl shadow-2xl transition-transform ${showAbbrModal ? 'scale-100' : 'scale-95'} flex flex-col`}>
            <div className="bg-gradient-to-r from-pink-600 to-orange-600 text-white p-4 rounded-t-2xl flex items-center justify-between">
              <h2 className="font-bold text-lg">📖 縮寫對照表</h2>
              <button onClick={() => setShowAbbrModal(false)} className="p-2 hover:bg-white/10 rounded-lg transition-colors"><Icon name="x" size={24} /></button>
            </div>
            <div className="flex-1 overflow-y-auto p-4">
              <div className="grid gap-2">
                {abbreviations.map((item, idx) => (
                  <div key={idx} className="flex items-center gap-4 p-3 bg-slate-50 rounded-xl">
                    <span className="font-mono font-bold text-pink-600 w-16 text-sm">{item.abbr}</span>
                    <div className="flex-1"><p className="text-slate-800 text-sm">{item.full}</p><p className="text-slate-500 text-xs">{item.chinese}</p></div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );

      return (
        <div className="font-sans">
          {quizMode ? renderQuiz() : currentView === 'chapter' ? renderChapter() : renderHome()}
          {renderAbbrModal()}
        </div>
      );
    }

    ReactDOM.render(<CardiomyopathyApp />, document.getElementById('root'));
  </script>
</body>
</html>
