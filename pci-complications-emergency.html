                        <div style={{
                            padding: '40px 20px',
                            background: score >= 8 ? 'linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(16, 185, 129, 0.05) 100%)' : score >= 6 ? 'linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(245, 158, 11, 0.05) 100%)' : 'linear-gradient(135deg, rgba(239, 68, 68, 0.15) 0%, rgba(239, 68, 68, 0.05) 100%)',
                            borderRadius: '20px',
                            marginBottom: '24px'
                        }}>
                            <span style={{ fontSize: '60px' }}>
                                {score >= 8 ? '🎉' : score >= 6 ? '👍' : '📚'}
                            </span>
                            <h2 style={{ fontSize: '24px', fontWeight: '700', marginTop: '16px' }}>
                                測驗完成！
                            </h2>
                            <div style={{
                                fontSize: '48px',
                                fontWeight: '700',
                                color: score >= 8 ? 'var(--success)' : score >= 6 ? 'var(--warning)' : 'var(--danger)',
                                marginTop: '16px'
                            }}>
                                {score} / {quizQuestions.length}
                            </div>
                            <p style={{ fontSize: '14px', color: 'var(--text-muted)', marginTop: '8px' }}>
                                正確率：{Math.round((score / quizQuestions.length) * 100)}%
                            </p>
                        </div>
                        
                        <div style={{
                            padding: '20px',
                            background: 'var(--bg-card)',
                            borderRadius: '12px',
                            marginBottom: '20px',
                            textAlign: 'left'
                        }}>
                            <h3 style={{ fontSize: '15px', fontWeight: '600', marginBottom: '12px' }}>
                                {score >= 8 ? '🌟 優秀！' : score >= 6 ? '💪 不錯！' : '📖 需要加強'}
                            </h3>
                            <p style={{ fontSize: '13px', color: 'var(--text-secondary)', lineHeight: '1.6' }}>
                                {score >= 8 
                                    ? '你對 PCI 緊急併發症的處置有很好的理解！建議定期複習以保持熟練度。'
                                    : score >= 6
                                    ? '你已掌握基本概念，建議針對答錯的題目再複習相關章節。'
                                    : '建議重新閱讀 No-Reflow 和 Perforation 的處置章節，並使用查核表練習。'}
                            </p>
                        </div>
                        
                        <button
                            onClick={resetQuiz}
                            style={{
                                width: '100%',
                                padding: '16px',
                                background: 'var(--secondary)',
                                border: 'none',
                                borderRadius: '12px',
                                color: 'white',
                                fontSize: '16px',
                                fontWeight: '600',
                                cursor: 'pointer'
                            }}
                        >
                            重新測驗
                        </button>
                    </div>
                );
            }
            
            const question = quizQuestions[currentQuestion];
            const isAnswered = answers[currentQuestion] !== undefined;
            
            return (
                <div style={{ padding: '16px', paddingBottom: '100px' }} className="animate-slide-in">
                    <div style={{
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'space-between',
                        marginBottom: '20px'
                    }}>
                        <div style={{
                            display: 'flex',
                            gap: '4px'
                        }}>
                            {quizQuestions.map((_, idx) => (
                                <div
                                    key={idx}
                                    style={{
                                        width: idx === currentQuestion ? '24px' : '8px',
                                        height: '8px',
                                        borderRadius: '4px',
                                        background: answers[idx] !== undefined
                                            ? answers[idx] === quizQuestions[idx].answer
                                                ? 'var(--success)'
                                                : 'var(--danger)'
                                            : idx === currentQuestion
                                                ? 'var(--secondary)'
                                                : 'var(--border)',
                                        transition: 'all 0.3s ease'
                                    }}
                                />
                            ))}
                        </div>
                        <span style={{ fontSize: '13px', color: 'var(--text-muted)' }}>
                            {Object.keys(answers).filter(k => answers[k] === quizQuestions[k].answer).length} / {currentQuestion + (isAnswered ? 1 : 0)} 正確
                        </span>
                    </div>
                    
                    <QuizQuestion
                        question={question}
                        onAnswer={handleAnswer}
                        answered={isAnswered}
                        selectedAnswer={answers[currentQuestion]}
                    />
                    
                    {isAnswered && (
                        <button
                            onClick={nextQuestion}
                            style={{
                                width: '100%',
                                padding: '16px',
                                background: 'var(--secondary)',
                                border: 'none',
                                borderRadius: '12px',
                                color: 'white',
                                fontSize: '16px',
                                fontWeight: '600',
                                cursor: 'pointer',
                                marginTop: '16px'
                            }}
                            className="animate-fade-in"
                        >
                            {currentQuestion < quizQuestions.length - 1 ? '下一題 →' : '查看結果'}
                        </button>
                    )}
                </div>
            );
        };

        // ============== Main App ==============
        const App = () => {
            const [currentSection, setCurrentSection] = useState('home');
            const [progress, setProgress] = useState(0);
            
            const renderSection = () => {
                switch (currentSection) {
                    case 'home':
                        return <HomePage onNavigate={setCurrentSection} />;
                    case 'noreflow':
                        return <NoReflowPage />;
                    case 'perforation':
                        return <PerforationPage />;
                    case 'checklist':
                        return <ChecklistPage />;
                    case 'quiz':
                        return <QuizPage />;
                    default:
                        return <HomePage onNavigate={setCurrentSection} />;
                }
            };
            
            return (
                <div style={{ 
                    maxWidth: '480px', 
                    margin: '0 auto', 
                    minHeight: '100vh',
                    background: 'var(--bg-dark)'
                }}>
                    <Header 
                        currentSection={currentSection} 
                        onBack={() => setCurrentSection('home')}
                        progress={progress}
                    />
                    {renderSection()}
                    
                    {currentSection !== 'home' && (
                        <div style={{
                            position: 'fixed',
                            bottom: 0,
                            left: '50%',
                            transform: 'translateX(-50%)',
                            width: '100%',
                            maxWidth: '480px',
                            padding: '12px 16px',
                            background: 'linear-gradient(180deg, transparent 0%, var(--bg-dark) 30%)',
                            paddingTop: '40px'
                        }}>
                            <button
                                onClick={() => setCurrentSection('home')}
                                style={{
                                    width: '100%',
                                    padding: '14px',
                                    background: 'var(--bg-card)',
                                    border: '1px solid var(--border)',
                                    borderRadius: '12px',
                                    color: 'var(--text-secondary)',
                                    fontSize: '14px',
                                    fontWeight: '500',
                                    cursor: 'pointer',
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    gap: '8px'
                                }}
                            >
                                ← 返回主選單
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
    <script>
      function initShareButtons() { const pageUrl = window.location.href; const pageTitle = document.title; const encodedUrl = encodeURIComponent(pageUrl); const qrCodeImg = document.getElementById('qrCode'); if (qrCodeImg) qrCodeImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodedUrl}`; const lineShare = document.getElementById('lineShare'); if (lineShare) lineShare.href = `https://social-plugins.line.me/lineit/share?url=${encodedUrl}`; const emailShare = document.getElementById('emailShare'); if (emailShare) { const emailSubject = encodeURIComponent(`分享：${pageTitle}`); const emailBody = encodeURIComponent(`我想和您分享這個頁面：\n\n${pageTitle}\n\n${pageUrl}`); emailShare.href = `mailto:?subject=${emailSubject}&body=${emailBody}`; } }
      function toggleShareMenu() { const menu = document.getElementById('shareMenu'); if (menu) menu.classList.toggle('active'); }
      function copyPageUrl() { const pageUrl = window.location.href; navigator.clipboard.writeText(pageUrl).then(() => { alert('連結已複製到剪貼簿！'); }).catch(() => { const textArea = document.createElement('textarea'); textArea.value = pageUrl; document.body.appendChild(textArea); textArea.select(); document.execCommand('copy'); document.body.removeChild(textArea); alert('連結已複製到剪貼簿！'); }); }
      document.addEventListener('click', function(event) { const shareButton = document.querySelector('.share-button'); const shareMenu = document.getElementById('shareMenu'); if (shareButton && shareMenu && !shareButton.contains(event.target) && shareMenu.classList.contains('active')) shareMenu.classList.remove('active'); });
      document.addEventListener('DOMContentLoaded', initShareButtons);
    </script>
</body>
</html>
