    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Teaching Content
        const teachingContent = [
            {
                title: "AS 超音波評估概論",
                icon: "📚",
                content: [
                    {
                        subtitle: "什麼是主動脈瓣狹窄？",
                        text: "主動脈瓣狹窄 (Aortic Stenosis, AS) 是最常見的瓣膜疾病之一，好發於老年人。主要病因包括退化性鈣化、先天性雙葉瓣膜、風濕性心臟病等。"
                    },
                    {
                        subtitle: "超音波在 AS 評估的角色",
                        text: "經胸超音波心圖 (TTE) 是評估 AS 嚴重程度的首選檢查，可評估瓣膜形態、測量跨瓣壓力梯度、計算瓣膜面積。"
                    }
                ],
                keyPoints: [
                    "AS 是老年人最常見的瓣膜疾病",
                    "TTE 是評估 AS 的首選檢查方法",
                    "需評估：瓣膜形態、流速、壓力梯度、瓣膜面積"
                ]
            },
            {
                title: "超音波窗口與測量技巧",
                icon: "🔊",
                content: [
                    {
                        subtitle: "最佳測量窗口",
                        text: "心尖五腔窗口 (Apical 5-chamber view) 是最常用的窗口，因為探頭方向與主動脈瓣血流較為平行。其他可用窗口包括：胸骨右緣、胸骨上窩。"
                    },
                    {
                        subtitle: "CW Doppler 測量原則",
                        text: "使用連續多普勒 (CW Doppler) 測量最大流速。取樣線應與血流方向盡可能平行 (夾角 < 20°)，從多個窗口測量，採用最高值。"
                    }
                ],
                keyPoints: [
                    "首選：心尖五腔窗口 (A5C)",
                    "使用 CW Doppler 測量高速血流",
                    "取樣線與血流平行，夾角越小越準確",
                    "多窗口測量，採用最高值"
                ]
            },
            {
                title: "AS 嚴重度分級標準",
                icon: "📊",
                content: [
                    {
                        subtitle: "ASE/ESC 診斷標準",
                        text: "根據美國超音波心臟醫學會 (ASE) 與歐洲心臟病學會 (ESC) 指南，AS 嚴重度分為輕度、中度、重度三級。"
                    }
                ],
                table: {
                    headers: ["參數", "輕度", "中度", "重度"],
                    rows: [
                        ["最大流速 (Vmax)", "2.0-2.9 m/s", "3.0-3.9 m/s", "≥ 4.0 m/s"],
                        ["平均壓力梯度", "< 20 mmHg", "20-39 mmHg", "≥ 40 mmHg"],
                        ["瓣膜面積 (AVA)", "> 1.5 cm²", "1.0-1.5 cm²", "< 1.0 cm²"],
                        ["面積指數 (AVAi)", "> 0.85", "0.6-0.85", "< 0.6 cm²/m²"]
                    ]
                },
                keyPoints: [
                    "重度 AS：Vmax ≥ 4.0 m/s",
                    "重度 AS：Mean PG ≥ 40 mmHg",
                    "重度 AS：AVA < 1.0 cm²",
                    "三項指標應一致，不一致時需進一步評估"
                ]
            },
            {
                title: "連續性方程式",
                icon: "🧮",
                content: [
                    {
                        subtitle: "原理",
                        text: "連續性方程式 (Continuity Equation) 基於流量守恆原理：通過 LVOT 的血流量 = 通過主動脈瓣的血流量。"
                    },
                    {
                        subtitle: "公式",
                        text: "AVA = (LVOT 面積 × LVOT VTI) ÷ AV VTI\n其中 LVOT 面積 = π × (LVOT 直徑/2)²"
                    },
                    {
                        subtitle: "測量要點",
                        text: "LVOT 直徑：在胸骨旁長軸窗口測量，位於主動脈瓣下 0.5-1.0 cm 處。LVOT VTI：使用 PW Doppler 在相同位置測量。"
                    }
                ],
                keyPoints: [
                    "需測量：LVOT 直徑、LVOT VTI、AV VTI",
                    "LVOT 直徑測量位置：瓣環下 0.5-1.0 cm",
                    "LVOT 直徑誤差 1mm → AVA 誤差約 10%",
                    "LVOT VTI 用 PW Doppler，AV VTI 用 CW Doppler"
                ]
            },
            {
                title: "特殊情況處理",
                icon: "⚠️",
                content: [
                    {
                        subtitle: "低流量低梯度 AS",
                        text: "當 LVEF 降低時，即使是重度 AS，壓力梯度也可能不高。此時應使用 Dobutamine 壓力測試來區分「真性重度 AS」與「假性重度 AS」。"
                    },
                    {
                        subtitle: "高 LVOT 流速情況",
                        text: "當 LVOT 流速 > 1.5 m/s 時（如：主動脈瓣下狹窄、高心輸出狀態），必須使用完整的 Bernoulli 方程式：ΔP = 4(V₂² - V₁²)"
                    }
                ],
                keyPoints: [
                    "Low-flow, low-gradient AS：考慮 Dobutamine 測試",
                    "LVOT V > 1.5 m/s：用完整 Bernoulli 公式",
                    "主動脈瓣逆流不影響收縮期順行流速測量",
                    "探頭角度是低估流速的最常見原因"
                ]
            }
        ];

        // Quiz Questions
        const quizQuestions = [

                id: 1,

                    "脈衝多普勒 (PW Doppler)",
                    "連續多普勒 (CW Doppler)",
                    "組織多普勒 (TDI)",
                    "彩色多普勒 (Color Doppler)"
                ],
                correct: 1,
                explanation: "CW Doppler 可測量任何速度的血流，適合測量 AS 的高速血流 (常 > 4 m/s)。PW Doppler 有速度限制 (Nyquist limit)，無法準確測量高速血流。"

                    "≥ 4.0 m/s"

                correct: 3,
                explanation: "重度 AS 的診斷標準：Vmax ≥ 4.0 m/s、Mean PG ≥ 40 mmHg、AVA < 1.0 cm²。三項指標應同時評估。"
            },
            {
                id: 4,
                question: "使用 CW Doppler 測量 AS 流速時，取樣線與血流方向的最理想夾角為？",

                    "45°",
                    "60°"
                ],
                correct: 0,
                explanation: "根據多普勒原理：V測量 = V實際 × cos(θ)。當 θ = 0° 時，cos(0°) = 1，測量最準確。夾角越大，流速被低估越多。"

                correct: 1,
                explanation: "從心尖窗口測量時，收縮期主動脈瓣血流是遠離探頭的方向，在頻譜上顯示為藍色（基線下方）。正確識別方向可避免與 AR 逆流混淆。"
            },
            {
                id: 6,
                question: "計算 AVA 使用連續性方程式時，需要測量以下哪三項參數？",

                    "主動脈根部直徑、AV VTI、LVOT VTI",
                    "瓣環直徑、瓣膜開口面積、心輸出量"
                ],
                correct: 1,
                explanation: "連續性方程式：AVA = (LVOT 面積 × LVOT VTI) ÷ AV VTI。需要測量 LVOT 直徑（計算面積）、LVOT VTI（用 PW）、AV VTI（用 CW）。"
            },
            {
                id: 7,
                question: "測量 LVOT 直徑的標準位置是？",
                options: [
                    "主動脈瓣葉尖端",

                ],
                correct: 2,
                explanation: "LVOT 直徑應在胸骨旁長軸窗口、收縮中期測量，位於主動脈瓣環下 0.5-1.0 cm 處。測量從內膜到內膜，與血管走向垂直。"

                explanation: "探頭與血流不平行是低估 AS 最常見的原因。例如 30° 夾角會使流速低估約 13%，60° 夾角會低估 50%。應使用多窗口測量取最高值。"

        // Quiz Component
        const Quiz = ({ onComplete }) => {
            const [currentQ, setCurrentQ] = useState(0);
            const [selected, setSelected] = useState(null);
            const [showExplanation, setShowExplanation] = useState(false);
            const [score, setScore] = useState(0);
            const [finished, setFinished] = useState(false);
            const [answers, setAnswers] = useState([]);

            const handleSelect = (idx) => {
                if (showExplanation) return;
                setSelected(idx);
                setShowExplanation(true);
                const isCorrect = idx === quizQuestions[currentQ].correct;
                if (isCorrect) setScore(s => s + 1);
                setAnswers([...answers, { q: currentQ, selected: idx, correct: isCorrect }]);
            };

            const handleNext = () => {
                if (currentQ < quizQuestions.length - 1) {
                    setCurrentQ(currentQ + 1);
                    setSelected(null);
                    setShowExplanation(false);
                } else {
                    setFinished(true);
                    const finalScore = Math.round((score / quizQuestions.length) * 100);
                    localStorage.setItem('exam-echo-as-score', finalScore);
                    onComplete(finalScore);

                    // Track achievement
                    if (window.AchievementTracker) {
                        window.AchievementTracker.trackQuizComplete('exam-echo-as', finalScore);
                    }
                }
            };

            const handleRestart = () => {
                setCurrentQ(0);
                setSelected(null);
                setShowExplanation(false);
                setScore(0);
                setFinished(false);
                setAnswers([]);
            };

            if (finished) {
                const percentage = Math.round((score / quizQuestions.length) * 100);
                let icon, message;
                if (percentage >= 80) {
                    icon = "🎉"; message = "太棒了！你對 AS 超音波評估有很好的掌握！";
                } else if (percentage >= 60) {
                    icon = "👍"; message = "不錯！建議複習一些重點內容。";
                } else {
                    icon = "📚"; message = "建議重新閱讀教學內容，加強學習！";
                }

                return (
                    <div className="quiz-container">
                        <div className="result-container">
                            <div className="result-icon">{icon}</div>
                            <div className="result-title">測驗完成！</div>
                            <div className="result-score">{percentage}%</div>
                            <div className="result-message">{message}</div>
                            <div className="result-details">
                                <div className="result-stat">
                                    <div className="result-stat-value correct">{score}</div>
                                    <div className="result-stat-label">答對</div>
                                </div>
                                <div className="result-stat">
                                    <div className="result-stat-value incorrect">{quizQuestions.length - score}</div>
                                    <div className="result-stat-label">答錯</div>
                                </div>
                            </div>
                            <button className="quiz-btn primary" onClick={handleRestart}>
                                重新測驗
                            </button>
                        </div>
                    </div>
                );
            }

            const q = quizQuestions[currentQ];
            const progress = Math.round(((currentQ + 1) / quizQuestions.length) * 100);

            return (
                <div>
                    <div className="progress-container">
                        <div className="progress-header">
                            <span className="progress-title">測驗進度</span>
                            <span className="progress-percentage">{currentQ + 1} / {quizQuestions.length}</span>
                        </div>
                        <div className="progress-bar">
                            <div className="progress-fill" style={{ width: `${progress}%` }}></div>
                        </div>
                    </div>

                    <div className="quiz-container fade-in">
                        <div className="quiz-header">
                            <span className="quiz-progress">第 {currentQ + 1} 題</span>
                            <span className="quiz-progress">目前得分：{score}</span>
                        </div>
                        <div className="quiz-question">{q.question}</div>
                        <div className="quiz-options">
                            {q.options.map((opt, idx) => {
                                let className = "quiz-option";
                                if (showExplanation) {
                                    className += " disabled";
                                    if (idx === q.correct) className += " correct";
                                    else if (idx === selected) className += " incorrect";
                                } else if (idx === selected) {
                                    className += " selected";
                                }
                                return (
                                    <button key={idx} className={className} onClick={() => handleSelect(idx)}>
                                        {String.fromCharCode(65 + idx)}. {opt}
                                    </button>
                                );
                            })}
                        </div>
                        {showExplanation && (
                            <div className="quiz-explanation">
                                <div className="quiz-explanation-title">💡 解析</div>
                                <div className="quiz-explanation-text">{q.explanation}</div>
                            </div>
                        )}
                        {showExplanation && (
                            <button className="quiz-btn primary" onClick={handleNext}>
                                {currentQ < quizQuestions.length - 1 ? '下一題' : '完成測驗'}
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        // Main App
        const App = () => {
            const [activeTab, setActiveTab] = useState('teaching');
            const [openSections, setOpenSections] = useState({ 0: true });

            useEffect(() => {

            }, []);

            const toggleSection = (idx) => {
                setOpenSections(prev => ({ ...prev, [idx]: !prev[idx] }));

            return (
                <div className="app-container">

                    <a href="exam.html" className="back-link">← 返回訓練中心</a>

                    <header className="header">

                        <h1>主動脈瓣狹窄超音波評估</h1>
                        <p>Aortic Stenosis Echo Assessment</p>
                    </header>

                    <div className="tabs">
                        <button 
                            className={`tab ${activeTab === 'teaching' ? 'active' : ''}`}
                            onClick={() => setActiveTab('teaching')}
                        >
                            📚 教學內容
                        </button>
                        <button 
                            className={`tab ${activeTab === 'quiz' ? 'active' : ''}`}
                            onClick={() => setActiveTab('quiz')}
                        >
                            ✍️ 測驗 ({quizScore !== null ? `${quizScore}%` : '未完成'})
                        </button>
                    </div>

                    {activeTab === 'teaching' && (
                        <div className="fade-in">
                            {teachingContent.map((section, idx) => (

                                    data={section}

                                    onToggle={() => toggleSection(idx)}
                                />
                            ))}
                        </div>
                    )}

                        <Quiz onComplete={setQuizScore} />
                    )}

                    <footer className="footer">
                        <p>心血管中心教育訓練 | 主動脈瓣狹窄超音波評估</p>
                        <p>台大醫院新竹分院 | 2025</p>
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>

    <script>
        function initShareButtons() {
            const pageUrl = window.location.href;
            const pageTitle = document.title;
            const encodedUrl = encodeURIComponent(pageUrl);
            const qrCodeImg = document.getElementById('qrCode');
            if (qrCodeImg) qrCodeImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodedUrl}`;
            const lineShare = document.getElementById('lineShare');
            if (lineShare) lineShare.href = `https://social-plugins.line.me/lineit/share?url=${encodedUrl}`;
            const emailShare = document.getElementById('emailShare');
            if (emailShare) {
                const emailSubject = encodeURIComponent(`分享：${pageTitle}`);
                const emailBody = encodeURIComponent(`我想和您分享這個頁面：\n\n${pageTitle}\n\n${pageUrl}`);
                emailShare.href = `mailto:?subject=${emailSubject}&body=${emailBody}`;
            }
        }
        function toggleShareMenu() {
            const menu = document.getElementById('shareMenu');
            if (menu) menu.classList.toggle('active');
        }
        function copyPageUrl() {
            const pageUrl = window.location.href;
            navigator.clipboard.writeText(pageUrl).then(() => {
                alert('連結已複製到剪貼簿！');
            }).catch(() => {
                const textArea = document.createElement('textarea');
                textArea.value = pageUrl;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('連結已複製到剪貼簿！');
            });
        }
        document.addEventListener('click', function(event) {
            const shareButton = document.querySelector('.share-button');
            const shareMenu = document.getElementById('shareMenu');
            if (shareButton && shareMenu && !shareButton.contains(event.target) && shareMenu.classList.contains('active')) {
                shareMenu.classList.remove('active');
            }
        });
        document.addEventListener('DOMContentLoaded', initShareButtons);
    </script>

    <!-- Achievement System Scripts -->
    <script src="achievements-config.js"></script>
    <script src="achievements.js"></script>
</body>
