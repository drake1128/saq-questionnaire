<style>
:root{
  --primary:#1e3a5f; --primary-light:#2d5a87; --accent:#e74c3c; --accent-light:#ff6b5b;
  --success:#27ae60; --warning:#f39c12; --teal:#0d9488; --purple:#7c3aed;
  --bg-cream:#faf8f5; --bg-card:#ffffff; --text-dark:#2c3e50; --text-muted:#7f8c8d;
  --border:#ecf0f1; --shadow:0 4px 20px rgba(0,0,0,0.08);
  --spacer:#1e3a5f; --paddle:#0d9488; --clasp:#e74c3c;
}
:root.dark{
  --bg-cream:#12182b; --bg-card:#1b2540; --text-dark:#eaeaea; --text-muted:#9aa6bd;
  --border:#2d3a55; --shadow:0 4px 20px rgba(0,0,0,0.4); --primary-light:#5b8fc7;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif;background:var(--bg-cream);color:var(--text-dark);line-height:1.7;}
.app{max-width:760px;margin:0 auto;padding:0 0 90px;padding-bottom:calc(90px + env(safe-area-inset-bottom));}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:22px 18px 18px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow);}
.header h1{font-size:19px;font-weight:700;letter-spacing:.5px;}
.header .sub{font-size:12.5px;opacity:.85;margin-top:3px;font-weight:300;}
.theme-btn{position:absolute;top:20px;right:16px;background:rgba(255,255,255,.18);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;}
.progress-wrap{height:5px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:12px;overflow:hidden;}
.progress-bar{height:100%;background:var(--warning);transition:width .4s;border-radius:4px;}
.progress-txt{font-size:11px;opacity:.85;margin-top:5px;}
.content{padding:16px;}
.card{background:var(--bg-card);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border);}
.card h2{font-size:17px;color:var(--primary-light);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.card h3{font-size:15px;color:var(--accent);margin:14px 0 8px;}
.card p{font-size:14px;margin-bottom:8px;}
.tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;background:var(--primary);color:#fff;margin:0 4px 4px 0;font-weight:500;}
.tag.teal{background:var(--teal);} .tag.red{background:var(--accent);} .tag.amber{background:var(--warning);} .tag.purple{background:var(--purple);}
.en{color:var(--text-muted);font-style:normal;font-weight:400;}
.takehome{background:linear-gradient(135deg,#fff8e1,#fff3cd);border-left:5px solid var(--warning);border-radius:10px;padding:14px 16px;margin:6px 0 14px;}
:root.dark .takehome{background:linear-gradient(135deg,#3a3320,#332d1a);}
.takehome .lbl{font-size:12px;font-weight:700;color:var(--warning);letter-spacing:1px;margin-bottom:6px;}
.takehome ul{margin-left:18px;font-size:13.5px;}
.takehome li{margin-bottom:5px;}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.nav-card{background:var(--bg-card);border-radius:14px;padding:16px 12px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer;transition:transform .15s;position:relative;min-height:108px;display:flex;flex-direction:column;justify-content:center;align-items:center;}
.nav-card:active{transform:scale(.96);}
.nav-card .ic{font-size:26px;margin-bottom:6px;}
.nav-card .t{font-size:13.5px;font-weight:600;line-height:1.3;}
.nav-card .n{font-size:10.5px;color:var(--text-muted);margin-top:3px;}
.nav-card .done{position:absolute;top:8px;right:8px;color:var(--success);font-size:14px;}
.back{background:none;border:none;color:var(--primary-light);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;gap:5px;padding:6px 0;}
.svgbox{background:var(--bg-cream);border-radius:14px;padding:10px;margin:10px 0;border:1px solid var(--border);}
.partbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--bg-cream);border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:8px;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--text-dark);min-height:48px;transition:.15s;}
.partbtn:active{transform:scale(.99);}
.partbtn.active{border-color:var(--primary-light);background:var(--bg-card);box-shadow:var(--shadow);}
.partbtn .dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
.info-pop{background:var(--bg-card);border:1.5px solid var(--primary-light);border-radius:12px;padding:14px;margin:6px 0 12px;font-size:13.5px;animation:fade .3s;}
@keyframes fade{from{opacity:0;transform:translateY(-6px);}to{opacity:1;}}
.info-pop .h{font-weight:700;color:var(--primary-light);margin-bottom:6px;font-size:14.5px;}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0;}
.tbl th{background:var(--primary);color:#fff;padding:9px 7px;text-align:left;font-weight:500;}
.tbl td{padding:8px 7px;border-bottom:1px solid var(--border);vertical-align:top;}
.tbl tr:nth-child(even) td{background:var(--bg-cream);}
.pill{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;white-space:nowrap;}
.pill.post{background:#dbeafe;color:#1e40af;} .pill.ant{background:#fce7f3;color:#9d174d;}
.pill.med{background:#dcfce7;color:#166534;} .pill.lat{background:#fef3c7;color:#92400e;}
:root.dark .pill.post{background:#1e3a5f;color:#bfdbfe;} :root.dark .pill.ant{background:#4a1d3a;color:#fbcfe8;}
:root.dark .pill.med{background:#14432a;color:#bbf7d0;} :root.dark .pill.lat{background:#3a2e0f;color:#fde68a;}
.step{display:flex;gap:11px;margin-bottom:10px;align-items:flex-start;}
.step .num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--primary-light);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;}
.step .body{font-size:13.5px;flex:1;}
.step .body b{color:var(--primary-light);}
.warn-box{background:#fdecea;border-left:4px solid var(--accent);border-radius:8px;padding:11px 13px;font-size:13px;margin:8px 0;}
:root.dark .warn-box{background:#3a1f1c;}
.warn-box .h{font-weight:700;color:var(--accent);margin-bottom:4px;font-size:13px;}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.compare .col{background:var(--bg-cream);border-radius:12px;padding:13px;border:1px solid var(--border);}
.compare .col h4{font-size:14px;margin-bottom:8px;text-align:center;padding-bottom:6px;border-bottom:2px solid var(--border);}
.compare .col.a h4{color:var(--primary-light);} .compare .col.b h4{color:var(--teal);}
.compare ul{list-style:none;font-size:12.5px;}
.compare li{padding:5px 0;border-bottom:1px dashed var(--border);}
.compare li:last-child{border:none;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 4px;padding-bottom:calc(8px + env(safe-area-inset-bottom));z-index:60;box-shadow:0 -2px 12px rgba(0,0,0,.06);}
.bn{background:none;border:none;font-size:10px;color:var(--text-muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;font-family:inherit;min-width:56px;}
.bn.active{color:var(--primary-light);font-weight:600;}
.bn .ic{font-size:19px;}
.quiz-opt{display:block;width:100%;text-align:left;background:var(--bg-cream);border:1.5px solid var(--border);border-radius:10px;padding:13px;margin-bottom:9px;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--text-dark);min-height:48px;transition:.15s;}
.quiz-opt.correct{background:#d4f4dd;border-color:var(--success);color:#1a6b3a;}
.quiz-opt.wrong{background:#fdd;border-color:var(--accent);color:#a02;}
.quiz-opt:disabled{cursor:default;}
.explain{background:var(--bg-cream);border-radius:10px;padding:13px;font-size:13px;margin-top:8px;border-left:4px solid var(--primary-light);}
.nextbtn{background:var(--primary-light);color:#fff;border:none;border-radius:10px;padding:13px;width:100%;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;font-family:inherit;min-height:48px;}
.score-big{font-size:42px;font-weight:700;color:var(--primary-light);text-align:center;}
.ref{font-size:11px;color:var(--text-muted);margin-top:6px;line-height:1.5;}
.footer-disc{font-size:10.5px;color:var(--text-muted);text-align:center;padding:16px 20px 6px;line-height:1.6;}
.sig{font-size:11.5px;color:var(--text-muted);text-align:center;padding:4px 20px;line-height:1.7;}
.kbd{display:inline-block;background:var(--primary);color:#fff;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:600;margin:0 1px;}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:11.5px;margin-top:6px;}
.legend span{display:flex;align-items:center;gap:5px;}
.legend .dot{width:12px;height:12px;border-radius:50%;}
/* real-photo implant view */
.photo-wrap{position:relative;max-width:430px;margin:2px auto 4px;}
.implant-photo{width:100%;display:block;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.12);}
.hl{position:absolute;border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%);transition:opacity .35s;mix-blend-mode:multiply;}
:root.dark .hl{mix-blend-mode:screen;}
.hl.on{opacity:1;animation:hlpulse 1.7s ease-in-out infinite;}
@keyframes hlpulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.85;}50%{transform:translate(-50%,-50%) scale(1.13);opacity:1;}}
.hl-spacer{left:50%;top:41%;width:27%;height:35%;background:radial-gradient(circle,rgba(120,170,225,.9),rgba(120,170,225,0) 70%);mix-blend-mode:screen;}
.hl-pad-l{left:26%;top:69%;width:30%;height:30%;background:radial-gradient(circle,rgba(13,148,136,.55),rgba(13,148,136,0) 70%);}
.hl-pad-r{left:74%;top:69%;width:30%;height:30%;background:radial-gradient(circle,rgba(13,148,136,.55),rgba(13,148,136,0) 70%);}
.hl-clasp-l{left:41%;top:52%;width:17%;height:24%;background:radial-gradient(circle,rgba(231,76,60,.65),rgba(231,76,60,0) 70%);}
.hl-clasp-r{left:59%;top:52%;width:17%;height:24%;background:radial-gradient(circle,rgba(231,76,60,.65),rgba(231,76,60,0) 70%);}
</style>
