        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }

        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { border-collapse: collapse; width: 100%; min-width: 500px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { background: rgba(96, 165, 250, 0.2); font-weight: 600; }
        tr:hover { background: rgba(255,255,255,0.05); }
        .nav-item { transition: all 0.2s ease; }
        .nav-item:hover { background: rgba(96, 165, 250, 0.2); }
        .nav-item.active { background: rgba(96, 165, 250, 0.3); border-left: 3px solid #60a5fa; }

                        ))}
                    </div>
                </Accordion>

                <div className="glass rounded-xl p-4 mt-4">
                    <h3 className="text-red-400 font-bold mb-2">🚨 警示症狀 - 需立即返院</h3>
                    <div className="grid grid-cols-1 gap-2 text-sm">
                        <div className="text-red-300">• 單側肢體無力</div>
                        <div className="text-red-300">• 頭痛</div>
                        <div className="text-red-300">• 視力模糊</div>
                        <div className="text-red-300">• 口齒不清</div>
                    </div>
                </div>
            </div>
        );

        // NEW PAGE: PPM/CIED Routine - From 91C-40-0007
        const PPMRoutinePage = () => (
            <div className="p-4">
                <h2 className="text-xl font-bold text-white mb-4">🔋 心律調節器照護流程</h2>
                <p className="text-gray-400 text-xs mb-4">依據 91C-40-0007 內科部永久性心律調節器、去顫器、再同步治療器置入照護預立醫療流程</p>

                <Accordion title="適應症" defaultOpen={true}>
                    <div className="space-y-2">
                        {ppmRoutine.indications.map((item, i) => (
                            <div key={i} className="text-gray-300 text-sm flex items-start gap-2">
                                <span className="text-cyan-400">•</span>
                                {item}
                            </div>
                        ))}
                    </div>
                </Accordion>

                <Accordion title="術前特殊評估">
                    <div className="space-y-2">
                        {ppmRoutine.preAssessment.map((item, i) => (
                            <div key={i} className="flex items-start gap-3">
                                <span className="w-6 h-6 flex items-center justify-center bg-cyan-500/30 text-cyan-300 rounded-full font-bold text-xs">
                                    {i + 1}
                                </span>
                                <span className="text-gray-300 text-sm flex-1">{item}</span>
                            </div>
                        ))}
                    </div>
                </Accordion>

                <Accordion title="術前檢驗項目">
                    <div className="space-y-2">
                        {ppmRoutine.preProcedureLabs.map((item, i) => (
                            <div key={i} className="text-gray-300 text-sm flex items-start gap-2">
                                <span className="text-cyan-400">•</span>
                                {item}
                            </div>
                        ))}
                    </div>
                </Accordion>

                <Accordion title="術前醫囑">
                    <div className="space-y-2">
                        {ppmRoutine.preProcedureOrders.map((item, i) => (
                            <div key={i} className="flex items-start gap-3">
                                <span className="w-6 h-6 flex items-center justify-center bg-purple-500/30 text-purple-300 rounded-full font-bold text-xs">
                                    {i + 1}
                                </span>
                                <span className="text-gray-300 text-sm flex-1">{item}</span>
                            </div>
                        ))}
                    </div>
                </Accordion>

                <Accordion title="術後醫囑">
                    <div className="space-y-2">
                        {ppmRoutine.postProcedureOrders.map((item, i) => (
                            <div key={i} className="flex items-start gap-3">
                                <span className="w-6 h-6 flex items-center justify-center bg-green-500/30 text-green-300 rounded-full font-bold text-xs">
                                    {i + 1}
                                </span>
                                <span className="text-gray-300 text-sm flex-1">{item}</span>
                            </div>
                        ))}
                    </div>
                </Accordion>

                <Accordion title="術後評估重點">
                    <div className="space-y-2">
                        {ppmRoutine.postAssessment.map((item, i) => (
                            <div key={i} className="text-gray-300 text-sm flex items-start gap-2">
                                <Icons.Check />
                                {item}
                            </div>
                        ))}
                    </div>
                </Accordion>

                <Accordion title="需通知醫師的情況">
                    <div className="space-y-2">
                        {ppmRoutine.notifyDoctor.map((item, i) => (
                            <div key={i} className="text-red-300 text-sm flex items-start gap-2">
                                <span className="text-red-500">⚠</span>
                                {item}
                            </div>
                        ))}
                    </div>
                </Accordion>

                <Accordion title="出院衛教內容">
                    <div className="space-y-2">
                        {ppmRoutine.patientEducation.map((item, i) => (
                            <div key={i} className="text-gray-300 text-sm flex items-start gap-2">
                                <Icons.Check />
                                {item}
                            </div>
                        ))}
                    </div>
                </Accordion>

                <div className="glass rounded-xl p-4 mt-4">
                    <h3 className="text-yellow-400 font-medium mb-2">⚡ 電磁干擾注意事項</h3>
                    <div className="grid grid-cols-1 gap-2 text-sm">
                        <div className="text-gray-300">• 手機請使用對側耳朵接聽</div>
                        <div className="text-gray-300">• 家用電話則無差別</div>
                        <div className="text-gray-300">• 請遠離微波爐約 1 公尺</div>
                        <div className="text-gray-300">• 請遠離變電箱及高壓電塔約 1 公尺</div>
                    </div>
                </div>
            </div>
        );

        // Main App
        const App = () => {
            const [page, setPage] = useState('home');
            const [menuOpen, setMenuOpen] = useState(false);

            const navItems = [
                { id: 'home', icon: <Icons.Home />, label: '首頁' },
                { id: 'chestpain', icon: <Icons.Heart />, label: '胸痛流程' },
                { id: 'oncall', icon: <Icons.Phone />, label: '值班急症' },
                { id: 'consent', icon: <Icons.Document />, label: '同意書' },
                { id: 'cath', icon: <Icons.Heart />, label: '導管室' },
                { id: 'cagroutine', icon: <Icons.Clipboard />, label: '心導管照護' },
                { id: 'icasroutine', icon: <Icons.Clipboard />, label: '頸動脈支架' },
                { id: 'ppmroutine', icon: <Icons.Clipboard />, label: '心律調節器' },
                { id: 'symptoms', icon: <Icons.Clipboard />, label: '症狀診斷' },
                { id: 'medications', icon: <Icons.Document />, label: '常用藥物' },
                { id: 'scores', icon: <Icons.Edit />, label: '臨床評分' },
                { id: 'procedures', icon: <Icons.Clipboard />, label: '術式指引' },
                { id: 'rules', icon: <Icons.Users />, label: '工作規範' },
                { id: 'records', icon: <Icons.Edit />, label: '病歷書寫' },
                { id: 'discharge', icon: <Icons.Logout />, label: '出院規劃' },
                { id: 'reference', icon: <Icons.Phone />, label: '快速查詢' },
            ];

            const renderPage = () => {
                switch(page) {
                    case 'home': return <HomePage setPage={setPage} />;
                    case 'schedule': return <SchedulePage />;
                    case 'consent': return <ConsentPage />;
                    case 'cath': return <CathPage />;
                    case 'procedures': return <ProceduresPage />;
                    case 'rules': return <RulesPage />;
                    case 'records': return <RecordsPage />;
                    case 'teaching': return <TeachingPage />;
                    case 'discharge': return <DischargePage />;
                    case 'reference': return <ReferencePage />;
                    case 'chestpain': return <ChestPainPage />;
                    case 'symptoms': return <SymptomsPage />;
                    case 'scores': return <ClinicalScoresPage />;
                    case 'medications': return <MedicationsPage />;
                    case 'oncall': return <OnCallPage />;
                    case 'cagroutine': return <CAGRoutinePage />;
                    case 'icasroutine': return <ICASRoutinePage />;
                    case 'ppmroutine': return <PPMRoutinePage />;
                    default: return <HomePage setPage={setPage} />;
                }
            };

            return (
                <div className="min-h-screen text-white">
                    {/* Header */}
                    <header className="glass sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
                        {page !== 'home' ? (
                            <button onClick={() => setPage('home')} className="p-2 hover:bg-white/10 rounded-lg">
                                <Icons.Back />
                            </button>
                        ) : (
                            <div className="w-9"></div>
                        )}
                        <h1 className="text-lg font-bold">心血管中心工作指引</h1>
                        <button onClick={() => setMenuOpen(true)} className="p-2 hover:bg-white/10 rounded-lg">
                            <Icons.Menu />
                        </button>
                    </header>

                    {/* Content */}
                    <main className="pb-20">
                        {renderPage()}
                    </main>

                    {/* Mobile Menu Overlay */}
                    {menuOpen && (
                        <div className="fixed inset-0 z-50 bg-black/50" onClick={() => setMenuOpen(false)}>
                            <div className="absolute right-0 top-0 h-full w-72 glass" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center p-4 border-b border-white/10">
                                    <span className="font-bold">選單</span>
                                    <button onClick={() => setMenuOpen(false)} className="p-2 hover:bg-white/10 rounded-lg">
                                        <Icons.Close />
                                    </button>
                                </div>
                                <nav className="p-2">
                                    {navItems.map(item => (
                                        <button
                                            key={item.id}
                                            onClick={() => { setPage(item.id); setMenuOpen(false); }}
                                            className={`nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg ${page === item.id ? 'active' : ''}`}
                                        >
                                            {item.icon}
                                            <span>{item.label}</span>
                                        </button>
                                    ))}
                                </nav>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
