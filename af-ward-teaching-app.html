<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>心房顫動病房處置教學</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        :root {
            --bg-primary: #0a0f1a;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --bg-card-hover: #222d3f;
            --accent-teal: #14b8a6;
            --accent-teal-dim: #0d9488;
            --accent-coral: #f97316;
            --accent-rose: #f43f5e;
            --accent-violet: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #2d3748;
            --border-light: #374151;
        }
        
        html, body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        body {
            background: 
                radial-gradient(ellipse at 20% 0%, rgba(20, 184, 166, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
                var(--bg-primary);
            min-height: 100vh;
        }
        
        #root {
            min-height: 100vh;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
        
        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(20, 184, 166, 0.3); }
            50% { box-shadow: 0 0 40px rgba(20, 184, 166, 0.5); }
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.1); }
        }
        
        @keyframes ecg-line {
            0% { stroke-dashoffset: 1000; }
            100% { stroke-dashoffset: 0; }
        }
        
        .animate-in {
            animation: fadeInUp 0.4s ease-out forwards;
        }
        
        .stagger-1 { animation-delay: 0.05s; opacity: 0; }
        .stagger-2 { animation-delay: 0.1s; opacity: 0; }
        .stagger-3 { animation-delay: 0.15s; opacity: 0; }
        .stagger-4 { animation-delay: 0.2s; opacity: 0; }
        .stagger-5 { animation-delay: 0.25s; opacity: 0; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // ============ SVG Icons ============
        const Icons = {
            Heart: () => (
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            ),
            Pill: () => (
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="24" height="24">
                    <path d="M10.5 20.5L3.5 13.5C1.5 11.5 1.5 8.16 3.5 6.16C5.5 4.16 8.84 4.16 10.84 6.16L17.84 13.16C19.84 15.16 19.84 18.5 17.84 20.5C15.84 22.5 12.5 22.5 10.5 20.5Z"/>
                    <line x1="8.5" y1="8.5" x2="15.5" y2="15.5"/>
                </svg>
            ),
            Activity: () => (
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="24" height="24">
                    <polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/>
                </svg>
            ),
            Calculator: () => (
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="24" height="24">
                    <rect x="4" y="2" width="16" height="20" rx="2"/>
                    <line x1="8" y1="6" x2="16" y2="6"/>
                    <line x1="8" y1="10" x2="8" y2="10.01"/>
                    <line x1="12" y1="10" x2="12" y2="10.01"/>
                    <line x1="16" y1="10" x2="16" y2="10.01"/>
                    <line x1="8" y1="14" x2="8" y2="14.01"/>
                    <line x1="12" y1="14" x2="12" y2="14.01"/>
                    <line x1="16" y1="14" x2="16" y2="14.01"/>
                    <line x1="8" y1="18" x2="8" y2="18.01"/>
                    <line x1="12" y1="18" x2="16" y2="18"/>
                </svg>
            ),
            AlertTriangle: () => (
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="24" height="24">
                    <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                    <line x1="12" y1="9" x2="12" y2="13"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
            ),
            Check: () => (
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" width="20" height="20">
                    <polyline points="20,6 9,17 4,12"/>
                </svg>
            ),
            ChevronRight: () => (
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="20" height="20">
                    <polyline points="9,18 15,12 9,6"/>
                </svg>
            ),
            Info: () => (
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="16" x2="12" y2="12"/>
                    <line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
            ),
            Zap: () => (
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                    <polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/>
                </svg>
            ),
            Clock: () => (
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12,6 12,12 16,14"/>
                </svg>
            ),
            Droplet: () => (
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                </svg>
            )
        };
        
        // ============ ECG Animation Component ============
        const ECGLine = () => (
            <svg viewBox="0 0 400 60" style={{width: '100%', height: '40px', marginBottom: '8px'}}>
                <defs>
                    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stopColor="#14b8a6" stopOpacity="0.2"/>
                        <stop offset="50%" stopColor="#14b8a6" stopOpacity="1"/>
                        <stop offset="100%" stopColor="#14b8a6" stopOpacity="0.2"/>
                    </linearGradient>
                </defs>
                <path
                    d="M0,30 L30,30 L35,30 L40,30 L50,30 L55,10 L60,50 L65,25 L70,35 L75,30 L100,30 L130,30 L135,30 L140,30 L150,30 L155,8 L160,52 L165,25 L170,35 L175,30 L200,30 L230,30 L235,30 L240,30 L250,30 L255,12 L260,48 L265,25 L270,35 L275,30 L300,30 L330,30 L335,30 L340,30 L350,30 L355,10 L360,50 L365,25 L370,35 L375,30 L400,30"
                    fill="none"
                    stroke="url(#ecgGrad)"
                    strokeWidth="2"
                    strokeLinecap="round"
                    style={{
                        strokeDasharray: 1000,
                        animation: 'ecg-line 3s linear infinite'
                    }}
                />
            </svg>
        );
        
        // ============ Header Component ============
        const Header = ({ currentTab, setCurrentTab }) => {
            const tabs = [
                { id: 'overview', label: 'AF總覽', icon: <Icons.Heart /> },
                { id: 'pulse', label: '脈搏vs心率', icon: <Icons.Activity /> },
                { id: 'rate', label: '心率控制', icon: <Icons.Zap /> },
                { id: 'meds', label: '藥物', icon: <Icons.Pill /> },
                { id: 'chads', label: 'CHA₂DS₂-VASc', icon: <Icons.Calculator /> },
                { id: 'hasbled', label: 'HAS-BLED', icon: <Icons.AlertTriangle /> },
            ];
            
            return (
                <header style={{
                    position: 'sticky',
                    top: 0,
                    zIndex: 100,
                    background: 'linear-gradient(180deg, rgba(10,15,26,0.98) 0%, rgba(10,15,26,0.95) 100%)',
                    backdropFilter: 'blur(20px)',
                    borderBottom: '1px solid var(--border-color)',
                }}>
                    <div style={{
                        padding: '16px 16px 12px',
                        textAlign: 'center',
                    }}>
                        <ECGLine />
                        <h1 style={{
                            fontSize: '1.4rem',
                            fontWeight: 700,
                            background: 'linear-gradient(135deg, #14b8a6 0%, #3b82f6 50%, #8b5cf6 100%)',
                            WebkitBackgroundClip: 'text',
                            WebkitTextFillColor: 'transparent',
                            letterSpacing: '0.5px',
                        }}>
                            心房顫動 AF 病房處置
                        </h1>
                        <p style={{
                            fontSize: '0.75rem',
                            color: 'var(--text-muted)',
                            marginTop: '4px',
                        }}>
                            護理臨床教學指引
                        </p>
                    </div>
                    
                    <nav style={{
                        display: 'flex',
                        overflowX: 'auto',
                        padding: '0 8px 12px',
                        gap: '6px',
                        scrollbarWidth: 'none',
                        msOverflowStyle: 'none',
                    }}>
                        {tabs.map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setCurrentTab(tab.id)}
                                style={{
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '6px',
                                    padding: '8px 14px',
                                    borderRadius: '20px',
                                    border: 'none',
                                    background: currentTab === tab.id 
                                        ? 'linear-gradient(135deg, var(--accent-teal) 0%, var(--accent-teal-dim) 100%)'
                                        : 'var(--bg-card)',
                                    color: currentTab === tab.id ? '#fff' : 'var(--text-secondary)',
                                    fontSize: '0.8rem',
                                    fontWeight: 500,
                                    cursor: 'pointer',
                                    whiteSpace: 'nowrap',
                                    transition: 'all 0.2s ease',
                                    flexShrink: 0,
                                }}
                            >
                                <span style={{ 
                                    display: 'flex', 
                                    transform: 'scale(0.85)',
                                    opacity: currentTab === tab.id ? 1 : 0.7 
                                }}>
                                    {tab.icon}
                                </span>
                                {tab.label}
                            </button>
                        ))}
                    </nav>
                </header>
            );
        };
        
        // ============ Card Components ============
        const Card = ({ children, accent, style = {} }) => (
            <div style={{
                background: 'var(--bg-card)',
                borderRadius: '16px',
                padding: '20px',
                border: '1px solid var(--border-color)',
                borderLeft: accent ? `4px solid ${accent}` : '1px solid var(--border-color)',
                ...style
            }}>
                {children}
            </div>
        );
        
        const InfoBox = ({ type = 'info', title, children }) => {
            const styles = {
                info: { bg: 'rgba(59, 130, 246, 0.1)', border: '#3b82f6', icon: <Icons.Info /> },
                warning: { bg: 'rgba(249, 115, 22, 0.1)', border: '#f97316', icon: <Icons.AlertTriangle /> },
                danger: { bg: 'rgba(244, 63, 94, 0.1)', border: '#f43f5e', icon: <Icons.AlertTriangle /> },
                success: { bg: 'rgba(16, 185, 129, 0.1)', border: '#10b981', icon: <Icons.Check /> },
            };
            const s = styles[type];
            
            return (
                <div style={{
                    background: s.bg,
                    borderLeft: `4px solid ${s.border}`,
                    borderRadius: '8px',
                    padding: '14px 16px',
                    marginTop: '16px',
                }}>
                    <div style={{
                        display: 'flex',
                        alignItems: 'center',
                        gap: '8px',
                        marginBottom: title ? '8px' : 0,
                        color: s.border,
                        fontWeight: 600,
                        fontSize: '0.9rem',
                    }}>
                        {s.icon}
                        {title}
                    </div>
                    <div style={{ fontSize: '0.85rem', color: 'var(--text-secondary)', lineHeight: 1.7 }}>
                        {children}
                    </div>
                </div>
            );
        };
        
        const SectionTitle = ({ children, icon }) => (
            <h2 style={{
                display: 'flex',
                alignItems: 'center',
                gap: '10px',
                fontSize: '1.15rem',
                fontWeight: 600,
                color: 'var(--text-primary)',
                marginBottom: '16px',
            }}>
                {icon && <span style={{ color: 'var(--accent-teal)' }}>{icon}</span>}
                {children}
            </h2>
        );
        
        const SubTitle = ({ children, color = 'var(--accent-teal)' }) => (
            <h3 style={{
                fontSize: '1rem',
                fontWeight: 600,
                color: color,
                marginBottom: '12px',
                marginTop: '20px',
                display: 'flex',
                alignItems: 'center',
                gap: '8px',
            }}>
                <span style={{
                    width: '4px',
                    height: '18px',
                    background: color,
                    borderRadius: '2px',
                }}/>
                {children}
            </h3>
        );
        
        // ============ Overview Tab ============
        const OverviewTab = () => (
            <div style={{ padding: '20px 16px', display: 'flex', flexDirection: 'column', gap: '20px' }}>
                <Card accent="var(--accent-teal)" className="animate-in stagger-1">
                    <SectionTitle icon={<Icons.Heart />}>什麼是心房顫動 (AF)?</SectionTitle>
                    <p style={{ color: 'var(--text-secondary)', fontSize: '0.9rem', lineHeight: 1.8 }}>
                        心房顫動是<strong style={{color: 'var(--accent-coral)'}}>最常見的心律不整</strong>，心房以 350-600 次/分 快速且不規則顫動，
                        導致 <strong style={{color: 'var(--accent-teal)'}}>R-R 間距不規則 (irregularly irregular)</strong>。
                    </p>
                    
                    <div style={{
                        display: 'grid',
                        gridTemplateColumns: 'repeat(2, 1fr)',
                        gap: '12px',
                        marginTop: '16px',
                    }}>
                        {[
                            { label: '心悸', desc: '最常見症狀' },
                            { label: '呼吸困難', desc: '活動時加劇' },
                            { label: '頭暈疲倦', desc: '心輸出量下降' },
                            { label: '無症狀', desc: '約1/3病人' },
                        ].map((item, i) => (
                            <div key={i} style={{
                                background: 'var(--bg-secondary)',
                                padding: '12px',
                                borderRadius: '10px',
                                textAlign: 'center',
                            }}>
                                <div style={{ fontWeight: 600, color: 'var(--text-primary)', fontSize: '0.9rem' }}>
                                    {item.label}
                                </div>
                                <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '4px' }}>
                                    {item.desc}
                                </div>
                            </div>
                        ))}
                    </div>
                </Card>
                
                <Card accent="var(--accent-blue)" className="animate-in stagger-2">
                    <SectionTitle>ECG 特徵</SectionTitle>
                    <div style={{
                        background: '#0d1117',
                        borderRadius: '12px',
                        padding: '16px',
                        fontFamily: "'JetBrains Mono', monospace",
                    }}>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                            {[
                                { check: '✗', text: 'P wave 消失', color: '#f43f5e' },
                                { check: '→', text: '被 f wave (顫動波) 取代', color: '#f97316' },
                                { check: '~', text: 'R-R interval 不規則', color: '#eab308' },
                                { check: '↑', text: '心室率通常 100-180 bpm', color: '#14b8a6' },
                            ].map((item, i) => (
                                <div key={i} style={{
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '12px',
                                    fontSize: '0.85rem',
                                }}>
                                    <span style={{
                                        color: item.color,
                                        fontWeight: 700,
                                        fontSize: '1rem',
                                        width: '24px',
                                        textAlign: 'center',
                                    }}>{item.check}</span>
                                    <span style={{ color: 'var(--text-secondary)' }}>{item.text}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </Card>
                
                <Card accent="var(--accent-violet)" className="animate-in stagger-3">
                    <SectionTitle>AF 治療三大目標</SectionTitle>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                        {[
                            { 
                                num: '1', 
                                title: 'Rate Control 心率控制',
                                desc: '控制心室速率 → β-blocker、CCB、Digoxin',
                                color: 'var(--accent-teal)'
                            },
                            { 
                                num: '2', 
                                title: 'Rhythm Control 節律控制',
                                desc: '恢復正常竇性節律 → Amiodarone、電擊整流',
                                color: 'var(--accent-blue)'
                            },
                            { 
                                num: '3', 
                                title: 'Anticoagulation 抗凝血',
                                desc: '預防中風 → NOAC、Warfarin',
                                color: 'var(--accent-coral)'
                            },
                        ].map((item, i) => (
                            <div key={i} style={{
                                display: 'flex',
                                gap: '14px',
                                alignItems: 'flex-start',
                                background: 'var(--bg-secondary)',
                                padding: '14px',
                                borderRadius: '12px',
                            }}>
                                <div style={{
                                    width: '32px',
                                    height: '32px',
                                    borderRadius: '50%',
                                    background: item.color,
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    fontWeight: 700,
                                    fontSize: '0.9rem',
                                    flexShrink: 0,
                                }}>
                                    {item.num}
                                </div>
                                <div>
                                    <div style={{ fontWeight: 600, color: 'var(--text-primary)', fontSize: '0.9rem' }}>
                                        {item.title}
                                    </div>
                                    <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '4px' }}>
                                        {item.desc}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </Card>
            </div>
        );
        
        // ============ Pulse vs Heart Rate Tab ============
        const PulseTab = () => (
            <div style={{ padding: '20px 16px', display: 'flex', flexDirection: 'column', gap: '20px' }}>
                <Card accent="var(--accent-coral)" className="animate-in stagger-1">
                    <SectionTitle icon={<Icons.Activity />}>核心概念：脈搏落差</SectionTitle>
                    
                    <div style={{
                        background: 'linear-gradient(135deg, rgba(249,115,22,0.15) 0%, rgba(244,63,94,0.1) 100%)',
                        borderRadius: '16px',
                        padding: '20px',
                        textAlign: 'center',
                        marginBottom: '16px',
                    }}>
                        <div style={{
                            fontFamily: "'JetBrains Mono', monospace",
                            fontSize: '1.4rem',
                            fontWeight: 700,
                            color: 'var(--accent-coral)',
                            marginBottom: '8px',
                        }}>
                            Pulse Deficit = HR - Pulse
                        </div>
                        <div style={{
                            fontSize: '0.85rem',
                            color: 'var(--text-secondary)',
                        }}>
                            脈搏落差 = 心率 - 周邊脈搏
                        </div>
                    </div>
                    
                    <div style={{
                        display: 'grid',
                        gridTemplateColumns: '1fr auto 1fr',
                        gap: '12px',
                        alignItems: 'center',
                        background: 'var(--bg-secondary)',
                        borderRadius: '12px',
                        padding: '20px 16px',
                    }}>
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)', marginBottom: '6px' }}>
                                心電圖心率
                            </div>
                            <div style={{
                                fontSize: '2rem',
                                fontWeight: 700,
                                color: 'var(--accent-rose)',
                                fontFamily: "'JetBrains Mono', monospace",
                            }}>
                                120
                            </div>
                            <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>bpm</div>
                        </div>
                        
                        <div style={{
                            fontSize: '1.5rem',
                            color: 'var(--text-muted)',
                        }}>→</div>
                        
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)', marginBottom: '6px' }}>
                                周邊脈搏
                            </div>
                            <div style={{
                                fontSize: '2rem',
                                fontWeight: 700,
                                color: 'var(--accent-teal)',
                                fontFamily: "'JetBrains Mono', monospace",
                            }}>
                                96
                            </div>
                            <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>bpm</div>
                        </div>
                    </div>
                    
                    <div style={{

                                </label>
                            ))}
                        </div>
                    </Card>
                    
                    <Card accent={risk.color} className="animate-in stagger-2">
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ fontSize: '0.85rem', color: 'var(--text-muted)', marginBottom: '8px' }}>
                                總分
                            </div>
                            <div style={{
                                fontFamily: "'JetBrains Mono', monospace",
                                fontSize: '4rem',
                                fontWeight: 700,
                                color: risk.color,
                                lineHeight: 1,
                            }}>
                                {totalScore}
                            </div>
                            <div style={{
                                marginTop: '16px',
                                padding: '12px 20px',
                                background: `${risk.color}20`,
                                borderRadius: '10px',
                                display: 'inline-block',
                            }}>
                                <div style={{ fontWeight: 600, color: risk.color, fontSize: '1rem' }}>
                                    {risk.level}
                                </div>
                                <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '4px' }}>
                                    年中風率 {risk.rate}
                                </div>
                            </div>
                            <div style={{
                                marginTop: '16px',
                                fontSize: '0.9rem',
                                color: 'var(--text-secondary)',
                                padding: '14px',
                                background: 'var(--bg-secondary)',
                                borderRadius: '10px',
                            }}>
                                {risk.action}
                            </div>
                        </div>
                    </Card>
                </div>
            );
        };
        
        // ============ HAS-BLED Calculator ============
        const HASBLEDCalculator = () => {
            const [scores, setScores] = useState({
                htn: false,
                abnormal_renal: false,
                abnormal_liver: false,
                stroke: false,
                bleeding: false,
                labile: false,
                elderly: false,
                drugs: false,
                alcohol: false,
            });
            
            const items = [
                { key: 'htn', label: 'H - 高血壓 (SBP >160 mmHg)' },
                { key: 'abnormal_renal', label: 'A - 腎功能異常 (透析/Cr >2.6)' },
                { key: 'abnormal_liver', label: 'A - 肝功能異常 (肝硬化/Bil >2x/AST ALT >3x)' },
                { key: 'stroke', label: 'S - 中風病史' },
                { key: 'bleeding', label: 'B - 出血病史或傾向' },
                { key: 'labile', label: 'L - INR 不穩定 (TTR <60%)' },
                { key: 'elderly', label: 'E - 年齡 >65 歲' },
                { key: 'drugs', label: 'D - 藥物 (抗血小板/NSAIDs)' },
                { key: 'alcohol', label: 'D - 酒精 (≥8杯/週)' },
            ];
            
            const totalScore = Object.values(scores).filter(Boolean).length;
            
            const getRisk = () => {
                if (totalScore <= 2) return { 
                    level: '低出血風險', 
                    action: '可安全使用抗凝血劑', 
                    color: 'var(--accent-emerald)' 
                };
                return { 
                    level: '高出血風險', 
                    action: '謹慎使用抗凝血劑，加強監測', 
                    color: 'var(--accent-rose)' 
                };
            };
            
            const risk = getRisk();
            
            return (
                <div style={{ padding: '20px 16px', display: 'flex', flexDirection: 'column', gap: '20px' }}>
                    <Card accent="var(--accent-rose)" className="animate-in stagger-1">
                        <SectionTitle icon={<Icons.Droplet />}>HAS-BLED 出血風險評估</SectionTitle>
                        
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                            {items.map(item => (
                                <label
                                    key={item.key}
                                    style={{
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: '12px',
                                        padding: '14px',
                                        background: scores[item.key] ? 'rgba(244,63,94,0.15)' : 'var(--bg-secondary)',
                                        borderRadius: '10px',
                                        cursor: 'pointer',
                                        border: scores[item.key] ? '1px solid var(--accent-rose)' : '1px solid transparent',
                                        transition: 'all 0.2s',
                                    }}
                                >
                                    <input
                                        type="checkbox"
                                        checked={scores[item.key]}
                                        onChange={(e) => setScores({...scores, [item.key]: e.target.checked})}
                                        style={{ display: 'none' }}
                                    />
                                    <div style={{
                                        width: '24px',
                                        height: '24px',
                                        borderRadius: '6px',
                                        border: scores[item.key] ? 'none' : '2px solid var(--border-light)',
                                        background: scores[item.key] ? 'var(--accent-rose)' : 'transparent',
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                        flexShrink: 0,
                                    }}>
                                        {scores[item.key] && <Icons.Check />}
                                    </div>
                                    <span style={{ flex: 1, fontSize: '0.85rem', color: 'var(--text-secondary)' }}>
                                        {item.label}
                                    </span>
                                    <span style={{
                                        fontFamily: "'JetBrains Mono', monospace",
                                        fontSize: '0.85rem',
                                        fontWeight: 600,
                                        color: scores[item.key] ? 'var(--accent-rose)' : 'var(--text-muted)',
                                    }}>
                                        +1
                                    </span>
                                </label>
                            ))}
                        </div>
                    </Card>
                    
                    <Card accent={risk.color} className="animate-in stagger-2">
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ fontSize: '0.85rem', color: 'var(--text-muted)', marginBottom: '8px' }}>
                                總分
                            </div>
                            <div style={{
                                fontFamily: "'JetBrains Mono', monospace",
                                fontSize: '4rem',
                                fontWeight: 700,
                                color: risk.color,
                                lineHeight: 1,
                            }}>
                                {totalScore}
                            </div>
                            <div style={{
                                marginTop: '16px',
                                padding: '12px 20px',
                                background: `${risk.color}20`,
                                borderRadius: '10px',
                                display: 'inline-block',
                            }}>
                                <div style={{ fontWeight: 600, color: risk.color, fontSize: '1rem' }}>
                                    {risk.level}
                                </div>
                                <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '4px' }}>
                                    {totalScore <= 2 ? '分數 0-2' : '分數 ≥3'}
                                </div>
                            </div>
                            <div style={{
                                marginTop: '16px',
                                fontSize: '0.9rem',
                                color: 'var(--text-secondary)',
                                padding: '14px',
                                background: 'var(--bg-secondary)',
                                borderRadius: '10px',
                            }}>
                                {risk.action}
                            </div>
                        </div>
                        
                        <InfoBox type="warning" title="重要觀念">
                            HAS-BLED ≥3 <strong style={{color:'var(--accent-amber)'}}>不是抗凝血的絕對禁忌</strong>
                            <br/>而是提醒需要：
                            <ul style={{ margin: '8px 0 0 16px', lineHeight: 1.8 }}>
                                <li>更密切監測出血徵象</li>
                                <li>矯正可逆因素 (控制血壓、停NSAIDs)</li>
                                <li>選擇出血風險較低的 NOAC</li>
                            </ul>
                        </InfoBox>
                    </Card>
                </div>
            );
        };
        
        // ============ Main App ============
        const App = () => {
            const [currentTab, setCurrentTab] = useState('overview');
            
            const renderContent = () => {
                switch(currentTab) {
                    case 'overview': return <OverviewTab />;
                    case 'pulse': return <PulseTab />;
                    case 'rate': return <RateControlTab />;
                    case 'meds': return <MedicationsTab />;
                    case 'chads': return <CHADSCalculator />;
                    case 'hasbled': return <HASBLEDCalculator />;
                    default: return <OverviewTab />;
                }
            };
            
            return (
                <div style={{ 
                    minHeight: '100vh',
                    paddingBottom: '40px',
                }}>
                    <Header currentTab={currentTab} setCurrentTab={setCurrentTab} />
                    <main key={currentTab}>
                        {renderContent()}
                    </main>
                    <footer style={{
                        textAlign: 'center',
                        padding: '20px',
                        fontSize: '0.7rem',
                        color: 'var(--text-muted)',
                    }}>
                        AF Ward Management Teaching Guide v2.0
                        <br/>
                        僅供教學參考，臨床決策請依實際情況判斷
                    </footer>
                </div>
            );
        };
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
