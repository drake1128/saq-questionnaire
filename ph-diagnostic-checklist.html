<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>肺動脈高壓診斷查核表 | PH Diagnostic Checklist</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0a0f1a;
            --bg-secondary: #111827;
            --bg-card: #1a2234;
            --bg-card-hover: #1f2943;
            --accent-blue: #3b82f6;
            --accent-cyan: #22d3ee;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-green: #10b981;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #2d3a52;
            --gradient-1: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --gradient-2: linear-gradient(135deg, #22d3ee, #3b82f6);
            --gradient-3: linear-gradient(135deg, #ec4899, #f97316);
            --shadow-glow: 0 0 40px rgba(59, 130, 246, 0.15);
        }

        body {
            font-family: 'Noto Sans TC', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        #root {
            min-height: 100vh;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .slide-in {
            animation: slideIn 0.3s ease-out forwards;
        }

        /* Main Layout */
        .app-container {
            max-width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, var(--bg-primary) 0%, #0d1525 100%);
        }

        /* Header */
        .header {
            background: linear-gradient(180deg, rgba(26, 34, 52, 0.98) 0%, rgba(26, 34, 52, 0.95) 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 600px;
            margin: 0 auto;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            background: var(--gradient-2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .header-subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Navigation */
        .nav-container {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 68px;
            z-index: 99;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .nav-container::-webkit-scrollbar {
            display: none;
        }

        .nav-tabs {
            display: flex;
            padding: 0 12px;
            gap: 4px;
            max-width: 600px;
            margin: 0 auto;
        }

        .nav-tab {
            flex: none;
            padding: 12px 16px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .nav-tab:hover {
            color: var(--text-secondary);
        }

        .nav-tab.active {
            color: var(--accent-cyan);
            border-bottom-color: var(--accent-cyan);
        }

        .nav-tab-icon {
            margin-right: 6px;
        }

        /* Content */
        .content {
            flex: 1;
            padding: 20px 16px 100px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Section Cards */
        .section-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .section-card:hover {
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: var(--shadow-glow);
        }

        .section-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .section-header:hover {
            background: var(--bg-card-hover);
        }

        .section-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .section-subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .expand-icon {
            color: var(--text-muted);
            transition: transform 0.3s ease;
            font-size: 1.2rem;
        }

        .expand-icon.expanded {
            transform: rotate(180deg);
        }

        .section-content {
            padding: 0 20px 20px;
            border-top: 1px solid var(--border-color);
        }

        /* Checklist Items */
        .checklist-group {
            margin-top: 16px;
        }

        .checklist-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-cyan);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checklist-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(45, 58, 82, 0.5);
            transition: all 0.2s ease;
        }

        .checklist-item:last-child {
            border-bottom: none;
        }

        .checklist-checkbox {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent;
        }

        .checklist-checkbox:hover {
            border-color: var(--accent-cyan);
        }

        .checklist-checkbox.checked {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }

        .checklist-checkbox.checked svg {
            display: block;
        }

        .checklist-checkbox svg {
            display: none;
            width: 14px;
            height: 14px;
            color: white;
        }

        .checklist-text {
            flex: 1;
        }

        .checklist-main {
            font-size: 0.9rem;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .checklist-eng {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .checklist-item.completed .checklist-main {
            color: var(--text-secondary);
            text-decoration: line-through;
        }

        /* Info Boxes */
        .info-box {
            padding: 16px;
            border-radius: 12px;
            margin-top: 16px;
        }

        .info-box.blue {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .info-box.green {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .info-box.yellow {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        .info-box.red {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .info-box.purple {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        .info-box-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-box.blue .info-box-title { color: var(--accent-blue); }
        .info-box.green .info-box-title { color: var(--accent-green); }
        .info-box.yellow .info-box-title { color: var(--accent-yellow); }
        .info-box.red .info-box-title { color: var(--accent-red); }
        .info-box.purple .info-box-title { color: var(--accent-purple); }

        .info-box-content {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Criteria Table */
        .criteria-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 0.85rem;
        }

        .criteria-table th {
            background: var(--bg-secondary);
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
        }

        .criteria-table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(45, 58, 82, 0.5);
            color: var(--text-secondary);
        }

        .criteria-table tr:last-child td {
            border-bottom: none;
        }

        .criteria-table .value {
            color: var(--accent-cyan);
            font-weight: 500;
        }

        /* Progress Bar */
        .progress-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .progress-percentage {
            font-size: 1.2rem;
            font-weight: 700;
            background: var(--gradient-2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .progress-bar {
            height: 8px;
            background: var(--bg-secondary);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient-2);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Quiz Section */
        .quiz-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .quiz-progress {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .quiz-question {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quiz-option {
            padding: 14px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            color: var(--text-primary);
            text-align: left;
        }

        .quiz-option:hover {
            border-color: var(--accent-cyan);
            background: rgba(34, 211, 238, 0.05);
        }

        .quiz-option.selected {
            border-color: var(--accent-cyan);
            background: rgba(34, 211, 238, 0.1);
        }

        .quiz-option.correct {
            border-color: var(--accent-green);
            background: rgba(16, 185, 129, 0.15);
        }

        .quiz-option.incorrect {
            border-color: var(--accent-red);
            background: rgba(239, 68, 68, 0.15);
        }

        .quiz-option.disabled {
            pointer-events: none;
        }

        .quiz-explanation {
            margin-top: 20px;
            padding: 16px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
        }

        .quiz-explanation-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 8px;
        }

        .quiz-explanation-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .quiz-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .quiz-btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quiz-btn.primary {
            background: var(--gradient-2);
            color: white;
        }

        .quiz-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(34, 211, 238, 0.3);
        }

        .quiz-btn.secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .quiz-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Quiz Result */
        .quiz-result {
            text-align: center;
            padding: 40px 20px;
        }

        .quiz-result-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .quiz-result-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .quiz-result-score {
            font-size: 2rem;
            font-weight: 700;
            background: var(--gradient-2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }

        .quiz-result-message {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        /* WHO Classification Cards */
        .who-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }

        .who-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .who-card:hover {
            border-color: rgba(59, 130, 246, 0.3);
            transform: translateX(4px);
        }

        .who-card.expanded {
            border-color: var(--accent-cyan);
        }

        .who-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .who-card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .who-card-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .who-card-badge.g1 { background: rgba(168, 85, 247, 0.2); color: var(--accent-purple); }
        .who-card-badge.g2 { background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); }
        .who-card-badge.g3 { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
        .who-card-badge.g4 { background: rgba(249, 115, 22, 0.2); color: var(--accent-orange); }
        .who-card-badge.g5 { background: rgba(236, 72, 153, 0.2); color: var(--accent-pink); }

        .who-card-details {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .who-card-details ul {
            list-style: none;
            padding: 0;
        }

        .who-card-details li {
            padding: 6px 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .who-card-details li::before {
            content: "•";
            color: var(--accent-cyan);
            font-weight: bold;
        }

        /* Tab Content */
        .tab-content {
            animation: fadeIn 0.3s ease-out;
        }

        /* Overview Stats */
        .overview-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--gradient-2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Important Notes */
        .notes-list {
            margin-top: 16px;
        }

        .note-item {
            display: flex;
            gap: 12px;
            padding: 14px;
            background: var(--bg-secondary);
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .note-icon {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .note-icon.warning {
            background: rgba(251, 191, 36, 0.2);
        }

        .note-icon.danger {
            background: rgba(239, 68, 68, 0.2);
        }

        .note-icon.info {
            background: rgba(59, 130, 246, 0.2);
        }

        .note-text {
            flex: 1;
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Flow Diagram */
        .flow-diagram {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }

        .flow-step {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .flow-step:last-child {
            margin-bottom: 0;
        }

        .flow-arrow {
            text-align: center;
            color: var(--accent-cyan);
            font-size: 1.2rem;
            margin: 8px 0 8px 14px;
        }

        .flow-box {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .flow-box.highlight {
            border-color: var(--accent-cyan);
            background: rgba(34, 211, 238, 0.1);
        }

        /* Reset Button */
        .reset-btn {
            width: 100%;
            padding: 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 20px;
        }

        .reset-btn:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.75rem;
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .footer a {
            color: var(--accent-cyan);
            text-decoration: none;
        }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            .header {
                padding: 12px 16px;
            }

            .header-title {
                font-size: 1.1rem;
            }

            .nav-tab {
                padding: 10px 12px;
                font-size: 0.8rem;
            }

            .content {
                padding: 16px 12px 100px;
            }

            .section-header {
                padding: 14px 16px;
            }

            .section-content {
                padding: 0 16px 16px;
            }

            .quiz-container {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // Checklist Data
        const checklistData = {
            stage1: {
                title: "第一階段：初步評估與懷疑 PH",
                subtitle: "Initial Assessment",
                icon: "🔍",
                iconBg: "linear-gradient(135deg, #3b82f6, #8b5cf6)",
                sections: [
                    {

                if (showExplanation) return;
                setSelected(idx);
                setShowExplanation(true);
                const isCorrect = idx === quizQuestions[currentQ].correct;
                if (isCorrect) setScore(score + 1);

                    setCurrentQ(currentQ + 1);
                    setSelected(null);
                    setShowExplanation(false);
                } else {
                    setFinished(true);
                    onComplete(score + (selected === quizQuestions[currentQ].correct ? 1 : 0));

                setCurrentQ(0);
                setSelected(null);
                setShowExplanation(false);
                setScore(0);
                setFinished(false);
                setAnswers([]);

                            <div className="quiz-explanation-text">{q.explanation}</div>
                        </div>
                    )}
                    {showExplanation && (
                        <div className="quiz-buttons">
                            <button className="quiz-btn primary" onClick={handleNext}>
                                {currentQ < quizQuestions.length - 1 ? '下一題' : '完成測驗'}
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [activeTab, setActiveTab] = useState('checklist');
            const [checkedItems, setCheckedItems] = useState(() => {
                const saved = localStorage.getItem('ph-checklist-progress');
                return saved ? JSON.parse(saved) : {};
            });
            const [quizScore, setQuizScore] = useState(null);

            useEffect(() => {
                localStorage.setItem('ph-checklist-progress', JSON.stringify(checkedItems));
            }, [checkedItems]);

            const toggleItem = useCallback((id) => {
                setCheckedItems(prev => ({
                    ...prev,
                    [id]: !prev[id]
                }));
            }, []);

            const resetProgress = () => {
                if (confirm('確定要重置所有進度嗎？')) {
                    setCheckedItems({});
                    setQuizScore(null);
                }
            };

            const totalItems = useMemo(() => {
                let count = 0;
                Object.values(checklistData).forEach(stage => {
                    stage.sections.forEach(section => {
                        count += section.items.length;
                    });
                });
                return count;
            }, []);

            const completedItems = Object.values(checkedItems).filter(Boolean).length;
            const progressPercentage = totalItems > 0 ? Math.round((completedItems / totalItems) * 100) : 0;

            const tabs = [
                { id: 'checklist', label: '查核表', icon: '📋' },
                { id: 'criteria', label: '診斷標準', icon: '📊' },
                { id: 'quiz', label: '自我測驗', icon: '✍️' },
                { id: 'notes', label: '重點提醒', icon: '⚠️' }
            ];

            return (
                <div className="app-container">
                    <header className="header">
                        <div className="header-content">
                            <div className="header-title">肺動脈高壓診斷查核表</div>
                            <div className="header-subtitle">Pulmonary Hypertension Diagnostic Checklist | Based on 2022 ESC/ERS Guidelines</div>
                        </div>
                    </header>

                    <nav className="nav-container">
                        <div className="nav-tabs">
                            {tabs.map(tab => (
                                <button
                                    key={tab.id}
                                    className={`nav-tab ${activeTab === tab.id ? 'active' : ''}`}
                                    onClick={() => setActiveTab(tab.id)}
                                >
                                    <span className="nav-tab-icon">{tab.icon}</span>
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    </nav>

                    <main className="content">
                        {activeTab === 'checklist' && (
                            <div className="tab-content">
                                <div className="progress-container">
                                    <div className="progress-header">
                                        <span className="progress-title">學習進度</span>
                                        <span className="progress-percentage">{progressPercentage}%</span>
                                    </div>
                                    <div className="progress-bar">
                                        <div className="progress-fill" style={{ width: `${progressPercentage}%` }}></div>
                                    </div>
                                    <div className="progress-stats">
                                        <span>已完成：{completedItems} / {totalItems}</span>
                                        <span>剩餘：{totalItems - completedItems} 項</span>
                                    </div>
                                </div>

                                {Object.entries(checklistData).map(([key, data]) => (
                                    key !== 'stage4' ? (
                                        <SectionCard
                                            key={key}
                                            data={data}
                                            checkedItems={checkedItems}
                                            onToggleItem={toggleItem}
                                        />
                                    ) : (
                                        <div key={key} className="section-card fade-in">
                                            <div className="section-header" style={{ cursor: 'default' }}>
                                                <div className="section-title-group">
                                                    <div className="section-icon" style={{ background: data.iconBg }}>
                                                        {data.icon}
                                                    </div>
                                                    <div>
                                                        <div className="section-title">{data.title}</div>
                                                        <div className="section-subtitle">{data.subtitle}</div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="section-content">
                                                <WHOClassification />
                                            </div>
                                        </div>
                                    )
                                ))}

                                <button className="reset-btn" onClick={resetProgress}>
                                    🔄 重置學習進度
                                </button>
                            </div>
                        )}

                        {activeTab === 'criteria' && (
                            <div className="tab-content">
                                <div className="section-card">
                                    <div className="section-content" style={{ paddingTop: '20px' }}>
                                        <div className="info-box blue">
                                            <div className="info-box-title">📌 RHC 診斷標準 (2022 ESC/ERS)</div>
                                            <div className="info-box-content">
                                                <table className="criteria-table">
                                                    <thead>
                                                        <tr>
                                                            <th>參數</th>
                                                            <th>診斷標準</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <tr>
                                                            <td>mPAP (休息)</td>
                                                            <td className="value">&gt; 20 mmHg</td>
                                                        </tr>
                                                        <tr>
                                                            <td>PVR</td>
                                                            <td className="value">&gt; 2 WU</td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>

                                        <div className="info-box green" style={{ marginTop: '16px' }}>
                                            <div className="info-box-title">🔬 血行動力學分型</div>
                                            <div className="info-box-content">
                                                <table className="criteria-table">
                                                    <thead>
                                                        <tr>
                                                            <th>分型</th>
                                                            <th>mPAP</th>
                                                            <th>PAWP</th>
                                                            <th>PVR</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <tr>
                                                            <td>Pre-capillary PH</td>
                                                            <td className="value">&gt; 20</td>
                                                            <td className="value">≤ 15</td>
                                                            <td className="value">&gt; 2</td>
                                                        </tr>
                                                        <tr>
                                                            <td>IpcPH<br/><span style={{fontSize: '0.75rem', color: 'var(--text-muted)'}}>Isolated post-capillary PH</span></td>
                                                            <td className="value">&gt; 20</td>
                                                            <td className="value">&gt; 15</td>
                                                            <td className="value">≤ 2</td>
                                                        </tr>
                                                        <tr>
                                                            <td>CpcPH<br/><span style={{fontSize: '0.75rem', color: 'var(--text-muted)'}}>Combined pre- and post-capillary PH</span></td>
                                                            <td className="value">&gt; 20</td>
                                                            <td className="value">&gt; 15</td>
                                                            <td className="value">&gt; 2</td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>

                                        <div className="info-box purple" style={{ marginTop: '16px' }}>
                                            <div className="info-box-title">🫀 超音波 PH 評估等級</div>
                                            <div className="info-box-content">
                                                <table className="criteria-table">
                                                    <thead>
                                                        <tr>
                                                            <th>可能性</th>
                                                            <th>標準</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <tr>
                                                            <td>低可能性</td>
                                                            <td>TRPG ≤ 2.8 m/s, 無其他 PH 徵象</td>
                                                        </tr>
                                                        <tr>
                                                            <td>中等可能性</td>
                                                            <td>TRPG 2.9-3.4 m/s 或 TRPG ≤ 2.8 m/s 但有其他徵象</td>
                                                        </tr>
                                                        <tr>
                                                            <td>高可能性</td>
                                                            <td>TRPG &gt; 3.4 m/s 或 TRPG 2.9-3.4 m/s 加上其他徵象</td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>

                                        <div className="info-box yellow" style={{ marginTop: '16px' }}>
                                            <div className="info-box-title">💊 Vasoreactivity Test 陽性標準</div>
                                            <div className="info-box-content">
                                                mPAP 下降 ≥ 10 mmHg 到絕對值 &lt; 40 mmHg<br/>
                                                + Cardiac output 維持或增加<br/><br/>
                                                ✅ 陽性 → CCB trial<br/>
                                                ❌ 陰性或 CCB 失敗 → PAH-specific therapy
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="section-card" style={{ marginTop: '16px' }}>
                                    <div className="section-content" style={{ paddingTop: '20px' }}>
                                        <div className="checklist-title">
                                            <span>🔄</span> 診斷流程最重要原則
                                        </div>
                                        <div className="flow-diagram">
                                            <div className="flow-step">
                                                <div className="flow-box">超音波懷疑 PH</div>
                                            </div>
                                            <div className="flow-arrow">↓</div>
                                            <div className="flow-step">
                                                <div className="flow-box highlight">RHC 確診</div>
                                            </div>
                                            <div className="flow-arrow">↓</div>
                                            <div className="flow-step">
                                                <div className="flow-box">血行動力學分型</div>
                                            </div>
                                            <div className="flow-arrow">↓</div>
                                            <div className="flow-step">
                                                <div className="flow-box">WHO 分類</div>
                                            </div>
                                            <div className="flow-arrow">↓</div>
                                            <div className="flow-step">
                                                <div className="flow-box">風險評估</div>
                                            </div>
                                            <div className="flow-arrow">↓</div>
                                            <div className="flow-step">
                                                <div className="flow-box highlight">治療決策</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'quiz' && (
                            <div className="tab-content">
                                <div className="overview-stats">
                                    <div className="stat-card">
                                        <div className="stat-value">10</div>
                                        <div className="stat-label">題目總數</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-value">{quizScore !== null ? `${quizScore * 10}%` : '--'}</div>
                                        <div className="stat-label">最近成績</div>
                                    </div>
                                </div>
                                <Quiz onComplete={(score) => setQuizScore(score)} />
                            </div>
                        )}

                        {activeTab === 'notes' && (
                            <div className="tab-content">
                                <div className="section-card">
                                    <div className="section-content" style={{ paddingTop: '20px' }}>
                                        <div className="checklist-title">
                                            <span>⚠️</span> 常見陷阱 Common Pitfalls
                                        </div>
                                        <div className="notes-list">
                                            <div className="note-item">
                                                <div className="note-icon danger">❌</div>
                                                <div className="note-text">
                                                    <strong>僅依 TTE 診斷 PH</strong><br/>
                                                    TTE 只能懷疑，需 RHC 確認診斷
                                                </div>
                                            </div>
                                            <div className="note-item">
                                                <div className="note-icon warning">⚠️</div>
                                                <div className="note-text">
                                                    <strong>忽略 Group 2 (左心疾病)</strong><br/>
                                                    這是最常見的 PH 原因！
                                                </div>
                                            </div>
                                            <div className="note-item">
                                                <div className="note-icon danger">❌</div>
                                                <div className="note-text">
                                                    <strong>未做 V/Q scan 排除 CTEPH</strong><br/>
                                                    CTEPH 是唯一可能治癒的 PH
                                                </div>
                                            </div>
                                            <div className="note-item">
                                                <div className="note-icon warning">⚠️</div>
                                                <div className="note-text">
                                                    <strong>未篩檢 CTD</strong><br/>
                                                    SSc 患者 10-15% 有 PAH
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="section-card" style={{ marginTop: '16px' }}>
                                    <div className="section-content" style={{ paddingTop: '20px' }}>
                                        <div className="checklist-title">
                                            <span>💡</span> 重要提醒 Key Reminders
                                        </div>
                                        <div className="notes-list">
                                            <div className="note-item">
                                                <div className="note-icon info">📊</div>
                                                <div className="note-text">
                                                    <strong>BNP/NT-proBNP</strong> 是重要預後指標，追蹤必測
                                                </div>
                                            </div>
                                            <div className="note-item">
                                                <div className="note-icon info">🏥</div>
                                                <div className="note-text">
                                                    <strong>CTEPH</strong> 是唯一可能治癒的 PH (手術 PEA)
                                                </div>
                                            </div>
                                            <div className="note-item">
                                                <div className="note-icon danger">🚫</div>
                                                <div className="note-text">
                                                    <strong>Group 1 PAH 才適合標靶藥物</strong><br/>
                                                    不可亂用於 Group 2/3
                                                </div>
                                            </div>
                                            <div className="note-item">
                                                <div className="note-icon info">📋</div>
                                                <div className="note-text">
                                                    <strong>所有疑似 PH 患者都應做 V/Q scan</strong><br/>
                                                    排除 CTEPH
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="info-box red" style={{ marginTop: '16px' }}>
                                    <div className="info-box-title">🎯 診斷流程核心原則</div>
                                    <div className="info-box-content" style={{ fontSize: '1rem', fontWeight: '500' }}>
                                        超音波懷疑 PH → RHC 確診 → 血行動力學分型 → WHO 分類 → 風險評估 → 治療決策
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="footer">
                        <p>肺動脈高壓診斷查核表 | 謝慕揚 MD, PhD, FESC</p>
                        <p>Based on 2022 ESC/ERS Guidelines | Version 1.0</p>
                        <p style={{ marginTop: '8px' }}>
                            台大醫院新竹分院心血管中心 | Updated: December 2025
                        </p>
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
