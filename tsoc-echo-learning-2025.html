      { id: 'quiz_master', icon: '🏆', title: '測驗達人', desc: '完成所有測驗', condition: (progress) => progress.quizzesCompleted >= 6 },
      { id: 'explorer', icon: '🗺️', title: '探索者', desc: '訪問所有進階主題', condition: (progress) => progress.topicsVisited >= 10 },
      { id: 'dedicated', icon: '🔥', title: '堅持不懈', desc: '連續學習 3 天', condition: (progress) => progress.streak >= 3 },
    ];

    // 主應用組件
    function EchoLearningApp() {
      const [currentView, setCurrentView] = useState('home');
      const [selectedCourse, setSelectedCourse] = useState(null);
      const [selectedSection, setSelectedSection] = useState(0);
      const [quizMode, setQuizMode] = useState(false);
      const [quizIndex, setQuizIndex] = useState(0);
      const [quizAnswer, setQuizAnswer] = useState(null);
      const [quizScore, setQuizScore] = useState(0);
      const [quizComplete, setQuizComplete] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [menuOpen, setMenuOpen] = useState(false);
      const [showAbbrModal, setShowAbbrModal] = useState(false);
      const [showAchievements, setShowAchievements] = useState(false);
      const [newAchievement, setNewAchievement] = useState(null);

      // 成就系統狀態
      const [progress, setProgress] = useState(() => {
        const saved = localStorage.getItem('echo-learning-progress');
        return saved ? JSON.parse(saved) : {
          lessonsCompleted: 0,
          quizzesCompleted: 0,
          perfectQuizzes: 0,
          topicsVisited: 0,
          streak: 0,
          lastVisit: null,
          unlockedAchievements: [],
          visitedTopics: []
        };
      });

      // 保存進度到 localStorage
      useEffect(() => {
        localStorage.setItem('echo-learning-progress', JSON.stringify(progress));
      }, [progress]);

      // 檢查並解鎖成就
      const checkAchievements = (newProgress) => {
        achievementDefinitions.forEach(achievement => {
          if (!newProgress.unlockedAchievements.includes(achievement.id) && achievement.condition(newProgress)) {
            setNewAchievement(achievement);
            setProgress(prev => ({
              ...prev,
              unlockedAchievements: [...prev.unlockedAchievements, achievement.id]
            }));
            setTimeout(() => setNewAchievement(null), 3000);
          }
        });
      };

      // 記錄完成章節
      const recordLessonComplete = () => {
        const newProgress = { ...progress, lessonsCompleted: progress.lessonsCompleted + 1 };
        setProgress(newProgress);
        checkAchievements(newProgress);
      };

      // 記錄完成測驗
      const recordQuizComplete = (isPerfect) => {
        const newProgress = {
          ...progress,
          quizzesCompleted: progress.quizzesCompleted + 1,
          perfectQuizzes: isPerfect ? progress.perfectQuizzes + 1 : progress.perfectQuizzes
        };
        setProgress(newProgress);
        checkAchievements(newProgress);
      };

      const courses = Object.values(courseData);

      // 搜索功能
      const searchResults = useMemo(() => {
        if (!searchTerm.trim()) return [];
        const term = searchTerm.toLowerCase();
        const results = [];
        
        courses.forEach(course => {
          course.sections.forEach((section, idx) => {
            if (section.title.toLowerCase().includes(term)) {
              results.push({ course, section, sectionIdx: idx, type: 'section' });
            }
          });
        });
        
        abbreviations.forEach(abbr => {
          if (abbr.abbr.toLowerCase().includes(term) ||
              abbr.full.toLowerCase().includes(term) ||
              abbr.chinese.includes(term)) {
            results.push({ abbr, type: 'abbreviation' });
          }
        });
        
        return results.slice(0, 15);
      }, [searchTerm]);

      const startQuiz = (course) => {
        setSelectedCourse(course);
        setQuizMode(true);
        setQuizIndex(0);
        setQuizAnswer(null);
        setQuizScore(0);
        setQuizComplete(false);
        // 記錄章節完成（開始測驗表示已閱讀章節）
        recordLessonComplete();
      };

      const handleQuizAnswer = (index) => {
        if (quizAnswer !== null) return;
        setQuizAnswer(index);
        if (index === selectedCourse.quiz[quizIndex].correct) {
          setQuizScore(prev => prev + 1);
        }
      };

      const nextQuestion = () => {
        if (quizIndex < selectedCourse.quiz.length - 1) {
          setQuizIndex(prev => prev + 1);
          setQuizAnswer(null);
        } else {
          setQuizComplete(true);
          // 記錄測驗完成成就
          const finalScore = quizScore + (quizAnswer === selectedCourse.quiz[quizIndex].correct ? 1 : 0);
          const isPerfect = finalScore === selectedCourse.quiz.length;
          recordQuizComplete(isPerfect);
        }
      };

      const restartQuiz = () => {
        setQuizIndex(0);
        setQuizAnswer(null);
        setQuizScore(0);
        setQuizComplete(false);
      };

      // 渲染內容項目
      const renderContentItem = (item, idx) => {
        switch (item.type) {
          case 'heading':
            return (
              <h3 key={idx} className="text-lg font-bold text-slate-800 mt-6 mb-3 flex items-center gap-2">
                <div className="w-1 h-5 bg-gradient-to-b from-blue-500 to-purple-500 rounded-full"></div>
                {item.text}
              </h3>
            );
          case 'step':
            return (
              <div key={idx} className="flex gap-3 my-2 items-start">
                <div className="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">
                  {idx + 1}
                </div>
                <p className="text-slate-700 leading-relaxed">{item.text}</p>
              </div>
            );
          case 'point':
            return (
              <p key={idx} className="my-2 text-slate-700 pl-4 border-l-2 border-slate-200">
                {item.text}
              </p>
            );
          case 'measure':
            return (
              <div key={idx} className="my-2 bg-gradient-to-r from-blue-50 to-indigo-50 p-3 rounded-lg border border-blue-100">
                <span className="font-mono font-bold text-blue-700">{item.name}</span>
                <span className="text-slate-600 ml-2">— {item.desc}</span>
              </div>
            );
          case 'formula':
            return (
              <div key={idx} className="my-3 bg-gradient-to-r from-amber-50 to-orange-50 p-4 rounded-xl border border-amber-200 font-mono text-sm text-amber-900 overflow-x-auto">
                🔢 {item.text}
              </div>
            );
          case 'tip':
            return (
              <div key={idx} className="my-3 bg-gradient-to-r from-emerald-50 to-teal-50 p-4 rounded-xl border border-emerald-200 text-emerald-800">
                {item.text}
              </div>
            );
          case 'warning':
            return (
              <div key={idx} className="my-3 bg-gradient-to-r from-red-50 to-rose-50 p-4 rounded-xl border border-red-200 text-red-800">
                {item.text}
              </div>
            );
          case 'table':
            return (
              <div key={idx} className="my-4 overflow-x-auto rounded-xl border border-slate-200 shadow-sm">
                <table className="w-full text-sm">
                  <thead className="bg-gradient-to-r from-slate-100 to-slate-50">
                    <tr>
                      {item.headers.map((h, i) => (
                        <th key={i} className="px-4 py-3 text-left font-semibold text-slate-700 border-b border-slate-200">
                          {h}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {item.rows.map((row, i) => (
                      <tr key={i} className="hover:bg-blue-50/50 transition-colors">
                        {row.map((cell, j) => (
                          <td key={j} className="px-4 py-3 border-b border-slate-100 text-slate-700">
                            {cell}
                          </td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            );
          default:
            return null;
        }
      };

      // 首頁
      const renderHome = () => (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
          <div className="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white px-4 py-6 shadow-lg">
            <div className="flex items-center justify-between mb-4">
              <button onClick={() => setMenuOpen(true)} className="p-2 hover:bg-white/10 rounded-lg transition-colors">
                <Icon name="menu" size={24} />
              </button>
              <h1 className="text-lg font-bold">TSOC Echo 學習</h1>
              <div className="flex items-center gap-1">
                <button onClick={() => setShowAchievements(true)} className="p-2 hover:bg-white/10 rounded-lg transition-colors relative">
                  <span className="text-xl">🏆</span>
                  {progress.unlockedAchievements.length > 0 && (
                    <span className="absolute -top-1 -right-1 w-5 h-5 bg-yellow-400 text-yellow-900 text-xs font-bold rounded-full flex items-center justify-center">
                      {progress.unlockedAchievements.length}
                    </span>
                  )}
                </button>
                <button onClick={() => setShowAbbrModal(true)} className="p-2 hover:bg-white/10 rounded-lg transition-colors">
                  <Icon name="bookmark" size={24} />
                </button>
              </div>
            </div>
            <p className="text-blue-100 text-sm text-center">台灣心臟學會 2025 心臟超音波指南</p>
            
            <div className="mt-4 relative">
              <Icon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={20} />
              <input
                type="text"
                placeholder="搜尋內容或縮寫..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="w-full pl-10 pr-4 py-3 rounded-xl bg-white/95 text-slate-800 placeholder-slate-400 shadow-lg focus:outline-none focus:ring-2 focus:ring-white/50"
              />
            </div>
          </div>

          {searchTerm && (
            <div className="px-4 py-4">
              <h3 className="text-sm font-semibold text-slate-500 mb-3">搜尋結果 ({searchResults.length})</h3>
              {searchResults.length === 0 ? (
                <p className="text-slate-500 text-center py-8">找不到相關內容</p>
              ) : (
                <div className="space-y-2">
                  {searchResults.map((result, idx) => (
                    <button
                      key={idx}
                      onClick={() => {
                        if (result.type === 'abbreviation') {
                          setShowAbbrModal(true);
                        } else {
                          setSelectedCourse(result.course);
                          setSelectedSection(result.sectionIdx);
                          setCurrentView('course');
                        }
                        setSearchTerm('');
                      }}
                      className="w-full text-left p-3 bg-white rounded-xl shadow-sm hover:shadow-md transition-all border border-slate-100"
                    >
                      {result.type === 'abbreviation' ? (
                        <div>
                          <span className="font-mono font-bold text-blue-600">{result.abbr.abbr}</span>
                          <span className="text-slate-600 ml-2">{result.abbr.chinese}</span>
                        </div>
                      ) : (
                        <div>
                          <span className="text-xs text-slate-400">{result.course.title}</span>
                          <p className="font-medium text-slate-800">{result.section.title}</p>
                        </div>
                      )}
                    </button>
                  ))}
                </div>
              )}
            </div>
          )}

          {!searchTerm && (
            <div className="px-4 py-6 space-y-4">
              <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                📚 學習章節
              </h2>
              
              <div className="grid grid-cols-2 gap-2">
                {courses.map((course) => (
                  <button
                    key={course.id}
                    onClick={() => {
                      setSelectedCourse(course);
                      setSelectedSection(0);
                      setCurrentView('course');
                    }}
                    className="bg-white rounded-xl p-3 shadow-sm hover:shadow-lg transition-all border border-slate-100 text-left group"
                  >
                    <div className="flex items-center gap-2">
                      <div
                        className="w-10 h-10 rounded-lg flex items-center justify-center text-lg flex-shrink-0"
                        style={{ backgroundColor: `${course.color}15` }}
                      >
                        {course.icon}
                      </div>
                      <div className="flex-1 min-w-0">
                        <h3 className="font-semibold text-slate-800 group-hover:text-blue-600 transition-colors text-sm truncate">
                          {course.title}
                        </h3>
                        <p className="text-xs text-slate-400 truncate">{course.titleEn}</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-2 mt-2 text-xs text-slate-400">
                      <span>📄 {course.sections.length}</span>
                      {course.quiz && <span>🏆 {course.quiz.length}</span>}
                    </div>
                  </button>
                ))}
              </div>

              {/* Advanced Topics - Links to Subpages */}
              <h2 className="text-lg font-bold text-slate-800 mt-8 mb-4 flex items-center gap-2">
                🎓 進階主題
              </h2>

              <div className="grid grid-cols-2 gap-3">
                {[
                  { href: 'echo-basics.html', icon: '📖', title: '基礎原理', subtitle: 'Ch 00-03', color: '#3B82F6' },
                  { href: 'echo-hemodynamics.html', icon: '💨', title: '舒張功能', subtitle: 'Ch 04', color: '#8B5CF6' },
                  { href: 'echo-cardiomyopathy.html', icon: '💔', title: '心肌病變', subtitle: 'Ch 05-07', color: '#EC4899' },
                  { href: 'echo-ischemic.html', icon: '🩺', title: '缺血性心病', subtitle: 'Ch 08', color: '#EF4444' },
                  { href: 'echo-aortic-valve.html', icon: '🔴', title: '主動脈瓣', subtitle: 'Ch 09-10', color: '#F97316' },
                  { href: 'echo-mitral-valve.html', icon: '🟣', title: '二尖瓣', subtitle: 'Ch 11-12', color: '#A855F7' },
                  { href: 'echo-right-heart.html', icon: '🔵', title: '右心系統', subtitle: 'Ch 13, 16', color: '#06B6D4' },
                  { href: 'echo-prosthetics-endocarditis.html', icon: '⚙️', title: '人工瓣 & 感染', subtitle: 'Ch 14-15', color: '#64748B' },
                  { href: 'echo-aorta-pericardium.html', icon: '🫀', title: '主動脈 & 心包', subtitle: 'Ch 17-18', color: '#14B8A6' },
                  { href: 'echo-masses-chd.html', icon: '🧬', title: '腫塊 & 先天性', subtitle: 'Ch 19-20', color: '#84CC16' },
                ].map((topic) => (
                  <a
                    key={topic.href}
                    href={topic.href}
                    className="bg-white rounded-xl p-3 shadow-sm hover:shadow-lg transition-all border border-slate-100 block group"
                  >
                    <div className="flex items-center gap-3">
                      <div
                        className="w-10 h-10 rounded-lg flex items-center justify-center text-lg"
                        style={{ backgroundColor: `${topic.color}15` }}
                      >
                        {topic.icon}
                      </div>
                      <div className="flex-1 min-w-0">
                        <h3 className="font-semibold text-slate-800 group-hover:text-blue-600 transition-colors text-sm truncate">
                          {topic.title}
                        </h3>
                        <p className="text-xs text-slate-400">{topic.subtitle}</p>
                      </div>
                    </div>
                  </a>
                ))}
              </div>
            </div>
          )}
        </div>
      );

      // 課程詳情
      const renderCourse = () => {
        if (!selectedCourse) return null;
        const section = selectedCourse.sections[selectedSection];

        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
            <div 
              className="sticky top-0 z-10 px-4 py-4 shadow-lg"
              style={{ background: `linear-gradient(135deg, ${selectedCourse.color}, ${selectedCourse.color}dd)` }}
            >
              <div className="flex items-center justify-between text-white">
                <button
                  onClick={() => setCurrentView('home')}
                  className="p-2 hover:bg-white/10 rounded-lg transition-colors flex items-center gap-1"
                >
                  <Icon name="chevron-left" size={20} />
                  <span className="text-sm">返回</span>
                </button>
                <h1 className="font-bold text-lg flex-1 text-center px-2 truncate">{selectedCourse.title}</h1>
                <div className="w-16"></div>
              </div>
            </div>

            <div className="overflow-x-auto bg-white border-b border-slate-100 shadow-sm">
              <div className="flex p-2 gap-2 min-w-max">
                {selectedCourse.sections.map((sec, idx) => (
                  <button
                    key={sec.id}
                    onClick={() => setSelectedSection(idx)}
                    className={`px-4 py-2 rounded-full text-sm whitespace-nowrap transition-all ${
                      selectedSection === idx 
                        ? 'text-white shadow-md' 
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                    style={selectedSection === idx ? { backgroundColor: selectedCourse.color } : {}}
                  >
                    {sec.title.split(' ').slice(0, 2).join(' ')}
                  </button>
                ))}
              </div>
            </div>

            <div className="px-4 py-6">
              <h2 className="text-xl font-bold text-slate-800 mb-4">{section.title}</h2>
              <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                {section.content.map((item, idx) => renderContentItem(item, idx))}
              </div>
            </div>

            <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-3 flex items-center justify-between shadow-lg">
              <button
                onClick={() => setSelectedSection(prev => Math.max(0, prev - 1))}
                disabled={selectedSection === 0}
                className="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-100 text-slate-700 disabled:opacity-50 hover:bg-slate-200 transition-colors"
              >
                <Icon name="chevron-left" size={20} />
                上一節
              </button>
              
              {selectedCourse.quiz && (
                <button
                  onClick={() => startQuiz(selectedCourse)}
                  className="flex items-center gap-2 px-4 py-2 rounded-xl text-white shadow-md hover:shadow-lg transition-all"
                  style={{ backgroundColor: selectedCourse.color }}
                >
                  🏆 測驗
                </button>
              )}
              
              <button
                onClick={() => setSelectedSection(prev => Math.min(selectedCourse.sections.length - 1, prev + 1))}
                disabled={selectedSection === selectedCourse.sections.length - 1}
                className="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-100 text-slate-700 disabled:opacity-50 hover:bg-slate-200 transition-colors"
              >
                下一節
                <Icon name="chevron-right" size={20} />
              </button>
            </div>

            <div className="h-20"></div>
          </div>
        );
      };

      // 測驗頁面
      const renderQuiz = () => {
        if (!selectedCourse || !selectedCourse.quiz) return null;
        const currentQuestion = selectedCourse.quiz[quizIndex];

        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-50 via-purple-50 to-indigo-50">
            <div className="bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-4 py-4 shadow-lg">
              <div className="flex items-center justify-between">
                <button 
                  onClick={() => {
                    setQuizMode(false);
                    setCurrentView('course');
                  }} 
                  className="p-2 hover:bg-white/10 rounded-lg transition-colors"
                >
                  <Icon name="x" size={24} />
                </button>
                <h1 className="font-bold text-lg">{selectedCourse.title} - 測驗</h1>
                <div className="w-10"></div>
              </div>
              
              <div className="mt-4 flex items-center gap-2">
                <div className="flex-1 h-2 bg-white/20 rounded-full overflow-hidden">
                  <div 
                    className="h-full bg-white rounded-full transition-all duration-300"
                    style={{ width: `${((quizIndex + 1) / selectedCourse.quiz.length) * 100}%` }}
                  ></div>
                </div>
                <span className="text-sm text-white/80">{quizIndex + 1}/{selectedCourse.quiz.length}</span>
              </div>
            </div>

            {quizComplete ? (
              <div className="px-4 py-8 text-center">
                <div className="w-24 h-24 mx-auto mb-6 rounded-full bg-gradient-to-br from-purple-500 to-indigo-500 flex items-center justify-center shadow-lg text-4xl">
                  🏆
                </div>
                <h2 className="text-2xl font-bold text-slate-800 mb-2">測驗完成！</h2>
                <p className="text-slate-600 mb-6">
                  你的得分：
                  <span className="text-3xl font-bold text-purple-600 mx-2">{quizScore}</span>
                  / {selectedCourse.quiz.length}
                </p>
                <div className="text-4xl mb-6">
                  {quizScore === selectedCourse.quiz.length ? '🎉 完美！' : 
                   quizScore >= selectedCourse.quiz.length * 0.8 ? '👏 很棒！' :
                   quizScore >= selectedCourse.quiz.length * 0.6 ? '💪 加油！' : '📚 再努力！'}
                </div>
                <div className="space-y-3">
                  <button
                    onClick={restartQuiz}
                    className="w-full py-3 rounded-xl bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-semibold shadow-md hover:shadow-lg transition-all"
                  >
                    🔄 重新測驗
                  </button>
                  <button
                    onClick={() => {
                      setQuizMode(false);
                      setCurrentView('course');
                    }}
                    className="w-full py-3 rounded-xl bg-slate-100 text-slate-700 font-semibold hover:bg-slate-200 transition-colors"
                  >
                    返回課程
                  </button>
                </div>
              </div>
            ) : (
              <div className="px-4 py-6">
                <div className="bg-white rounded-2xl p-6 shadow-lg border border-slate-100 mb-6">
                  <h3 className="text-lg font-bold text-slate-800 mb-6 leading-relaxed">
                    {currentQuestion.q}
                  </h3>
                  <div className="space-y-3">
                    {currentQuestion.options.map((option, idx) => {
                      const isCorrect = idx === currentQuestion.correct;
                      const isSelected = quizAnswer === idx;
                      let buttonStyle = 'bg-slate-50 border-slate-200 text-slate-700';
                      
                      if (quizAnswer !== null) {
                        if (isCorrect) {
                          buttonStyle = 'bg-emerald-50 border-emerald-500 text-emerald-700';
                        } else if (isSelected && !isCorrect) {
                          buttonStyle = 'bg-red-50 border-red-500 text-red-700';
                        }
                      }
                      
                      return (
                        <button
                          key={idx}
                          onClick={() => handleQuizAnswer(idx)}
                          disabled={quizAnswer !== null}
                          className={`w-full p-4 rounded-xl border-2 text-left transition-all ${buttonStyle} ${
                            quizAnswer === null ? 'hover:border-purple-300 hover:bg-purple-50' : ''
                          }`}
                        >
                          <div className="flex items-center gap-3">
                            <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm ${
                              quizAnswer !== null && isCorrect ? 'bg-emerald-500 text-white' :
                              quizAnswer !== null && isSelected && !isCorrect ? 'bg-red-500 text-white' :
                              'bg-slate-200 text-slate-600'
                            }`}>
                              {quizAnswer !== null && isCorrect ? '✓' :
                               quizAnswer !== null && isSelected && !isCorrect ? '✗' :
                               String.fromCharCode(65 + idx)}
                            </div>
                            <span className="font-medium">{option}</span>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {quizAnswer !== null && (
                  <div className="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-2xl p-5 border border-blue-200 mb-6 animate-fade-in">
                    <h4 className="font-bold text-blue-800 mb-2 flex items-center gap-2">
                      💡 解釋
                    </h4>
                    <p className="text-blue-700">{currentQuestion.explanation}</p>
                  </div>
                )}

                {quizAnswer !== null && (
                  <button
                    onClick={nextQuestion}
                    className="w-full py-4 rounded-xl bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-bold shadow-md hover:shadow-lg transition-all"
                  >
                    {quizIndex < selectedCourse.quiz.length - 1 ? '下一題 →' : '查看結果 →'}
                  </button>
                )}
              </div>
            )}
          </div>
        );
      };

      // 側邊選單
      const renderMenu = () => (
        <div className={`fixed inset-0 z-50 transition-all duration-300 ${menuOpen ? 'visible' : 'invisible'}`}>
          <div 
            className={`absolute inset-0 bg-black/50 transition-opacity ${menuOpen ? 'opacity-100' : 'opacity-0'}`}
            onClick={() => setMenuOpen(false)}
          ></div>
          <div className={`absolute left-0 top-0 bottom-0 w-80 bg-white shadow-2xl transition-transform ${menuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
            <div className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-6">
              <div className="flex items-center justify-between mb-4">
                <h2 className="text-xl font-bold">選單</h2>
                <button onClick={() => setMenuOpen(false)} className="p-2 hover:bg-white/10 rounded-lg transition-colors">
                  <Icon name="x" size={24} />
                </button>
              </div>
              <p className="text-blue-100 text-sm">TSOC 心臟超音波指南 2025</p>
            </div>
            
            <div className="p-4 space-y-2">
              <button
                onClick={() => {
                  setCurrentView('home');
                  setMenuOpen(false);
                }}
                className="w-full flex items-center gap-3 p-4 rounded-xl hover:bg-slate-100 transition-colors text-left"
              >
                🏠 <span className="font-medium">首頁</span>
              </button>
              
              <button
                onClick={() => {
                  setShowAbbrModal(true);
                  setMenuOpen(false);
                }}
                className="w-full flex items-center gap-3 p-4 rounded-xl hover:bg-slate-100 transition-colors text-left"
              >
                📖 <span className="font-medium">縮寫對照表</span>
              </button>
              
              <button
                onClick={() => {
                  setSelectedCourse(courseData.normalValues);
                  setSelectedSection(0);
                  setCurrentView('course');
                  setMenuOpen(false);
                }}
                className="w-full flex items-center gap-3 p-4 rounded-xl hover:bg-slate-100 transition-colors text-left"
              >
                📊 <span className="font-medium">正常值參考表</span>
              </button>
            </div>
            
            <div className="p-4 border-t border-slate-100">
              <h3 className="text-sm font-semibold text-slate-500 mb-3">快速跳轉</h3>
              <div className="space-y-1 max-h-64 overflow-y-auto">
                {courses.map(course => (
                  <button
                    key={course.id}
                    onClick={() => {
                      setSelectedCourse(course);
                      setSelectedSection(0);
                      setCurrentView('course');
                      setMenuOpen(false);
                    }}
                    className="w-full flex items-center gap-2 p-3 rounded-lg hover:bg-slate-100 transition-colors text-left text-sm"
                  >
                    <span>{course.icon}</span>
                    <span className="truncate">{course.title}</span>
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      );

      // 縮寫對照表彈窗
      const renderAbbrModal = () => (
        <div className={`fixed inset-0 z-50 transition-all duration-300 ${showAbbrModal ? 'visible' : 'invisible'}`}>
          <div
            className={`absolute inset-0 bg-black/50 transition-opacity ${showAbbrModal ? 'opacity-100' : 'opacity-0'}`}
            onClick={() => setShowAbbrModal(false)}
          ></div>
          <div className={`absolute inset-4 md:inset-10 bg-white rounded-2xl shadow-2xl transition-transform ${showAbbrModal ? 'scale-100' : 'scale-95'} flex flex-col`}>
            <div className="bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-4 rounded-t-2xl flex items-center justify-between">
              <h2 className="font-bold text-lg">📖 縮寫對照表</h2>
              <button onClick={() => setShowAbbrModal(false)} className="p-2 hover:bg-white/10 rounded-lg transition-colors">
                <Icon name="x" size={24} />
              </button>
            </div>
            <div className="flex-1 overflow-y-auto p-4">
              <div className="grid gap-2">
                {abbreviations.map((item, idx) => (
                  <div key={idx} className="flex items-center gap-4 p-3 bg-slate-50 rounded-xl">
                    <span className="font-mono font-bold text-blue-600 w-16 text-sm">{item.abbr}</span>
                    <div className="flex-1">
                      <p className="text-slate-800 text-sm">{item.full}</p>
                      <p className="text-slate-500 text-xs">{item.chinese}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );

      // 成就彈窗
      const renderAchievementsModal = () => (
        <div className={`fixed inset-0 z-50 transition-all duration-300 ${showAchievements ? 'visible' : 'invisible'}`}>
          <div
            className={`absolute inset-0 bg-black/50 transition-opacity ${showAchievements ? 'opacity-100' : 'opacity-0'}`}
            onClick={() => setShowAchievements(false)}
          ></div>
          <div className={`absolute inset-4 md:inset-10 bg-white rounded-2xl shadow-2xl transition-transform ${showAchievements ? 'scale-100' : 'scale-95'} flex flex-col`}>
            <div className="bg-gradient-to-r from-yellow-500 to-orange-500 text-white p-4 rounded-t-2xl flex items-center justify-between">
              <h2 className="font-bold text-lg">🏆 成就系統</h2>
              <button onClick={() => setShowAchievements(false)} className="p-2 hover:bg-white/10 rounded-lg transition-colors">
                <Icon name="x" size={24} />
              </button>
            </div>
            <div className="p-4 bg-gradient-to-r from-yellow-50 to-orange-50 border-b">
              <div className="flex items-center justify-between">
                <div>
                  <p className="text-sm text-slate-600">已解鎖成就</p>
                  <p className="text-2xl font-bold text-orange-600">{progress.unlockedAchievements.length} / {achievementDefinitions.length}</p>
                </div>
                <div className="text-right">
                  <p className="text-sm text-slate-600">學習進度</p>
                  <p className="text-sm text-slate-800">📚 {progress.lessonsCompleted} 章節 | ✏️ {progress.quizzesCompleted} 測驗</p>
                </div>
              </div>
            </div>
            <div className="flex-1 overflow-y-auto p-4">
              <div className="grid gap-3">
                {achievementDefinitions.map((achievement) => {
                  const isUnlocked = progress.unlockedAchievements.includes(achievement.id);
                  return (
                    <div
                      key={achievement.id}
                      className={`flex items-center gap-4 p-4 rounded-xl border-2 transition-all ${
                        isUnlocked
                          ? 'bg-gradient-to-r from-yellow-50 to-orange-50 border-yellow-300'
                          : 'bg-slate-50 border-slate-200 opacity-60'
                      }`}
                    >
                      <div className={`w-14 h-14 rounded-xl flex items-center justify-center text-3xl ${
                        isUnlocked ? 'bg-yellow-100' : 'bg-slate-200 grayscale'
                      }`}>
                        {achievement.icon}
                      </div>
                      <div className="flex-1">
                        <h3 className={`font-bold ${isUnlocked ? 'text-slate-800' : 'text-slate-500'}`}>
                          {achievement.title}
                          {isUnlocked && <span className="ml-2 text-green-500">✓</span>}
                        </h3>
                        <p className="text-sm text-slate-500">{achievement.desc}</p>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );

      // 新成就通知
      const renderNewAchievementPopup = () => (
        newAchievement && (
          <div className="fixed top-4 left-4 right-4 z-50 animate-fade-in">
            <div className="bg-gradient-to-r from-yellow-400 to-orange-400 rounded-2xl p-4 shadow-2xl flex items-center gap-4">
              <div className="w-16 h-16 bg-white rounded-xl flex items-center justify-center text-4xl shadow-lg">
                {newAchievement.icon}
              </div>
              <div className="flex-1 text-white">
                <p className="text-sm font-medium opacity-90">🎉 成就解鎖！</p>
                <h3 className="text-xl font-bold">{newAchievement.title}</h3>
                <p className="text-sm opacity-90">{newAchievement.desc}</p>
              </div>
            </div>
          </div>
        )
      );

      return (
        <div className="font-sans">
          {quizMode ? renderQuiz() :
           currentView === 'course' ? renderCourse() :
           renderHome()}

          {renderMenu()}
          {renderAbbrModal()}
          {renderAchievementsModal()}
          {renderNewAchievementPopup()}
        </div>
      );
    }

    // 渲染應用
    ReactDOM.render(<EchoLearningApp />, document.getElementById('root'));
  </script>
</body>
</html>
