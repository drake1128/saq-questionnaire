<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>從「主動」到「越權」｜學生討好與表現的文化論述與文獻</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1e3a5f; --primary-light:#2d5a87; --accent:#c2410c; --accent-light:#f97316;
  --success:#27ae60; --warning:#f39c12; --bg-cream:#faf8f5; --bg-card:#ffffff;
  --text-dark:#2c3e50; --text-muted:#7f8c8d; --border:#ecf0f1; --shadow:0 4px 20px rgba(0,0,0,.08);
  --hdr1:#1e2a5a; --hdr2:#3b4d8f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg-cream);color:var(--text-dark);line-height:1.78;font-size:16px}
.app{max-width:780px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,var(--hdr1),var(--hdr2));color:#fff;padding:22px 18px 18px}
header h1{margin:0;font-size:20px;font-weight:700}
header .sub{margin:4px 0 0;font-size:13.5px;opacity:.9;font-weight:300;letter-spacing:.3px}
main{padding:16px 14px}
.card{background:var(--bg-card);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 10px;color:var(--primary);font-weight:700}
.card h3{font-size:15px;margin:18px 0 8px;color:var(--primary-light);font-weight:600}
.card h3:first-child{margin-top:0}
p{margin:0 0 10px}
.muted{color:var(--text-muted);font-size:13px}
.takehome{border-left:4px solid var(--accent);background:#fff8f3}
.takehome ol{margin:0;padding-left:20px}
.takehome li{margin-bottom:9px;font-size:15px}
.hero{background:linear-gradient(135deg,#eef1fb,#f7f8fd);border:1px solid #cdd4ee;
  border-radius:14px;padding:18px;text-align:center;margin-bottom:14px}
.hero .big{font-size:30px;font-weight:700;color:var(--hdr1);line-height:1.3;letter-spacing:2px}
.hero .cap{font-size:13.5px;color:var(--text-dark);margin-top:8px}
.hero .src{font-size:12px;color:var(--text-muted);margin-top:8px}
.datum{background:#f4f8fb;border-radius:9px;padding:10px 12px;margin:9px 0;font-size:14px}
.datum b{color:var(--primary)}
.warn{background:#fef7ea;border-left:3px solid var(--warning);border-radius:0 8px 8px 0;
  padding:10px 12px;margin:10px 0;font-size:13.5px}
.warn b{color:#b9770e}
.impl{background:#f0f9f3;border-left:3px solid var(--success);border-radius:0 8px 8px 0;
  padding:10px 12px;margin:10px 0;font-size:13.5px}
.impl b{color:var(--success)}
.quote{border-left:3px solid #cdd4ee;padding:4px 0 4px 12px;margin:10px 0;
  font-size:14px;color:#4a5b6a}
.quote .who{display:block;font-size:12px;color:var(--text-muted);margin-top:2px}
.classic{background:#f7f5ef;border:1px solid #e6e0cf;border-radius:10px;padding:10px 12px;margin:9px 0;font-size:14px}
.classic .zh{font-weight:700;color:#5b4a1f;font-size:15px}
.classic .src{font-size:12px;color:var(--text-muted)}
table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
th,td{border-bottom:1px solid var(--border);padding:8px 5px;text-align:left;vertical-align:top}
th{color:var(--primary);font-weight:600;background:#f7fafc;font-size:12.5px}
td.n{font-weight:700;color:var(--accent);white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll table{min-width:540px}
.bar-row{margin-bottom:11px}
.bar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.bar-top .nm{font-weight:600}
.bar-top .vl{font-weight:700;color:var(--hdr2)}
.bar-track{height:11px;border-radius:99px;background:var(--border);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#8fa0e0,#3b4d8f)}
.bar-note{font-size:11.5px;color:var(--text-muted);margin-top:2px}
.acc{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff}
.acc-head{display:flex;align-items:center;gap:10px;padding:13px 14px;min-height:48px;cursor:pointer;
  font-weight:600;font-size:14.5px}
.flag{flex:0 0 auto;font-size:13px;font-weight:700;background:var(--primary);color:#fff;
  border-radius:7px;padding:2px 8px}
.acc-arrow{margin-left:auto;color:var(--text-muted);font-size:12px;transition:transform .2s}
.acc-arrow.open{transform:rotate(90deg)}
.acc-body{padding:12px 14px 14px;font-size:14px;border-top:1px solid var(--border)}
.acc-body ul{margin:8px 0;padding-left:19px}
.acc-body li{margin-bottom:5px}
.ref{font-size:13.2px;margin-bottom:11px;padding-bottom:11px;border-bottom:1px dashed var(--border)}
.ref:last-child{border-bottom:none}
.ref .t{font-weight:600;color:var(--text-dark)}
.ref .j{color:var(--text-muted);font-size:12.5px}
.ref a{color:var(--primary-light);word-break:break-all;font-size:12.5px}
.pill{display:inline-block;background:#eef3f8;color:var(--primary-light);border-radius:99px;
  padding:2px 9px;font-size:11.5px;font-weight:600;margin-right:6px;margin-bottom:4px}
.pill.red{background:#fdeeec;color:#c0392b}
.pill.grn{background:#eff9f3;color:var(--success)}
.pill.org{background:#fff3e8;color:var(--accent)}
/* cover + module */
.cover{display:block;position:relative;border-radius:14px;overflow:hidden;background:#111;margin-bottom:12px;text-decoration:none;box-shadow:var(--shadow)}
.cover img{display:block;width:100%;height:460px;object-fit:contain;background:#111}
@media (max-width:520px){.cover img{height:auto;max-height:70vh}}
.cover .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.cover .play span{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--hdr1);font-size:26px;display:flex;align-items:center;justify-content:center;padding-left:5px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.cover .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 11px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:13px;line-height:1.5}
.cover .cap b{font-size:14.5px;display:block}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.meta div{background:#f4f8fb;border-radius:9px;padding:8px 10px;font-size:13px}
.meta div b{display:block;color:var(--primary);font-size:11.5px;font-weight:700;letter-spacing:.5px}
.loop{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0}
.loop .st{border-radius:12px;padding:12px 13px;border:1.5px solid var(--border);background:#fff;position:relative}
.loop .st .k{font-size:26px;font-weight:700;line-height:1;display:inline-block;width:44px;height:44px;border-radius:12px;color:#fff;text-align:center;line-height:44px;margin-right:10px;vertical-align:middle}
.loop .st .h{font-weight:700;color:var(--primary);vertical-align:middle;font-size:15px}
.loop .st p{margin:8px 0 0;font-size:13.8px}
.loop .st ul{margin:6px 0 0;padding-left:19px;font-size:13.5px}
.loop .st li{margin-bottom:3px}
.k1{background:#2d5a87}.k2{background:#3b4d8f}.k3{background:#27ae60}
.tl{border-left:3px solid #cdd4ee;margin:8px 0 8px 6px;padding-left:12px}
.tl .it{position:relative;margin-bottom:10px;font-size:13.8px}
.tl .it::before{content:"";position:absolute;left:-18px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--hdr2)}
.tl .it b{color:var(--primary)}
.tl .it .m{font-size:11.5px;color:var(--text-muted);font-weight:700;margin-right:6px}
.chk{border:1.5px solid var(--border);border-radius:12px;padding:12px 13px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:#fff}
.chk.on{border-color:var(--success);background:#f0f9f3}
.chk .bx{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;margin-top:2px}
.chk.on .bx{background:var(--success);border-color:var(--success)}
.chk .tx{font-size:14px}
.chk .tx i{display:block;font-style:normal;font-size:12.5px;color:var(--text-muted)}
.mcq{border:1.5px solid var(--border);border-radius:12px;padding:13px;margin-bottom:10px;background:#fff}
.mcq .q{font-weight:500;font-size:14.5px;margin-bottom:8px}
.mcq .o{display:block;width:100%;text-align:left;border:1.5px solid var(--border);border-radius:10px;background:#fff;padding:9px 11px;margin-bottom:6px;font-family:inherit;font-size:13.8px;cursor:pointer;color:var(--text-dark)}
.mcq .o.ok{border-color:var(--success);background:#eff9f3}
.mcq .o.no{border-color:#e74c3c;background:#fdeeec}
.card-title-img{width:100%;border-radius:10px;margin-bottom:10px}
/* slope */
.slope{border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px;background:#fff}
.step{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid var(--border);cursor:pointer;align-items:flex-start}
.step:last-child{border-bottom:none}
.step .no{flex:0 0 26px;height:26px;border-radius:50%;background:#eef1fb;color:var(--hdr2);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.step .ln{flex:1;font-size:14px}
.step .ln i{display:block;color:var(--text-muted);font-style:normal;font-size:12.5px}
.step.over{background:#fff3e8}
.step.over .no{background:var(--accent);color:#fff}
.step.picked{outline:2px solid var(--hdr2);outline-offset:-2px}
.lvl{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-top:4px}
.lvl.l0{background:#eff9f3;color:var(--success)}
.lvl.l1{background:#eef3f8;color:var(--primary-light)}
.lvl.l2{background:#fef7ea;color:#b9770e}
.lvl.l3{background:#fdeeec;color:#c0392b}
.lvl.l4{background:#3b1f2b;color:#fff}
.sc{border:1.5px solid var(--border);border-radius:12px;padding:13px;margin-bottom:10px;background:#fff}
.sc-q{font-size:14.5px;font-weight:500;margin-bottom:10px}
.sc-btns{display:flex;gap:8px;flex-wrap:wrap}
.sc-btn{flex:1;min-width:90px;min-height:48px;border:1.5px solid var(--border);border-radius:10px;background:#fff;
  font-family:inherit;font-size:13.5px;font-weight:600;color:var(--text-muted);cursor:pointer}
.sc-btn.pick{border-color:var(--hdr2);background:#eef1fb;color:var(--hdr2)}
.sc-ans{margin-top:11px;padding:11px;border-radius:10px;font-size:13.8px;background:#f4f8fb;border:1px solid #d8e2ee}
.sc-ans .lab{font-weight:700;margin-bottom:4px;color:var(--primary)}
.swap{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px}
.swap .bad{background:#fff3e8;padding:10px 12px;font-size:14px}
.swap .good{background:#eff9f3;padding:10px 12px;font-size:14px;border-top:1px solid var(--border)}
.swap .tagx{font-size:11.5px;font-weight:700;color:var(--accent);display:block;margin-bottom:2px}
.swap .tago{font-size:11.5px;font-weight:700;color:var(--success);display:block;margin-bottom:2px}
.btn{width:100%;min-height:50px;border:none;border-radius:12px;background:var(--primary);color:#fff;
  font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;padding:12px}
.btn.ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20;box-shadow:0 -2px 14px rgba(0,0,0,.06)}
nav button{flex:1;min-height:60px;border:none;background:none;font-family:inherit;font-size:11px;
  font-weight:600;color:var(--text-muted);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;padding:6px 2px}
nav button.on{color:var(--hdr2)}
nav .dot{width:20px;height:20px;border-radius:7px;background:currentColor;opacity:.18}
nav button.on .dot{opacity:1}
footer{padding:20px 16px 30px;text-align:center;font-size:12px;color:var(--text-muted);line-height:1.9}
footer .sig{color:var(--text-dark);font-weight:600;font-size:13px}
@media print{nav,.btn{display:none!important}body{background:#fff}
  .card{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}}

/* Share */
.sharefab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:30;width:54px;height:54px;border-radius:50%;border:2px solid #cdd4ee;background:linear-gradient(135deg,var(--hdr1),var(--hdr2));color:#fff;font-size:22px;cursor:pointer;box-shadow:0 6px 20px rgba(30,42,90,.35);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.sharefab:hover{transform:translateY(-2px)}
.shovl{position:fixed;inset:0;z-index:200;background:rgba(20,28,60,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px}
.shovl.on{display:flex}
.shbox{background:#fff;border-radius:16px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.shhead{background:linear-gradient(135deg,var(--hdr1),var(--hdr2));color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.shhead b{font-size:16px}
.shhead button{background:none;border:0;color:#fff;font-size:26px;line-height:1;cursor:pointer;padding:0 4px}
.shbody{padding:16px 20px 20px}
.shbody p{margin:0 0 12px;font-size:13.5px;color:var(--text-muted)}
.qrwrap{text-align:center;background:#faf8f5;border-radius:12px;padding:12px;margin-bottom:10px}
.qrwrap img{width:150px;height:150px;border-radius:8px}
.qrwrap small{display:block;color:var(--text-muted);font-size:12px;margin-top:6px}
.shbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:8px 0;padding:12px 16px;border:1px solid var(--border);border-radius:11px;background:#faf8f5;color:var(--text-dark);font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;transition:border-color .15s,background .15s}
.shbtn:hover,.shbtn.ok{border-color:#cdd4ee;background:#eef1fb}
.shbtn .ic{font-size:19px;flex-shrink:0;width:24px;text-align:center}
.shbtn small{display:block;font-weight:400;font-size:12px;color:var(--text-muted);margin-top:1px}
@media print{.sharefab,.shovl{display:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

/* ========== 影片逐句：主動 → 越權 的滑坡 ==========
   level: 0 準備(合宜) 1 預判(合宜但需回報) 2 代勞(灰色) 3 越權(違規) 4 僭越(荒謬化) */
const STEPS = [
  {q:"The patient's ready for surgery, sir. He's in position, monitors are connected, meds are drawn up.",
   zh:"病人就位、監視器接好、藥抽好了。", l:1,
   e:"術前準備是實習生可以參與的工作，但「藥抽好了」在多數機構屬於麻醉團隊授權範圍，且應有雙重核對。合宜的版本是：<b>做完後回報並請主治確認</b>，而不是宣告「ready」。"},
  {q:"Did you already intubate? — Oh, Mallampati class 1. I thought I'd save you the trouble.",
   zh:"Mallampati 第一級，我想幫您省點麻煩，已經插好管了。", l:3,
   e:"<b>全片的分水嶺。</b>氣道評估（預測好不好插）與執行資格（誰可以插）是兩件事。未經授權的侵入性處置＝越權，與「主動」無關。ten Cate 的 entrustment 架構把這條線講得很清楚：<b>信任是被授予的，不是自己宣告的</b>。"},
  {q:"I also contacted every breakfast establishment in a three mile radius and put him on a no-serve list.",
   zh:"我還聯絡了方圓三英里的早餐店，把病人列入拒售名單。", l:4,
   e:"NPO 是正確的關注點，但把「確認禁食」升級成「控制環境」是荒謬化的僭越——它同時揭露了討好行為的本質：<b>用可見的努力量取代判斷</b>。"},
  {q:"Is that a new chair? — Yes, I got it from the charge nurse. I complimented his bouffant.",
   zh:"椅子是護理長的，我稱讚了他的髮帽。", l:2,
   e:"以社交手腕取得資源給老師——這是 Goffman 意義下最典型的 impression management，也是華人職場「會做人」的典型畫面。<b>不違規，但把老師的舒適置於團隊關係之上</b>，並讓護理長承擔了成本。"},
  {q:"I attached a sound dampening panel to the drape to cut down on unnecessary surgeon noise.",
   zh:"我在鋪單上加了隔音板，減少外科醫師的噪音。", l:3,
   e:"擅自改動無菌區。主治的反應（「這正是醫療需要的創新」）是整段最值得討論的一句：<b>老師的讚賞把違規行為正增強了</b>——Mackin 與 Watling（Acad Med 2026）指出，學習者會不斷解讀老師釋出的訊號來調整行為。"},
  {q:"（主治睡著）— Shh. Everything's fine. Surgery's done.",
   zh:"您睡著的時候手術做完了。", l:4,
   e:"監督者缺席、學生獨自完成全程——喜劇把「主治沒在看」推到極端，但這正是 Kennedy 2005 討論的「progressive independence」在缺乏監督結構時會出現的樣子。<b>問題不只是學生越權，也是指導者放任。</b>"},
  {q:"Your phone is fully charged. I added a few investments to your portfolio while you were out.",
   zh:"手機充飽了，順便幫您加了幾筆投資。", l:4,
   e:"從臨床越權滑到私人領域——這是編劇對「討好」的最後一擊：<b>當學生的目標從「把病人照顧好」變成「讓老師開心」，界線就不存在了。</b>"},
  {q:"Now, can I interest you in the daily wordle? — Absolutely, you can.",
   zh:"要不要玩今天的 wordle？— 當然好。", l:2,
   e:"收尾：師生關係被重新定義成「服侍—享受」。主治全程沒有一句糾正。<b>影片本身不做價值判斷，這是它作為教材的優點，也是風險。</b>"},
];
const LVL = ["準備","預判","代勞","越權","僭越"];

/* ========== 文化論述 ========== */
const CULTURES = [
  {f:"儒家", t:"兩條互相拉扯的傳統：「勤」與「守分」", body:<>
    <p>華人文化對「好學生」的期待其實是<b>兩套並存、彼此緊張的論述</b>。第一套獎勵主動、勤快與「有眼力」；第二套嚴格要求角色界線。影片裡的學生把第一套推到極端，同時把第二套完全丟掉。</p>
    <h3>獎勵主動的一面</h3>
    <div className="classic"><span className="zh">「察言而觀色，慮以下人。」</span><br/>

    <p>英語世界的醫學生俚語有專門的詞：<b>gunner</b>（過度競爭、搶答、搶 procedure、不惜踩同儕的學生）與 <b>brown-noser / suck-up</b>（討好老師）。影片的標題「How to ace your rotation」正是對這套文化的反諷。</p>
    <div className="datum">Kilby（AMA J Ethics／Virtual Mentor 2014）〈Advising the "gunner"〉把 gunner 定義為<b>非認知面向的學習困難</b>——不是不夠聰明，而是把「被看見」置於「學會」之上，需要輔導而非讚賞。</div>
    <p>Hafferty（Acad Med 1998）的經典論點在此適用：學生學到的不是我們教的（formal curriculum），而是<b>被獎賞的（hidden curriculum）</b>。他建議檢視機構的四個面向：政策、<b>評量活動</b>、資源分配、以及機構的「俚語」——gunner 這個詞本身就是隱性課程的證據。</p>
    <p>McGaghie（Acad Med 2018）指出，臨床教育長期依賴主觀評量，造成 <b>evaluation apprehension</b>，而 impression management 正是它的產物——「從古代到中世紀到現在都有紀錄」。他認為 CBME 與 mastery learning 會逐步降低這種動機。</p>

  </>},
  {f:"跨文化", t:"Hofstede 權力距離：數字與實證", body:<>
    <p>Hofstede 的<b>權力距離指數（PDI）</b>描述一個社會中位階較低者接受並預期權力不平等的程度。醫學教育文獻常用它解釋為何亞洲學生較少發問、較少求助、較少反駁。</p>
    <div className="scroll"><table>
      <thead><tr><th>國家／地區</th><th>PDI</th><th>臨床教育文獻中的觀察</th></tr></thead>
      <tbody>
        <tr><td>馬來西亞</td><td className="n">100</td><td>Shilkofski 2016：從「被動」轉「主動」學習是最大的文化落差</td></tr>
        <tr><td>中國</td><td className="n">80</td><td>Xing 2026：師生權力距離愈高，校園連結感愈低</td></tr>
        <tr><td>印尼</td><td className="n">78</td><td>Sari 2023／Felaza 2023：回饋對話中學生扮演從屬角色</td></tr>
        <tr><td>台灣</td><td className="n">58</td><td>Ho 2012：多一條「聽學長姐的」未明說原則；Wu 2025：階層與怕被批評抑制 speaking up</td></tr>
        <tr><td>日本</td><td className="n">54</td><td>Suzuki 2025：怕顯得僭越、尊重權威</td></tr>
        <tr><td>美國</td><td className="n">40</td><td>Appelbaum 2025：已發展出 PPDS 量表測量學生感知的權力距離</td></tr>
        <tr><td>英國</td><td className="n">35</td><td>Gupta 2025：即便如此，學生仍「展演出興趣與投入的外表」</td></tr>
      </tbody>
    </table></div>
    <p className="muted">PDI 為 Hofstede Insights 公開數值，量級參考用；各國內部差異（世代、科別、醫院）常大於國家間差異。</p>
    <div className="datum">Frambach 等（Med Educ 2012）比較香港、中東與荷蘭三所醫學院的 PBL：<b>「階層」是亞洲學生自主學習的主要文化障礙</b>，「成就」壓力則同時影響兩組非西方學生。</div>
    <div className="datum">Appelbaum 等（J Interprof Care 2019，243 位醫學與護理學生）：權力距離對團隊效能的影響，經由<b>心理安全感與團隊凝聚力</b>中介。權力距離本身不是命運，心理安全感是可介入的變項。</div>
    <div className="impl"><b>重要的反例：</b>Gupta 等（Med Teach 2025）在英國做了 120 小時病房民族誌，發現即使在低 PDI 的英國，學生仍然「<b>展演出符合社會規範的興趣與投入外表</b>」，並把「留下好的第一印象」當作預防人際衝突的手段。<b>討好不是亞洲特產，是所有高風險評量環境的產物；文化只是決定它長什麼樣子。</b></div>
  </>},

              <li style={{marginBottom:8}}>「討好行為」本身沒有介入研究；教師端語言替換的建議是基於 Mackin & Watling 2026 與 Watling 2014 的機轉推論。</li>
              <li>影片為喜劇，角色與情節皆為虛構；本頁對台詞的層級標註是教學用判準，不是對創作者的評價。</li>
            </ul>
          </div>
        </>}

      </main>

<script>
var SH_CANON="https://drake1128.github.io/saq-questionnaire/proactive-to-overstepping-app.html";

var SH_TITLE="從「主動」到「越權」｜學生討好與表現的文化論述與文獻";
var SH_TEXT="「聽・看・聽」教學模組——做對病人安全的事，不是取悅你的 VS。以一支麻醉科輪訓喜劇短片為教材：逐句標註主動→越權的滑坡、儒家／日本／英美對「討好老師」的文化論述、印象管理與求助行為的文獻、情境判斷與教師端語言替換。";

document.getElementById("shMail").href="mailto:?subject="+encodeURIComponent(SH_TITLE)+"&body="+encodeURIComponent(SH_TEXT+"\n\n"+SH_PAGE);
document.getElementById("shQr").src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data="+encodeURIComponent(SH_PAGE);

function shClose(){document.getElementById("shovl").classList.remove("on");}

function shNativeGo(){navigator.share({title:SH_TITLE,text:SH_TEXT,url:SH_PAGE}).catch(function(){});}
function shCopy(url,id){
  var b=document.getElementById(id), sp=b.querySelector("span:last-child");
  var done=function(){var o=sp.innerHTML; b.classList.add("ok"); sp.innerHTML="已複製到剪貼簿 ✓"; setTimeout(function(){sp.innerHTML=o;b.classList.remove("ok");},1800);};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(url).then(done).catch(function(){shFallback(url,done);});}
  else{shFallback(url,done);}
}
function shFallback(url,done){
  var t=document.createElement("textarea"); t.value=url; t.style.position="fixed"; t.style.opacity="0";
  document.body.appendChild(t); t.select();
  try{document.execCommand("copy");done();}catch(e){prompt("請複製此連結：",url);}
  document.body.removeChild(t);
}
</script>
