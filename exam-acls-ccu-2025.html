<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCU 教育訓練評核 2026 年 2 月 27 日 | ACLS 急救藥物與呼吸道處置</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #273549;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --accent-orange: #f97316;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #334155;
        }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
        }

        #root {
            min-height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        /* Share Button Styles */
        .share-button { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .share-toggle { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #3B82F6 0%, #60A5FA 100%); border: none; color: white; font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; }
        .share-toggle:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5); }
        .share-menu { position: absolute; top: 60px; right: 0; background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); padding: 20px; min-width: 280px; display: none; animation: fadeInShare 0.3s ease; }
        .share-menu.active { display: block; }
        @keyframes fadeInShare { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .share-menu h4 { color: #1e293b; margin: 0 0 15px 0; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
        .qr-container { background: #f8fafc; border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 15px; }
        .qr-container img { max-width: 150px; height: auto; border-radius: 8px; }
        .qr-container p { font-size: 0.75rem; color: #64748b; margin: 8px 0 0 0; }
        .share-buttons { display: flex; flex-direction: column; gap: 10px; }
        .share-btn { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; border: none; cursor: pointer; width: 100%; }
        .share-btn.line { background: #06C755; color: white; }
        .share-btn.email { background: #3b82f6; color: white; }
        .share-btn.copy { background: #f1f5f9; color: #334155; }
        .share-btn:hover { transform: translateY(-1px); opacity: 0.9; }
    </style>
</head>
<body>
    <!-- Share Button -->
    <div class="share-button">
        <button class="share-toggle" onclick="toggleShareMenu()" title="分享">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        </button>
        <div class="share-menu" id="shareMenu">
            <h4>📤 分享此頁面</h4>
            <div class="qr-container">
                <img id="qrCode" src="" alt="QR Code" width="150" height="150">
                <p>掃描 QR Code 開啟頁面</p>
            </div>
            <div class="share-buttons">
                <a id="lineShare" class="share-btn line" href="#" target="_blank" rel="noopener noreferrer">💬 LINE 分享</a>
                <a id="emailShare" class="share-btn email" href="#">📧 Email 分享</a>
                <button class="share-btn copy" onclick="copyPageUrl()">📋 複製連結</button>
            </div>
        </div>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ========== 50 Quiz Questions ==========
        const quizQuestions = [

            {

                    "2mg/1ml/Amp",

            {
                id: 2,

                explanation: "成人心臟停止劑量為 1mg/3~5 分鐘 IVP。小兒劑量為 0.2mg/kg。"

            {

                explanation: "Norepinephrine 必須經由 CVC 給藥，避免周邊滲漏造成組織壞死。且不可與 NTG (Nitroglycerin) 同一管路。"

                explanation: "Atropine 最大總劑量為 3mg。超過此劑量不建議再給予，因副作用（如心搏過速、瞳孔散大）會增加。"

            {

        // Quiz Component
        const Quiz = ({ onComplete }) => {
            const [currentQ, setCurrentQ] = useState(0);
            const [selected, setSelected] = useState(null);
            const [showExplanation, setShowExplanation] = useState(false);
            const [score, setScore] = useState(0);
            const [finished, setFinished] = useState(false);
            const [answers, setAnswers] = useState([]);

            const handleSelect = (idx) => {
                if (showExplanation) return;
                setSelected(idx);
                setShowExplanation(true);
                const isCorrect = idx === quizQuestions[currentQ].correct;
                if (isCorrect) setScore(s => s + 1);
                setAnswers([...answers, { q: currentQ, selected: idx, correct: isCorrect }]);
            };

            const handleNext = () => {
                if (currentQ < quizQuestions.length - 1) {
                    setCurrentQ(currentQ + 1);
                    setSelected(null);
                    setShowExplanation(false);
                } else {
                    setFinished(true);
                    const finalScore = Math.round((score / quizQuestions.length) * 100);
                    localStorage.setItem('exam-acls-ccu-score', finalScore);
                    onComplete(finalScore);

                    if (window.AchievementTracker) {
                        window.AchievementTracker.trackQuizComplete('exam-acls-ccu', finalScore);
                    }
                }
            };

            const handleRestart = () => {
                setCurrentQ(0);
                setSelected(null);
                setShowExplanation(false);
                setScore(0);
                setFinished(false);
                setAnswers([]);
            };

            if (finished) {
                const percentage = Math.round((score / quizQuestions.length) * 100);
                let icon, message;
                if (percentage >= 90) {
                    icon = "\uD83C\uDF89"; message = "太棒了！你對 ACLS 急救藥物與呼吸道處置有很好的掌握！";
                } else if (percentage >= 80) {
                    icon = "\uD83D\uDC4D"; message = "很好！大部分重點已掌握，再加強少數不熟的部分。";
                } else if (percentage >= 60) {
                    icon = "\uD83D\uDCDA"; message = "建議複習教學內容，特別是答錯的題目。";
                } else {
                    icon = "\uD83D\uDCDD"; message = "建議重新閱讀教學內容，務必熟記急救藥物劑量與注意事項！";
                }

                return (
                    <div className="quiz-container">
                        <div className="result-container">
                            <div className="result-icon">{icon}</div>
                            <div className="result-title">測驗完成！</div>
                            <div className="result-score">{percentage}%</div>
                            <div className="result-message">{message}</div>
                            <div className="result-details">
                                <div className="result-stat">
                                    <div className="result-stat-value correct-val">{score}</div>
                                    <div className="result-stat-label">答對</div>
                                </div>
                                <div className="result-stat">
                                    <div className="result-stat-value incorrect-val">{quizQuestions.length - score}</div>
                                    <div className="result-stat-label">答錯</div>
                                </div>
                            </div>
                            <button className="quiz-btn primary" onClick={handleRestart}>
                                重新測驗
                            </button>
                        </div>
                    </div>
                );
            }

            const q = quizQuestions[currentQ];
            const progress = Math.round(((currentQ + 1) / quizQuestions.length) * 100);

            return (
                <div>
                    <div className="progress-container">
                        <div className="progress-header">
                            <span className="progress-title">測驗進度</span>
                            <span className="progress-percentage">{currentQ + 1} / {quizQuestions.length}</span>
                        </div>
                        <div className="progress-bar">
                            <div className="progress-fill" style={{ width: `${progress}%` }}></div>
                        </div>
                    </div>

                    <div className="quiz-container fade-in">
                        <div className="quiz-header">
                            <span className="quiz-progress">第 {currentQ + 1} 題</span>
                            <span className="quiz-progress">目前得分：{score}</span>
                        </div>
                        <div className="quiz-question">{q.question}</div>
                        <div className="quiz-options">
                            {q.options.map((opt, idx) => {
                                let className = "quiz-option";
                                if (showExplanation) {
                                    className += " disabled";
                                    if (idx === q.correct) className += " correct";
                                    else if (idx === selected) className += " incorrect";
                                } else if (idx === selected) {
                                    className += " selected";
                                }
                                return (
                                    <button key={idx} className={className} onClick={() => handleSelect(idx)}>
                                        {String.fromCharCode(65 + idx)}. {opt}
                                    </button>
                                );
                            })}
                        </div>
                        {showExplanation && (
                            <div className="quiz-explanation">
                                <div className="quiz-explanation-title">&#x1F4A1; 解析</div>
                                <div className="quiz-explanation-text">{q.explanation}</div>
                            </div>
                        )}
                        {showExplanation && (
                            <button className="quiz-btn primary" onClick={handleNext}>
                                {currentQ < quizQuestions.length - 1 ? '下一題' : '完成測驗'}
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {

                setOpenSections(prev => ({ ...prev, [idx]: !prev[idx] }));

            return (
                <div className="app-container">

                    <a href="index.html" className="back-link">&#x2190; 返回首頁</a>

                    <header className="header">

                        <h1>ACLS 急救藥物與呼吸道處置</h1>
                        <p>CCU 教育訓練評核</p>
                        <div className="date-badge">2026 年 2 月 27 日</div>
                    </header>

                    <div className="tabs">
                        <button
                            className={`tab ${activeTab === 'teaching' ? 'active' : ''}`}
                            onClick={() => setActiveTab('teaching')}
                        >
                            &#x1F4DA; 教學內容
                        </button>
                        <button
                            className={`tab ${activeTab === 'quiz' ? 'active' : ''}`}
                            onClick={() => setActiveTab('quiz')}
                        >
                            &#x270D;&#xFE0F; 測驗 ({quizScore !== null ? `${quizScore}%` : '未完成'})
                        </button>
                    </div>

                    {activeTab === 'teaching' && (
                        <div className="fade-in">
                            {teachingContent.map((section, idx) => (
                                <TeachingSection
                                    key={idx}
                                    data={section}
                                    isOpen={openSections[idx] || false}
                                    onToggle={() => toggleSection(idx)}
                                />
                            ))}
                        </div>
                    )}

                    {activeTab === 'quiz' && (
                        <Quiz onComplete={setQuizScore} />
                    )}

                    <footer className="footer">
                        <p>CCU 教育訓練 | ACLS 情況演練 — 急救藥物使用與注意事項、呼吸道及呼吸動力處置</p>
                        <p>新竹台大分院 | 2026.02.27</p>
                    </footer>

            const emailShare = document.getElementById('emailShare');

                const emailSubject = encodeURIComponent(`分享：${pageTitle}`);
                const emailBody = encodeURIComponent(`我想和您分享這個頁面：\n\n${pageTitle}\n\n${pageUrl}`);
                emailShare.href = `mailto:?subject=${emailSubject}&body=${emailBody}`;
            }
        }
        function toggleShareMenu() {
            const menu = document.getElementById('shareMenu');
            if (menu) menu.classList.toggle('active');
        }
        function copyPageUrl() {
            const pageUrl = window.location.href;
            navigator.clipboard.writeText(pageUrl).then(() => {
                alert('連結已複製到剪貼簿！');
            }).catch(() => {
                const textArea = document.createElement('textarea');
                textArea.value = pageUrl;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('連結已複製到剪貼簿！');
            });
        }
        document.addEventListener('click', function(event) {
            const shareButton = document.querySelector('.share-button');
            const shareMenu = document.getElementById('shareMenu');
            if (shareButton && shareMenu && !shareButton.contains(event.target) && shareMenu.classList.contains('active')) {
                shareMenu.classList.remove('active');
            }
        });
        document.addEventListener('DOMContentLoaded', initShareButtons);
    </script>

    <script src="achievements-config.js"></script>
    <script src="achievements.js"></script>
</body>
