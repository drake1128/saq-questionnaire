<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#14B8A6">
  <meta name="description" content="Echo 判讀流程：以一份真實 ISCV 心臟超音波報告為例的七站判讀法，從還原 BSA 到找出數字矛盾點，附互動計算器與自我測驗。">
  <title>Echo 判讀流程 — 從 ISCV 報告數字到臨床敘事</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-primary:#080d16;
      --bg-secondary:#0f172a;
      --accent:#14B8A6;
      --accent-2:#06B6D4;
      --accent-soft:rgba(20,184,166,.14);
      --line:rgba(148,163,184,.18);
      --txt:#e2e8f0;
      --txt-dim:#94a3b8;
    }
    *{font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
    .mono{font-family:'SF Mono','Consolas','Menlo',monospace;font-variant-numeric:tabular-nums;}
    html{scroll-behavior:smooth;}
    body{
      margin:0;padding:0;background:var(--bg-primary);color:var(--txt);
      background-image:
        radial-gradient(ellipse at 15% -5%, rgba(20,184,166,.10) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 5%, rgba(6,182,212,.08) 0%, transparent 50%);
      background-attachment:fixed;
      -webkit-font-smoothing:antialiased;
    }
    #root{min-height:100vh;padding-bottom:env(safe-area-inset-bottom);}

    /* ---------- layout ---------- */
    .wrap{max-width:960px;margin:0 auto;padding:0 14px;}
    .card{
      background:rgba(255,255,255,.035);border:1px solid var(--line);
      border-radius:16px;padding:18px;margin-bottom:16px;
      backdrop-filter:blur(8px);
    }
    .card-tight{padding:14px;}
    .hd{
      background:linear-gradient(135deg,#0f766e 0%,#0891b2 100%);
      padding:18px 16px calc(18px + env(safe-area-inset-top)) 16px;
      box-shadow:0 6px 28px rgba(13,148,136,.35);
      position:relative;overflow:hidden;
    }
    .hd::after{
      content:'';position:absolute;inset:0;
      background:radial-gradient(circle at 88% 12%, rgba(255,255,255,.16) 0%, transparent 42%);
      pointer-events:none;
    }
    .navbar{
      display:flex;overflow-x:auto;gap:8px;padding:10px 14px;
      background:rgba(8,13,22,.92);backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
      position:sticky;top:0;z-index:90;
      -webkit-overflow-scrolling:touch;scrollbar-width:none;
    }
    .navbar::-webkit-scrollbar{display:none;}
    .navtab{
      flex-shrink:0;padding:9px 15px;border-radius:22px;border:1px solid var(--line);
      background:rgba(255,255,255,.04);color:var(--txt-dim);
      font-size:.83rem;font-weight:500;white-space:nowrap;cursor:pointer;
      transition:all .22s ease;min-height:40px;
    }
    .navtab:hover{color:#fff;border-color:rgba(20,184,166,.5);}
    .navtab.on{
      background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);
      color:#04211f;font-weight:700;border-color:transparent;
      box-shadow:0 4px 16px rgba(20,184,166,.34);
    }

    /* ---------- typography ---------- */
    h2.sec{font-size:1.12rem;font-weight:700;color:#5eead4;margin:0 0 4px;}
    .sec-en{font-size:.72rem;color:var(--txt-dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px;}
    .lead{font-size:.93rem;line-height:1.85;color:#cbd5e1;}
    .dim{color:var(--txt-dim);}
    .kbd{
      display:inline-block;padding:1px 7px;border-radius:6px;
      background:rgba(20,184,166,.16);color:#5eead4;
      font-size:.82em;font-weight:600;
    }

    /* ---------- step ---------- */
    .step-head{
      display:flex;align-items:center;gap:12px;cursor:pointer;
      user-select:none;min-height:48px;
    }
    .step-num{
      flex-shrink:0;width:40px;height:40px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      font-weight:700;font-size:1rem;
      background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);
      color:#04211f;
    }
    .step-num.done{background:linear-gradient(135deg,#22c55e 0%,#16a34a 100%);color:#04210f;}
    .chev{transition:transform .25s ease;color:var(--txt-dim);flex-shrink:0;}
    .chev.open{transform:rotate(90deg);}
    .step-body{animation:fade .28s ease;}
    @keyframes fade{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}

    /* ---------- boxes ---------- */
    .box{border-radius:12px;padding:13px 15px;margin:11px 0;font-size:.88rem;line-height:1.8;}
    .box-t{font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:6px;font-size:.88rem;}
    .b-info{background:rgba(56,189,248,.09);border:1px solid rgba(56,189,248,.4);}
    .b-info .box-t{color:#7dd3fc;}
    .b-ok{background:rgba(34,197,94,.09);border:1px solid rgba(34,197,94,.4);}
    .b-ok .box-t{color:#86efac;}
    .b-warn{background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.45);}
    .b-warn .box-t{color:#fcd34d;}
    .b-bad{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.45);}
    .b-bad .box-t{color:#fca5a5;}
    .b-key{background:linear-gradient(135deg,rgba(20,184,166,.13) 0%,rgba(6,182,212,.10) 100%);border:1px solid rgba(20,184,166,.5);}
    .b-key .box-t{color:#5eead4;}

    /* ---------- formula ---------- */
    .formula{
      background:rgba(2,6,23,.7);border:1px solid rgba(20,184,166,.3);
      border-left:3px solid var(--accent);border-radius:10px;
      padding:12px 14px;margin:11px 0;overflow-x:auto;
      font-size:.86rem;line-height:2;color:#a5f3fc;
    }

    /* ---------- table ---------- */
    .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0;
        border:1px solid var(--line);border-radius:12px;}
    table.t{width:100%;border-collapse:collapse;font-size:.82rem;min-width:400px;}
    table.t th{
      background:rgba(20,184,166,.16);color:#5eead4;font-weight:700;
      padding:10px 11px;text-align:left;white-space:nowrap;
      border-bottom:1px solid var(--line);
    }
    table.t td{padding:9px 11px;border-bottom:1px solid rgba(148,163,184,.10);vertical-align:top;line-height:1.7;}
    table.t tr:last-child td{border-bottom:none;}
    table.t tbody tr:hover{background:rgba(20,184,166,.06);}

    /* ---------- measurement chips ---------- */
    .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;}
    .chip{
      border-radius:11px;padding:10px 11px;cursor:pointer;text-align:left;
      border:1px solid var(--line);background:rgba(255,255,255,.03);
      transition:all .2s ease;min-height:62px;width:100%;
    }
    .chip:hover{transform:translateY(-2px);border-color:rgba(20,184,166,.55);}
    .chip.sel{border-color:var(--accent);background:rgba(20,184,166,.13);box-shadow:0 0 0 1px var(--accent);}
    .chip-k{font-size:.7rem;color:var(--txt-dim);line-height:1.35;margin-bottom:3px;}
    .chip-v{font-size:.98rem;font-weight:700;line-height:1.25;}
    .s-ok .chip-v{color:#86efac;}
    .s-watch .chip-v{color:#fcd34d;}
    .s-bad .chip-v{color:#fca5a5;}
    .s-key .chip-v{color:#5eead4;}
    .s-na .chip-v{color:#64748b;}
    .chip-u{font-size:.68rem;color:var(--txt-dim);font-weight:400;margin-left:2px;}

    /* ---------- inputs ---------- */
    .fld{display:flex;flex-direction:column;gap:5px;}
    .fld label{font-size:.76rem;color:var(--txt-dim);line-height:1.5;}
    .fld input,.fld select{
      background:rgba(2,6,23,.65);border:1px solid var(--line);border-radius:9px;
      padding:10px 11px;color:#fff;font-size:16px;width:100%;
      transition:border-color .2s;
    }
    .fld input:focus,.fld select:focus{outline:none;border-color:var(--accent);}
    .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:12px;}
    .out{
      background:rgba(2,6,23,.6);border:1px dashed rgba(20,184,166,.45);
      border-radius:11px;padding:12px 14px;font-size:.87rem;line-height:1.95;
    }
    .out b{color:#5eead4;}
    .btn{
      border:none;border-radius:10px;padding:11px 17px;font-size:.85rem;font-weight:600;
      cursor:pointer;transition:all .2s;min-height:44px;
    }
    .btn-p{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);color:#04211f;}
    .btn-p:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(20,184,166,.35);}
    .btn-g{background:rgba(255,255,255,.06);color:var(--txt-dim);border:1px solid var(--line);}
    .btn-g:hover{color:#fff;border-color:rgba(20,184,166,.5);}

    /* ---------- quiz ---------- */
    .opt{
      display:block;width:100%;text-align:left;padding:12px 14px;margin:7px 0;
      border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.03);
      color:var(--txt);font-size:.87rem;line-height:1.7;cursor:pointer;transition:all .2s;min-height:48px;
    }
    .opt:hover:not(:disabled){border-color:rgba(20,184,166,.55);background:rgba(20,184,166,.07);}
    .opt:disabled{cursor:default;}
    .opt.right{border-color:#22c55e;background:rgba(34,197,94,.14);color:#bbf7d0;}
    .opt.wrong{border-color:#ef4444;background:rgba(239,68,68,.14);color:#fecaca;}

    .prog{height:6px;border-radius:99px;background:rgba(148,163,184,.18);overflow:hidden;}
    .prog>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s ease;}

    .pill{
      display:inline-block;padding:2px 9px;border-radius:99px;font-size:.68rem;
      font-weight:600;letter-spacing:.02em;
    }
    .p-ok{background:rgba(34,197,94,.18);color:#86efac;}
    .p-watch{background:rgba(245,158,11,.18);color:#fcd34d;}
    .p-bad{background:rgba(239,68,68,.18);color:#fca5a5;}
    .p-key{background:rgba(20,184,166,.18);color:#5eead4;}

    ul.pl{margin:8px 0 8px 0;padding-left:20px;}
    ul.pl li{margin:6px 0;line-height:1.8;font-size:.88rem;}
    ul.pl li::marker{color:var(--accent);}

    a.ref{color:#7dd3fc;text-decoration:none;border-bottom:1px dotted rgba(125,211,252,.5);}
    a.ref:hover{color:#bae6fd;}

    @media (max-width:480px){
      .wrap{padding:0 11px;}
      .card{padding:15px;border-radius:14px;}
      .mgrid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));}
      table.t{font-size:.76rem;}
      .navtab{padding:8px 13px;font-size:.79rem;}
    }
    @media (max-width:360px){
      .mgrid{grid-template-columns:1fr 1fr;}
    }

    /* ---------- share button (house standard) ---------- */
    .share-button{position:fixed;top:16px;right:16px;z-index:1000;}
    .share-toggle{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#3B82F6 0%,#60A5FA 100%);border:none;color:#fff;cursor:pointer;box-shadow:0 4px 15px rgba(59,130,246,.4);transition:all .3s ease;display:flex;align-items:center;justify-content:center;}
    .share-toggle:hover{transform:scale(1.1);box-shadow:0 6px 20px rgba(59,130,246,.5);}
    .share-menu{position:absolute;top:56px;right:0;background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.35);padding:20px;min-width:270px;display:none;animation:fadeInShare .3s ease;}
    .share-menu.active{display:block;}
    @keyframes fadeInShare{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
    .share-menu h4{color:#1e293b;margin:0 0 15px;font-size:1rem;display:flex;align-items:center;gap:8px;}
    .qr-container{background:#f8fafc;border-radius:12px;padding:15px;text-align:center;margin-bottom:15px;}
    .qr-container img{max-width:150px;height:auto;border-radius:8px;}
    .qr-container p{font-size:.75rem;color:#64748b;margin:8px 0 0;}
    .share-buttons{display:flex;flex-direction:column;gap:10px;}
    .share-btn{display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;border-radius:10px;cursor:pointer;font-size:.92rem;font-weight:500;transition:all .2s ease;text-decoration:none;color:#fff;}
    .share-btn.line{background:#00B900;}.share-btn.email{background:#EA4335;}.share-btn.copy{background:#3B82F6;}
    .share-btn:hover{transform:translateX(4px);box-shadow:0 4px 12px rgba(0,0,0,.15);}
    .share-btn svg{width:20px;height:20px;fill:currentColor;flex-shrink:0;}
    .share-close{position:absolute;top:10px;right:10px;background:none;border:none;font-size:1.5rem;cursor:pointer;color:#64748b;width:32px;height:32px;display:flex;align-items:center;justify-content:center;padding:0;}
    .share-close:hover{color:#1e293b;}
  </style>
</head>
<body>

<!-- Share Button -->
<div class="share-button">
  <button class="share-toggle" onclick="toggleShareMenu()" title="分享此頁面"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg></button>
  <div class="share-menu" id="shareMenu">
    <button class="share-close" onclick="toggleShareMenu()">&times;</button>
    <h4>📤 分享此頁面</h4>
    <div class="qr-container"><img id="qrCode" src="" alt="QR Code"><p>掃描 QR Code 開啟頁面</p></div>

      <a class="share-btn line" href="#" id="lineShare" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63h2.386c.349 0 .63.285.63.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63.349 0 .631.285.631.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.349 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg>LINE 分享</a>

  </div>
</div>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

/* =========================================================================
   資料層
   ========================================================================= */

/* =========================================================================

   ========================================================================= */

const TONE = { ok:'p-ok', watch:'p-watch', bad:'p-bad', key:'p-key' };

const Box = ({ kind, title, children }) => (
  <div className={'box b-' + kind}>
    {title ? <div className="box-t">{title}</div> : null}
    <div className="lead" style={{fontSize:'.88rem'}}>{children}</div>
  </div>
);

const Tbl = ({ title, headers, rows }) => (
  <div>
    {title ? <div style={{fontSize:'.83rem',fontWeight:600,color:'#5eead4',margin:'14px 0 2px'}}>{title}</div> : null}
    <div className="tw">
      <table className="t">
        <thead><tr>{headers.map((h,i)=><th key={i}>{h}</th>)}</tr></thead>
        <tbody>{rows.map((r,i)=><tr key={i}>{r.map((c,j)=><td key={j}>{c}</td>)}</tr>)}</tbody>
      </table>
    </div>
  </div>
);

const Block = ({ b }) => {
  switch (b.type) {
    case 'why':
      return <Box kind="info" title="🎯 為什麼要做這一步">{b.text}</Box>;
    case 'formula':
      return <div className="formula mono">{b.lines.map((l,i)=><div key={i}>{l || ' '}</div>)}</div>;
    case 'case':
      return (
        <div>
          <div style={{fontSize:'.83rem',fontWeight:600,color:'#5eead4',margin:'14px 0 2px'}}>{b.title}</div>
          <div className="tw">
            <table className="t">
              <thead><tr><th>項目</th><th>數值 / 計算</th><th>判讀</th></tr></thead>
              <tbody>
                {b.rows.map((r,i)=>(
                  <tr key={i}>
                    <td style={{whiteSpace:'nowrap'}}>{r[0]}</td>
                    <td className="mono">{r[1]}</td>
                    <td><span className={'pill ' + (TONE[r[3]] || 'p-key')}>{r[2]}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    case 'table':
      return <Tbl title={b.title} headers={b.headers} rows={b.rows} />;
    case 'pitfall':
      return (
        <Box kind="warn" title="⚠️ 這個測量什麼時候會失效">
          <ul className="pl">{b.items.map((x,i)=><li key={i}>{x}</li>)}</ul>
        </Box>
      );
    case 'list':
      return (
        <div>
          <div style={{fontSize:'.83rem',fontWeight:600,color:'#5eead4',margin:'14px 0 2px'}}>{b.title}</div>
          <ul className="pl">{b.items.map((x,i)=><li key={i}>{x}</li>)}</ul>
        </div>
      );
    case 'ok':   return <Box kind="ok"   title={'✅ ' + b.title}>{b.text}</Box>;
    case 'warn': return <Box kind="warn" title={'⚠️ ' + b.title}>{b.text}</Box>;
    case 'bad':  return <Box kind="bad"  title={'🚩 ' + b.title}>{b.text}</Box>;
    case 'info': return <Box kind="info" title={'ℹ️ ' + b.title}>{b.text}</Box>;
    case 'key':  return <Box kind="key"  title={'🔑 ' + b.title}>{b.text}</Box>;
    default:     return null;
  }
};

const TabFlow = ({ open, setOpen, done, toggleDone }) => {

  return (
    <div className="wrap" style={{paddingTop:16}}>
      <div className="card card-tight">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:9,fontSize:'.8rem'}}>

          <span style={{color:'#5eead4',fontWeight:700}}>{pct}%</span>
        </div>
        <div className="prog"><div style={{width:pct + '%'}}></div></div>
      </div>

      {STEPS.map(s=>{
        const isOpen = open === s.id;
        return (
          <div className="card" key={s.id} id={'step-' + s.id}>
            <div className="step-head" onClick={()=>setOpen(isOpen ? null : s.id)}>
              <span className={'step-num' + (done[s.id] ? ' done' : '')}>{done[s.id] ? '✓' : s.n}</span>
              <span style={{flex:1,minWidth:0}}>
                <span style={{display:'block',fontSize:'.97rem',fontWeight:700,color:'#e2e8f0',lineHeight:1.4}}>
                  {s.icon} {s.title}
                </span>
                <span style={{display:'block',fontSize:'.7rem',color:'#94a3b8',letterSpacing:'.04em',marginTop:2}}>{s.en}</span>
              </span>
              <span className={'chev' + (isOpen ? ' open' : '')} style={{fontSize:'1.25rem'}}>›</span>
            </div>

            {isOpen && (
              <div className="step-body" style={{marginTop:14}}>
                <p className="lead" style={{borderLeft:'3px solid rgba(20,184,166,.5)',paddingLeft:12}}>{s.lead}</p>
                {s.blocks.map((b,i)=><Block key={i} b={b} />)}
                <div style={{display:'flex',gap:9,flexWrap:'wrap',marginTop:14}}>
                  <button className={done[s.id] ? 'btn btn-g' : 'btn btn-p'} onClick={()=>toggleDone(s.id)}>
                    {done[s.id] ? '↺ 取消完成標記' : '✓ 標記這一站完成'}

                  {s.n < STEPS.length && (
                    <button className="btn btn-g" onClick={()=>{

            <button className="btn btn-g" style={{padding:'6px 12px',minHeight:34}} onClick={()=>setSel(null)}>關閉</button>
          </div>
          <p className="lead" style={{marginTop:10,fontSize:'.87rem'}}>{sel.note}</p>
        </div>
      )}

      {CASE_GROUPS.map(g=>{
        const items = filter==='all' ? g.items : g.items.filter(x=>x.s===filter);
        if (!items.length) return null;
        return (
          <div className="card" key={g.name}>
            <h2 className="sec" style={{fontSize:'.97rem'}}>{g.icon} {g.name}</h2>
            <div className="mgrid" style={{marginTop:12}}>
              {items.map(it=>(
                <button key={it.k}
                  className={'chip s-' + it.s + (sel && sel.k===it.k ? ' sel' : '')}
                  onClick={()=>setSel(sel && sel.k===it.k ? null : it)}>
                  <div className="chip-k">{it.k}</div>
                  <div className="chip-v mono">{it.v}<span className="chip-u">{it.u}</span></div>
                </button>
              ))}
            </div>
          </div>
        );
      })}

      <div className="card">
        <h2 className="sec">原始報告畫面</h2>
        <div className="sec-en">Original ISCV printout</div>
        <p className="lead" style={{fontSize:'.85rem'}}>上面的數值面板重建自這張 ISCV「Show Report」畫面（已去識別化，僅保留量測欄位）。</p>
        <button className="btn btn-g" style={{marginTop:10}} onClick={()=>setShowImg(!showImg)}>
          {showImg ? '收合原始畫面' : '展開原始畫面'}
        </button>
        {showImg && (
          <div style={{marginTop:12,borderRadius:12,overflow:'hidden',border:'1px solid rgba(148,163,184,.25)',background:'#fff'}}>
            <img src={ISCV_REPORT_IMG} alt="ISCV 心臟超音波量測報告畫面"
                 style={{width:'100%',display:'block'}} />
          </div>
        )}
      </div>

      <div className="card">
        <h2 className="sec">整合結論</h2>
        <div className="sec-en">Putting it together</div>
        <Box kind="key" title="🔑 Take Home Message">
          這份報告的數字不是一個左心的故事。左心結構近乎正常、filling pressure 估計正常，
          但 TR Vmax 3.18 m/s ＋ PA AcT 90 ms ＋ IVC 擴張且塌陷不良，指向肺高壓，且很可能是 pre-capillary 型態。
          同時 SVi 只有 30 ml/m²，屬 low-flow state。
          這份 study 最重要的資訊反而是沒測的東西：完整的 RV 評估。
        </Box>
        <Box kind="warn" title="⚠️ 下結論之前">
          先排除 TR envelope 品質不佳造成的高估，並確認 IVC 呼吸相標記是否正確。
          測量假象排除掉，才輪到臨床鑑別診斷。
        </Box>
      </div>
    </div>
  );
};

/* =========================================================================
   分頁：計算器
   ========================================================================= */
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
const f = (n, d=2) => (n===null || n===undefined || !isFinite(n)) ? '—' : n.toFixed(d);

const Calc = ({ title, icon, desc, fields, state, set, render }) => (
  <div className="card">
    <h2 className="sec">{icon} {title}</h2>
    <div className="sec-en">{desc}</div>
    <div className="fgrid">
      {fields.map(fl=>(
        <div className="fld" key={fl.k}>
          <label>{fl.label}</label>
          {fl.opts
            ? <select value={state[fl.k]} onChange={e=>set(fl.k, e.target.value)}>
                {fl.opts.map(o=><option key={o.v} value={o.v}>{o.t}</option>)}
              </select>
            : <input type="number" step="any" inputMode="decimal"
                     value={state[fl.k]} placeholder={fl.ph || ''}
                     onChange={e=>set(fl.k, e.target.value)} />}
        </div>
      ))}
    </div>
    <div className="out">{render(state)}</div>
  </div>
);

const TabCalc = () => {
  const [s, setS] = useState({
    // BSA
    lvids:'2.7', lvidsi:'1.65', mass:'109.7', massi:'67.1',
    // geometry
    pwd:'0.91', lvidd:'4.1', lvmi:'67.1', sex:'m',
    // EF
    ef1:'64.1', ef2:'71.9', ef3:'',
    // diastolic
    dE:'54.2', dA:'118.7', dSep:'6.4', dLat:'8.3', dLavi:'17.1', dTr:'3.18',
    // RAP/RVSP
    ivcMax:'2.22', ivcMin:'1.69', trv:'3.18',
    // Mahan
    act:'90',
    // flow
    sv:'48.4', bsa:'1.64', lvotD:'', lvotVti:'',
    // PVR
    pTrv:'3.18', pRvot:''
  });
  const set = (k,v)=>setS(p=>({...p,[k]:v}));

  return (
    <div className="wrap" style={{paddingTop:16}}>
      <div className="card card-tight">
        <p className="lead" style={{fontSize:'.85rem',margin:0}}>
          所有欄位已預先填入本案例數值，可直接改成你手上報告的數字。
          計算結果僅供教學輔助，臨床判讀請以完整影像與臨床背景為準。
        </p>
      </div>

      {/* 1. BSA */}
      <Calc title="反推 BSA 與 index 一致性" icon="📐" desc="Step 1 — recover BSA"
        state={s} set={set}
        fields={[
          {k:'lvids', label:'LVIDs (cm)'},
          {k:'lvidsi', label:'LVIDs index (cm/m²)'},
          {k:'mass', label:'LV mass (g)'},
          {k:'massi', label:'LV mass index (g/m²)'}
        ]}
        render={st=>{
          const a = num(st.lvids), b = num(st.lvidsi), c = num(st.mass), d = num(st.massi);
          const bsa1 = (a && b) ? a/b : null;
          const bsa2 = (c && d) ? c/d : null;
          const diff = (bsa1 && bsa2) ? Math.abs(bsa1-bsa2)/((bsa1+bsa2)/2)*100 : null;
          return (
            <div>
              <div>由 LVIDs 反推：<b className="mono">{f(bsa1)} m²</b></div>
              <div>由 LV mass 反推：<b className="mono">{f(bsa2)} m²</b></div>
              {diff!==null && (
                <div style={{marginTop:6}}>
                  差異 <span className="mono">{f(diff,1)}%</span> —{' '}
                  <span className={'pill ' + (diff<=5 ? 'p-ok' : 'p-bad')}>
                    {diff<=5 ? '一致，indexed 數值可信' : '不一致，先回頭確認量測或身高體重'}
                  </span>
                </div>
              )}
            </div>
          );
        }} />

      {/* 2. Geometry */}
      <Calc title="RWT 與左心室幾何分類" icon="🧱" desc="Step 2 — LV geometry"
        state={s} set={set}
        fields={[
          {k:'pwd', label:'LVPWd (cm)'},
          {k:'lvidd', label:'LVIDd (cm)'},
          {k:'lvmi', label:'LV mass index (g/m²)'},
          {k:'sex', label:'性別', opts:[{v:'m',t:'男'},{v:'fm',t:'女'}]}
        ]}
        render={st=>{
          const pw = num(st.pwd), id = num(st.lvidd), mi = num(st.lvmi);
          const rwt = (pw && id) ? 2*pw/id : null;
          const lim = st.sex==='m' ? 115 : 95;
          if (rwt===null || mi===null) return <div className="dim">請填入 LVPWd、LVIDd 與 LV mass index。</div>;
          const thick = rwt > 0.42, heavy = mi > lim;
          const geo = thick ? (heavy ? 'Concentric hypertrophy' : 'Concentric remodeling')
                            : (heavy ? 'Eccentric hypertrophy' : 'Normal geometry');
          return (
            <div>
              <div>RWT ＝ (2 × {f(pw)}) ÷ {f(id)} ＝ <b className="mono">{f(rwt)}</b>（{thick ? '> 0.42 增厚' : '≤ 0.42 正常'}）</div>
              <div>LV mass index {f(mi,1)} g/m²（{st.sex==='m'?'男':'女'}性上限 {lim}）→ {heavy ? '升高' : '正常'}</div>
              <div style={{marginTop:6}}>分類：<span className="pill p-key">{geo}</span></div>
            </div>
          );
        }} />

      {/* 3. EF */}
      <Calc title="EF 取最差值 + ASE 分級" icon="💪" desc="Step 3 — worst-value EF grading（院內慣例）"
        state={s} set={set}
        fields={[
          {k:'ef1', label:'EF (Teich) %', ph:'選填'},
          {k:'ef2', label:'EF (cubed) %', ph:'選填'},
          {k:'ef3', label:'EF (MOD-sp4 / Simpson) %', ph:'選填'}
        ]}
        render={st=>{
          const list = [num(st.ef1), num(st.ef2), num(st.ef3)].filter(x=>x!==null);
          if (!list.length) return <div className="dim">至少填入一個 EF 值。</div>;
          const worst = Math.min.apply(null, list);
          let g, tone;
          if (worst >= 52) { g='Normal'; tone='p-ok'; }
          else if (worst >= 41) { g='Mildly reduced'; tone='p-watch'; }
          else if (worst >= 30) { g='Moderately reduced'; tone='p-bad'; }
          else { g='Severely reduced'; tone='p-bad'; }
          return (
            <div>
              <div>輸入的 EF：<span className="mono">{list.map(x=>f(x,1)+'%').join('、')}</span></div>
              <div>取最差值：<b className="mono">{f(worst,1)}%</b></div>
              <div style={{marginTop:6}}>ASE 分級：<span className={'pill ' + tone}>{g}</span></div>
              <div className="dim" style={{marginTop:8,fontSize:'.8rem'}}>
                提醒：若存在任何 RWMA，EF(Teich) 與 EF(cubed) 皆無效，須改用 biplane Simpson。
              </div>
            </div>
          );
        }} />

      {/* 4. Diastolic */}
      <Calc title="舒張功能分級（ASE/EACVI 2016）" icon="💨" desc="Step 4 — diastolic grading algorithm"
        state={s} set={set}
        fields={[
          {k:'dE', label:'MV E (cm/s)'},
          {k:'dA', label:'MV A (cm/s)'},
          {k:'dSep', label:'Septal e′ (cm/s)'},
          {k:'dLat', label:'Lateral e′ (cm/s)'},
          {k:'dLavi', label:'LAVi (ml/m²)'},
          {k:'dTr', label:'TR Vmax (m/s)'}
        ]}
        render={st=>{
          const E=num(st.dE), A=num(st.dA), sep=num(st.dSep), lat=num(st.dLat),
                lavi=num(st.dLavi), tr=num(st.dTr);
          if (E===null || A===null) return <div className="dim">請至少填入 MV E 與 A。</div>;
          const ea = E/A;
          const eAvg = (sep!==null && lat!==null) ? E/((sep+lat)/2) : null;
          const out = [];
          out.push(<div key="ea">E/A ＝ <b className="mono">{f(ea)}</b></div>);
          if (eAvg!==null) out.push(<div key="ee">Average E/e′ ＝ <b className="mono">{f(eAvg,1)}</b>（異常 &gt; 14）</div>);
          if (sep!==null) out.push(<div key="s">Septal e′ {f(sep,1)} cm/s — {sep<7 ? '異常（< 7）' : '正常'}</div>);
          if (lat!==null) out.push(<div key="l">Lateral e′ {f(lat,1)} cm/s — {lat<10 ? '異常（< 10）' : '正常'}</div>);

          let verdict, tone, path;
          if (ea <= 0.8 && E <= 50) {
            verdict = 'Grade I diastolic dysfunction，LAP normal'; tone='p-watch';
            path = 'E/A ≤ 0.8 且 E ≤ 50 cm/s → 直接判定，不需再看三項指標。';
          } else if (ea >= 2) {
            verdict = 'Grade III diastolic dysfunction，LAP elevated'; tone='p-bad';
            path = 'E/A ≥ 2 → restrictive filling。';
          } else {
            const crit = [];
            if (eAvg!==null) crit.push({n:'Average E/e′ > 14', p: eAvg>14});
            if (tr!==null)   crit.push({n:'TR Vmax > 2.8 m/s', p: tr>2.8});
            if (lavi!==null) crit.push({n:'LAVi > 34 ml/m²',   p: lavi>34});
            const pos = crit.filter(c=>c.p).length;
            path = (ea<=0.8 ? 'E/A ≤ 0.8 但 E > 50 cm/s' : 'E/A 介於 0.8 與 2 之間') + ' → 評估三項指標。';
            out.push(
              <div key="crit" style={{marginTop:8}}>
                {crit.map((c,i)=>(
                  <div key={i}>
                    <span className={'pill ' + (c.p ? 'p-bad' : 'p-ok')}>{c.p ? '陽性' : '陰性'}</span>
                    <span style={{marginLeft:8}}>{c.n}</span>
                  </div>
                ))}
                <div style={{marginTop:4}}>陽性 <b className="mono">{pos}</b> / {crit.length} 項</div>
              </div>
            );
            if (crit.length < 2) { verdict='資料不足，無法分級'; tone='p-watch'; }
            else if (crit.length === 2 && pos === 1) { verdict='Indeterminate（兩項指標互相矛盾）'; tone='p-watch'; }
            else if (pos >= 2) { verdict='Grade II diastolic dysfunction，LAP elevated'; tone='p-bad'; }
            else { verdict='Grade I diastolic dysfunction，LAP normal'; tone='p-watch'; }
          }
          return (
            <div>
              {out}
              <div className="dim" style={{marginTop:8,fontSize:'.8rem'}}>路徑：{path}</div>
              <div style={{marginTop:6}}>結論：<span className={'pill ' + tone}>{verdict}</span></div>
              <div className="dim" style={{marginTop:8,fontSize:'.8rem'}}>
                不適用情境：AF、明顯 MAC、二尖瓣手術後、心律調節器依賴、重度瓣膜疾病。
              </div>
            </div>
          );
        }} />

      {/* 5. RAP / RVSP */}
      <Calc title="RAP 與 RVSP" icon="🧭" desc="Step 5 — right atrial pressure & RV systolic pressure"
        state={s} set={set}
        fields={[
          {k:'ivcMax', label:'IVC 最大直徑 (cm)'},
          {k:'ivcMin', label:'IVC 最小直徑 (cm)'},
          {k:'trv', label:'TR Vmax (m/s)'}
        ]}
        render={st=>{
          const mx=num(st.ivcMax), mn=num(st.ivcMin), v=num(st.trv);
          if (mx===null || mn===null) return <div className="dim">請填入 IVC 最大與最小直徑。</div>;
          const col = (mx-mn)/mx*100;
          const big = mx > 2.1, poor = col < 50;
          let rap, rng;
          if (!big && !poor) { rap=3; rng='0–5'; }
          else if (big && poor) { rap=15; rng='10–20'; }
          else { rap=8; rng='5–10'; }
          const pg = v!==null ? 4*v*v : null;
          const rvsp = pg!==null ? pg + rap : null;
          return (
            <div>
              <div>塌陷率 ＝ ({f(mx)} − {f(mn)}) ÷ {f(mx)} ＝ <b className="mono">{f(col,0)}%</b></div>
              <div>直徑 {big ? '> 2.1 cm' : '≤ 2.1 cm'}、塌陷 {poor ? '< 50%' : '> 50%'} → RAP ≈ <b className="mono">{rap} mmHg</b>（{rng}）</div>
              {pg!==null && <div style={{marginTop:6}}>TR max PG ＝ 4 × {f(v)}² ＝ <b className="mono">{f(pg,1)} mmHg</b></div>}
              {rvsp!==null && <div>RVSP ＝ {f(pg,1)} ＋ {rap} ＝ <b className="mono">{f(rvsp,1)} mmHg</b></div>}
              {v!==null && (
                <div style={{marginTop:6}}>
                  <span className={'pill ' + (v<=2.8 ? 'p-ok' : (v<=3.4 ? 'p-watch' : 'p-bad'))}>
                    ESC 2022 PH 機率：{v<=2.8 ? '低' : (v<=3.4 ? '中' : '高')}
                  </span>
                </div>
              )}
              <div className="dim" style={{marginTop:8,fontSize:'.8rem'}}>
                ⚠️ 若報告的吸氣相直徑大於吐氣相，代表病人可能在正壓通氣或標記有誤 — 先回看影像再採用此 RAP。
              </div>
            </div>
          );
        }} />

      {/* 6. Mahan */}
      <Calc title="PA acceleration time → mPAP（Mahan）" icon="🌬️" desc="Step 5 — Mahan formula"
        state={s} set={set}
        fields={[{k:'act', label:'PA acceleration time (ms)'}]}
        render={st=>{
          const t=num(st.act);
          if (t===null) return <div className="dim">請填入 AcT。</div>;
          const m = 79 - 0.45*t;
          return (
            <div>
              <div>mPAP ＝ 79 − (0.45 × {f(t,0)}) ＝ <b className="mono">{f(m,1)} mmHg</b></div>
              <div style={{marginTop:6}}>
                <span className={'pill ' + (t<100 ? 'p-bad' : 'p-ok')}>
                  AcT {f(t,0)} ms — {t<100 ? '< 100 ms，高度提示 PH' : '≥ 100 ms'}
                </span>
              </div>
              <div className="dim" style={{marginTop:8,fontSize:'.8rem'}}>
                心跳明顯偏離 60–100 bpm 時準度下降；同時觀察 RVOT 有無 mid-systolic notching。
              </div>
            </div>
          );
        }} />

      {/* 7. Flow */}
      <Calc title="SVi / CI 與 low-flow 確認" icon="🌊" desc="Step 3 — flow state"
        state={s} set={set}
        fields={[
          {k:'sv', label:'SV（報告值, ml）'},
          {k:'bsa', label:'BSA (m²)'},
          {k:'lvotD', label:'LVOT 直徑 (cm)', ph:'選填'},
          {k:'lvotVti', label:'LVOT VTI (cm)', ph:'選填'}
        ]}
        render={st=>{
          const sv=num(st.sv), bsa=num(st.bsa), d=num(st.lvotD), vti=num(st.lvotVti);
          const svi = (sv!==null && bsa) ? sv/bsa : null;
          const csa = d!==null ? Math.PI*Math.pow(d/2,2) : null;
          const svD = (csa!==null && vti!==null) ? csa*vti : null;
          const sviD = (svD!==null && bsa) ? svD/bsa : null;
          return (
            <div>
              {svi!==null && (
                <div>
                  報告 SV 推算 SVi ＝ {f(sv,1)} ÷ {f(bsa)} ＝ <b className="mono">{f(svi,1)} ml/m²</b>{' '}
                  <span className={'pill ' + (svi<35 ? 'p-bad' : 'p-ok')}>{svi<35 ? 'low-flow' : '正常'}</span>
                </div>
              )}
              {csa!==null && <div style={{marginTop:6}}>LVOT CSA ＝ π × ({f(d)} ÷ 2)² ＝ <b className="mono">{f(csa)} cm²</b></div>}
              {svD!==null && <div>LVOT-derived SV ＝ {f(csa)} × {f(vti,1)} ＝ <b className="mono">{f(svD,1)} ml</b></div>}
              {sviD!==null && (
                <div>
                  LVOT-derived SVi ＝ <b className="mono">{f(sviD,1)} ml/m²</b>{' '}
                  <span className={'pill ' + (sviD<35 ? 'p-bad' : 'p-ok')}>{sviD<35 ? 'low-flow 確認' : '非 low-flow'}</span>
                </div>
              )}
              {vti!==null && (
                <div style={{marginTop:6}}>
                  <span className={'pill ' + (vti<18 ? 'p-bad' : 'p-ok')}>LVOT VTI {f(vti,1)} cm — {vti<18 ? '< 18 cm，low-flow' : '≥ 18 cm'}</span>
                </div>
              )}
              <div className="dim" style={{marginTop:8,fontSize:'.8rem'}}>
                報告的 SV 來自 LV 容積公式，只能提示 low-flow；真正確認要靠 LVOT VTI × CSA。
              </div>
            </div>
          );
        }} />

      {/* 8. PVR */}
      <Calc title="估算 PVR（Abbas 公式）" icon="🔬" desc="Step 7 — pre- vs post-capillary"
        state={s} set={set}
        fields={[
          {k:'pTrv', label:'TR Vmax (m/s)'},
          {k:'pRvot', label:'RVOT VTI (cm)', ph:'本例未測'}
        ]}
        render={st=>{
          const v=num(st.pTrv), r=num(st.pRvot);
          if (v===null || r===null || r===0)
            return <div className="dim">需要 TR Vmax 與 RVOT VTI 兩個值。本例 RVOT VTI 未測 — 這正是第 7 站列出的缺口之一。</div>;
          const pvr = (v/r)*10 + 0.16;
          return (
            <div>
              <div>PVR ＝ ({f(v)} ÷ {f(r,1)}) × 10 ＋ 0.16 ＝ <b className="mono">{f(pvr)} Wood units</b></div>
              <div style={{marginTop:6}}>
                <span className={'pill ' + (pvr>2 ? 'p-bad' : 'p-ok')}>{pvr>2 ? '> 2 WU，提示升高' : '≤ 2 WU'}</span>
              </div>
              <div className="dim" style={{marginTop:8,fontSize:'.8rem'}}>
                限制：Rajagopalan 等人指出當侵入性 PVR &gt; 8 Wood units 時，本公式與實測值不相關，
                不可用於重度 PH 的定量，只適合作為 pre- / post-capillary 的初步分流線索。
              </div>
            </div>
          );
        }} />
    </div>
  );
};

/* =========================================================================
   分頁：速查表 + 文獻
   ========================================================================= */
const TabRef = () => (
  <div className="wrap" style={{paddingTop:16}}>
    {CUTOFFS.map(c=>(
      <div className="card" key={c.title}>
        <h2 className="sec" style={{fontSize:'.97rem'}}>{c.icon} {c.title}</h2>
        <Tbl headers={c.headers} rows={c.rows} />
      </div>
    ))}

    <div className="card">
      <h2 className="sec">參考文獻</h2>
      <div className="sec-en">References（DOI 連結已逐一驗證）</div>
      <div style={{display:'flex',flexDirection:'column',gap:14,marginTop:12}}>
        {REFS.map((r,i)=>(
          <div key={i} style={{fontSize:'.84rem',lineHeight:1.75,paddingLeft:14,borderLeft:'2px solid rgba(20,184,166,.35)'}}>
            <div>{r.a}</div>
            <div style={{color:'#e2e8f0',fontWeight:500}}>
              {r.u
                ? <a className="ref" href={r.u} target="_blank" rel="noopener noreferrer">{r.t}</a>
                : <span>{r.t}</span>}
            </div>
            <div className="dim">{r.j}</div>
            <div style={{color:'#7dd3fc',fontSize:'.79rem',marginTop:3}}>→ {r.n}</div>
          </div>
        ))}
      </div>
    </div>

    <div className="card">
      <h2 className="sec">使用說明與限制</h2>
      <div className="sec-en">Scope & limitations</div>
      <Box kind="warn" title="⚠️ 這份教材不是判讀授權">
        <ul className="pl">
          <li>所有計算器僅供教學輔助，臨床判讀必須回到完整影像、image quality 與臨床背景。</li>
          <li>案例數值來自一份真實 ISCV 報告，已去識別化並僅保留量測欄位。</li>
          <li>院內慣例（EF 取最差值、LVH 門檻 1.3 cm）為本科室內部一致性規範，非 ASE 原文條文。</li>
          <li>ASE 2016 舒張功能演算法在 AF、明顯 MAC、瓣膜手術後、心律調節器依賴等情境不適用。</li>
        </ul>
      </Box>
    </div>
  </div>
);

/* =========================================================================
   分頁：測驗
   ========================================================================= */
const TabQuiz = ({ ans, setAns }) => {
  const answered = Object.keys(ans).length;
  const correct = Object.keys(ans).filter(k=>ans[k]===QUIZ[k].a).length;
  const pct = answered ? Math.round(correct/answered*100) : 0;

  return (
    <div className="wrap" style={{paddingTop:16}}>
      <div className="card card-tight">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:9,fontSize:'.82rem'}}>
          <span className="dim">已作答 {answered} / {QUIZ.length}</span>
          <span style={{color:'#5eead4',fontWeight:700}}>答對 {correct}（{pct}%）</span>
        </div>
        <div className="prog"><div style={{width:(answered/QUIZ.length*100) + '%'}}></div></div>
        {answered>0 && (
          <button className="btn btn-g" style={{marginTop:12}} onClick={()=>setAns({})}>重新開始</button>
        )}
      </div>

      {QUIZ.map((q,qi)=>{
        const picked = ans[qi];
        const shown = picked !== undefined;
        return (
          <div className="card" key={qi}>
            <div style={{display:'flex',gap:10,marginBottom:11}}>
              <span className="step-num" style={{width:28,height:28,borderRadius:9,fontSize:'.8rem',flexShrink:0}}>{qi+1}</span>
              <span className="lead" style={{fontWeight:600,color:'#e2e8f0'}}>{q.q}</span>
            </div>
            {q.opts.map((o,oi)=>{
              let cls = 'opt';
              if (shown) {
                if (oi === q.a) cls += ' right';
                else if (oi === picked) cls += ' wrong';
              }
              return (
                <button key={oi} className={cls} disabled={shown}
                        onClick={()=>setAns({...ans, [qi]: oi})}>
                  <span style={{color:'#5eead4',fontWeight:700,marginRight:8}}>{'ABCD'[oi]}</span>{o}
                </button>
              );
            })}
            {shown && (
              <Box kind={picked===q.a ? 'ok' : 'bad'} title={picked===q.a ? '✅ 答對' : '❌ 答錯'}>
                {q.why}
              </Box>
            )}
          </div>
        );
      })}

      {answered === QUIZ.length && (
        <div className="card">
          <h2 className="sec">完成</h2>
          <div className="sec-en">Finished</div>
          <p className="lead">
            答對 <b style={{color:'#5eead4'}}>{correct} / {QUIZ.length}</b>（{pct}%）。
            {pct >= 80 ? ' 流程掌握良好 — 建議直接拿一份自己的 ISCV 報告走一次七站。'
                       : ' 建議回到「七站流程」把答錯的那幾站重讀一次。'}
          </p>
        </div>
      )}
    </div>
  );
};

/* =========================================================================
   App
   ========================================================================= */
const TABS = [
  { k:'home', label:'🏠 總覽' },
  { k:'flow', label:'🧭 七站流程' },
  { k:'case', label:'🔢 案例數值' },
  { k:'calc', label:'🧮 計算器' },
  { k:'ref',  label:'📖 速查與文獻' },
  { k:'quiz', label:'📝 自我測驗' }
];

const App = () => {
  const [tab, setTab] = useState('home');
  const [open, setOpen] = useState('bsa');
  const [done, setDone] = useState({});
  const [ans, setAns] = useState({});

  // 載入進度
  useEffect(()=>{
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d.done) setDone(d.done);
        if (d.ans) setAns(d.ans);
      }
    } catch(e) {}
  }, []);

  // 儲存進度
  useEffect(()=>{
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ done, ans })); } catch(e) {}
  }, [done, ans]);

  const go = useCallback((t, stepId)=>{
    setTab(t);
    if (stepId) setOpen(stepId);
    window.scrollTo({ top:0, behavior:'smooth' });
  }, []);

  const toggleDone = id => setDone(p=>({ ...p, [id]: !p[id] }));

  const doneCount = Object.keys(done).filter(k=>done[k]).length;

  return (
    <div>
      <header className="hd">
        <div className="wrap" style={{position:'relative',zIndex:1}}>
          <div style={{fontSize:'.68rem',letterSpacing:'.14em',color:'rgba(255,255,255,.75)',fontWeight:600}}>
            NTUH HSINCHU · CARDIOVASCULAR CENTER
          </div>
          <h1 style={{fontSize:'1.32rem',fontWeight:700,color:'#fff',margin:'6px 0 4px',lineHeight:1.35}}>
            Echo 判讀流程
          </h1>
          <div style={{fontSize:'.83rem',color:'rgba(255,255,255,.92)',lineHeight:1.6}}>
            從 ISCV 報告數字到臨床敘事 — 七站判讀法
          </div>
          <div style={{display:'flex',gap:7,flexWrap:'wrap',marginTop:9}}>
            <span style={{background:'rgba(255,255,255,.2)',padding:'3px 11px',borderRadius:14,fontSize:'.68rem',color:'#fff'}}>
              7 站流程
            </span>
            <span style={{background:'rgba(255,255,255,.2)',padding:'3px 11px',borderRadius:14,fontSize:'.68rem',color:'#fff'}}>
              真實案例
            </span>
            <span style={{background:'rgba(255,255,255,.2)',padding:'3px 11px',borderRadius:14,fontSize:'.68rem',color:'#fff'}}>
              8 個計算器
            </span>
            <span style={{background:'rgba(255,255,255,.2)',padding:'3px 11px',borderRadius:14,fontSize:'.68rem',color:'#fff'}}>
              進度 {doneCount}/{STEPS.length}
            </span>
          </div>
        </div>
      </header>

      <nav className="navbar">
        <div className="wrap" style={{display:'flex',gap:8,padding:0,maxWidth:960,width:'100%'}}>
          {TABS.map(t=>(
            <button key={t.k}
              className={'navtab' + (tab===t.k ? ' on' : '')}
              onClick={()=>go(t.k)}>{t.label}</button>
          ))}
        </div>
      </nav>

      {tab==='home' && <TabOverview go={go} done={done} />}
      {tab==='flow' && <TabFlow open={open} setOpen={setOpen} done={done} toggleDone={toggleDone} />}
      {tab==='case' && <TabCase />}
      {tab==='calc' && <TabCalc />}
      {tab==='ref'  && <TabRef />}
      {tab==='quiz' && <TabQuiz ans={ans} setAns={setAns} />}

      <footer className="wrap" style={{padding:'24px 14px 40px',textAlign:'center'}}>
        <div style={{fontSize:'.75rem',color:'#64748b',lineHeight:1.9}}>
          衛生福利部／國立臺灣大學醫學院附設醫院新竹臺大分院　內科部 心臟血管科<br/>
          教材整理：謝慕揚 醫師　·　案例來源：ISCV 心臟超音波報告（去識別化）<br/>
          本教材僅供院內教學使用，臨床判讀請以完整影像與臨床背景為準
        </div>
      </footer>
    </div>
  );
};

ReactDOM.render(<App />, document.getElementById('root'));
</script>

<script>
  function initShareButtons(){
    var pageUrl = window.location.href;
    var pageTitle = document.title;
    var encodedUrl = encodeURIComponent(pageUrl);
    var qr = document.getElementById('qrCode');
    if (qr) qr.src = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodedUrl;
    var ln = document.getElementById('lineShare');
    if (ln) ln.href = 'https://social-plugins.line.me/lineit/share?url=' + encodedUrl;
    var em = document.getElementById('emailShare');
    if (em) {
      em.href = 'mailto:?subject=' + encodeURIComponent('分享：' + pageTitle) +
                '&body=' + encodeURIComponent('與你分享這個頁面：\n\n' + pageTitle + '\n\n' + pageUrl);
    }
  }
  function toggleShareMenu(){
    var m = document.getElementById('shareMenu');
    if (m) m.classList.toggle('active');
  }
  function copyPageUrl(){
    var pageUrl = window.location.href;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(pageUrl).then(function(){ alert('連結已複製到剪貼簿！'); }).catch(fallbackCopy);
    } else { fallbackCopy(); }
    function fallbackCopy(){
      var ta = document.createElement('textarea');
      ta.value = pageUrl; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      alert('連結已複製到剪貼簿！');
    }
  }
  document.addEventListener('click', function(ev){
    var btn = document.querySelector('.share-button');
    var menu = document.getElementById('shareMenu');
    if (btn && menu && !btn.contains(ev.target) && menu.classList.contains('active')) {
      menu.classList.remove('active');
    }
  });
  document.addEventListener('DOMContentLoaded', initShareButtons);
</script>
</body>
</html>
