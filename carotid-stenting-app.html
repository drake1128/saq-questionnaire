    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #1a365d;
            --primary-light: #2c5282;
            --accent: #c53030;
            --success: #276749;
            --warning: #c05621;
            --info: #2b6cb0;
            --purple: #6b46c1;
            --teal: #285e61;
            --bg-dark: #0d1b2a;
            --bg-card: #1b2838;
            --bg-card-light: #243447;
            --text-light: #e2e8f0;
            --text-muted: #a0aec0;
            --border-color: #2d3748;
            --shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a2744 100%);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        
        #root { min-height: 100vh; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .slide-in { animation: slideIn 0.3s ease-out forwards; }
        .pulse { animation: pulse 2s infinite; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 3px; }
        
        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: var(--success);
            cursor: pointer;
        }
        
        select, input[type="text"], input[type="number"] {
            background: var(--bg-card-light);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-light);
            font-size: 15px;
            width: 100%;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: var(--info);
        }
    </style>
</head>

                                                    <td style={{ padding: '12px', textAlign: 'center' }}>{row.ecst}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div style={{ marginTop: '12px', fontSize: '13px', color: 'var(--text-muted)' }}>
                                    <p>⚠️ 有症狀 ≥50% 建議介入 | 🔴 強烈建議介入</p>
                                </div>
                            </Card>

                            {/* 計算機 */}
                            <Card>
                                <SectionTitle icon="🧮" title="狹窄程度計算機" />
                                <div style={{ marginBottom: '14px' }}>
                                    <label style={{ fontSize: '13px', color: 'var(--text-muted)', display: 'block', marginBottom: '8px' }}>
                                        選擇計算方法：
                                    </label>
                                    <div style={{ display: 'flex', gap: '10px' }}>
                                        <button
                                            onClick={() => setCalcMethod('nascet')}
                                            style={{
                                                flex: 1,
                                                padding: '10px',
                                                background: calcMethod === 'nascet' ? '#38a169' : 'var(--bg-card-light)',
                                                border: 'none',
                                                borderRadius: '8px',
                                                color: 'white',
                                                cursor: 'pointer',
                                                fontSize: '14px'
                                            }}
                                        >
                                            NASCET
                                        </button>
                                        <button
                                            onClick={() => setCalcMethod('ecst')}
                                            style={{
                                                flex: 1,
                                                padding: '10px',
                                                background: calcMethod === 'ecst' ? '#3182ce' : 'var(--bg-card-light)',
                                                border: 'none',
                                                borderRadius: '8px',
                                                color: 'white',
                                                cursor: 'pointer',
                                                fontSize: '14px'
                                            }}
                                        >
                                            ECST
                                        </button>
                                    </div>
                                </div>
                                <div style={{ display: 'flex', gap: '12px', marginBottom: '14px' }}>
                                    <div style={{ flex: 1 }}>
                                        <label style={{ fontSize: '13px', color: 'var(--text-muted)', display: 'block', marginBottom: '6px' }}>
                                            最窄處直徑 B (mm)
                                        </label>
                                        <input
                                            type="number"
                                            placeholder="B"
                                            value={stenosisInput.narrow}
                                            onChange={(e) => setStenosisInput(prev => ({ ...prev, narrow: e.target.value }))}
                                        />
                                    </div>
                                    <div style={{ flex: 1 }}>
                                        <label style={{ fontSize: '13px', color: 'var(--text-muted)', display: 'block', marginBottom: '6px' }}>
                                            {calcMethod === 'nascet' ? '遠端正常 ICA A (mm)' : '預估原本直徑 C (mm)'}
                                        </label>
                                        <input
                                            type="number"
                                            placeholder={calcMethod === 'nascet' ? 'A' : 'C'}
                                            value={stenosisInput.reference}
                                            onChange={(e) => setStenosisInput(prev => ({ ...prev, reference: e.target.value }))}
                                        />
                                    </div>
                                </div>
                                <button
                                    onClick={calculateStenosis}
                                    style={{
                                        width: '100%',
                                        padding: '14px',
                                        background: calcMethod === 'nascet' ? '#38a169' : '#3182ce',
                                        border: 'none',
                                        borderRadius: '10px',
                                        color: 'white',
                                        fontSize: '16px',
                                        fontWeight: '600',
                                        cursor: 'pointer'
                                    }}
                                >
                                    計算 {calcMethod.toUpperCase()} 狹窄程度
                                </button>
                                {calcResult && (
                                    <div style={{
                                        marginTop: '16px',
                                        padding: '16px',
                                        background: parseFloat(calcResult) >= 50 ? 'rgba(229, 62, 62, 0.15)' : 'rgba(56, 161, 105, 0.15)',
                                        borderRadius: '12px',
                                        textAlign: 'center'
                                    }}>
                                        <div style={{ fontSize: '14px', marginBottom: '6px' }}>{calcMethod.toUpperCase()} 狹窄程度</div>
                                        <div style={{
                                            fontSize: '2.5rem',
                                            fontWeight: '700',
                                            color: parseFloat(calcResult) >= 50 ? '#e53e3e' : 'var(--success)'
                                        }}>
                                            {calcResult}%
                                        </div>
                                        {calcMethod === 'nascet' && parseFloat(calcResult) >= 70 && (
                                            <div style={{ color: '#e53e3e', marginTop: '8px' }}>🔴 強烈建議介入治療</div>
                                        )}
                                        {calcMethod === 'nascet' && parseFloat(calcResult) >= 50 && parseFloat(calcResult) < 70 && (
                                            <div style={{ color: '#ed8936', marginTop: '8px' }}>⚠️ 有症狀者建議介入治療</div>
                                        )}
                                    </div>
                                )}
                            </Card>

                            {/* 臨床意義 */}
                            <Card>
                                <SectionTitle icon="📊" title="臨床適應症" color="var(--accent)" />
                                <div style={{
                                    background: 'rgba(229, 62, 62, 0.1)',
                                    padding: '16px',
                                    borderRadius: '12px',
                                    marginBottom: '14px'
                                }}>
                                    <div style={{ fontWeight: '600', marginBottom: '8px', color: '#e53e3e' }}>🔴 有症狀 (TIA/Stroke)</div>
                                    <ul style={{ paddingLeft: '20px', margin: 0 }}>
                                        <li>{nascetEcstData.clinicalSignificance.symptomatic.indication}</li>
                                        <li>{nascetEcstData.clinicalSignificance.symptomatic.strongIndication}</li>
                                        <li>{nascetEcstData.clinicalSignificance.symptomatic.timing}</li>
                                    </ul>
                                </div>
                                <div style={{
                                    background: 'rgba(237, 137, 54, 0.1)',
                                    padding: '16px',
                                    borderRadius: '12px'
                                }}>
                                    <div style={{ fontWeight: '600', marginBottom: '8px', color: '#ed8936' }}>🟡 無症狀</div>
                                    <ul style={{ paddingLeft: '20px', margin: 0 }}>
                                        <li>{nascetEcstData.clinicalSignificance.asymptomatic.indication}</li>
                                        <li>{nascetEcstData.clinicalSignificance.asymptomatic.consideration}</li>
                                    </ul>
                                </div>
                            </Card>
                        </div>
                    </div>
                );
            };

            const EducationPage = () => {
                const [expandedSection, setExpandedSection] = useState('whatIs');

                const sections = [
                    { id: 'whatIs', icon: '❓', data: patientEducation.whatIs },
                    { id: 'symptoms', icon: '⚠️', data: patientEducation.symptoms },
                    { id: 'treatment', icon: '🩺', data: patientEducation.treatment },
                    { id: 'risks', icon: '📊', data: patientEducation.risks },
                    { id: 'recovery', icon: '🏥', data: patientEducation.recovery },
                    { id: 'followUp', icon: '📅', data: patientEducation.followUp },
                    { id: 'cost', icon: '💰', data: patientEducation.cost }
                ];

                return (
                    <div>
                        <Header title="病患家屬衛教" subtitle="Patient & Family Education" onBack={() => setCurrentPage('home')} />
                        <div style={{ padding: '20px', maxWidth: '600px', margin: '0 auto' }}>
                            <AlertBox type="info">
                                <strong>📖 衛教說明</strong>
                                <p style={{ marginTop: '6px', fontSize: '14px' }}>以下資訊可協助您與家人了解頸動脈支架治療</p>
                            </AlertBox>

                            {sections.map((section) => (
                                <Card
                                    key={section.id}
                                    onClick={() => setExpandedSection(expandedSection === section.id ? null : section.id)}
                                    style={{ cursor: 'pointer' }}
                                >
                                    <div style={{
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'space-between'
                                    }}>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                                            <span style={{ fontSize: '1.5rem' }}>{section.icon}</span>
                                            <h3 style={{ fontSize: '1rem', fontWeight: '600' }}>{section.data.title}</h3>
                                        </div>
                                        <span style={{
                                            transform: expandedSection === section.id ? 'rotate(180deg)' : 'rotate(0)',
                                            transition: 'transform 0.3s'
                                        }}>▼</span>
                                    </div>
                                    {expandedSection === section.id && (
                                        <ul style={{
                                            paddingLeft: '20px',
                                            marginTop: '16px',
                                            animation: 'fadeIn 0.3s ease-out'
                                        }}>
                                            {section.data.content.map((item, idx) => (
                                                <li key={idx} style={{ marginBottom: '10px', lineHeight: '1.6' }}>{item}</li>
                                            ))}
                                        </ul>
                                    )}
                                </Card>
                            ))}

                            {/* FAQ */}
                            <Card>
                                <SectionTitle icon="💬" title="常見問題" />
                                {patientEducation.faq.map((faq, idx) => (
                                    <div key={idx} style={{
                                        padding: '14px',
                                        background: 'var(--bg-card-light)',
                                        borderRadius: '10px',
                                        marginBottom: '12px'
                                    }}>
                                        <div style={{ fontWeight: '600', marginBottom: '8px', color: 'var(--info)' }}>
                                            Q: {faq.q}
                                        </div>
                                        <div style={{ fontSize: '14px' }}>
                                            A: {faq.a}
                                        </div>
                                    </div>
                                ))}
                            </Card>

                            {/* 參考連結 */}
                            <Card>
                                <SectionTitle icon="🔗" title="更多資訊" />
                                <p style={{ fontSize: '14px', color: 'var(--text-muted)', marginBottom: '12px' }}>
                                    搜尋關鍵字：
                                </p>
                                <div style={{ fontSize: '14px' }}>
                                    <p style={{ marginBottom: '8px' }}>• 內頸動脈狹窄腦中風學會 (腦中風學會)</p>
                                    <p>• 頸動脈血流重建 (台北榮總)</p>
                                </div>
                            </Card>
                        </div>
                    </div>
                );
            };

            const MRSPage = () => (
                <div>
                    <Header title="mRS 量表" subtitle="Modified Rankin Scale" onBack={() => setCurrentPage('home')} />
                    <div style={{ padding: '20px', maxWidth: '600px', margin: '0 auto' }}>
                        <AlertBox type="info">
                            <strong>Modified Rankin Scale (mRS)</strong>
                            <p style={{ marginTop: '6px', fontSize: '14px' }}>評估中風後遺症嚴重程度的標準量表</p>
                        </AlertBox>

                        <Card>
                            <SectionTitle icon="📋" title="各級評分說明" />
                            {mrsScale.map((item) => (
                                <div key={item.score} style={{
                                    display: 'flex',
                                    gap: '14px',
                                    padding: '14px',
                                    background: item.score >= 4 ? 'rgba(229, 62, 62, 0.1)' : 'var(--bg-card-light)',
                                    borderRadius: '10px',
                                    marginBottom: '10px',
                                    alignItems: 'flex-start'
                                }}>
                                    <div style={{
                                        width: '36px',
                                        height: '36px',
                                        background: item.score >= 4 ? '#e53e3e' : item.score >= 2 ? '#ed8936' : 'var(--success)',
                                        borderRadius: '50%',
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                        fontWeight: '700',
                                        flexShrink: 0
                                    }}>
                                        {item.score}
                                    </div>
                                    <div style={{ flex: 1 }}>
                                        <div style={{ marginBottom: '6px' }}>{item.description}</div>
                                        {item.economic !== '-' && (
                                            <div style={{ fontSize: '13px', color: '#ed8936' }}>
                                                💰 {item.economic}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </Card>

                        <Card>
                            <AlertBox type="warning">
                                <strong>頸動脈狹窄惡化的影響</strong>
                                <p style={{ marginTop: '8px', fontSize: '14px' }}>
                                    頸動脈狹窄若進展至全阻塞導致中風，mRS 4-6 分的比例較高。
                                    及早治療可降低嚴重殘障風險。
                                </p>
                            </AlertBox>
                        </Card>
                    </div>
                </div>
            );

            const QuizPage = () => {
                const currentQuestion = quizQuestions[quizState.currentQ];

                const handleAnswer = (idx) => {
                    if (quizState.selected !== null) return;
                    setQuizState(prev => ({
                        ...prev,
                        selected: idx,
                        score: idx === currentQuestion.correct ? prev.score + 1 : prev.score,
                        showResult: true
                    }));
                };

                const nextQuestion = () => {
                    if (quizState.currentQ < quizQuestions.length - 1) {
                        setQuizState(prev => ({
                            ...prev,
                            currentQ: prev.currentQ + 1,
                            selected: null,
                            showResult: false
                        }));
                    } else {
                        setQuizState(prev => ({ ...prev, completed: true }));
                    }
                };

                const resetQuiz = () => {
                    setQuizState({
                        currentQ: 0,
                        score: 0,
                        selected: null,
                        showResult: false,
                        completed: false
                    });
                };

                // Track achievement when quiz is completed
                React.useEffect(() => {
                    if (quizState.completed && window.AchievementTracker) {
                        const percentage = Math.round((quizState.score / quizQuestions.length) * 100);
                        window.AchievementTracker.trackQuizComplete('carotid-stenting-quiz', percentage);
                    }
                }, [quizState.completed, quizState.score]);

                if (quizState.completed) {
                    const percentage = Math.round((quizState.score / quizQuestions.length) * 100);
                    return (
                        <div>
                            <Header title="測驗結果" onBack={() => setCurrentPage('home')} />
                            <div style={{ padding: '20px', maxWidth: '600px', margin: '0 auto', textAlign: 'center' }}>
                                <Card>
                                    <div style={{ fontSize: '5rem', marginBottom: '20px' }}>
                                        {percentage >= 80 ? '🎉' : percentage >= 60 ? '👍' : '📚'}
                                    </div>
                                    <h2 style={{ fontSize: '1.5rem', marginBottom: '10px' }}>
                                        {percentage >= 80 ? '太棒了！' : percentage >= 60 ? '不錯喔！' : '繼續加油！'}
                                    </h2>
                                    <div style={{
                                        fontSize: '3rem',
                                        fontWeight: '700',
                                        color: percentage >= 80 ? 'var(--success)' : percentage >= 60 ? '#ed8936' : 'var(--accent)',
                                        marginBottom: '10px'
                                    }}>
                                        {quizState.score} / {quizQuestions.length}
                                    </div>
                                    <p style={{ color: 'var(--text-muted)', marginBottom: '30px' }}>
                                        正確率：{percentage}%
                                    </p>
                                    <button
                                        onClick={resetQuiz}
                                        style={{
                                            padding: '14px 40px',
                                            background: 'var(--info)',
                                            border: 'none',
                                            borderRadius: '10px',
                                            color: 'white',
                                            fontSize: '16px',
                                            cursor: 'pointer'
                                        }}
                                    >
                                        重新測驗
                                    </button>
                                </Card>
                            </div>
                        </div>
                    );
                }

                return (
                    <div>
                        <Header 
                            title="自我測驗" 
                            subtitle={`第 ${quizState.currentQ + 1} / ${quizQuestions.length} 題`}
                            onBack={() => setCurrentPage('home')} 
                        />
                        <div style={{ padding: '20px', maxWidth: '600px', margin: '0 auto' }}>
                            <ProgressBar current={quizState.currentQ + 1} total={quizQuestions.length} />
                            
                            <Card>
                                <h3 style={{ fontSize: '1.1rem', marginBottom: '20px', lineHeight: '1.6' }}>
                                    {currentQuestion.q}
                                </h3>
                                {currentQuestion.options.map((option, idx) => (
                                    <div
                                        key={idx}
                                        onClick={() => handleAnswer(idx)}
                                        style={{
                                            padding: '16px',
                                            background: quizState.showResult
                                                ? idx === currentQuestion.correct
                                                    ? 'rgba(56, 161, 105, 0.2)'
                                                    : idx === quizState.selected
                                                        ? 'rgba(229, 62, 62, 0.2)'
                                                        : 'var(--bg-card-light)'
                                                : 'var(--bg-card-light)',
                                            borderRadius: '10px',
                                            marginBottom: '10px',
                                            cursor: quizState.selected === null ? 'pointer' : 'default',
                                            border: quizState.showResult
                                                ? idx === currentQuestion.correct
                                                    ? '2px solid var(--success)'
                                                    : idx === quizState.selected
                                                        ? '2px solid var(--accent)'
                                                        : '2px solid transparent'
                                                : '2px solid transparent',
                                            display: 'flex',
                                            alignItems: 'center',
                                            gap: '12px'
                                        }}
                                    >
                                        <span style={{
                                            width: '28px',
                                            height: '28px',
                                            background: 'var(--bg-card)',
                                            borderRadius: '50%',
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'center',
                                            fontWeight: '600',
                                            fontSize: '14px'
                                        }}>
                                            {String.fromCharCode(65 + idx)}
                                        </span>
                                        <span>{option}</span>
                                    </div>
                                ))}

                                {quizState.showResult && (
                                    <div style={{
                                        marginTop: '20px',
                                        padding: '16px',
                                        background: 'rgba(49, 130, 206, 0.1)',
                                        borderRadius: '10px',
                                        borderLeft: '4px solid var(--info)'
                                    }}>
                                        <strong>💡 說明：</strong>
                                        <p style={{ marginTop: '8px' }}>{currentQuestion.explanation}</p>
                                    </div>
                                )}

                                {quizState.showResult && (
                                    <button
                                        onClick={nextQuestion}
                                        style={{
                                            width: '100%',
                                            padding: '14px',
                                            background: 'var(--info)',
                                            border: 'none',
                                            borderRadius: '10px',
                                            color: 'white',
                                            fontSize: '16px',
                                            fontWeight: '600',
                                            cursor: 'pointer',
                                            marginTop: '20px'
                                        }}
                                    >
                                        {quizState.currentQ < quizQuestions.length - 1 ? '下一題 →' : '查看結果'}
                                    </button>
                                )}
                            </Card>
                        </div>
                    </div>
                );
            };

            // ==================== RENDER ====================
            const renderPage = () => {
                switch (currentPage) {
                    case 'ward': return <WardPage />;
                    case 'cathlab': return <CathLabPage />;
                    case 'nascet': return <NASCETPage />;
                    case 'education': return <EducationPage />;
                    case 'mrs': return <MRSPage />;
                    case 'quiz': return <QuizPage />;
                    default: return <HomePage />;
                }
            };

            return (
                <div style={{ minHeight: '100vh' }}>
                    {renderPage()}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>

    <!-- Achievement System Scripts -->
    <script src="achievements-config.js"></script>
    <script src="achievements.js"></script>
</body>
</html>
