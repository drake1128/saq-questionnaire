<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAOD 周邊動脈阻塞疾病 - 護理照護教學</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e8e8e8;
        }
        
        .app-container {
            max-width: 100%;
            margin: 0 auto;
            padding-bottom: 80px;
        }
        
        .header {
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            color: white;
            padding: 20px 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
        }
        
        .header h1 {
            font-size: 1.4em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 0.85em;
            opacity: 0.95;
        }
        
        .nav-tabs {
            display: flex;
            overflow-x: auto;
            background: rgba(22, 33, 62, 0.95);
            padding: 10px;
            gap: 8px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            border-bottom: 2px solid #e94560;
        }
        
        .nav-tabs::-webkit-scrollbar {
            display: none;
        }
        
        .nav-tab {
            flex-shrink: 0;
            padding: 10px 16px;
            border-radius: 25px;
            border: none;
            background: rgba(233, 69, 96, 0.2);
            color: #e8e8e8;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .nav-tab.active {
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }
        
        .content {
            padding: 15px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid rgba(233, 69, 96, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.2);
        }
        
        .card-title {
            color: #ff6b6b;
            font-size: 1.1em;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(233, 69, 96, 0.3);
        }
        
        .card-icon {
            font-size: 1.3em;
        }
        
        .info-item {
            padding: 12px;
            margin: 8px 0;
            background: rgba(233, 69, 96, 0.08);
            border-radius: 10px;
            border-left: 4px solid #e94560;
        }
        
        .info-label {
            color: #ff8a8a;
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .info-content {
            color: #e8e8e8;
            font-size: 0.9em;
            line-height: 1.6;
        }
        
        .warning-box {
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.15) 0%, rgba(255, 152, 0, 0.15) 100%);
            border: 1px solid #ffc107;
            border-radius: 12px;
            padding: 15px;
            margin: 12px 0;
        }
        
        .warning-title {
            color: #ffc107;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .danger-box {
            background: linear-gradient(135deg, rgba(244, 67, 54, 0.15) 0%, rgba(233, 30, 99, 0.15) 100%);
            border: 1px solid #f44336;
            border-radius: 12px;
            padding: 15px;
            margin: 12px 0;
        }
        
        .danger-title {
            color: #f44336;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .success-box {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.15) 0%, rgba(102, 187, 106, 0.15) 100%);
            border: 1px solid #4caf50;
            border-radius: 12px;
            padding: 15px;
            margin: 12px 0;
        }
        
        .success-title {
            color: #4caf50;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .checklist-item {
            display: flex;
            align-items: flex-start;
            padding: 12px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .checklist-item:hover {
            background: rgba(233, 69, 96, 0.1);
        }
        
        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #e94560;
            border-radius: 6px;
            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .checkbox.checked {
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
        }
        
        .checklist-text {
            flex: 1;
            font-size: 0.9em;
            line-height: 1.5;
        }
        
        .step-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            border-radius: 50%;
            font-weight: bold;
            font-size: 0.9em;
            margin-right: 12px;
            flex-shrink: 0;
        }
        
        .step-content {
            flex: 1;
        }
        
        .step-title {
            font-weight: bold;
            color: #ff8a8a;
            margin-bottom: 5px;
        }
        
        .medication-card {
            background: linear-gradient(135deg, rgba(63, 81, 181, 0.15) 0%, rgba(103, 58, 183, 0.15) 100%);
            border: 1px solid #5c6bc0;
            border-radius: 12px;
            padding: 15px;
            margin: 10px 0;
        }
        
        .med-name {
            color: #7986cb;
            font-weight: bold;
            font-size: 1em;
            margin-bottom: 5px;
        }
        
        .med-detail {
            color: #b0bec5;
            font-size: 0.85em;
            line-height: 1.5;
        }
        
        .assessment-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 15px 0;
        }
        
        .assessment-item {
            background: rgba(233, 69, 96, 0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(233, 69, 96, 0.3);
        }
        
        .assessment-icon {
            font-size: 2em;
            margin-bottom: 8px;
        }
        
        .assessment-label {
            color: #ff8a8a;
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .assessment-desc {
            color: #b0bec5;
            font-size: 0.8em;
        }
        
        .quiz-option {
            padding: 15px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(233, 69, 96, 0.3);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .quiz-option:hover {
            background: rgba(233, 69, 96, 0.15);
            border-color: #e94560;
        }
        
        .quiz-option.selected {
            background: rgba(233, 69, 96, 0.2);
            border-color: #e94560;
        }
        
        .quiz-option.correct {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4caf50;
        }
        
        .quiz-option.incorrect {
            background: rgba(244, 67, 54, 0.2);
            border-color: #f44336;
        }
        
        .quiz-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }
        
        .quiz-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }
        
        .quiz-btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            transition: width 0.5s ease;
        }
        
        .score-display {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.2) 0%, rgba(255, 107, 107, 0.2) 100%);
            border-radius: 20px;
            margin: 20px 0;
        }
        
        .score-number {
            font-size: 3em;
            font-weight: bold;
            color: #ff6b6b;
        }
        
        .score-label {
            color: #b0bec5;
            margin-top: 10px;
        }
        
        .expand-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 15px;
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 12px;
            color: #ff8a8a;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 10px 0;
        }
        
        .expand-btn:hover {
            background: rgba(233, 69, 96, 0.25);
        }
        
        .expand-content {
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 0 0 12px 12px;
            margin-top: -10px;
            margin-bottom: 10px;
        }
        
        .timeline-item {
            display: flex;
            padding: 15px 0;
            border-left: 3px solid #e94560;
            margin-left: 15px;
            padding-left: 20px;
            position: relative;
        }
        
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 18px;
            width: 14px;
            height: 14px;
            background: #e94560;
            border-radius: 50%;
        }
        
        .rutherford-stage {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .stage-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(233, 69, 96, 0.1);
            border-radius: 10px;
            gap: 12px;
        }
        
        .stage-number {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            border-radius: 50%;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .act-flow {
            text-align: center;
            padding: 15px;
            margin: 10px 0;
        }
        
        .act-box {
            display: inline-block;
            padding: 15px 25px;
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.2) 0%, rgba(255, 107, 107, 0.2) 100%);
            border: 2px solid #e94560;
            border-radius: 12px;
            margin: 5px;
            font-weight: bold;
        }
        
        .act-arrow {
            display: block;
            color: #ff6b6b;
            font-size: 1.5em;
            margin: 10px 0;
        }
        
        .search-box {
            padding: 12px 18px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 25px;
            color: #e8e8e8;
            font-size: 0.95em;
            margin-bottom: 15px;
        }
        
        .search-box::placeholder {
            color: #888;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #e94560;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.3);
        }
        
        .tab-section {
            margin-bottom: 20px;
        }
        
        .sub-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        
        .sub-tab {
            padding: 8px 16px;
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 20px;
            color: #e8e8e8;
            cursor: pointer;
            font-size: 0.85em;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        
        .sub-tab.active {
            background: #e94560;
            color: white;
        }
        
        .highlight {
            background: linear-gradient(135deg, rgba(255, 235, 59, 0.2) 0%, rgba(255, 193, 7, 0.2) 100%);
            padding: 2px 6px;
            border-radius: 4px;
            color: #ffc107;
        }
        
        .table-responsive {
            overflow-x: auto;
            margin: 15px 0;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
        }
        
        .data-table th {
            background: rgba(233, 69, 96, 0.3);
            padding: 12px 10px;
            text-align: left;
            color: #ff8a8a;
            font-weight: bold;
        }
        
        .data-table td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .data-table tr:hover {
            background: rgba(233, 69, 96, 0.1);
        }
        
        /* WIfI Score Styles */
        .wifi-section {
            margin: 15px 0;
        }
        
        .wifi-category {
            margin-bottom: 20px;
        }
        
        .wifi-category-title {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.3) 0%, rgba(255, 107, 107, 0.2) 100%);
            border-radius: 12px 12px 0 0;
            font-weight: bold;
            color: #ff8a8a;
        }
        
        .wifi-category-icon {
            font-size: 1.5em;
        }
        
        .wifi-options {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 0 0 12px 12px;
            padding: 10px;
        }
        
        .wifi-option {
            display: flex;
            align-items: flex-start;
            padding: 12px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .wifi-option:hover {
            background: rgba(233, 69, 96, 0.1);
            border-color: rgba(233, 69, 96, 0.3);
        }
        
        .wifi-option.selected {
            background: rgba(233, 69, 96, 0.2);
            border-color: #e94560;
        }
        
        .wifi-grade {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(233, 69, 96, 0.3);
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.2em;
            margin-right: 15px;
            flex-shrink: 0;
        }
        
        .wifi-option.selected .wifi-grade {
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
        }
        
        .wifi-desc {
            flex: 1;
        }
        
        .wifi-desc-title {
            font-weight: bold;
            color: #ff8a8a;
            margin-bottom: 5px;
        }
        
        .wifi-desc-detail {
            color: #b0bec5;
            font-size: 0.85em;
            line-height: 1.5;
        }
        
        .wifi-result {
            background: linear-gradient(135deg, rgba(103, 58, 183, 0.2) 0%, rgba(63, 81, 181, 0.2) 100%);
            border: 2px solid #7c4dff;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }
        
        .wifi-result-title {
            color: #b388ff;
            font-size: 1.1em;
            margin-bottom: 15px;
        }
        
        .wifi-score-display {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .wifi-score-item {
            background: rgba(124, 77, 255, 0.2);
            border-radius: 12px;
            padding: 15px 20px;
            text-align: center;
            min-width: 80px;
        }
        
        .wifi-score-letter {
            font-size: 1.5em;
            font-weight: bold;
            color: #b388ff;
        }
        
        .wifi-score-value {
            font-size: 2em;
            font-weight: bold;
            color: #7c4dff;
        }
        
        .wifi-clinical-stage {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-top: 15px;
        }
        
        .wifi-stage-title {
            color: #ffc107;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .wifi-stage-risk {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .risk-item {
            text-align: center;
            padding: 10px;
        }
        
        .risk-label {
            font-size: 0.8em;
            color: #b0bec5;
            margin-bottom: 5px;
        }
        
        .risk-value {
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .risk-low { color: #4caf50; }
        .risk-moderate { color: #ffc107; }
        .risk-high { color: #ff9800; }
        .risk-very-high { color: #f44336; }
        
        .reset-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: #e8e8e8;
            cursor: pointer;
            font-size: 0.9em;
            margin-top: 15px;
            transition: all 0.3s ease;
        }
        
        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.2em;
            }
            
            .assessment-grid {
                grid-template-columns: 1fr;
            }
            
            .card {
                padding: 15px;
            }
            
            .wifi-score-display {
                gap: 10px;
            }
            
            .wifi-score-item {
                min-width: 70px;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Main App Component
        function App() {
            const [activeTab, setActiveTab] = useState('basics');
            const [searchTerm, setSearchTerm] = useState('');
            
            const tabs = [
                { id: 'basics', label: '📚 基礎知識', icon: '📚' },
                { id: 'diagnosis', label: '🔍 診斷評估', icon: '🔍' },
                { id: 'wifi', label: '📊 WIfI評分', icon: '📊' },
                { id: 'precath', label: '💊 術前準備', icon: '💊' },
                { id: 'cathlab', label: '🏥 導管室', icon: '🏥' },
                { id: 'postcath', label: '🩹 術後照護', icon: '🩹' },
                { id: 'wound', label: '🩺 傷口照護', icon: '🩺' },
                { id: 'quiz', label: '📝 自我測驗', icon: '📝' }
            ];
            
            return (
                <div className="app-container">
                    <header className="header">
                        <h1>🦵 PAOD 周邊動脈阻塞疾病</h1>
                        <p>護理照護完整教學指南</p>
                    </header>
                    
                    <nav className="nav-tabs">
                        {tabs.map(tab => (
                            <button
                                key={tab.id}
                                className={`nav-tab ${activeTab === tab.id ? 'active' : ''}`}
                                onClick={() => setActiveTab(tab.id)}
                            >
                                {tab.label}
                            </button>
                        ))}
                    </nav>
                    
                    <main className="content">
                        <input
                            type="text"
                            className="search-box"
                            placeholder="🔍 搜尋關鍵字..."
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                        />
                        
                        {activeTab === 'basics' && <BasicsSection searchTerm={searchTerm} />}
                        {activeTab === 'diagnosis' && <DiagnosisSection searchTerm={searchTerm} />}
                        {activeTab === 'wifi' && <WIfISection />}
                        {activeTab === 'precath' && <PreCathSection searchTerm={searchTerm} />}
                        {activeTab === 'cathlab' && <CathLabSection searchTerm={searchTerm} />}
                        {activeTab === 'postcath' && <PostCathSection searchTerm={searchTerm} />}
                        {activeTab === 'wound' && <WoundCareSection searchTerm={searchTerm} />}
                        {activeTab === 'quiz' && <QuizSection />}
                    </main>
                </div>
            );
        }
        
        // Expandable Section Component
        function ExpandableSection({ title, children, defaultOpen = false }) {
            const [isOpen, setIsOpen] = useState(defaultOpen);
            
            return (
                <div>
                    <button className="expand-btn" onClick={() => setIsOpen(!isOpen)}>
                        <span>{title}</span>
                        <span>{isOpen ? '▼' : '▶'}</span>
                    </button>
                    {isOpen && <div className="expand-content">{children}</div>}
                </div>
            );
        }

                },
                {
                    question: "下肢循環評估的四個步驟是？",
                    options: ["看、聽、問、切", "看、摸、觸診、問診", "視、觸、叩、聽", "望、聞、問、切"],
                    correct: 1,
                    explanation: "正確順序為：看（顏色傷口）、摸（溫度）、觸診（脈搏）、問診（痛麻酸無力）"
                },
                {
                    question: "WIfI 中的 Ischemia Grade 3 對應的 ABI 範圍是？",
                    options: ["≥ 0.80", "0.6-0.79", "0.4-0.59", "< 0.4"],
                    correct: 3,
                    explanation: "Ischemia Grade 3 (重度缺血)：ABI < 0.4、踝壓 < 50 mmHg"
                },
                {
                    question: "移除 Sheath 後，沙包應加壓多久？",
                    options: ["2 小時", "4 小時", "6 小時", "8 小時"],
                    correct: 3,
                    explanation: "移除 sheath 後以 2 kg 沙包加壓 8 小時"
                },
                {
                    question: "WIfI foot Infection Grade 3 的特徵是？",
                    options: ["無感染", "局部感染紅腫 ≤ 2cm", "局部感染紅腫 > 2cm", "局部感染合併 SIRS 徵象"],
                    correct: 3,
                    explanation: "fI Grade 3 = 局部感染合併全身性發炎反應徵象 (SIRS)"
                }
            ];
            
            const handleAnswer = (index) => {
                if (answered) return;
                setSelectedAnswer(index);
            };
            
            const submitAnswer = () => {
                if (selectedAnswer === null) return;
                setAnswered(true);
                if (selectedAnswer === questions[currentQuestion].correct) {
                    setScore(score + 1);
                }
            };
            
            const nextQuestion = () => {
                if (currentQuestion < questions.length - 1) {
                    setCurrentQuestion(currentQuestion + 1);
                    setSelectedAnswer(null);
                    setAnswered(false);
                } else {
                    setShowResult(true);
                }
            };
            
            const restartQuiz = () => {
                setCurrentQuestion(0);
                setSelectedAnswer(null);
                setShowResult(false);
                setScore(0);
                setAnswered(false);
            };
            
            if (showResult) {
                const percentage = Math.round((score / questions.length) * 100);
                return (
                    <div className="tab-section">
                        <div className="score-display">
                            <div className="score-number">{percentage}%</div>
                            <div className="score-label">
                                {score} / {questions.length} 題正確
                            </div>
                            <div style={{ marginTop: '15px', color: '#b0bec5' }}>
                                {percentage >= 80 ? '🎉 優秀！您對 PAOD 與 WIfI 掌握得很好！' :
                                 percentage >= 60 ? '👍 不錯！再複習一下可以更好！' :
                                 '📚 建議再仔細閱讀各章節內容'}
                            </div>
                        </div>
                        <button className="quiz-btn" onClick={restartQuiz}>
                            🔄 重新測驗
                        </button>
                    </div>
                );
            }
            
            const q = questions[currentQuestion];
            
            return (
                <div className="tab-section">
                    <div className="card">
                        <div className="progress-bar">
                            <div 
                                className="progress-fill" 
                                style={{ width: `${((currentQuestion + 1) / questions.length) * 100}%` }}
                            />
                        </div>
                        
                        <div style={{ textAlign: 'center', marginBottom: '15px', color: '#b0bec5' }}>
                            第 {currentQuestion + 1} / {questions.length} 題
                        </div>
                        
                        <div className="card-title" style={{ borderBottom: 'none', paddingBottom: 0 }}>
                            {q.question}
                        </div>
                        
                        <div style={{ marginTop: '20px' }}>
                            {q.options.map((option, index) => (
                                <div
                                    key={index}
                                    className={`quiz-option 
                                        ${selectedAnswer === index ? 'selected' : ''}
                                        ${answered && index === q.correct ? 'correct' : ''}
                                        ${answered && selectedAnswer === index && index !== q.correct ? 'incorrect' : ''}
                                    `}
                                    onClick={() => handleAnswer(index)}
                                >
                                    {String.fromCharCode(65 + index)}. {option}
                                </div>
                            ))}
                        </div>
                        
                        {answered && (
                            <div className={selectedAnswer === q.correct ? 'success-box' : 'danger-box'}>
                                <div className={selectedAnswer === q.correct ? 'success-title' : 'danger-title'}>
                                    {selectedAnswer === q.correct ? '✅ 正確！' : '❌ 錯誤'}
                                </div>
                                <div className="info-content">{q.explanation}</div>
                            </div>
                        )}
                        
                        {!answered ? (
                            <button 
                                className="quiz-btn" 
                                onClick={submitAnswer}
                                disabled={selectedAnswer === null}
                            >
                                確認答案
                            </button>
                        ) : (
                            <button className="quiz-btn" onClick={nextQuestion}>
                                {currentQuestion < questions.length - 1 ? '下一題 →' : '查看結果'}
                            </button>
                        )}
                    </div>
                </div>
            );
        }
        
        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
