                                <span className="highlight">診斷標準：ABI ≤ 0.9 或血管超音波確認狹窄/阻塞</span>

                                <strong>PTAS</strong> = PTA + Stenting (氣球擴張術併支架置放)<br/>
                                <strong>DSA</strong> = Digital Subtraction Angiography (數位減除血管攝影)<br/>
                                <strong>CAG</strong> = Coronary Angiography (冠狀動脈攝影)<br/><br/>

        function WIfISection() {
            const [woundGrade, setWoundGrade] = useState(null);
            const [ischemiaGrade, setIschemiaGrade] = useState(null);
            const [infectionGrade, setInfectionGrade] = useState(null);

            const woundOptions = [
                { grade: 0, title: '無傷口 / 休息痛', detail: '無潰瘍或壞疽（可能有缺血性休息痛）' },
                { grade: 1, title: '小型淺層潰瘍', detail: '遠端下肢或足部小型淺層潰瘍；無壞疽' },
                { grade: 2, title: '深層潰瘍', detail: '深層潰瘍，暴露骨骼、關節或肌腱；壞疽僅限於腳趾' },
                { grade: 3, title: '廣泛潰瘍/壞疽', detail: '廣泛深層潰瘍；涉及前足或中足的壞疽；跟骨受累' }
            ];

            const ischemiaOptions = [
                { grade: 0, title: '無缺血', detail: 'ABI ≥ 0.80、踝壓 > 100 mmHg、趾壓/TcPO2 ≥ 60 mmHg、SPP ≥ 50 mmHg' },
                { grade: 1, title: '輕度缺血', detail: 'ABI 0.6-0.79、踝壓 70-100 mmHg、趾壓/TcPO2 40-59 mmHg、SPP 40-50 mmHg' },
                { grade: 2, title: '中度缺血', detail: 'ABI 0.4-0.59、踝壓 50-70 mmHg、趾壓/TcPO2 30-39 mmHg、SPP 30-40 mmHg' },
                { grade: 3, title: '重度缺血', detail: 'ABI < 0.4、踝壓 < 50 mmHg、趾壓/TcPO2 < 30 mmHg、SPP < 30 mmHg' }
            ];

            const infectionOptions = [
                { grade: 0, title: '無感染', detail: '無感染症狀或徵象' },
                { grade: 1, title: '輕度感染', detail: '局部感染僅涉及皮膚和皮下組織；潰瘍周圍紅腫 > 0.5cm 但 ≤ 2cm；排除其他原因導致的發炎反應' },
                { grade: 2, title: '中度感染', detail: '局部感染紅腫 > 2cm 或涉及比皮膚更深層結構（膿瘍、骨髓炎、敗血性關節炎、筋膜炎）；無全身性發炎反應徵象' },
                { grade: 3, title: '重度感染', detail: '局部感染合併 SIRS 徵象（體溫 > 38°C 或 < 36°C、HR > 90、RR > 20、WBC > 12000 或 < 4000）' }
            ];

            const getClinicalStage = () => {
                if (woundGrade === null || ischemiaGrade === null || infectionGrade === null) return null;
                const w = woundGrade, i = ischemiaGrade, f = infectionGrade;
                if (w === 0 && i <= 1 && f === 0) return { stage: 1, risk: 'very-low', amputation: '極低', benefit: '低' };
                if ((w === 1 && i <= 1 && f <= 1) || (w === 0 && i <= 2 && f <= 1)) return { stage: 2, risk: 'low', amputation: '低', benefit: '中' };
                if ((w === 2 && i <= 2 && f <= 1) || (w === 1 && i === 2 && f <= 1) || (w <= 1 && i <= 2 && f === 2)) return { stage: 3, risk: 'moderate', amputation: '中', benefit: '中-高' };
                if ((w === 3) || (i === 3) || (f === 3) || (w === 2 && f === 2) || (w === 2 && i === 2 && f >= 1)) return { stage: 4, risk: 'high', amputation: '高', benefit: '高' };
                return { stage: 3, risk: 'moderate', amputation: '中', benefit: '中' };
            };

            const resetScores = () => { setWoundGrade(null); setIschemiaGrade(null); setInfectionGrade(null); };
            const clinicalStage = getClinicalStage();

            return (
                <div className="tab-section">
                    <div className="card">
                        <div className="card-title"><span className="card-icon"></span>WIfI 分類系統簡介</div>
                        <div className="info-item">
                            <div className="info-label">什麼是 WIfI？</div>
                            <div className="info-content">
                                <strong>W</strong>ound (傷口) + <strong>I</strong>schemia (缺血) + <strong>f</strong>oot <strong>I</strong>nfection (足部感染)<br/><br/>
                                由 SVS (Society for Vascular Surgery) 於 2014 年提出，用於評估<span className="highlight">慢性肢體威脅性缺血 (CLTI)</span> 的嚴重程度，預測截肢風險及血管重建效益。
                            </div>
                        </div>
                        <div className="success-box">
                            <div className="success-title">臨床應用</div>
                            <div className="info-content">
                                • 預測 1 年內截肢風險<br/>
                                • 評估血管重建手術效益<br/>
                                • 出院病摘中需記錄 WIfI Classification<br/>
                                • 標準化傷口評估與交班
                            </div>
                        </div>
                    </div>

                    <div className="card">
                        <div className="card-title"><span className="card-icon"></span>WIfI 互動評分表</div>
                        <p style={{ color: '#b0bec5', marginBottom: '15px', fontSize: '0.9em' }}>
                            請依序選擇病患的傷口、缺血、感染程度，系統將自動計算臨床分期與風險
                        </p>

                        <div className="wifi-category">
                            <div className="wifi-category-title">
                                <span className="wifi-category-icon"></span>
                                <span>W - Wound 傷口分級</span>
                                {woundGrade !== null && <span style={{ marginLeft: 'auto', color: '#4caf50' }}>已選擇: Grade {woundGrade}</span>}
                            </div>
                            <div className="wifi-options">
                                {woundOptions.map((opt) => (
                                    <div key={opt.grade} className={`wifi-option ${woundGrade === opt.grade ? 'selected' : ''}`} onClick={() => setWoundGrade(opt.grade)}>
                                        <div className="wifi-grade">{opt.grade}</div>
                                        <div className="wifi-desc">
                                            <div className="wifi-desc-title">{opt.title}</div>
                                            <div className="wifi-desc-detail">{opt.detail}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="wifi-category">
                            <div className="wifi-category-title">
                                <span className="wifi-category-icon"></span>
                                <span>I - Ischemia 缺血分級</span>
                                {ischemiaGrade !== null && <span style={{ marginLeft: 'auto', color: '#4caf50' }}>已選擇: Grade {ischemiaGrade}</span>}
                            </div>
                            <div className="wifi-options">
                                {ischemiaOptions.map((opt) => (
                                    <div key={opt.grade} className={`wifi-option ${ischemiaGrade === opt.grade ? 'selected' : ''}`} onClick={() => setIschemiaGrade(opt.grade)}>
                                        <div className="wifi-grade">{opt.grade}</div>
                                        <div className="wifi-desc">
                                            <div className="wifi-desc-title">{opt.title}</div>
                                            <div className="wifi-desc-detail">{opt.detail}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="wifi-category">
                            <div className="wifi-category-title">
                                <span className="wifi-category-icon"></span>
                                <span>fI - foot Infection 足部感染分級</span>
                                {infectionGrade !== null && <span style={{ marginLeft: 'auto', color: '#4caf50' }}>已選擇: Grade {infectionGrade}</span>}
                            </div>
                            <div className="wifi-options">
                                {infectionOptions.map((opt) => (
                                    <div key={opt.grade} className={`wifi-option ${infectionGrade === opt.grade ? 'selected' : ''}`} onClick={() => setInfectionGrade(opt.grade)}>
                                        <div className="wifi-grade">{opt.grade}</div>
                                        <div className="wifi-desc">
                                            <div className="wifi-desc-title">{opt.title}</div>
                                            <div className="wifi-desc-detail">{opt.detail}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="wifi-result">
                            <div className="wifi-result-title">WIfI 評分結果</div>
                            <div className="wifi-score-display">
                                <div className="wifi-score-item"><div className="wifi-score-letter">W</div><div className="wifi-score-value">{woundGrade !== null ? woundGrade : '-'}</div></div>
                                <div className="wifi-score-item"><div className="wifi-score-letter">I</div><div className="wifi-score-value">{ischemiaGrade !== null ? ischemiaGrade : '-'}</div></div>
                                <div className="wifi-score-item"><div className="wifi-score-letter">fI</div><div className="wifi-score-value">{infectionGrade !== null ? infectionGrade : '-'}</div></div>
                            </div>

                            {clinicalStage ? (
                                <div className="wifi-clinical-stage">
                                    <div className="wifi-stage-title">臨床分期: Stage {clinicalStage.stage}</div>
                                    <div className="wifi-stage-risk">
                                        <div className="risk-item"><div className="risk-label">1年截肢風險</div><div className={`risk-value risk-${clinicalStage.risk}`}>{clinicalStage.amputation}</div></div>
                                        <div className="risk-item"><div className="risk-label">血管重建效益</div><div className={`risk-value risk-${clinicalStage.risk === 'very-low' ? 'low' : clinicalStage.risk}`}>{clinicalStage.benefit}</div></div>
                                    </div>
                                    {clinicalStage.stage === 1 && <div className="success-box" style={{ marginTop: '15px' }}><div className="info-content"><strong>Stage 1 (極低風險)：</strong>傷口癒合機率高，可先嘗試保守治療</div></div>}
                                    {clinicalStage.stage === 2 && <div className="info-item" style={{ marginTop: '15px' }}><div className="info-content"><strong>Stage 2 (低風險)：</strong>大多數傷口可癒合，建議積極藥物治療</div></div>}
                                    {clinicalStage.stage === 3 && <div className="warning-box" style={{ marginTop: '15px' }}><div className="info-content"><strong>Stage 3 (中度風險)：</strong>建議考慮血管重建介入治療</div></div>}
                                    {clinicalStage.stage === 4 && <div className="danger-box" style={{ marginTop: '15px' }}><div className="info-content"><strong>Stage 4 (高風險)：</strong>迫切需要血管重建，截肢風險高</div></div>}
                                </div>
                            ) : (
                                <div style={{ color: '#888', marginTop: '15px' }}>請完成所有三項評估以獲得臨床分期結果</div>
                            )}
                            <button className="reset-btn" onClick={resetScores}>重新評估</button>
                        </div>
                    </div>

                    <div className="card">
                        <div className="card-title"><span className="card-icon"></span>WIfI 臨床分期對照表</div>
                        <div className="table-responsive">
                            <table className="data-table">
                                <thead><tr><th>臨床分期</th><th>1年截肢風險</th><th>血管重建效益</th><th>建議處置</th></tr></thead>
                                <tbody>

                                    <tr><td><span className="highlight">Stage 2</span></td><td style={{ color: '#8bc34a' }}>低 (5-20%)</td><td>中</td><td>積極藥物治療</td></tr>
                                    <tr><td><span className="highlight">Stage 3</span></td><td style={{ color: '#ffc107' }}>中 (20-50%)</td><td>中-高</td><td>考慮血管重建</td></tr>
                                    <tr><td><span className="highlight">Stage 4</span></td><td style={{ color: '#f44336' }}>高 (&gt;50%)</td><td>高</td><td>迫切血管重建</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="card">
                        <div className="card-title"><span className="card-icon"></span>病歷記錄範例</div>
                        <div className="info-item">
                            <div className="info-label">WIfI Classification 記錄格式</div>

                                    WIfI Classification: W2-I2-fI1, Clinical Stage 3<br/>
                                    - Wound: Grade 2 (deep ulcer with toe gangrene)<br/>
                                    - Ischemia: Grade 2 (ABI 0.45, ankle pressure 55 mmHg)<br/>
                                    - foot Infection: Grade 1 (local cellulitis &lt; 2cm)
                                </code>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function QuizSection() {
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [showResult, setShowResult] = useState(false);
            const [score, setScore] = useState(0);
            const [answered, setAnswered] = useState(false);

            const questions = [
                { question: "PAOD 的診斷標準 ABI 值為何？", options: ["≤ 0.7", "≤ 0.8", "≤ 0.9", "≤ 1.0"], correct: 2, explanation: "ABI ≤ 0.9 為週邊血管疾病的診斷標準" },
                { question: "WIfI 分類系統中的「I」代表什麼？", options: ["Inflammation (發炎)", "Infection (感染)", "Ischemia (缺血)", "Injury (損傷)"], correct: 2, explanation: "WIfI = Wound(傷口) + Ischemia(缺血) + foot Infection(足部感染)" },
                { question: "Critical Limb Ischemia (CLI) 與 Acute Limb Ischemia (ALI) 的主要區別是？", options: ["CLI 是急性發作，ALI 是慢性進展", "CLI 是慢性進展，ALI 是兩週內快速惡化", "兩者沒有區別", "CLI 只影響上肢"], correct: 1, explanation: "CLI 是慢性下肢動脈狹窄緩慢進展，ALI 是兩週內新發生且快速惡化" },
                { question: "移除 Sheath 前，ACT 必須小於多少秒？", options: ["100 秒", "150 秒", "200 秒", "250 秒"], correct: 1, explanation: "ACT 必須小於 150 秒才可以移除 sheath" },
                { question: "若 Sheath 反抽沒有回血，應該怎麼做？", options: ["打 Normal Saline 進去沖洗", "絕對不能打 Normal Saline，應通知醫師", "直接移除 Sheath", "等待 30 分鐘後再嘗試"], correct: 1, explanation: "絕對不能打 N/S 進去，因為可能已有血塊，打進去會把血塊往腳底沖，造成 gangrene" },
                { question: "Rutherford Category 4 代表什麼？", options: ["輕度間歇性跛行", "中度間歇性跛行", "重度間歇性跛行", "休息痛"], correct: 3, explanation: "Category 4 表示休息痛 (Resting Pain)，ABI < 0.4，脈搏消失，肢體冷" },
                { question: "下肢循環評估的四個步驟是？", options: ["看、聽、問、切", "看、摸、觸診、問診", "視、觸、叩、聽", "望、聞、問、切"], correct: 1, explanation: "正確順序為：看（顏色傷口）、摸（溫度）、觸診（脈搏）、問診（痛麻酸無力）" },
                { question: "ALI 病患除了 CLI 用藥外，還需要加上什麼？", options: ["只需要 Aspirin", "Alprostadil (Promostan) + Anticoagulant", "只需要 PPI", "不需要額外用藥"], correct: 1, explanation: "ALI 需要 CLI 藥物加上 Alprostadil/PGE1 (Promostan) 6 amp in N/S 500ml pump 21ml/hr 及抗凝血劑。PGE1 透過血管擴張、抑制血小板聚集及改善微循環發揮作用" },
                { question: "Cilostazol 的絕對禁忌症是什麼？", options: ["CKD stage 5", "NYHA Class III-IV 心衰竭", "肝硬化 Child-Pugh A", "年齡 > 80 歲"], correct: 1, explanation: "Cilostazol 為 PDE-III 抑制劑，在 NYHA Class III-IV 心衰竭患者絕對禁忌，因同類藥物長期口服會增加死亡風險。CKD 不需調整劑量（肝臟代謝為主）" },
                { question: "Rivaroxaban 用於 PAD 的「血管劑量」為何？", options: ["20 mg QD", "15 mg BID", "2.5 mg BID + Aspirin", "10 mg QD"], correct: 2, explanation: "PAD 的 Dual Pathway Inhibition 使用 Rivaroxaban 2.5 mg BID（血管劑量）+ Aspirin 100 mg/day，來自 COMPASS 及 VOYAGER PAD 試驗。注意此劑量遠低於 AF 治療劑量 (20 mg QD)" },
                { question: "移除 Sheath 後，沙包應加壓多久？", options: ["2 小時", "4 小時", "6 小時", "8 小時"], correct: 3, explanation: "移除 sheath 後以 2 kg 沙包加壓 8 小時" },
                { question: "糖尿病合併 PAD 病患的 LDL 目標為？", options: ["< 100 mg/dL", "< 70 mg/dL", "< 55 mg/dL", "< 40 mg/dL"], correct: 2, explanation: "根據 2024 ACC/AHA 指南，目標 LDL < 55 mg/dL" },
                { question: "WIfI Clinical Stage 4 的 1 年截肢風險為？", options: ["極低 (<5%)", "低 (5-20%)", "中 (20-50%)", "高 (>50%)"], correct: 3, explanation: "Stage 4 為高風險，1年截肢風險 >50%，迫切需要血管重建" },
                { question: "根據 NTUH 新竹分院數據，CAD 病患合併嚴重 PAD 的比例約為多少？", options: ["5%", "10%", "15.4%", "25%"], correct: 2, explanation: "根據 NTUH 新竹 2015-2020 數據，約 15.4% 的 CAD 病患合併嚴重 PAD" },
                { question: "PAD 病患有典型間歇性跛行症狀的比例約為多少？", options: ["10%", "32%", "50%", "75%"], correct: 1, explanation: "僅約 32% 的 PAD 病患有典型間歇性跛行症狀，大多數症狀不典型或無症狀" },
                { question: "當 ABI > 1.3 時，應如何處理？", options: ["確診為 PAD", "視為正常", "需做 TBI、SPP 或血管超音波確認", "立即轉介血管外科"], correct: 2, explanation: "ABI > 1.3 表示血管不可壓縮（常見於 DM/CKD 病患的動脈鈣化），此時 ABI 不可靠，需改用 TBI、SPP 或血管超音波" },
                { question: "SPP (皮膚灌流壓) 的主要優點是什麼？", options: ["測量速度快", "不受血管鈣化影響", "可同時測量雙腳", "不需要特殊儀器"], correct: 1, explanation: "SPP 使用雷射都卜勒測量微循環，最大優點是不受血管鈣化影響，適用於糖尿病、洗腎等血管鈣化嚴重的病人" },
                { question: "SPP < 30 mmHg 代表什麼臨床意義？", options: ["正常灌流", "輕度缺血，可觀察", "中度缺血，邊緣性癒合", "重度缺血，傷口癒合困難"], correct: 3, explanation: "SPP < 30 mmHg 代表重度缺血 (CLI)，傷口癒合困難，需要血管重建介入治療" },
                { question: "TASC Type D 病灶的建議治療方式？", options: ["一定要血管內介入", "優先考慮外科繞道手術", "只能藥物治療", "不需要治療"], correct: 1, explanation: "TASC Type D 病灶建議優先考慮外科繞道手術，但高風險病患仍可嘗試血管介入" },
                { question: "Technical Success 的定義是殘餘狹窄小於多少？", options: ["10%", "20%", "30%", "50%"], correct: 2, explanation: "Technical Success 定義為殘餘狹窄 < 30%" },
                { question: "WIfI 中的 Ischemia Grade 3 對應的 ABI 範圍是？", options: ["≥ 0.80", "0.6-0.79", "0.4-0.59", "< 0.4"], correct: 3, explanation: "Ischemia Grade 3 (重度缺血)：ABI < 0.4、踝壓 < 50 mmHg、SPP < 30 mmHg" },
                { question: "根據本院統計，血管介入治療的整體併發症發生率約為？", options: ["< 1%", "1-5%", "5-10%", "> 10%"], correct: 0, explanation: "根據本院 2012-2017 統計，所有併發症發生率均 < 1%，整體安全性極高" }
            ];

            const handleAnswer = (index) => { if (answered) return; setSelectedAnswer(index); };
            const submitAnswer = () => {
                if (selectedAnswer === null) return;
                setAnswered(true);
                if (selectedAnswer === questions[currentQuestion].correct) { setScore(score + 1); }
            };
            const nextQuestion = () => {
                if (currentQuestion < questions.length - 1) {
                    setCurrentQuestion(currentQuestion + 1);
                    setSelectedAnswer(null);
                    setAnswered(false);
                } else { setShowResult(true); }
            };
            const restartQuiz = () => { setCurrentQuestion(0); setSelectedAnswer(null); setShowResult(false); setScore(0); setAnswered(false); };

            if (showResult) {
                const percentage = Math.round((score / questions.length) * 100);
                return (
                    <div className="tab-section">
                        <div className="score-display">
                            <div className="score-number">{percentage}%</div>
                            <div className="score-label">{score} / {questions.length} 題正確</div>
                            <div style={{ marginTop: '15px', color: '#b0bec5' }}>
                                {percentage >= 80 ? '優秀！您對 PAOD 護理照護掌握得很好！' : percentage >= 60 ? '不錯！再複習一下可以更好！' : '建議再仔細閱讀各章節內容'}
                            </div>
                        </div>
                        <button className="quiz-btn" onClick={restartQuiz}>重新測驗</button>
                    </div>
                );
            }

            const q = questions[currentQuestion];
            return (
                <div className="tab-section">
                    <div className="card">
                        <div className="progress-bar"><div className="progress-fill" style={{ width: `${((currentQuestion + 1) / questions.length) * 100}%` }} /></div>
                        <div style={{ textAlign: 'center', marginBottom: '15px', color: '#b0bec5' }}>第 {currentQuestion + 1} / {questions.length} 題</div>
                        <div className="card-title" style={{ borderBottom: 'none', paddingBottom: 0 }}>{q.question}</div>
                        <div style={{ marginTop: '20px' }}>
                            {q.options.map((option, index) => (
                                <div key={index} className={`quiz-option ${selectedAnswer === index ? 'selected' : ''} ${answered && index === q.correct ? 'correct' : ''} ${answered && selectedAnswer === index && index !== q.correct ? 'incorrect' : ''}`} onClick={() => handleAnswer(index)}>
                                    {String.fromCharCode(65 + index)}. {option}
                                </div>
                            ))}
                        </div>
                        {answered && (
                            <div className={selectedAnswer === q.correct ? 'success-box' : 'danger-box'}>
                                <div className={selectedAnswer === q.correct ? 'success-title' : 'danger-title'}>{selectedAnswer === q.correct ? '正確！' : '錯誤'}</div>
                                <div className="info-content">{q.explanation}</div>
                            </div>
                        )}
                        {!answered ? (
                            <button className="quiz-btn" onClick={submitAnswer} disabled={selectedAnswer === null}>確認答案</button>
                        ) : (
                            <button className="quiz-btn" onClick={nextQuestion}>{currentQuestion < questions.length - 1 ? '下一題 →' : '查看結果'}</button>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>

    <!-- Floating Share Button JavaScript -->
    <script>
        // Initialize QR Code when page loads
        document.addEventListener('DOMContentLoaded', function() {
            initFloatingShareButton();
        });

        function initFloatingShareButton() {
            const pageUrl = window.location.href;
            const qrImg = document.getElementById('floatingQRCode');
            if (qrImg) {
                qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(pageUrl)}`;
            }
        }

        function toggleFloatingShareMenu() {
            const menu = document.getElementById('floatingShareMenu');
            if (menu) {
                menu.classList.toggle('active');
            }
        }

        function floatingShareLine() {
            const pageUrl = window.location.href;
            window.open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(pageUrl)}`, '_blank');
        }

        function floatingShareEmail() {
            const pageUrl = window.location.href;
            const pageTitle = 'PAOD 周邊動脈阻塞疾病 - 糖尿病足照護完整指南';
            const subject = encodeURIComponent(pageTitle);
            const body = encodeURIComponent(`推薦您這份 PAOD 教學資源：\n\n${pageUrl}\n\n內容包含最新 NEJM 2026 回顧文獻的治療建議。`);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        function floatingCopyLink() {
            const pageUrl = window.location.href;
            navigator.clipboard.writeText(pageUrl).then(() => {
                alert('連結已複製到剪貼簿！');
            }).catch(err => {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = pageUrl;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('連結已複製到剪貼簿！');
            });
        }

        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const shareButton = document.querySelector('.floating-share-button');
            const menu = document.getElementById('floatingShareMenu');
            if (shareButton && menu && !shareButton.contains(event.target)) {
                menu.classList.remove('active');
            }
        });
    </script>
