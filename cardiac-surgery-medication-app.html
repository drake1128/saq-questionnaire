                        questionId: prev.questions[prev.currentQuestion].id,

                        correct: prev.questions[prev.currentQuestion].correct

                        showResult: true

                                                <span className={`w-8 h-8 rounded-full flex items-center justify-center mr-3 ${
                                                    quizState.showExplanation && idx === currentQ.correct
                                                        ? 'bg-green-600 text-white'
                                                        : quizState.showExplanation && idx === quizState.selectedAnswer && idx !== currentQ.correct
                                                        ? 'bg-red-600 text-white'
                                                        : 'bg-gray-700 text-gray-300'
                                                }`}>
                                                    {String.fromCharCode(65 + idx)}
                                                </span>
                                                <span>{option}</span>
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>

                            {quizState.showExplanation && (
                                <div className={`rounded-xl p-4 ${
                                    quizState.selectedAnswer === currentQ.correct
                                        ? 'bg-green-900/30 border border-green-700'
                                        : 'bg-red-900/30 border border-red-700'
                                }`}>
                                    <div className="flex items-center mb-2">
                                        <span className={`text-xl mr-2 ${
                                            quizState.selectedAnswer === currentQ.correct
                                                ? 'text-green-400'
                                                : 'text-red-400'
                                        }`}>
                                            {quizState.selectedAnswer === currentQ.correct ? '✓ 答對了！' : '✗ 答錯了'}
                                        </span>
                                    </div>
                                    <p className="text-gray-300 text-sm">
                                        {currentQ.explanation}
                                    </p>
                                </div>
                            )}

                            {quizState.showExplanation && (
                                <button
                                    onClick={nextQuestion}
                                    className="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-bold text-lg"
                                >
                                    {quizState.currentQuestion < quizState.questions.length - 1 ? '下一題 →' : '查看結果'}
                                </button>
                            )}
                        </div>
                    </div>
                );
            };

            // 搜尋頁面
            const SearchPage = () => {
                const results = searchDrugs(searchTerm);

                return (
                    <div className="section-enter pt-16 pb-6">
                        <div className="gradient-header p-4">
                            <h1 className="text-xl font-bold text-white text-center mb-3">
                                藥物搜尋
                            </h1>
                            <div className="relative">
                                <input
                                    type="text"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    placeholder="輸入藥名（商品名或學名）"
                                    className="w-full bg-gray-800 text-white placeholder-gray-500 rounded-xl px-4 py-3 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                />
                                <span className="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500">
                                    🔍
                                </span>
                            </div>
                        </div>

                        <div className="px-4 py-4">
                            {!searchTerm ? (
                                <div className="text-center py-12">
                                    <div className="text-5xl mb-4">💊</div>
                                    <p className="text-gray-400">輸入藥名開始搜尋</p>
                                    <p className="text-gray-500 text-sm mt-2">
                                        例如：Plavix、Eliquis、Jardiance
                                    </p>
                                </div>
                            ) : results.length === 0 ? (
                                <div className="text-center py-12">
                                    <div className="text-5xl mb-4">🔍</div>
                                    <p className="text-gray-400">找不到符合的藥物</p>
                                    <p className="text-gray-500 text-sm mt-2">
                                        請嘗試其他關鍵字
                                    </p>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {results.map((drug, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => setSelectedDrug(drug)}
                                            className={`w-full p-4 rounded-xl text-left card-shadow ${
                                                drug.typeKey === 'continue' ? 'bg-green-900/40 border border-green-700' :
                                                drug.typeKey === 'optional' ? 'bg-yellow-900/40 border border-yellow-700' :
                                                drug.typeKey === 'stop' ? 'bg-red-900/40 border border-red-700' :
                                                'bg-blue-900/40 border border-blue-700'
                                            }`}
                                        >
                                            <div className="flex items-center justify-between">
                                                <div>
                                                    <h3 className="text-white font-bold">{drug.brand}</h3>
                                                    <p className="text-gray-400 text-sm">{drug.generic}</p>
                                                </div>
                                                <span className={`text-xs px-3 py-1 rounded-full ${
                                                    drug.typeKey === 'continue' ? 'bg-green-700 text-green-200' :
                                                    drug.typeKey === 'optional' ? 'bg-yellow-700 text-yellow-200' :
                                                    drug.typeKey === 'stop' ? 'bg-red-700 text-red-200' :
                                                    'bg-blue-700 text-blue-200'
                                                }`}>
                                                    {drug.stopTime || drug.type}
                                                </span>
                                            </div>
                                            <p className="text-gray-500 text-xs mt-2">{drug.category}</p>
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // 藥物詳情彈窗
            const DrugModal = () => {
                if (!selectedDrug) return null;

                return (
                    <div 
                        className="fixed inset-0 bg-black/80 z-50 flex items-end justify-center"
                        onClick={() => setSelectedDrug(null)}
                    >
                        <div 
                            className="bg-gray-800 rounded-t-3xl w-full max-w-lg p-6 pb-8"
                            onClick={(e) => e.stopPropagation()}
                        >
                            <div className="w-12 h-1 bg-gray-600 rounded-full mx-auto mb-4"></div>
                            
                            <div className="text-center mb-4">
                                <h2 className="text-2xl font-bold text-white">{selectedDrug.brand}</h2>
                                <p className="text-gray-400">{selectedDrug.generic}</p>
                            </div>

                            <div className="space-y-3">
                                <div className="bg-gray-700 rounded-xl p-4">
                                    <p className="text-gray-400 text-sm">藥物分類</p>
                                    <p className="text-white font-medium">{selectedDrug.category}</p>
                                </div>

                                <div className={`rounded-xl p-4 ${
                                    selectedDrug.typeKey === 'continue' ? 'bg-green-900/50' :
                                    selectedDrug.typeKey === 'optional' ? 'bg-yellow-900/50' :
                                    selectedDrug.typeKey === 'stop' ? 'bg-red-900/50' :
                                    'bg-blue-900/50'
                                }`}>
                                    <p className="text-gray-400 text-sm">術前處置</p>
                                    <p className={`font-bold ${
                                        selectedDrug.typeKey === 'continue' ? 'text-green-300' :
                                        selectedDrug.typeKey === 'optional' ? 'text-yellow-300' :
                                        selectedDrug.typeKey === 'stop' ? 'text-red-300' :
                                        'text-blue-300'
                                    }`}>
                                        {selectedDrug.stopTime ? `術前 ${selectedDrug.stopTime} 停用` : selectedDrug.type}
                                    </p>
                                </div>

                                {selectedDrug.reason && (
                                    <div className="bg-gray-700 rounded-xl p-4">
                                        <p className="text-gray-400 text-sm">處置原因</p>
                                        <p className="text-gray-200 text-sm">{selectedDrug.reason}</p>
                                    </div>
                                )}
                            </div>

                            <button
                                onClick={() => setSelectedDrug(null)}
                                className="w-full bg-gray-700 hover:bg-gray-600 text-white py-3 rounded-xl font-medium mt-4"
                            >
                                關閉
                            </button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-gray-900 text-white max-w-lg mx-auto">
                    {currentSection === 'home' && <HomePage />}
                    {currentSection === 'categories' && <CategoriesPage />}
                    {currentSection === 'timeline' && <TimelinePage />}
                    {currentSection === 'quiz' && <QuizPage />}
                    {currentSection === 'search' && <SearchPage />}
                    
                    <Navigation />
                    <DrugModal />
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>

    <!-- Achievement System Scripts -->
    <script src="achievements-config.js"></script>
    <script src="achievements.js"></script>
</body>
</html>
