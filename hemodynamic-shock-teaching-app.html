    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #1a365d;
            --primary-light: #2c5282;
            --accent: #e53e3e;
            --success: #38a169;
            --warning: #d69e2e;
            --info: #3182ce;
            --purple: #805ad5;
            --teal: #319795;
            --orange: #dd6b20;
            --bg-dark: #1a202c;
            --bg-card: #2d3748;
            --bg-card-light: #4a5568;
            --text-light: #f7fafc;
            --text-muted: #a0aec0;
            --shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        
        #root { min-height: 100vh; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
            75% { transform: scale(1.05); }
        }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .slide-in { animation: slideIn 0.3s ease-out forwards; }
        .pulse { animation: pulse 2s infinite; }
        .heartbeat { animation: heartbeat 1.5s infinite; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }
        
        .shock-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }
        
        .shock-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        
        .param-up { color: #fc8181; }
        .param-down { color: #68d391; }
        .param-normal { color: #a0aec0; }
        
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>

                                        height: '100px',
                                        borderRadius: '50%',
                                        background: 'var(--bg-dark)',
                                        display: 'flex',
                                        flexDirection: 'column',
                                        alignItems: 'center',
                                        justifyContent: 'center'
                                    }}>
                                        <div style={{ fontSize: '28px', fontWeight: '700' }}>{percentage}%</div>
                                        <div style={{ fontSize: '13px', color: 'var(--text-muted)' }}>{score}/{questions.length}</div>
                                    </div>
                                </div>

                                <h2 style={{ fontSize: '20px', marginBottom: '8px' }}>
                                    {percentage >= 80 ? '🎉 優秀！' : percentage >= 60 ? '👍 不錯！' : '💪 繼續加油！'}
                                </h2>
                                <p style={{ color: 'var(--text-muted)', marginBottom: '24px' }}>
                                    {percentage >= 80 ? '你對血流動力學有很好的掌握！' : 
                                     percentage >= 60 ? '再複習一下可以更進步！' : 
                                     '建議重新閱讀教材後再測驗'}
                                </p>

                                <button
                                    onClick={restartQuiz}
                                    style={{
                                        padding: '14px 32px',
                                        background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                        color: 'white',
                                        border: 'none',
                                        borderRadius: '12px',
                                        fontSize: '16px',
                                        fontWeight: '600',
                                        cursor: 'pointer'
                                    }}
                                >
                                    重新測驗
                                </button>
                            </div>
                        </div>
                    );
                }

                const q = questions[currentQ];

                return (
                    <div className="fade-in">
                        <Header title="自我測驗" subtitle={`問題 ${currentQ + 1} / ${questions.length}`} showBack />
                        <div style={{ padding: '0 16px' }}>
                            <div style={{ 
                                height: '6px', 
                                background: 'rgba(255,255,255,0.1)', 
                                borderRadius: '3px',
                                marginBottom: '20px',
                                overflow: 'hidden'
                            }}>
                                <div style={{
                                    height: '100%',
                                    width: `${((currentQ + 1) / questions.length) * 100}%`,
                                    background: 'linear-gradient(90deg, #667eea, #764ba2)',
                                    transition: 'width 0.3s ease'
                                }}/>
                            </div>

                            <div className="shock-card" style={{ marginBottom: '16px' }}>
                                <h3 style={{ fontSize: '16px', fontWeight: '600', lineHeight: '1.6' }}>
                                    {q.q}
                                </h3>
                            </div>

                            {q.options.map((opt, idx) => {
                                let bgColor = 'rgba(255,255,255,0.05)';
                                let borderColor = 'rgba(255,255,255,0.1)';

                                if (showResult) {
                                    if (idx === q.correct) {
                                        bgColor = 'rgba(104,211,145,0.2)';
                                        borderColor = '#68d391';
                                    } else if (idx === selected) {
                                        bgColor = 'rgba(252,129,129,0.2)';
                                        borderColor = '#fc8181';
                                    }
                                } else if (idx === selected) {
                                    borderColor = '#667eea';
                                    bgColor = 'rgba(102,126,234,0.2)';
                                }

                                return (
                                    <button
                                        key={idx}
                                        onClick={() => handleAnswer(idx)}
                                        disabled={showResult}
                                        style={{
                                            width: '100%',
                                            padding: '14px 16px',
                                            marginBottom: '10px',
                                            background: bgColor,
                                            border: `2px solid ${borderColor}`,
                                            borderRadius: '12px',
                                            textAlign: 'left',
                                            fontSize: '14px',
                                            cursor: showResult ? 'default' : 'pointer',
                                            display: 'flex',
                                            alignItems: 'center',
                                            gap: '12px',
                                            color: 'white',
                                            transition: 'all 0.2s ease'
                                        }}
                                    >
                                        <span style={{
                                            width: '26px',
                                            height: '26px',
                                            borderRadius: '50%',
                                            background: showResult && idx === q.correct ? '#68d391' : 'rgba(255,255,255,0.1)',
                                            color: showResult && idx === q.correct ? 'white' : 'var(--text-muted)',
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'center',
                                            fontWeight: '600',
                                            fontSize: '12px',
                                            flexShrink: 0
                                        }}>
                                            {String.fromCharCode(65 + idx)}
                                        </span>
                                        <span style={{ lineHeight: '1.4' }}>{opt}</span>
                                    </button>
                                );
                            })}

                            {showResult && (
                                <div style={{
                                    padding: '16px',
                                    background: selected === q.correct ? 'rgba(104,211,145,0.15)' : 'rgba(246,224,94,0.15)',
                                    borderRadius: '12px',
                                    borderLeft: `4px solid ${selected === q.correct ? '#68d391' : '#f6e05e'}`,
                                    marginBottom: '16px'
                                }} className="fade-in">
                                    <div style={{ fontWeight: '600', marginBottom: '8px' }}>
                                        {selected === q.correct ? '✓ 正確！' : '✗ 答錯了'}
                                    </div>
                                    <div style={{ fontSize: '14px', lineHeight: '1.6', color: 'var(--text-muted)' }}>
                                        {q.explanation}
                                    </div>
                                </div>
                            )}

                            {showResult && (
                                <button
                                    onClick={nextQuestion}
                                    style={{
                                        width: '100%',
                                        padding: '14px',
                                        background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                        color: 'white',
                                        border: 'none',
                                        borderRadius: '12px',
                                        fontSize: '16px',
                                        fontWeight: '600',
                                        cursor: 'pointer',
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                        gap: '8px'
                                    }}
                                >
                                    {currentQ < questions.length - 1 ? '下一題' : '查看結果'}
                                    <Icons.Arrow />
                                </button>
                            )}
                        </div>
                    </div>
                );
            };

            // ==================== RENDER PAGE ====================
            const renderPage = () => {
                switch(currentPage) {
                    case 'home': return <HomePage />;
                    case 'basics': return <BasicsPage />;
                    case 'shock-types': return <ShockTypesPage />;
                    case 'cases': return <CasesPage />;
                    case 'case-detail': return <CaseDetailPage />;
                    case 'glossary': return <GlossaryPage />;
                    case 'quiz': return <QuizPage />;
                    default: return <HomePage />;
                }
            };

            return (
                <div style={{ 
                    maxWidth: '480px', 
                    margin: '0 auto',
                    minHeight: '100vh',
                    background: 'linear-gradient(180deg, #1a202c 0%, #2d3748 100%)',
                    paddingBottom: '30px'
                }}>
                    {renderPage()}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
