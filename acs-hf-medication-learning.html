<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACS/HF 藥物學習系統 | 心臟科護理教育</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0f1a;
            --bg-secondary: #111827;
            --bg-card: #1a2234;
            --bg-elevated: #243044;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --accent-purple: #a855f7;
            --accent-orange: #f97316;
            --border-color: #334155;
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            --gradient-danger: linear-gradient(135deg, #f43f5e 0%, #f97316 100%);
            --gradient-success: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            --shadow-glow: 0 0 40px rgba(59, 130, 246, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        #root {
            min-height: 100vh;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.15); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px rgba(244, 63, 94, 0.5); }
            50% { box-shadow: 0 0 20px rgba(244, 63, 94, 0.8), 0 0 30px rgba(244, 63, 94, 0.4); }
        }

        .animate-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .stagger-1 { animation-delay: 0.1s; opacity: 0; }
        .stagger-2 { animation-delay: 0.2s; opacity: 0; }
        .stagger-3 { animation-delay: 0.3s; opacity: 0; }
        .stagger-4 { animation-delay: 0.4s; opacity: 0; }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* App Container */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg-primary);
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .back-btn {
            background: var(--bg-elevated);
            border: none;
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--bg-card);
        }

        /* Progress Bar */
        .progress-container {
            padding: 12px 20px;
            background: var(--bg-secondary);
        }

        .progress-bar {
            height: 4px;
            background: var(--bg-elevated);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient-primary);
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Main Content */
        .main-content {
            padding: 20px;
            padding-bottom: 100px;
        }

        /* Home Screen */
        .hero-section {
            text-align: center;
            padding: 30px 0;
        }

        .hero-icon {
            font-size: 64px;
            margin-bottom: 16px;
            animation: heartbeat 2s ease-in-out infinite;
        }

        .hero-title {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        /* Alert Banner */
        .alert-banner {
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.15) 0%, rgba(249, 115, 22, 0.15) 100%);
            border: 1px solid rgba(244, 63, 94, 0.3);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
            animation: glow 2s ease-in-out infinite;
        }

        .alert-banner-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .alert-banner-icon {
            font-size: 24px;
        }

        .alert-banner-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-rose);
        }

        .alert-banner-content {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .alert-banner-highlight {
            color: var(--accent-amber);
            font-weight: 600;
        }

        /* Category Cards */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .category-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--card-accent, var(--accent-blue));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .category-card:hover {
            transform: translateY(-4px);
            border-color: var(--card-accent, var(--accent-blue));
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .category-card:hover::before {
            opacity: 1;
        }

        .category-card.featured {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.1) 0%, rgba(249, 115, 22, 0.1) 100%);
            border-color: rgba(244, 63, 94, 0.3);
        }

        .category-icon {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .category-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .category-count {
            font-size: 12px;
            color: var(--text-muted);
        }

        .category-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--accent-rose);
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 20px;
        }

        /* Section Title */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 24px 0 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title-icon {
            font-size: 20px;
        }

        /* Drug List */
        .drug-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .drug-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .drug-card:hover {
            border-color: var(--accent-blue);
            transform: translateX(4px);
        }

        .drug-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .drug-chinese-name {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .drug-code {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.15);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .drug-generic-name {
            font-size: 13px;
            color: var(--accent-blue);
            margin-bottom: 6px;
        }

        .drug-brand-name {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .drug-warning-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(244, 63, 94, 0.15);
            color: var(--accent-rose);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            margin-top: 10px;
        }

        /* Drug Detail */
        .drug-detail-header {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .drug-detail-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .drug-detail-name {
            font-size: 24px;
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .drug-detail-generic {
            font-size: 14px;
            color: var(--accent-cyan);
            margin-bottom: 8px;
        }

        .drug-detail-brand {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Info Cards */
        .info-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .info-card-header {
            background: var(--bg-elevated);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .info-card-icon {
            font-size: 20px;
        }

        .info-card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
        }

        .info-card-toggle {
            color: var(--text-muted);
            transition: transform 0.3s;
        }

        .info-card-toggle.open {
            transform: rotate(180deg);
        }

        .info-card-content {
            padding: 16px;
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .info-card-content.collapsed {
            display: none;
        }

        /* Warning Box */
        .warning-box {
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.15) 0%, rgba(249, 115, 22, 0.1) 100%);
            border: 1px solid rgba(244, 63, 94, 0.3);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .warning-box-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .warning-box-icon {
            font-size: 24px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .warning-box-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-rose);
        }

        .warning-list {
            list-style: none;
            padding: 0;
        }

        .warning-list li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .warning-list li::before {
            content: '⚠️';
            position: absolute;
            left: 0;
            font-size: 12px;
        }

        /* Highlight Box */
        .highlight-box {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(6, 182, 212, 0.1) 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .highlight-box-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .highlight-box-content {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Quiz Section */
        .quiz-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .quiz-progress {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .quiz-progress-text {
            font-size: 14px;
            color: var(--text-muted);
        }

        .quiz-progress-score {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-emerald);
        }

        .quiz-question {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .quiz-option {
            background: var(--bg-elevated);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            font-size: 15px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }

        .quiz-option:hover:not(.disabled) {
            border-color: var(--accent-blue);
            transform: translateX(4px);
        }

        .quiz-option.selected {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.15);
        }

        .quiz-option.correct {
            border-color: var(--accent-emerald);
            background: rgba(16, 185, 129, 0.15);
        }

        .quiz-option.incorrect {
            border-color: var(--accent-rose);
            background: rgba(244, 63, 94, 0.15);
            animation: shake 0.4s ease;
        }

        .quiz-option.disabled {
            cursor: default;
            opacity: 0.7;
        }

        .quiz-explanation {
            margin-top: 20px;
            padding: 16px;
            background: var(--bg-elevated);
            border-radius: 14px;
            animation: fadeIn 0.4s ease;
        }

        .quiz-explanation-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quiz-explanation-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Quiz Result */
        .quiz-result {
            text-align: center;
            padding: 30px 20px;
        }

        .quiz-result-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .quiz-result-score {
            font-size: 48px;
            font-weight: 900;
            background: var(--gradient-success);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .quiz-result-label {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .quiz-result-message {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 30px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }

        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--accent-blue);
        }

        .btn-full {
            width: 100%;
        }

        .btn-next {
            margin-top: 20px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 12px 20px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: space-around;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .nav-item.active {
            color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.1);
        }

        .nav-item:hover:not(.active) {
            color: var(--text-secondary);
        }

        .nav-icon {
            font-size: 24px;
        }

        .nav-label {
            font-size: 11px;
            font-weight: 500;
        }

        /* Search */
        .search-container {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 16px;
            padding-left: 44px;
            font-size: 15px;
            color: var(--text-primary);
            font-family: inherit;
            transition: all 0.3s;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .search-wrapper {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: var(--text-muted);
        }

        /* Tabs */
        .tabs-container {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .tab-btn {
            flex-shrink: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }

        .tab-btn:hover:not(.active) {
            border-color: var(--accent-blue);
            color: var(--text-primary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Drug Class Badge */
        .drug-class-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .drug-class-badge.beta-blocker {
            background: rgba(244, 63, 94, 0.15);
            color: var(--accent-rose);
        }

        .drug-class-badge.ace-arb {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
        }

        .drug-class-badge.sglt2i {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-emerald);
        }

        .drug-class-badge.antiplatelet {
            background: rgba(168, 85, 247, 0.15);
            color: var(--accent-purple);
        }

        .drug-class-badge.anticoagulant {
            background: rgba(249, 115, 22, 0.15);
            color: var(--accent-orange);
        }

        .drug-class-badge.statin {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
        }

        .drug-class-badge.mra {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-amber);
        }

        // ==================== 測驗頁面 ====================
        function QuizScreen({ mode, onBack, onComplete }) {
            const [questions, setQuestions] = useState([]);
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [showExplanation, setShowExplanation] = useState(false);
            const [score, setScore] = useState(0);
            const [isComplete, setIsComplete] = useState(false);

            useEffect(() => {
                let filteredQuestions;
                if (mode === 'betaBlocker') {
                    filteredQuestions = quizQuestions.filter(q => q.category === 'betaBlocker');
                } else {
                    filteredQuestions = [...quizQuestions].sort(() => Math.random() - 0.5).slice(0, 10);
                }
                setQuestions(filteredQuestions);
            }, [mode]);

            const handleSelectAnswer = (index) => {
                if (showExplanation) return;
                setSelectedAnswer(index);
                setShowExplanation(true);
                if (index === questions[currentQuestion].correct) {
                    setScore(score + 1);
                }
            };

            const handleNext = () => {
                if (currentQuestion < questions.length - 1) {
                    setCurrentQuestion(currentQuestion + 1);
                    setSelectedAnswer(null);
                    setShowExplanation(false);
                } else {
                    setIsComplete(true);
                }
            };

            if (questions.length === 0) {
                return (
                    <div className="loading">
                        <div className="loading-spinner"></div>
                    </div>
                );
            }

            if (isComplete) {
                const percentage = Math.round((score / questions.length) * 100);
                let message = '';
                let icon = '';
                if (percentage >= 80) {
                    message = '太棒了！你對 ACS/HF 藥物有很好的理解！';
                    icon = '🎉';
                } else if (percentage >= 60) {
                    message = '不錯！但還有進步空間，繼續加油！';
                    icon = '💪';
                } else {
                    message = '建議再複習一下教材內容喔！';
                    icon = '📚';
                }

                return (
                    <>
                        <header className="header">
                            <div className="header-content">
                                <button className="back-btn" onClick={onBack}>←</button>
                                <div>
                                    <div className="header-title">測驗結果</div>
                                    <div className="header-subtitle">{mode === 'betaBlocker' ? 'Beta-blocker 測驗' : '綜合測驗'}</div>
                                </div>
                            </div>
                        </header>

                        <main className="main-content">
                            <div className="quiz-container animate-in">
                                <div className="quiz-result">
                                    <div className="quiz-result-icon">{icon}</div>
                                    <div className="quiz-result-score">{percentage}%</div>
                                    <div className="quiz-result-label">答對 {score} / {questions.length} 題</div>
                                    <div className="quiz-result-message">{message}</div>
                                    <button className="btn btn-primary btn-full" onClick={onComplete}>
                                        返回首頁
                                    </button>
                                </div>
                            </div>
                        </main>
                    </>
                );
            }

            const question = questions[currentQuestion];

            return (
                <>
                    <header className="header">
                        <div className="header-content">
                            <button className="back-btn" onClick={onBack}>←</button>
                            <div>
                                <div className="header-title">{mode === 'betaBlocker' ? 'Beta-blocker' : '綜合'} 測驗</div>
                                <div className="header-subtitle">第 {currentQuestion + 1} / {questions.length} 題</div>
                            </div>
                        </div>
                    </header>

                    <div className="progress-container">
                        <div className="progress-bar">
                            <div 
                                className="progress-fill" 
                                style={{width: `${((currentQuestion + 1) / questions.length) * 100}%`}}
                            ></div>
                        </div>
                        <div className="progress-text">
                            <span>進度 {currentQuestion + 1}/{questions.length}</span>
                            <span>目前得分 {score} 分</span>
                        </div>
                    </div>

                    <main className="main-content">
                        <div className="quiz-container animate-in">
                            <div className="quiz-question">{question.question}</div>
                            
                            <div className="quiz-options">
                                {question.options.map((option, index) => {
                                    let className = 'quiz-option';
                                    if (showExplanation) {
                                        className += ' disabled';
                                        if (index === question.correct) {
                                            className += ' correct';
                                        } else if (index === selectedAnswer && index !== question.correct) {
                                            className += ' incorrect';
                                        }
                                    } else if (selectedAnswer === index) {
                                        className += ' selected';
                                    }
                                    
                                    return (
                                        <button
                                            key={index}
                                            className={className}
                                            onClick={() => handleSelectAnswer(index)}
                                        >
                                            {String.fromCharCode(65 + index)}. {option}
                                        </button>
                                    );
                                })}
                            </div>

                            {showExplanation && (
                                <div className="quiz-explanation">
                                    <div className="quiz-explanation-title">
                                        {selectedAnswer === question.correct ? '✅ 答對了！' : '❌ 答錯了'}
                                    </div>
                                    <div className="quiz-explanation-text">
                                        {question.explanation}
                                    </div>
                                </div>
                            )}

                            {showExplanation && (
                                <button className="btn btn-primary btn-full btn-next" onClick={handleNext}>
                                    {currentQuestion < questions.length - 1 ? '下一題 →' : '查看結果'}
                                </button>
                            )}
                        </div>
                    </main>
                </>
            );
        }

        // ==================== 搜尋頁面 ====================
        function SearchScreen({ searchQuery, setSearchQuery, activeTab, setActiveTab, onSelectDrug, onBack }) {
            const allDrugs = useMemo(() => {
                const drugs = [];

                });
                return drugs;
            }, []);

            const filteredDrugs = useMemo(() => {
                let filtered = allDrugs;
                
                if (activeTab !== 'all') {
                    filtered = filtered.filter(d => d.categoryKey === activeTab);
                }
                
                if (searchQuery.trim()) {
                    const query = searchQuery.toLowerCase();
                    filtered = filtered.filter(d => 
                        d.chinese.toLowerCase().includes(query) ||
                        d.generic.toLowerCase().includes(query) ||
                        d.brand.toLowerCase().includes(query) ||
                        d.code.toLowerCase().includes(query)
                    );
                }
                
                return filtered;
            }, [allDrugs, activeTab, searchQuery]);

            const tabs = [
                { key: 'all', label: '全部' },
                { key: 'betaBlocker', label: 'β-blocker' },
                { key: 'aceArb', label: 'ACEi/ARB' },
                { key: 'sglt2i', label: 'SGLT2i' },
                { key: 'antiplatelet', label: '抗血小板' },
                { key: 'anticoagulant', label: '抗凝血' },
                { key: 'statin', label: 'Statin' },
                { key: 'mra', label: 'MRA' },
                { key: 'arni', label: 'ARNI' },
                { key: 'ivabradine', label: 'Ivabradine' }
            ];

            return (
                <>
                    <header className="header">
                        <div className="header-content">
                            <button className="back-btn" onClick={onBack}>←</button>
                            <div>
                                <div className="header-title">藥物搜尋</div>
                                <div className="header-subtitle">{allDrugs.length} 種藥物</div>
                            </div>
                        </div>
                    </header>

                    <main className="main-content">
                        <div className="search-container animate-in">
                            <div className="search-wrapper">
                                <span className="search-icon">🔍</span>
                                <input
                                    type="text"
                                    className="search-input"
                                    placeholder="搜尋藥物名稱、學名或八碼..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                />
                            </div>
                        </div>

                        <div className="tabs-container animate-in stagger-1">
                            {tabs.map(tab => (
                                <button
                                    key={tab.key}
                                    className={`tab-btn ${activeTab === tab.key ? 'active' : ''}`}
                                    onClick={() => setActiveTab(tab.key)}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        {filteredDrugs.length === 0 ? (
                            <div className="empty-state animate-in stagger-2">
                                <div className="empty-state-icon">🔍</div>
                                <p>找不到符合的藥物</p>
                            </div>
                        ) : (
                            <div className="drug-list">
                                {filteredDrugs.map((drug, index) => (
                                    <div 
                                        key={`${drug.categoryKey}-${drug.code}`}
                                        className="drug-card animate-in stagger-2"
                                        onClick={() => onSelectDrug(drug.categoryKey, drug)}
                                    >
                                        <div className="drug-card-header">
                                            <span className="drug-chinese-name">
                                                {drug.categoryIcon} {drug.chinese}
                                            </span>
                                            <span className="drug-code">{drug.code}</span>
                                        </div>
                                        <div className="drug-generic-name">{drug.generic}</div>
                                        <div className="drug-brand-name">{drug.brand}</div>
                                        {drug.categoryKey === 'betaBlocker' && (
                                            <span className="drug-warning-tag">💓 會降心跳</span>
                                        )}
                                        {drug.categoryKey === 'ivabradine' && (
                                            <span className="drug-warning-tag" style={{background: 'rgba(233, 30, 99, 0.15)', color: '#e91e63'}}>💗 純降心跳</span>
                                        )}
                                        {drug.type === '複方' && (
                                            <span className="drug-warning-tag" style={{background: 'rgba(16, 185, 129, 0.15)', color: 'var(--accent-emerald)'}}>💊 複方 SGLT2i + DPP-4i</span>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>
                </>
            );
        }

        // ==================== 底部導航 ====================
        function BottomNav({ currentView, onNavigate }) {
            return (
                <nav className="bottom-nav">
                    <button 
                        className={`nav-item ${currentView === 'home' || currentView === 'category' || currentView === 'drug' || currentView === 'betaBlockerLesson' ? 'active' : ''}`}
                        onClick={() => onNavigate('home')}
                    >
                        <span className="nav-icon">📚</span>
                        <span className="nav-label">學習</span>
                    </button>
                    <button 
                        className={`nav-item ${currentView === 'search' ? 'active' : ''}`}
                        onClick={() => onNavigate('search')}
                    >
                        <span className="nav-icon">🔍</span>
                        <span className="nav-label">搜尋</span>
                    </button>
                    <button 
                        className={`nav-item ${currentView === 'quiz' ? 'active' : ''}`}
                        onClick={() => onNavigate('quiz')}
                    >
                        <span className="nav-icon">📝</span>
                        <span className="nav-label">測驗</span>
                    </button>
                </nav>
            );
        }

        // ==================== 渲染應用程式 ====================
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
