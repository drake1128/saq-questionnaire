<style>

.shbtn .ic{font-size:19px;flex-shrink:0;width:24px;text-align:center}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

/* ========== 各國資料 ========== */
const BARS = [
  {nm:"奈及利亞 Nigeria（言語）", v:92.6, note:"Owoaje 等系列研究；羞辱 87.4%"},
  {nm:"澳洲 Australia（成人科）", v:74.0, note:"Scott 2015 MJA；目擊 83.1%"},
  {nm:"日本 Japan", v:68.5, note:"Nagata-Kobayashi 2006 JGIM；女 81.6% / 男 61.2%"},
  {nm:"泰國 Thailand", v:63.4, note:"引自泰國 2023 跨國比較文獻"},
  {nm:"巴基斯坦 Pakistan", v:62.5, note:"Shoukat 2010, Karachi"},
  {nm:"全球 pooled（任一 harassment）", v:59.4, note:"Fnais 2014 Acad Med；51 研究 / 38,353 人"},
  {nm:"全球 pooled（TBH）", v:57.1, note:"Wigg 2025；20 研究納入 meta-analysis"},
  {nm:"奧地利 Austria（大吼）", v:60.2, note:"Siller 2017；羞辱 40.9%、肢體 27.3%"},
  {nm:"美國 USA（任一型態）", v:38.0, note:"AAMC 2023；2018 GQ 為 42%"},
  {nm:"墨西哥 Mexico", v:27.0, note:"UNAM 醫學院調查"},
  {nm:"美國 USA（公開羞辱）", v:21.1, note:"AAMC GQ 2016–17；27,500 份問卷"},
  {nm:"英國 UK（單一 placement）", v:8.0, note:"GMC NTS；目擊 14%。時間框架僅一個 placement"},
];

const COUNTRIES = [
  {f:"全球", t:"Teaching by Humiliation 的統合分析", body:<>
    <div className="datum">Wigg、Li、Leow（<b>Med Sci Educ 2025;35:569–85</b>）：7 個資料庫、<b>28 篇研究、34,821 位受訓者</b>，其中 20 篇納入 meta-analysis。TBH 的合併發生率為 <b>57.1%（95% CI 41.3–71.6%）</b>，各研究間範圍 <b>8.0–90.8%</b>。</div>
    <p>該文將 TBH 定義為「教育者的教學行為導致受訓者產生羞辱感」——<b>以學習者的感受為判準，而非教師的意圖</b>。這個定義上的選擇很重要，也是後面各國數字差異這麼大的主因之一。</p>
    <p>研究同時指出，經歷 TBH 與憂鬱、焦慮、壓力、burnout、物質濫用及<b>自殺意念</b>症狀有關，並伴隨恐懼、憤怒、挫折、羞辱、羞恥與尷尬等情緒。</p>
    <div className="datum">Fnais 等（<b>Acad Med 2014;89:817–27</b>）：51 篇研究、38,353 位受訓者，<b>59.4%（95% CI 52.0–66.7%）</b>曾遭遇至少一種 harassment 或 discrimination；<b>言語騷擾最常見（63.0%，95% CI 54.8–71.2%）</b>。加害來源最常見為<b>主治醫師（34.4%）</b>，其次為病人或家屬（21.9%）。作者明白指出：這個比例<b>並未隨時間下降</b>。</div>
  </>},
  {f:"美國", t:"AAMC 畢業問卷（GQ）＋ LCME 標準", body:<>
    <div className="datum">JAMA Intern Med 分析 2016–2017 年 <b>27,500 份 GQ</b>（占當年畢業生 72.1%）：超過三分之一曾經歷至少一種不當對待；最常見為<b>公開羞辱 21.1%</b>。女性 <b>40.9%</b> vs 男性 25.2%；LGB 學生公開羞辱 27.1% vs 異性戀 20.7%。</div>
    <div className="datum">AAMC 2023 年資料：至少 <b>38%</b> 美國醫學生回報曾遭不當對待；絕大多數申訴對象為<b>臨床與課堂教師</b>。全國資料同時顯示，自認被不當對待者中約 <b>80% 未提出申訴</b>。</div>
    <p><b>制度特徵：</b>GQ 自 1978 年開始施行，1991 年起加入不當對待題組。LCME 明確期待學校運用 GQ 資料做出以數據為基礎的改善決策——換句話說，<b>「有沒有調查」不是選項，「調查結果難看怎麼辦」才是學校要回答的問題</b>。</p>
    <div className="impl"><b>可借鏡：</b>某校發現 GQ 顯示學生不熟悉申訴政策、且不相信通報會被追蹤後，成立工作小組重新設計處理流程並提高透明度，後續 GQ 數據明顯改善。介入的重點不在宣導，而在<b>讓學生看見案件確實被處理</b>。</div>
  </>},
  {f:"澳洲", t:"「Teaching by Humiliation」一詞的來源地", body:<>
    <div className="datum">Scott KM 等（<b>Med J Aust 2015;203(4)</b>）：兩所澳洲醫學院最後階段學生，146/151 完成問卷（回收率 96.7%）。成人科輪訓中<b>曾親身經歷 74.0%、曾目擊 83.1%</b>；兒科輪訓則為 28.8% 與 45.1%。</div>
    <p>質性資料的關鍵發現：學生描述的羞辱與威嚇行為，<b>多半是隱微而非公然的</b>，其中包含具攻擊性的提問方式。作者結論直接呼籲必須<b>中斷這種跨世代延續的文化</b>。</p>
    <div className="datum">同年外科界的震撼彈：RACS 委託的 Expert Advisory Group 調查 3,516 人（回收率 47.8%），<b>49.2%</b> 曾遭遇歧視、霸凌或性騷擾；<b>受訓醫師遭霸凌者達 54%</b>；71% 醫院承認過去五年院內發生過此類事件。歧視案件<b>僅 12% 獲得有效解決</b>。</div>
    <p><b>制度回應：</b>RACS 全盤接受 EAG 建議、<b>公開道歉</b>，並推出 Building Respect 行動計畫，承諾<b>每五年重複一次同一份調查</b>。這是少見的「調查—承認—承諾—再調查」完整循環。</p>
  </>},
  {f:"英國", t:"GMC 全國訓練調查（NTS）", body:<>
    <div className="datum">GMC NTS 為每年一次的全國普查，2025 年涵蓋<b>逾 71,000 名受訓醫師與訓練者</b>。較早期資料顯示，<b>8%</b> 於<b>當前這一個 placement</b> 期間經歷霸凌或貶抑、<b>14%</b> 曾目擊。</div>
    <div className="warn"><b>數字不可直接橫向比較：</b>NTS 問的是「單一 placement 期間」，而 AAMC GQ 問的是「整個醫學院四年」。時間框架不同，8% 與 38% 並非同一件事。</div>
    <div className="datum">2025 年 NTS 其他發現：少數族裔的英國畢業生 <b>34%</b> 回報遭遇微歧視等行為，白人同儕為 25%；女性受訓者 <b>17%</b> 曾被忽略或排除，男性 13%；同志 39%、雙性戀 45% 曾聽聞歧視性言論，異性戀者 24%。另有 <b>61%</b> 受訓醫師處於中度或高度 burnout 風險。</div>
    <p><b>制度特徵：</b>NTS 回收率極高、且資料可<b>辨識到個別訓練單位</b>，GMC 得以鎖定異常單位進行介入。這是英國制度最值得學的地方——調查不只是統計，是<b>監理工具</b>。</p>
  </>},
  {f:"日本", t:"亞洲最早的系統性調查", body:<>
    <div className="datum">Nagata-Kobayashi 等（<b>J Gen Intern Med 2006;21:212–8</b>）：六所醫學院五、六年級學生，276 份有效問卷。<b>68.5%</b> 於臨床實習期間至少遭遇一次 abuse。<b>言語 abuse 最常見</b>（男 52.8%、女 63.3%）。女性整體遭遇率 <b>81.6%</b>，顯著高於男性 <b>61.2%</b>。</div>
    <p>研究者特別記錄了一個台灣讀者會很熟悉的型態：<b>學生被指導醫師頻繁忽視或無視</b>，並表示這種態度令他們氣餒、降低學習動機。這是「沉默型羞辱」——不罵人，但當學生不存在。</p>
    <p>後續研究延伸到住院醫師（<b>Med Educ 2009</b>，37 家醫院、619 人）與酒精相關騷擾（<b>Med Educ 2010</b>）。2025 年一篇質性研究則轉向<b>微歧視（microaggressions）</b>，並提出在既有的「加害者—受害者—旁觀者」三角模型外，需要加入第四個元素：<b>話題本身</b>。</p>
    <p><b>制度特徵：</b>文部科學省 1999 年即發布防治性騷擾指引，但缺乏英美式的年度全國普查機制。</p>
  </>},
  {f:"台灣", t:"本土實證：質性但明確", body:<>
    <div className="datum">2023 年 9–12 月，訪談<b>32 位在教學醫院實習的六年級醫學生</b>的質性研究：結果顯示臨床學習中的「羞辱式教學」<b>確實存在</b>，尤其發生在學生對所面對的疾病或病例<b>欠缺臨床所期待的專業知識能力</b>時。</div>
    <p>該研究同時識別出正向的一端：<b>「從批評中學習」與「尊重的教學氛圍」是尊嚴教學的樣態</b>——這說明批評本身不是問題，羞辱才是。</p>

            <p className="muted" style={{marginBottom:0}}>換句話說：即使完全不從學生權益出發，只從病安與人力留任出發，這件事也值得處理。</p>
            <button className="btn" onClick={()=>go("what")}>先看定義與機轉</button>
          </div>
        </>}

        {tab==="what" && <>
          <div className="card">
            <h2>定義：以誰的感受為準？</h2>
            <p>Wigg 等人的統合分析採用的定義是：<b>「教育者的教學行為導致受訓者產生羞辱感」</b>——判準在<b>學習者的感受</b>，不在教師的意圖。</p>
            <p>這個選擇會直接影響數字。以行為清單（有沒有被大吼、被貶低）測量，得到的數字通常較低；以感受測量，數字較高但也更貼近實際傷害。看任何一份調查時，第一件事是確認它用哪一種。</p>
            <div className="warn"><b>常見誤解：</b>「我沒有要羞辱他的意思」不足以排除 TBH。反過來，「學生覺得不舒服」也不等於教師做錯——關鍵在<b>行為本身是否可辯護</b>：這個提問方式、這個時機、這個場合，換成任何一位學生都合理嗎？</div>
          </div>
          <div className="card">
            <h2>Pimping：從諷刺文到教學傳統</h2>
            <p>1989 年 Brancati 在 JAMA 發表〈The Art of Pimping〉，形式是<b>諷刺文</b>，內容卻被廣泛當成操作指南：他建議提問應「快速連發，且基本上無法回答」，並虛構了 William Harvey 與 Osler 的典故為其背書。</p>
            <div className="quote">同期讀者投書的回應是：pimping 只達成四件事——建立位階、壓抑誠實而自發的提問、製造敵意與憤怒、延續醫學教育長期為人詬病的去人性化。</div>
            <p>2009 年 Detsky 在 JAMA 的續篇宣稱 pimping 在學術醫學中「依然健在」，並建議主治醫師拿捏「羞辱答錯的學生」與「無聊到全場」之間的平衡。這段話今日讀來刺眼，但正說明<b>問題不在個別壞人，在被合理化的教學傳統</b>。</p>
            <h3>如何區分蘇格拉底式提問與羞辱</h3>
            <div className="scroll"><table>
              <thead><tr><th></th><th>蘇格拉底式提問</th><th>羞辱式提問</th></tr></thead>
              <tbody>
                <tr><td><b>意圖</b></td><td>引導思考、暴露推理缺口</td><td>維持權力階層、使人難堪</td></tr>
                <tr><td><b>難度</b></td><td>略高於學生現有程度</td><td>刻意超出程度，或根本無解</td></tr>
                <tr><td><b>節奏</b></td><td>一次一題，給思考時間</td><td>連珠炮，不給喘息</td></tr>
                <tr><td><b>答錯時</b></td><td>順著錯誤往下拆解</td><td>轉向質疑學生的能力或用功程度</td></tr>
                <tr><td><b>觀眾</b></td><td>與教學需要相稱</td><td>觀眾本身就是懲罰的一部分</td></tr>
                <tr><td><b>心理安全</b></td><td>說「我不知道」是安全的</td><td>說「我不知道」會被懲罰</td></tr>
              </tbody>
            </table></div>
            <p className="muted">Kost 與 Chen（Acad Med 2015）主張把 pimping 的定義直接限縮為後者；Stoddard 與 O'Dell 則指出兩者真正的分界在<b>提問者的意圖與心理安全感是否存在</b>。Wear 等人（2005）發現學生自己會區分 good pimping 與 malignant pimping——多數學生並不反對被問倒，反對的是被羞辱。</p>
          </div>
          <div className="card">
            <h2>為什麼難以根除</h2>
            <p><span className="pill red">世代循環</span>AAMC 指出，部分教師視嚴厲教學為訓練學生面對生死場域的準備；另一些人則是在重演自己受訓時經歷過的模式。Scott 2015 直接稱之為需要中斷的「跨世代遺產」。</p>
            <p><span className="pill red">潛在課程</span>Lempp 與 Seale（BMJ 2004）：羞辱式教學傳遞的不是知識，是「這裡的位階與規矩」。因此正式的專業素養課程與臨床現場的示範互相矛盾時，學生學的是後者。</p>
            <p><span className="pill red">通報成本不對稱</span>台灣 2023 年研究與 UCLA 質性研究得到同樣的答案：學生顧慮成績。AAMC 全國資料則顯示約 80% 未通報。<b>當通報者承擔全部風險、被通報者幾乎不承擔任何後果時，低通報率是理性選擇，不是文化問題。</b></p>
            <p><span className="pill red">隱微化</span>Scott 2015 特別指出，當代的羞辱多屬<b>隱微</b>而非公然——丟器械的時代或許在減少，但忽視、排除、具攻擊性的提問仍在持續。這使得「我們醫院沒有這個問題」這種判斷極不可靠。</p>
          </div>
        </>}

        {tab==="world" && <>
          <div className="card">
            <h2>盛行率概覽</h2>
            <div className="warn"><b>先讀這段再看圖：</b>下列數字<b>不可直接橫向比較</b>。各研究的定義（羞辱 vs 任一不當對待 vs 言語騷擾）、時間框架（單一 placement vs 整個醫學院）、對象（醫學生 vs 含住院醫師）與回收率都不同。此圖的用途是呈現<b>量級</b>，不是排名。</div>
            {BARS.map((b,i)=>(
              <div className="bar-row" key={i}>
                <div className="bar-top"><span className="nm">{b.nm}</span><span className="vl">{b.v}%</span></div>
                <div className="bar-track"><div className="bar-fill" style={{width:b.v+"%"}}/></div>
                <div className="bar-note">{b.note}</div>
              </div>
            ))}
          </div>
          <div className="card">
            <h2>各國詳述</h2>
            <p className="muted" style={{marginBottom:12}}>點開可看研究設計、數據細節與該國的制度回應。</p>
            <Accordion items={COUNTRIES}/>
          </div>
          <div className="card">
            <h2>制度回應的比較</h2>
            <div className="scroll"><table>
              <thead><tr><th>國家</th><th>常規全國調查</th><th>可辨識到單位</th><th>專業團體公開承諾</th></tr></thead>
              <tbody>
                <tr><td><b>美國</b></td><td>AAMC GQ，1978 起，每年</td><td>是（校層級，含全國對照）</td><td>LCME 要求以資料驅動改善</td></tr>
                <tr><td><b>英國</b></td><td>GMC NTS，每年，逾 7 萬人</td><td>是（訓練單位層級，可介入）</td><td>GMC 監理權；2014 專題報告</td></tr>
                <tr><td><b>澳紐</b></td><td>RACS 承諾每五年重複</td><td>部分</td><td>2015 公開道歉＋Action Plan</td></tr>
                <tr><td><b>日本</b></td><td>無常規普查（多為單次研究）</td><td>否</td><td>MEXT 1999 性騷擾防治指引</td></tr>
                <tr><td><b>台灣</b></td><td className="n">無</td><td>否</td><td>教育部實施原則＋教學醫院評鑑</td></tr>
              </tbody>
            </table></div>
            <div className="impl"><b>共同模式：</b>有實質進展的國家，做的都是同三件事——<b>（1）常規化的匿名普查、（2）資料可辨識到單位層級、（3）主管機關或專業團體公開承諾並持續追蹤</b>。宣導海報與單次講座不在這個清單上。</div>
            <div className="warn"><b>台灣的缺口很明確：</b>制度骨架其實齊備——申訴管道、14 個工作天處理時限、學生代表參與審議、實施成果納入教學醫院評鑑、2026 年 7 月上路的職場霸凌防治新制。<b>缺的是基線數據</b>。沒有每年一次的匿名調查，就無法知道現況、無法辨識異常單位、也無法證明任何改善措施有效。</div>
            <p className="muted" style={{marginBottom:0}}>對單一醫院而言，可行的第一步不是等全國制度，而是<b>在院內建立一份與成績脫鉤的匿名輪訓結束問卷</b>，並每年公布彙總結果與處理件數。</p>
          </div>
        </>}

        {tab==="judge" && <>
          <div className="card">
            <h2>情境判斷</h2>
            <p className="muted">共 8 題，先自己判斷再看解析。適合放在臨床教師 orientation 或科部教學會議討論——重點不在答對，在於發現大家的判準其實不一致。</p>
          </div>
          <div className="card">
            {SCENARIOS.map((s,i)=><Scenario key={i} item={s} idx={i}/>)}
          </div>
          <div className="card">
            <h2>語言替換對照</h2>
            <p className="muted" style={{marginBottom:12}}>教師層級最小、也最立即可行的改變。</p>
            {SWAPS.map((s,i)=>(
              <div className="swap" key={i}>
                <div className="bad"><span className="tagx">避免</span>{s.b}</div>
                <div className="good"><span className="tago">改為</span>{s.g}</div>
              </div>
            ))}
            <h3>三個層級的介入</h3>
            <p><span className="pill">教師層</span>提問一次一題、給思考時間；答錯往下拆解而非轉向質疑能力；公開場合只做病安相關的即時糾正，其餘私下說；查房時向病人介紹學生的姓名與角色。</p>
            <p><span className="pill">科部層</span>每科 orientation 明說行為界線（不是只講排班）；資深醫師示範說出「我不知道，我們一起查」；訓練旁觀者介入——現有文獻指出旁觀者反應模式是關鍵但研究不足的環節。</p>
            <p><span className="pill">機構層</span>與成績脫鉤的匿名管道；14 個工作天內回覆並留紀錄；<b>對累犯建立紀錄</b>（台灣報導指出，院方「有申訴卻無紀錄」是基層最大的不信任來源）；每年公布處理件數與結果彙總。</p>
            <div className="warn"><b>誠實的但書：</b>Mazer 等人（JAMA Netw Open 2018）系統性回顧 3,300 餘篇文獻，只找到 10 篇報告了實施成果的介入研究，整體品質低，多數僅有參與者滿意度資料。<b>上述建議是基於機轉與少數前後對照的合理推論，不是高強度證據。</b>任何院內介入都值得同時規劃評估方式。</div>
          </div>
        </>}

        {tab==="refs" && <>
          <div className="card">
            <h2>文獻</h2>
            <p className="muted" style={{marginBottom:12}}>依主題分組，點標題展開。連結為 DOI 或全文頁面。</p>
            {Object.keys(REFS).map(k=>(
              <div key={k}>
                <div className="acc-head" style={{borderTop:"1px solid #ecf0f1",paddingLeft:0,paddingRight:0}}
                     onClick={()=>setOpenRef(openRef===k?null:k)}>
                  <span style={{flex:1,color:"#1e3a5f"}}>{k}　<span className="muted" style={{fontWeight:400}}>（{REFS[k].length}）</span></span>
                  <span className={"acc-arrow"+(openRef===k?" open":"")}>▶</span>
                </div>
                {openRef===k && <div style={{paddingTop:8}}>
                  {REFS[k].map((r,i)=>(
                    <div className="ref" key={i}>
                      <div className="t">{r.t}</div>

                      <div style={{fontSize:13,margin:"5px 0"}} dangerouslySetInnerHTML={{__html:r.n}}/>
                      {r.u && <a href={r.u} target="_blank" rel="noopener">{r.u}</a>}
                    </div>
                  ))}
                </div>}
              </div>
            ))}
          </div>
          <div className="card">
            <h2>台灣相關法規</h2>
            <div className="ref">
              <div className="t">大學校院辦理新制醫學系醫學生臨床實習實施原則</div>
              <div className="j">教育部，112.03.03 臺教高（五）字第1122200255A號令</div>
              <div style={{fontSize:13,margin:"5px 0"}}>第十二點規範醫學生申訴管道與處理程序：14 個工作天內處理完畢（必要時延長至多 14 天），爭議處理之審議應有醫學生代表參與。第十三點明定實施成果與申訴處理情形納入教學醫院評鑑考核。</div>
              <a href="https://edu.law.moe.gov.tw/LawContent.aspx?id=GL002207" target="_blank" rel="noopener">edu.law.moe.gov.tw/LawContent.aspx?id=GL002207</a>
            </div>
            <div className="ref" style={{borderBottom:"none"}}>
              <div className="t">職場霸凌防治新制</div>
              <div className="j">2026 年 7 月 1 日上路</div>
              <div style={{fontSize:13,margin:"5px 0"}}>對講究師徒制的醫療院所形成挑戰。相關報導指出，醫學中心已在主管會議中提醒資深醫師於手術室避免辱罵用語；但同時也指出院方最大的問題是「有申訴卻無紀錄」。</div>
            </div>
          </div>
          <div className="card">
            <h2>幾個閱讀提醒</h2>
            <ul style={{paddingLeft:20,margin:0,fontSize:14}}>
              <li style={{marginBottom:8}}>看到任何盛行率數字，先問三件事：<b>定義（感受 vs 行為）、時間框架、回收率</b>。</li>
              <li style={{marginBottom:8}}>Wigg 2025 的 95% CI 是 41.3–71.6%，<b>區間非常寬</b>，異質性高。引用時應同時呈現區間，不宜只講 57.1%。</li>
              <li style={{marginBottom:8}}>Fnais 2014 的資料檢索停在 2011 年；Scott 2015 為<b>兩校的 pilot study</b>；台灣的研究為<b>32 人的質性訪談</b>。三者都不宜當成推論全國的依據。</li>
              <li>介入面的證據強度最弱。任何宣稱「某方案有效降低羞辱式教學」的說法，都值得先確認它有沒有<b>對照組與客觀結果指標</b>。</li>
            </ul>
          </div>
        </>}

      </main>

      <footer>
        <div className="sig">資料整理</div>
        <div className="sig">謝慕揚 醫師　MD, PhD, FESC</div>

        <div style={{marginTop:12}}>
          本內容為文獻與法規整理，未必涵蓋所有相關文獻<br/>
          僅供學術與教育用途，不代表任何單位之官方立場<br/>

        </div>
        <div style={{marginTop:10,fontSize:11}}>法規內容以主管機關公發布之版本為準。本頁不儲存任何使用者資料。</div>
      </footer>

      <nav>
        {TABS.map(t=>(
          <button key={t.id} className={tab===t.id?"on":""} onClick={()=>go(t.id)}>
            <div className="dot"/>{t.label}
          </button>
        ))}

  );
};
