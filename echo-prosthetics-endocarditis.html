<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#64748B">
  <title>人工瓣膜與感染 - TSOC Echo Learning</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>* { font-family: 'Noto Sans TC', 'Inter', sans-serif; } .font-mono { font-family: 'SF Mono', 'Consolas', monospace; } @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } } .animate-fade-in { animation: fade-in 0.3s ease-out; } body { margin: 0; padding: 0; } #root { min-height: 100vh; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    const Icon = ({ name, className = "", size = 20, ...props }) => { const [svg, setSvg] = React.useState(''); React.useEffect(() => { if (lucide.icons[name]) { setSvg(lucide.icons[name].toSvg({ width: size, height: size, class: className })); } }, [name, className, size]); return <span dangerouslySetInnerHTML={{ __html: svg }} {...props} />; };

    const chapters = {
      prosthetic: {
        id: 'prosthetic', title: 'Chapter 14: 人工瓣膜', titleEn: 'Prosthetic Valves', icon: '⚙️', color: '#64748B',
        sections: [
          { id: 'types', title: '瓣膜類型', content: [
            { type: 'heading', text: '機械瓣膜' },
            { type: 'point', text: 'Bileaflet (St. Jude)：最常用' },
            { type: 'point', text: 'Tilting disc (Medtronic Hall)' },
            { type: 'point', text: 'Caged ball (Starr-Edwards)：已少用' },
            { type: 'heading', text: '生物瓣膜' },
            { type: 'point', text: '豬瓣（Porcine）' },
            { type: 'point', text: '牛心包（Bovine pericardial）' },
            { type: 'point', text: 'TAVI/TAVR 瓣膜' },
            { type: 'table', headers: ['類型', '優點', '缺點'],
              rows: [['機械', '耐久性', '需終身抗凝'],['生物', '無需長期抗凝', '10-15 年退化']]
            },
          ]},
          { id: 'normal', title: '正常功能評估', content: [
            { type: 'heading', text: '正常跨瓣梯度參考' },
            { type: 'table', headers: ['瓣膜位置', 'Mean PG 參考'],
              rows: [['主動脈位機械', '< 20-25 mmHg'],['主動脈位生物', '< 15-20 mmHg'],['二尖瓣位機械', '< 5-6 mmHg'],['二尖瓣位生物', '< 5 mmHg']]
            },
            { type: 'point', text: '正常逆流：機械瓣有生理性 \"washing jets\"' },
            { type: 'warning', text: '⚠️ 梯度需考慮瓣膜尺寸和心輸出量' },
          ]},
          { id: 'dysfunction', title: '瓣膜功能障礙', content: [
            { type: 'heading', text: '狹窄徵象' },
            { type: 'step', text: '跨瓣梯度升高（比基線增加 > 50%）' },
            { type: 'step', text: 'EOA 減少' },
            { type: 'step', text: 'DVI < 0.25（主動脈瓣）' },
            { type: 'heading', text: '逆流徵象' },
            { type: 'step', text: '超過生理性的逆流 jet' },
            { type: 'step', text: '瓣周漏（Paravalvular leak）' },
            { type: 'step', text: '瓣膜搖擺（Rocking）= 瓣環離開' },
            { type: 'heading', text: '血栓 vs 贅生物' },
            { type: 'table', headers: ['特徵', '血栓', '贅生物'],
              rows: [['臨床', '抗凝不足', '發燒、培養陽性'],['形態', '較規則', '不規則、活動性'],['TEE', '軟組織回聲', '振盪性腫塊']]
            },
            { type: 'tip', text: '💡 TEE 對人工瓣膜評估優於 TTE' },
          ]},
        ],
        quiz: [
          { q: '主動脈位機械瓣正常 Mean PG 參考值？', options: ['< 10 mmHg', '< 15 mmHg', '< 20-25 mmHg', '< 40 mmHg'], correct: 2, explanation: '主動脈位機械瓣正常 Mean PG 約 < 20-25 mmHg' },
          { q: 'DVI < 0.25 提示什麼？', options: ['正常功能', '人工瓣狹窄', '人工瓣逆流', '無法判斷'], correct: 1, explanation: 'DVI (Doppler Velocity Index) < 0.25 提示人工主動脈瓣狹窄' },
        ]
      },
      ie: {
        id: 'ie', title: 'Chapter 15: 感染性心內膜炎', titleEn: 'Infective Endocarditis', icon: '🦠', color: '#DC2626',
        sections: [
          { id: 'duke', title: 'Duke 標準', content: [
            { type: 'heading', text: '超音波主要標準' },
            { type: 'step', text: '贅生物（振盪性腫塊）' },
            { type: 'step', text: '膿瘍' },
            { type: 'step', text: '人工瓣新發瓣周漏' },
            { type: 'step', text: '新發瓣膜逆流' },
            { type: 'heading', text: 'Duke 診斷' },
            { type: 'table', headers: ['分類', '標準'],
              rows: [['確定', '2 Major 或 1 Major + 3 Minor 或 5 Minor'],['可能', '1 Major + 1 Minor 或 3 Minor']]
            },
            { type: 'warning', text: '⚠️ TTE 敏感度約 60%，TEE 約 90%' },
          ]},
          { id: 'vegetation', title: '贅生物評估', content: [
            { type: 'heading', text: '贅生物特徵' },
            { type: 'point', text: '位置：瓣膜上游面（低壓側）' },
            { type: 'point', text: '形態：不規則、可活動' },
            { type: 'point', text: '回聲：與心肌相似' },
            { type: 'heading', text: '栓塞風險評估' },
            { type: 'table', headers: ['因素', '高風險'],
              rows: [['大小', '> 10 mm'],['位置', '二尖瓣（vs 主動脈瓣）'],['活動度', '高度活動性'],['菌種', 'S. aureus']]
            },
            { type: 'formula', text: '贅生物 > 10 mm + 栓塞事件 = 考慮早期手術' },
          ]},
          { id: 'complications', title: 'IE 併發症', content: [
            { type: 'heading', text: '超音波可見併發症' },
            { type: 'step', text: '瓣膜穿孔：新發/惡化逆流' },
            { type: 'step', text: '瓣環膿瘍：增厚、低回聲區' },
            { type: 'step', text: '假性動脈瘤：瓣周脈動性腔' },
            { type: 'step', text: '瘻管：異常血流通道' },
            { type: 'step', text: '腱索斷裂：flail leaflet' },
            { type: 'heading', text: '手術指徵' },
            { type: 'point', text: '心衰（因瓣膜逆流）' },
            { type: 'point', text: '無法控制的感染' },
            { type: 'point', text: '栓塞預防（大贅生物 + 栓塞史）' },
            { type: 'warning', text: '⚠️ 瓣環膿瘍需手術，抗生素無法穿透' },
          ]},
        ],
        quiz: [
          { q: '贅生物大於多少 mm 為高栓塞風險？', options: ['> 5 mm', '> 8 mm', '> 10 mm', '> 15 mm'], correct: 2, explanation: '贅生物 > 10 mm 為高栓塞風險' },
          { q: 'TEE 對 IE 的敏感度約？', options: ['60%', '75%', '90%', '99%'], correct: 2, explanation: 'TEE 對 IE 敏感度約 90%，優於 TTE 的 60%' },
          { q: '贅生物通常位於瓣膜的哪一側？', options: ['上游面（低壓側）', '下游面（高壓側）', '兩側均等', '瓣環'], correct: 0, explanation: '贅生物通常位於瓣膜上游面（低壓側）' },
        ]
      },
    };

    const abbreviations = [
      { abbr: 'IE', full: 'Infective Endocarditis', chinese: '感染性心內膜炎' },
      { abbr: 'TTE', full: 'Transthoracic Echocardiography', chinese: '經胸壁心臟超音波' },
      { abbr: 'TEE', full: 'Transesophageal Echocardiography', chinese: '經食道心臟超音波' },
      { abbr: 'TAVR', full: 'Transcatheter Aortic Valve Replacement', chinese: '經導管主動脈瓣置換' },
      { abbr: 'EOA', full: 'Effective Orifice Area', chinese: '有效開口面積' },
      { abbr: 'DVI', full: 'Doppler Velocity Index', chinese: '都卜勒速度指數' },
      { abbr: 'PVL', full: 'Paravalvular Leak', chinese: '瓣周漏' },
    ];

    function ProstheticIEApp() {
      const [currentView, setCurrentView] = useState('home');
      const [selectedChapter, setSelectedChapter] = useState(null);
      const [selectedSection, setSelectedSection] = useState(0);
      const [quizMode, setQuizMode] = useState(false);
      const [quizIndex, setQuizIndex] = useState(0);
      const [quizAnswer, setQuizAnswer] = useState(null);
      const [quizScore, setQuizScore] = useState(0);
      const [quizComplete, setQuizComplete] = useState(false);
      const [showAbbrModal, setShowAbbrModal] = useState(false);
      const chapterList = Object.values(chapters);
      const startQuiz = (chapter) => { setSelectedChapter(chapter); setQuizMode(true); setQuizIndex(0); setQuizAnswer(null); setQuizScore(0); setQuizComplete(false); };
      const handleQuizAnswer = (index) => { if (quizAnswer !== null) return; setQuizAnswer(index); if (index === selectedChapter.quiz[quizIndex].correct) setQuizScore(prev => prev + 1); };
      const nextQuestion = () => { if (quizIndex < selectedChapter.quiz.length - 1) { setQuizIndex(prev => prev + 1); setQuizAnswer(null); } else setQuizComplete(true); };
      const renderContentItem = (item, idx) => {
        switch (item.type) {
          case 'heading': return <h3 key={idx} className="text-lg font-bold text-slate-800 mt-6 mb-3 flex items-center gap-2"><div className="w-1 h-5 bg-gradient-to-b from-slate-500 to-red-500 rounded-full"></div>{item.text}</h3>;
          case 'step': return <div key={idx} className="flex gap-3 my-2 items-start"><div className="w-6 h-6 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">{idx + 1}</div><p className="text-slate-700 leading-relaxed">{item.text}</p></div>;
          case 'point': return <p key={idx} className="my-2 text-slate-700 pl-4 border-l-2 border-slate-200">{item.text}</p>;
          case 'formula': return <div key={idx} className="my-3 bg-gradient-to-r from-amber-50 to-orange-50 p-4 rounded-xl border border-amber-200 font-mono text-sm text-amber-900 overflow-x-auto">{item.text}</div>;
          case 'tip': return <div key={idx} className="my-3 bg-gradient-to-r from-emerald-50 to-teal-50 p-4 rounded-xl border border-emerald-200 text-emerald-800">{item.text}</div>;
          case 'warning': return <div key={idx} className="my-3 bg-gradient-to-r from-red-50 to-rose-50 p-4 rounded-xl border border-red-200 text-red-800">{item.text}</div>;
          case 'table': return (<div key={idx} className="my-4 overflow-x-auto rounded-xl border border-slate-200 shadow-sm"><table className="w-full text-sm"><thead className="bg-gradient-to-r from-slate-50 to-red-50"><tr>{item.headers.map((h, i) => <th key={i} className="px-4 py-3 text-left font-semibold text-slate-700 border-b border-slate-200">{h}</th>)}</tr></thead><tbody>{item.rows.map((row, i) => <tr key={i} className="hover:bg-slate-50/50 transition-colors">{row.map((cell, j) => <td key={j} className="px-4 py-3 border-b border-slate-100 text-slate-700">{cell}</td>)}</tr>)}</tbody></table></div>);
          default: return null;
        }
      };
      const renderHome = () => (<div className="min-h-screen bg-gradient-to-br from-slate-50 via-slate-100 to-red-50"><div className="bg-gradient-to-r from-slate-600 via-slate-500 to-red-600 text-white px-4 py-6 shadow-lg"><div className="flex items-center justify-between mb-2"><a href="tsoc-echo-learning-2025.html" className="p-2 hover:bg-white/10 rounded-lg transition-colors flex items-center gap-2"><Icon name="arrow-left" size={20} /><span className="text-sm">返回主頁</span></a><button onClick={() => setShowAbbrModal(true)} className="p-2 hover:bg-white/10 rounded-lg transition-colors"><Icon name="bookmark" size={24} /></button></div><h1 className="text-2xl font-bold text-center">⚙️ 人工瓣膜與感染</h1><p className="text-slate-200 text-sm text-center mt-1">Chapters 14-15: Prosthetics & IE</p></div><div className="px-4 py-6 space-y-4"><h2 className="text-lg font-bold text-slate-800 mb-4">選擇章節</h2>{chapterList.map((chapter) => (<button key={chapter.id} onClick={() => { setSelectedChapter(chapter); setSelectedSection(0); setCurrentView('chapter'); }} className="w-full bg-white rounded-2xl p-4 shadow-sm hover:shadow-lg transition-all border border-slate-100 text-left group"><div className="flex items-center gap-4"><div className="w-14 h-14 rounded-xl flex items-center justify-center text-2xl shadow-sm" style={{ backgroundColor: `${chapter.color}15` }}>{chapter.icon}</div><div className="flex-1"><h3 className="font-bold text-slate-800 group-hover:text-slate-600 transition-colors">{chapter.title}</h3><p className="text-sm text-slate-500">{chapter.titleEn}</p><div className="flex items-center gap-4 mt-2 text-xs text-slate-400"><span>📄 {chapter.sections.length} 小節</span><span>🏆 {chapter.quiz.length} 題測驗</span></div></div><Icon name="chevron-right" className="text-slate-400 group-hover:text-slate-600" size={20} /></div></button>))}</div><div className="px-4 pb-6"><h2 className="text-lg font-bold text-slate-800 mb-4">🔗 相關主題</h2><div className="grid grid-cols-2 gap-3"><a href="echo-aortic-valve.html" className="bg-white rounded-xl p-3 shadow-sm hover:shadow-md transition-all border border-slate-100 flex items-center gap-2"><span className="text-lg">🔴</span><span className="text-sm font-medium text-slate-700">主動脈瓣</span></a><a href="echo-mitral-valve.html" className="bg-white rounded-xl p-3 shadow-sm hover:shadow-md transition-all border border-slate-100 flex items-center gap-2"><span className="text-lg">🟣</span><span className="text-sm font-medium text-slate-700">二尖瓣</span></a></div></div></div>);
      const renderChapter = () => { if (!selectedChapter) return null; const section = selectedChapter.sections[selectedSection]; return (<div className="min-h-screen bg-gradient-to-br from-slate-50 via-slate-100 to-red-50"><div className="sticky top-0 z-10 px-4 py-4 shadow-lg" style={{ background: `linear-gradient(135deg, ${selectedChapter.color}, ${selectedChapter.color}dd)` }}><div className="flex items-center justify-between text-white"><button onClick={() => setCurrentView('home')} className="p-2 hover:bg-white/10 rounded-lg transition-colors"><Icon name="chevron-left" size={24} /></button><h1 className="font-bold text-lg flex-1 text-center px-2 truncate">{selectedChapter.title}</h1><div className="w-10"></div></div></div><div className="overflow-x-auto bg-white border-b border-slate-100 shadow-sm"><div className="flex p-2 gap-2 min-w-max">{selectedChapter.sections.map((sec, idx) => (<button key={sec.id} onClick={() => setSelectedSection(idx)} className={`px-4 py-2 rounded-full text-sm whitespace-nowrap transition-all ${selectedSection === idx ? 'text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`} style={selectedSection === idx ? { backgroundColor: selectedChapter.color } : {}}>{sec.title}</button>))}</div></div><div className="px-4 py-6"><h2 className="text-xl font-bold text-slate-800 mb-4">{section.title}</h2><div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">{section.content.map((item, idx) => renderContentItem(item, idx))}</div></div><div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-3 flex items-center justify-between shadow-lg"><button onClick={() => setSelectedSection(prev => Math.max(0, prev - 1))} disabled={selectedSection === 0} className="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-100 text-slate-700 disabled:opacity-50 hover:bg-slate-200 transition-colors"><Icon name="chevron-left" size={20} />上一節</button><button onClick={() => startQuiz(selectedChapter)} className="flex items-center gap-2 px-4 py-2 rounded-xl text-white shadow-md hover:shadow-lg transition-all" style={{ backgroundColor: selectedChapter.color }}>🏆 測驗</button><button onClick={() => setSelectedSection(prev => Math.min(selectedChapter.sections.length - 1, prev + 1))} disabled={selectedSection === selectedChapter.sections.length - 1} className="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-100 text-slate-700 disabled:opacity-50 hover:bg-slate-200 transition-colors">下一節<Icon name="chevron-right" size={20} /></button></div><div className="h-20"></div></div>); };
      const renderQuiz = () => { if (!selectedChapter?.quiz) return null; const currentQuestion = selectedChapter.quiz[quizIndex]; return (<div className="min-h-screen bg-gradient-to-br from-slate-50 via-purple-50 to-indigo-50"><div className="bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-4 py-4 shadow-lg"><div className="flex items-center justify-between"><button onClick={() => { setQuizMode(false); setCurrentView('chapter'); }} className="p-2 hover:bg-white/10 rounded-lg transition-colors"><Icon name="x" size={24} /></button><h1 className="font-bold text-lg">{selectedChapter.title} - 測驗</h1><div className="w-10"></div></div><div className="mt-4 flex items-center gap-2"><div className="flex-1 h-2 bg-white/20 rounded-full overflow-hidden"><div className="h-full bg-white rounded-full transition-all duration-300" style={{ width: `${((quizIndex + 1) / selectedChapter.quiz.length) * 100}%` }}></div></div><span className="text-sm text-white/80">{quizIndex + 1}/{selectedChapter.quiz.length}</span></div></div>{quizComplete ? (<div className="px-4 py-8 text-center"><div className="w-24 h-24 mx-auto mb-6 rounded-full bg-gradient-to-br from-purple-500 to-indigo-500 flex items-center justify-center shadow-lg text-4xl">🏆</div><h2 className="text-2xl font-bold text-slate-800 mb-2">測驗完成！</h2><p className="text-slate-600 mb-6">你的得分：<span className="text-3xl font-bold text-purple-600 mx-2">{quizScore}</span>/ {selectedChapter.quiz.length}</p><div className="space-y-3"><button onClick={() => { setQuizIndex(0); setQuizAnswer(null); setQuizScore(0); setQuizComplete(false); }} className="w-full py-3 rounded-xl bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-semibold shadow-md">🔄 重新測驗</button><button onClick={() => { setQuizMode(false); setCurrentView('chapter'); }} className="w-full py-3 rounded-xl bg-slate-100 text-slate-700 font-semibold">返回章節</button></div></div>) : (<div className="px-4 py-6"><div className="bg-white rounded-2xl p-6 shadow-lg border border-slate-100 mb-6"><h3 className="text-lg font-bold text-slate-800 mb-6 leading-relaxed">{currentQuestion.q}</h3><div className="space-y-3">{currentQuestion.options.map((option, idx) => { const isCorrect = idx === currentQuestion.correct; const isSelected = quizAnswer === idx; let buttonStyle = 'bg-slate-50 border-slate-200 text-slate-700'; if (quizAnswer !== null) { if (isCorrect) buttonStyle = 'bg-emerald-50 border-emerald-500 text-emerald-700'; else if (isSelected) buttonStyle = 'bg-red-50 border-red-500 text-red-700'; } return (<button key={idx} onClick={() => handleQuizAnswer(idx)} disabled={quizAnswer !== null} className={`w-full p-4 rounded-xl border-2 text-left transition-all ${buttonStyle} ${quizAnswer === null ? 'hover:border-purple-300 hover:bg-purple-50' : ''}`}><div className="flex items-center gap-3"><div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm ${quizAnswer !== null && isCorrect ? 'bg-emerald-500 text-white' : quizAnswer !== null && isSelected ? 'bg-red-500 text-white' : 'bg-slate-200 text-slate-600'}`}>{quizAnswer !== null && isCorrect ? '✓' : quizAnswer !== null && isSelected ? '✗' : String.fromCharCode(65 + idx)}</div><span className="font-medium">{option}</span></div></button>); })}</div></div>{quizAnswer !== null && (<><div className="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-2xl p-5 border border-blue-200 mb-6 animate-fade-in"><h4 className="font-bold text-blue-800 mb-2">💡 解釋</h4><p className="text-blue-700">{currentQuestion.explanation}</p></div><button onClick={nextQuestion} className="w-full py-4 rounded-xl bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-bold shadow-md">{quizIndex < selectedChapter.quiz.length - 1 ? '下一題 →' : '查看結果 →'}</button></>)}</div>)}</div>); };
      const renderAbbrModal = () => (<div className={`fixed inset-0 z-50 transition-all duration-300 ${showAbbrModal ? 'visible' : 'invisible'}`}><div className={`absolute inset-0 bg-black/50 transition-opacity ${showAbbrModal ? 'opacity-100' : 'opacity-0'}`} onClick={() => setShowAbbrModal(false)}></div><div className={`absolute inset-4 md:inset-10 bg-white rounded-2xl shadow-2xl transition-transform ${showAbbrModal ? 'scale-100' : 'scale-95'} flex flex-col`}><div className="bg-gradient-to-r from-slate-600 to-red-600 text-white p-4 rounded-t-2xl flex items-center justify-between"><h2 className="font-bold text-lg">📖 縮寫對照表</h2><button onClick={() => setShowAbbrModal(false)} className="p-2 hover:bg-white/10 rounded-lg transition-colors"><Icon name="x" size={24} /></button></div><div className="flex-1 overflow-y-auto p-4"><div className="grid gap-2">{abbreviations.map((item, idx) => (<div key={idx} className="flex items-center gap-4 p-3 bg-slate-50 rounded-xl"><span className="font-mono font-bold text-slate-600 w-16 text-sm">{item.abbr}</span><div className="flex-1"><p className="text-slate-800 text-sm">{item.full}</p><p className="text-slate-500 text-xs">{item.chinese}</p></div></div>))}</div></div></div></div>);
      return (<div className="font-sans">{quizMode ? renderQuiz() : currentView === 'chapter' ? renderChapter() : renderHome()}{renderAbbrModal()}</div>);
    }
    ReactDOM.render(<ProstheticIEApp />, document.getElementById('root'));
  </script>
</body>
</html>
