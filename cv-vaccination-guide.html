                        <div className="info-content" style={{marginTop: '12px'}}>
                            <p>• 每年約3-7%健康高齡者及4-10%高風險成人感染RSV</p>
                            <p>• 確診感染RSV的成年住院患者中，潛在心血管疾病發生率很高(45-63%)</p>
                            <p>• 約14-22%的RSV住院成人會出現心血管併發症</p>
                            <p>• 香港研究發現RSV死亡患者中有16.7%直接死於心血管原因</p>
                        </div>
                    </div>

                    <div className="info-section">
                        <div className="info-title">
                            <span>⚡</span> 帶狀疱疹
                        </div>
                        <div>
                            <div className="evidence-tag">韓國研究 n=20,311</div>
                            <div className="evidence-tag">雙向關聯</div>
                        </div>
                        <div className="info-content" style={{marginTop: '12px'}}>
                            <p>• 帶狀疱疹的終生風險高達三成，且隨著年齡增加發病率快速上升</p>
                            <p>• 水痘帶狀疱疹病毒(VZV)可直接侵犯血管，導致血管壁發炎與結構性改變</p>
                            <p>• 韓國全民健保資料庫研究顯示，心血管疾病患者得帶狀疱疹後，心肌梗塞、中風、心衰竭風險顯著增加</p>
                            <p>• 帶狀疱疹後的慢性疼痛可透過壓力反應和神經內分泌途徑影響心血管系統</p>
                        </div>
                    </div>

                    <div className="highlight-box blue">
                        <strong>關鍵訊息：</strong><br/>
                        感染與心血管疾病存在雙向關聯，接種疫苗不僅預防感染，更能保護心血管健康。
                    </div>
                </div>
            );

            const renderQuiz = () => {
                if (quizState.completed) {
                    return (
                        <div>
                            <div className="section-title">
                                <span className="icon">🎯</span>
                                測驗結果
                            </div>
                            
                            <div className="quiz-container">
                                <div className="score-display">
                                    <div className="score-circle">
                                        <div className="score-value">{quizState.score}</div>
                                        <div className="score-label">/ {quizQuestions.length}</div>
                                    </div>
                                    <div style={{fontSize: '1.2rem', marginBottom: '8px'}}>
                                        {quizState.score >= 8 ? '🎉 優秀！' : 
                                         quizState.score >= 6 ? '👍 良好！' : '💪 繼續加油！'}
                                    </div>
                                    <div style={{color: '#90caf9', marginBottom: '20px'}}>
                                        答對 {quizState.score} 題，共 {quizQuestions.length} 題
                                    </div>
                                    <button className="quiz-btn next" onClick={resetQuiz}>
                                        重新測驗
                                    </button>
                                </div>
                            </div>

                            <div className="info-section">
                                <div className="info-title">答題回顧</div>
                                {quizQuestions.map((q, idx) => (
                                    <div key={idx} style={{
                                        padding: '12px',
                                        marginBottom: '8px',
                                        borderRadius: '8px',
                                        background: quizState.answers[idx]?.correct 
                                            ? 'rgba(76, 175, 80, 0.1)' 
                                            : 'rgba(244, 67, 54, 0.1)'
                                    }}>
                                        <div style={{fontSize: '0.85rem', marginBottom: '4px'}}>
                                            {quizState.answers[idx]?.correct ? '✓' : '✗'} 第 {idx + 1} 題
                                        </div>
                                        <div style={{fontSize: '0.9rem'}}>{q.question}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }

                const currentQ = quizQuestions[quizState.currentQuestion];

                return (
                    <div>
                        <div className="section-title">
                            <span className="icon">📝</span>
                            自我測驗
                        </div>

                        <div className="progress-bar">
                            {quizQuestions.map((_, idx) => (
                                <div 
                                    key={idx}
                                    className={`progress-dot ${
                                        idx < quizState.currentQuestion ? 'completed' :
                                        idx === quizState.currentQuestion ? 'current' : ''
                                    }`}
                                ></div>
                            ))}
                        </div>

                        <div className="quiz-container">
                            <div style={{fontSize: '0.85rem', color: '#90caf9', marginBottom: '12px'}}>
                                問題 {quizState.currentQuestion + 1} / {quizQuestions.length}
                            </div>
                            
                            <div className="quiz-question">{currentQ.question}</div>
                            
                            <div className="quiz-options">
                                {currentQ.options.map((option, idx) => (
                                    <div
                                        key={idx}
                                        className={`quiz-option ${
                                            quizState.selectedAnswer === idx ? 'selected' : ''
                                        } ${
                                            quizState.showResult && idx === currentQ.correct ? 'correct' : ''
                                        } ${
                                            quizState.showResult && 
                                            quizState.selectedAnswer === idx && 
                                            idx !== currentQ.correct ? 'wrong' : ''
                                        }`}
                                        onClick={() => handleAnswerSelect(idx)}
                                    >
                                        {String.fromCharCode(65 + idx)}. {option}
                                    </div>
                                ))}
                            </div>

                            {quizState.showResult && (
                                <div className={`quiz-feedback ${
                                    quizState.selectedAnswer === currentQ.correct ? 'correct' : 'wrong'
                                }`}>
                                    {quizState.selectedAnswer === currentQ.correct 
                                        ? '✓ 答對了！' 
                                        : '✗ 答錯了！'}
                                    <br/><br/>
                                    <strong>解說：</strong>{currentQ.explanation}
                                </div>
                            )}

                            {!quizState.showResult ? (
                                <button 
                                    className="quiz-btn submit"
                                    onClick={handleSubmitAnswer}
                                    disabled={quizState.selectedAnswer === null}
                                >
                                    確認答案
                                </button>
                            ) : (
                                <button 
                                    className="quiz-btn next"
                                    onClick={handleNextQuestion}
                                >
                                    {quizState.currentQuestion < quizQuestions.length - 1 
                                        ? '下一題' 
                                        : '查看結果'}
                                </button>
                            )}
                        </div>
                    </div>
                );
            };

            const renderChecklist = () => {
                const vaccineList = [
                    { key: 'flu', name: '流感疫苗', freq: '每年接種', icon: '💉' },
                    { key: 'pneumo', name: '肺炎鏈球菌疫苗', freq: '依醫師建議', icon: '🛡️' },
                    { key: 'covid', name: '新冠肺炎疫苗', freq: '依最新建議', icon: '🦠' },
                    { key: 'rsv', name: '呼吸道融合病毒疫苗', freq: '符合條件者', icon: '🌬️' },
                    { key: 'shingles', name: '帶狀疱疹疫苗', freq: '50歲以上', icon: '⚡' }
                ];

                const completedCount = Object.values(checklist).filter(Boolean).length;

                return (
                    <div>
                        <div className="section-title">
                            <span className="icon">✅</span>
                            疫苗接種清單
                        </div>

                        <div className="stat-card">
                            <div className="stat-title">接種進度</div>
                            <div className="stat-value">{completedCount}/{vaccineList.length}</div>
                            <div className="stat-desc">
                                {completedCount === vaccineList.length 
                                    ? '🎉 太棒了！已完成所有建議疫苗' 
                                    : '點擊下方項目標記已接種的疫苗'}
                            </div>
                        </div>

                        <div className="checklist">
                            {vaccineList.map(vaccine => (
                                <div key={vaccine.key} className="checklist-item">
                                    <div 
                                        className={`checklist-checkbox ${checklist[vaccine.key] ? 'checked' : ''}`}
                                        onClick={() => toggleChecklist(vaccine.key)}
                                    >
                                        {checklist[vaccine.key] && '✓'}
                                    </div>
                                    <div style={{flex: 1}}>
                                        <div className="checklist-text">
                                            {vaccine.icon} {vaccine.name}
                                        </div>
                                        <div style={{fontSize: '0.8rem', color: '#90caf9'}}>
                                            {vaccine.freq}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="highlight-box" style={{marginTop: '16px'}}>
                            <strong>💡 提醒：</strong><br/>
                            此清單僅供個人追蹤使用。實際接種時程請諮詢您的主治醫師，依個人健康狀況調整。
                        </div>

                        <div className="patient-card" style={{marginTop: '16px'}}>
                            <div className="patient-title">
                                <span>📞</span> 接種前諮詢
                            </div>
                            <div className="simple-text">
                                接種疫苗前，請告知醫師：<br/>
                                • 您目前的用藥（特別是抗凝血劑）<br/>
                                • 過去的疫苗過敏史<br/>
                                • 近期身體狀況<br/>
                                • 是否正在接受其他治療
                            </div>
                        </div>
                    </div>
                );
            };

            const renderContent = () => {
                switch (activeTab) {
                    case 'overview': return renderOverview();
                    case 'vaccines': return renderVaccineDetails();
                    case 'evidence': return renderEvidence();
                    case 'quiz': return renderQuiz();
                    case 'checklist': return renderChecklist();
                    default: return renderOverview();
                }
            };

            return (
                <div className="app-container">
                    <div className="header">
                        <h1>💉 心血管病患疫苗接種指引</h1>
                        <p>Vaccination Guide for CV Patients</p>
                    </div>

                    <div className="nav-tabs">
                        {tabs.map(tab => (
                            <button
                                key={tab.id}
                                className={`nav-tab ${activeTab === tab.id ? 'active' : ''}`}
                                onClick={() => setActiveTab(tab.id)}
                            >
                                {tab.label}
                            </button>
                        ))}
                    </div>

                    <div className="content">
                        {renderContent()}
                    </div>

                    <div className="footer">
                        參考資料：台灣心臟學會、台灣感染症學會共同建議<br/>
                        <a href="#">國立台灣大學醫學院附設醫院新竹分院 心血管中心</a><br/>
                        本應用程式僅供教育目的使用
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
