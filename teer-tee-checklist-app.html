    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #7c3aed;
            --primary-light: #8b5cf6;
            --primary-dark: #5b21b6;
            --accent: #f59e0b;
            --accent-light: #fbbf24;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --bg-dark: #0f0f1a;
            --bg-card: #1a1a2e;
            --bg-card-hover: #252542;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #334155;
        }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        #root {
            min-height: 100vh;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(124, 58, 237, 0); }
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .slide-in {
            animation: slideIn 0.3s ease-out forwards;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 2px;
        }

        input[type="text"], input[type="number"], textarea {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 14px;
            width: 100%;
            font-family: inherit;
        }

        input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }
    </style>
</head>

                                    </thead>
                                    <tbody>

                                                <td style={{ padding: '8px', textAlign: 'center' }}>{item.hours}</td>
                                                <td style={{ padding: '8px', textAlign: 'center' }}>{NOAC_GUIDELINES.dabigatran.highRisk[i].hours}</td>

                        {/* Other NOACs */}

                                            <th style={{ padding: '8px', textAlign: 'center', color: '#10b981' }}>Low Risk</th>
                                            <th style={{ padding: '8px', textAlign: 'center', color: '#ef4444' }}>High Risk</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {NOAC_GUIDELINES.otherNOAC.lowRisk.map((item, i) => (
                                            <tr key={i} style={{ borderBottom: '1px solid var(--border)' }}>

                                                <td style={{ padding: '8px', textAlign: 'center' }}>{item.hours}</td>

                    {/* 30 Day Follow-up */}

                        </AlertBox>
                        {FOLLOW_UP_SCHEDULE.thirtyDay.items.map((item, i) => (
                            <ChecklistItem
                                key={`30d-${i}`}

                            />

                    {/* 1 Year Follow-up */}

                        </AlertBox>

                            <ChecklistItem
                                key={`1y-${i}`}
                                item={{ id: `1y-${i}`, text: item.text, critical: item.critical }}
                                checked={followUpChecks[`1y-${i}`]}
                                onToggle={() => toggleItem(`1y-${i}`)}
                            />

                    </InfoCard>

        };

        const EquipmentSection = () => {
            const [departureChecks, setDepartureChecks] = useState({});
            const [returnChecks, setReturnChecks] = useState({});
            const [teeCondition, setTeeCondition] = useState({ departure: '', return: '' });

            return (
                <div style={{ padding: '20px' }}>
                    <AlertBox type="warning">
                        <strong>去程：</strong>設備送出時填寫 | <strong>回程：</strong>設備送回時填寫
                    </AlertBox>

                    <InfoCard title="主要設備" icon="🖥️" color="#6366f1">
                        {EQUIPMENT_CHECKLIST.mainEquipment.map((eq, i) => (
                            <div key={i} style={{
                                display: 'flex',
                                justifyContent: 'space-between',
                                alignItems: 'center',
                                padding: '12px',
                                background: 'var(--bg-dark)',
                                borderRadius: '8px',
                                marginBottom: '8px',
                            }}>
                                <span style={{ fontWeight: 500 }}>{eq.name}</span>
                                <span style={{ color: 'var(--text-muted)', fontSize: '13px' }}>{eq.unit}</span>
                            </div>
                        ))}
                    </InfoCard>

                    <InfoCard title="TEE 探頭" icon="🔊" color="#ec4899">
                        {EQUIPMENT_CHECKLIST.teeProbes.map((probe, i) => (
                            <div key={i} style={{
                                display: 'flex',
                                justifyContent: 'space-between',
                                alignItems: 'center',
                                padding: '12px',
                                background: 'var(--bg-dark)',

                                marginBottom: '8px',
                            }}>
                                <span style={{ fontWeight: 500, color: '#ec4899' }}>{probe.name}</span>
                                <span style={{ color: 'var(--text-muted)', fontSize: '13px' }}>{probe.unit}</span>
                            </div>
                        ))}
                    </InfoCard>

                    <InfoCard title="麻醉用品" icon="💉" color="#10b981">
                        {EQUIPMENT_CHECKLIST.anesthesia.map((item, i) => (
                            <div key={i} style={{
                                display: 'flex',
                                justifyContent: 'space-between',
                                alignItems: 'center',
                                padding: '12px',
                                background: 'var(--bg-dark)',
                                borderRadius: '8px',
                                marginBottom: '8px',
                            }}>
                                <span>{item.name}</span>
                                <span style={{ color: 'var(--text-muted)', fontSize: '13px' }}>{item.unit}</span>
                            </div>
                        ))}
                    </InfoCard>

                    <InfoCard title="檢查用品" icon="🧪" color="#f59e0b">
                        {EQUIPMENT_CHECKLIST.supplies.map((item, i) => (
                            <div key={i} style={{
                                display: 'flex',
                                justifyContent: 'space-between',
                                alignItems: 'center',
                                padding: '12px',
                                background: 'var(--bg-dark)',
                                borderRadius: '8px',
                                marginBottom: '8px',
                            }}>
                                <span>{item.name}</span>
                                <span style={{ color: 'var(--text-muted)', fontSize: '13px' }}>{item.unit}</span>
                            </div>
                        ))}
                    </InfoCard>

                    <InfoCard title="連接線材" icon="🔌" color="#3b82f6">
                        <div style={{ 
                            background: 'var(--bg-dark)', 
                            borderRadius: '10px', 
                            padding: '14px',
                        }}>
                            <div style={{ fontWeight: 500, marginBottom: '10px' }}>黑色轉接線</div>
                            <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                                {[1, 2, 3, 4, 5, 6].map(num => (
                                    <div key={num} style={{
                                        width: '40px',
                                        height: '40px',
                                        borderRadius: '8px',
                                        background: 'var(--bg-card)',
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                        fontWeight: 600,
                                        border: '1px solid var(--border)',
                                    }}>
                                        {num}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </InfoCard>

                    <InfoCard title="TEE 探頭狀態檢查" icon="🔍" color="#ef4444">
                        <div style={{ 
                            background: 'var(--bg-dark)', 
                            borderRadius: '10px', 
                            padding: '14px',
                        }}>
                            <div style={{ fontWeight: 500, marginBottom: '10px' }}>咬痕外觀檢查</div>
                            <div style={{ display: 'flex', gap: '10px' }}>
                                <button style={{
                                    flex: 1,
                                    padding: '12px',
                                    borderRadius: '8px',
                                    border: 'none',
                                    background: 'rgba(16,185,129,0.2)',

                                    borderRadius: '8px',
                                    border: 'none',

                                    color: '#ef4444',
                                    fontWeight: 600,
                                    cursor: 'pointer',
                                }}>
                                    ✗ 異常
                                </button>

                        <div style={{

                                酵素擦消

                            </p>
                        </div>
                    </InfoCard>
                </div>
            );
        };

        const FullChecklistSection = () => {
            const [checkedItems, setCheckedItems] = useState({});
            
            const allItems = [
                ...PRE_ASSESSMENT_ITEMS,
                ...PRE_PROCEDURE_ITEMS,
                ...SURGERY_DAY_ITEMS,
                ...POST_PROCEDURE_ITEMS,
            ];

            const totalItems = allItems.reduce((sum, cat) => sum + cat.items.length, 0);
            const checkedCount = Object.values(checkedItems).filter(Boolean).length;
            const progress = (checkedCount / totalItems) * 100;

            const toggleItem = (id) => {
                setCheckedItems(prev => ({ ...prev, [id]: !prev[id] }));
            };

            const resetChecklist = () => {
                setCheckedItems({});
            };

            const stages = [
                { title: '1️⃣ 術前評估階段', items: PRE_ASSESSMENT_ITEMS, color: '#10b981' },
                { title: '2️⃣ 術前準備階段', items: PRE_PROCEDURE_ITEMS, color: '#f59e0b' },
                { title: '3️⃣ 手術當日', items: SURGERY_DAY_ITEMS, color: '#ef4444' },
                { title: '4️⃣ 術後處置', items: POST_PROCEDURE_ITEMS, color: '#3b82f6' },
            ];

            return (
                <div style={{ padding: '20px' }}>
                    {/* Progress Bar */}
                    <div style={{
                        background: 'var(--bg-card)',
                        borderRadius: '16px',
                        padding: '20px',
                        marginBottom: '20px',

                                {checkedCount} / {totalItems}
                            </span>
                        </div>
                        <div style={{
                            height: '12px',
                            background: 'var(--bg-dark)',
                            borderRadius: '6px',
                            overflow: 'hidden',
                        }}>
                            <div style={{
                                height: '100%',
                                width: `${progress}%`,
                                background: progress === 100 
                                    ? 'linear-gradient(90deg, #10b981 0%, #34d399 100%)'
                                    : 'linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%)',
                                transition: 'width 0.3s ease',
                                borderRadius: '6px',
                            }} />

                        {progress === 100 && (
                            <div style={{ 
                                marginTop: '12px', 
                                textAlign: 'center', 
                                color: '#10b981',
                                fontWeight: 600,
                                fontSize: '14px'

                            padding: '14px',

                            borderRadius: '12px',
                            color: 'var(--text-secondary)',
                            fontSize: '14px',
                            cursor: 'pointer',
                            marginBottom: '20px',

                    {/* All Stages */}

                        <div key={stageIndex} style={{ marginBottom: '24px' }}>

                                fontSize: '18px', 
                                fontWeight: 700, 
                                marginBottom: '16px',

                                alignItems: 'center',

                                            key={item.id}
                                            item={item}
                                            checked={checkedItems[item.id]}
                                            onToggle={() => toggleItem(item.id)}
                                        />
                                    ))}
                                </InfoCard>
                            ))}
                        </div>
                    ))}
                </div>
            );
        };

        // ========== Main App ==========
        const App = () => {
            const [currentSection, setCurrentSection] = useState('home');
            const [preAssessmentChecks, setPreAssessmentChecks] = useState({});
            const [preProcedureChecks, setPreProcedureChecks] = useState({});
            const [surgeryDayChecks, setSurgeryDayChecks] = useState({});
            const [postProcedureChecks, setPostProcedureChecks] = useState({});

            const renderSection = () => {
                switch (currentSection) {
                    case 'overview': return <OverviewSection />;
                    case 'nhi-coverage': return <NHICoverageSection />;
                    case 'tee-eval': return <TEEEvalSection />;
                    case 'mr-grading': return <MRGradingSection />;
                    case 'anatomy': return <AnatomySection />;
                    case 'pre-assessment': 
                        return <ChecklistSectionComponent 
                            title="術前評估階段" 
                            items={PRE_ASSESSMENT_ITEMS} 
                            checkedItems={preAssessmentChecks}
                            setCheckedItems={setPreAssessmentChecks}
                        />;
                    case 'pre-procedure': 
                        return <ChecklistSectionComponent 
                            title="術前準備階段" 
                            items={PRE_PROCEDURE_ITEMS} 
                            checkedItems={preProcedureChecks}
                            setCheckedItems={setPreProcedureChecks}
                        />;
                    case 'surgery-day': 
                        return <ChecklistSectionComponent 
                            title="手術當日" 
                            items={SURGERY_DAY_ITEMS} 
                            checkedItems={surgeryDayChecks}
                            setCheckedItems={setSurgeryDayChecks}
                        />;
                    case 'post-procedure': 
                        return <ChecklistSectionComponent 
                            title="術後處置" 
                            items={POST_PROCEDURE_ITEMS} 
                            checkedItems={postProcedureChecks}
                            setCheckedItems={setPostProcedureChecks}
                        />;
                    case 'follow-up': return <FollowUpSection />;
                    case 'equipment': return <EquipmentSection />;
                    case 'checklist': return <FullChecklistSection />;
                    default: return null;
                }
            };

            return (
                <div style={{ minHeight: '100vh', paddingBottom: '80px' }}>
                    <Header 
                        currentSection={currentSection}
                        onBack={() => setCurrentSection('home')}
                    />

                    {currentSection === 'home' ? (
                        <div style={{ padding: '20px' }}>
                            {/* Quick Stats */}
                            <div style={{
                                display: 'grid',
                                gridTemplateColumns: 'repeat(3, 1fr)',
                                gap: '10px',
                                marginBottom: '24px',
                            }}>
                                {[
                                    { label: 'TEE 參數', value: '16', unit: '項' },
                                    { label: '檢核項目', value: '80+', unit: '項' },
                                    { label: '追蹤時程', value: '3', unit: '階段' },
                                ].map((stat, i) => (
                                    <div key={i} style={{
                                        background: 'var(--bg-card)',
                                        borderRadius: '12px',
                                        padding: '14px',
                                        textAlign: 'center',
                                    }}>
                                        <div style={{ 
                                            fontSize: '20px', 
                                            fontWeight: 700, 
                                            color: 'var(--accent)',
                                            marginBottom: '2px'
                                        }}>
                                            {stat.value}
                                        </div>
                                        <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>
                                            {stat.unit}
                                        </div>
                                        <div style={{ fontSize: '11px', color: 'var(--text-secondary)', marginTop: '4px' }}>
                                            {stat.label}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Menu Grid */}
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                                {SECTIONS.map((section, index) => (
                                    <MenuCard
                                        key={section.id}
                                        section={section}
                                        index={index}
                                        onClick={() => setCurrentSection(section.id)}
                                    />
                                ))}
                            </div>

                            {/* Footer Info */}
                            <div style={{
                                marginTop: '24px',
                                padding: '16px',
                                background: 'var(--bg-card)',
                                borderRadius: '12px',
                                textAlign: 'center',
                                fontSize: '12px',
                                color: 'var(--text-muted)',
                            }}>
                                <p>TEER TEE Evaluation Checklist</p>
                                <p style={{ marginTop: '4px' }}>心血管中心 | 版本 2.0 | 2025-12-11</p>
                            </div>
                        </div>
                    ) : (
                        <div className="fade-in">
                            {renderSection()}
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
