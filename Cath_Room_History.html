/* ===========================================

    --ink:        #070d1c;

    --panel:      rgba(255,255,255,0.035);
    --panel-bd:   rgba(255,255,255,0.09);
    --text:       #eef3fc;
    --text-dim:   #94a6c6;
    --text-faint: #5e6f8d;

    --gold:       #e7b65a;
    --gold-bright:#f6d488;

    /* 分類色 */
    --c-coronary: #e2574c;
    --c-ep:       #9b7be0;
    --c-struct:   #e7b65a;
    --c-periph:   #45b5ae;
    --c-mile:     #f6d488;

    --font-num:  'Fraunces', serif;

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }
body {

}
.hero .en {
    font-family: var(--font-num); font-weight: 400; font-style: italic;
    font-size: clamp(1rem, 2.6vw, 1.7rem); color: var(--text-dim); letter-spacing: 0.02em;
}
.hero p.sub {

    font-weight: 300; font-size: clamp(0.9rem, 1.7vw, 1.15rem);
}

}

.stat .v {

}

.filter-bar {

    border-bottom: 1px solid var(--panel-bd);
    padding: clamp(0.7rem, 1.6vh, 1rem) 1rem;
    display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center;
}
.chip {
    font-family: var(--font-sans); font-size: clamp(0.72rem, 1.4vw, 0.92rem); font-weight: 500;
    color: var(--text-dim); background: var(--panel);
    border: 1px solid var(--panel-bd); border-radius: 999px;
    padding: 0.45em 1.1em; cursor: pointer; transition: all 0.25s var(--ease);
    display: inline-flex; align-items: center; gap: 0.5em; white-space: nowrap;
}
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.chip:hover { color: var(--text); border-color: rgba(255,255,255,0.25); transform: translateY(-1px); }
.chip.active { color: #0a1226; background: linear-gradient(120deg, var(--gold-bright), var(--gold)); border-color: transparent; box-shadow: 0 4px 18px rgba(231,182,90,0.3); }
.chip.active .dot { background: #0a1226; }
.chip[data-cat="coronary"]{ --cc: var(--c-coronary); }
.chip[data-cat="ep"]{ --cc: var(--c-ep); }
.chip[data-cat="struct"]{ --cc: var(--c-struct); }
.chip[data-cat="periph"]{ --cc: var(--c-periph); }
.chip[data-cat="milestone"]{ --cc: var(--c-mile); }
.chip:not([data-cat="all"]):not(.active) .dot { color: var(--cc); background: var(--cc); }

/* ===========================================
   時間軸
   =========================================== */
.timeline {
    position: relative; z-index: 2;
    max-width: 1080px; margin: 0 auto;
    padding: clamp(2rem, 5vh, 4rem) clamp(1rem, 4vw, 2rem) 5rem;
}

/* 中央脊線（桌機） */
.spine {
    position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 2px; background: var(--panel-bd);
}
.spine .fill {
    position: absolute; top: 0; left: 0; width: 100%; height: 0%;
    background: linear-gradient(180deg, var(--c-coronary), var(--gold) 60%, var(--gold-bright));
    box-shadow: 0 0 14px rgba(246,212,136,0.5);
    transition: height 0.15s linear;
}

/* 年代分隔 */
.era {
    position: relative; text-align: center; margin: clamp(2.2rem,5vh,3.6rem) 0 clamp(1.4rem,3vh,2.4rem);
    z-index: 3;
}
.era span {
    display: inline-block; background: var(--ink-2);
    border: 1px solid var(--gold); color: var(--gold);
    font-family: var(--font-zh); font-weight: 600; letter-spacing: 0.12em;
    font-size: clamp(0.85rem, 2vw, 1.2rem);
    padding: 0.5em 1.5em; border-radius: 999px;
    box-shadow: 0 6px 26px rgba(0,0,0,0.5);
}

/* 單一事件 */
.item {
    position: relative; width: 50%; padding: 0 clamp(1.6rem, 3.5vw, 3rem);
    margin-bottom: clamp(1.4rem, 3vh, 2.4rem);
    opacity: 0; transform: translateY(34px);
    transition: opacity 0.8s var(--ease), transform 0.8s var(--ease);
}
.item.show { opacity: 1; transform: translateY(0); }
.item.left  { left: 0; text-align: right; }
.item.right { left: 50%; text-align: left; }

/* 節點圓珠 */
.item .node {
    position: absolute; top: 1.5rem; width: 16px; height: 16px; border-radius: 50%;
    background: var(--ink-2); border: 3px solid var(--cc, var(--gold));
    z-index: 4; transition: all 0.3s var(--ease);
}
.item.left  .node { right: calc(clamp(1.6rem,3.5vw,3rem) * -1 - 8px); transform: translateX(50%); }
.item.right .node { left:  calc(clamp(1.6rem,3.5vw,3rem) * -1 - 8px); transform: translateX(-50%); }
.item.show .node { box-shadow: 0 0 16px var(--cc, var(--gold)); }
.item.milestone .node {
    width: 22px; height: 22px; background: var(--cc);
    box-shadow: 0 0 22px var(--cc); animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{ box-shadow:0 0 14px var(--cc) } 50%{ box-shadow:0 0 30px var(--cc), 0 0 50px var(--cc) } }

/* 卡片 */
.card {
    display: inline-block; text-align: left; width: 100%;
    background: var(--panel); border: 1px solid var(--panel-bd);
    border-radius: 16px; padding: clamp(1rem, 2.2vw, 1.5rem) clamp(1.1rem, 2.4vw, 1.6rem);
    position: relative; overflow: hidden;
    transition: transform 0.3s var(--ease), border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
}
.card::before {
    content:""; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
    background: var(--cc, var(--gold)); opacity: 0.9;
}
.card:hover {
    transform: translateY(-4px);
    border-color: color-mix(in srgb, var(--cc) 55%, transparent);
    box-shadow: 0 14px 40px rgba(0,0,0,0.45);
}
.item.milestone .card {
    background: linear-gradient(150deg, color-mix(in srgb, var(--cc) 14%, transparent), var(--panel));
    border-color: color-mix(in srgb, var(--cc) 45%, transparent);
}

.card .date {
    font-family: var(--font-num); font-weight: 600;
    color: var(--cc, var(--gold)); line-height: 1; margin-bottom: 0.5rem;
    display: flex; align-items: baseline; gap: 0.4rem; flex-wrap: wrap;
}
.card .date .yr  { font-size: clamp(1.5rem, 3.4vw, 2.2rem); }
.card .date .day { font-size: clamp(0.8rem, 1.5vw, 1rem); color: var(--text-dim); font-family: var(--font-sans); font-weight: 500; }
.card .cat-tag {
    font-size: clamp(0.6rem, 1.1vw, 0.72rem); font-weight: 500; letter-spacing: 0.08em;
    color: var(--cc); border: 1px solid color-mix(in srgb, var(--cc) 40%, transparent);
    padding: 0.2em 0.7em; border-radius: 999px; margin-left: auto;
}
.card h3 {
    font-family: var(--font-zh); font-weight: 600;
    font-size: clamp(1.05rem, 2.2vw, 1.4rem); line-height: 1.3; color: var(--text);
    margin-bottom: 0.25rem;
}
.card .note { font-size: clamp(0.78rem, 1.5vw, 0.95rem); color: var(--text-dim); font-weight: 300; margin-bottom: 0.7rem; }
.card .people {
    font-size: clamp(0.74rem, 1.4vw, 0.88rem); color: var(--text-faint);
    padding-top: 0.6rem; border-top: 1px dashed var(--panel-bd); line-height: 1.55;
}
.card .people b { color: var(--text-dim); font-weight: 500; }
.card .badge {
    display: inline-block; margin-top: 0.6rem;
    font-size: clamp(0.62rem,1.1vw,0.74rem); font-weight: 700; letter-spacing: 0.1em;
    color: #0a1226; background: linear-gradient(120deg, var(--gold-bright), var(--gold));
    padding: 0.3em 0.9em; border-radius: 999px;
}

.item.dim { opacity: 0.12 !important; filter: grayscale(0.6); pointer-events: none; transition: all 0.4s ease; }
.item.dim.show { transform: translateY(0); }

/* ===========================================
   手機：改為左側單欄脊線
   =========================================== */
@media (max-width: 760px) {
    .spine { left: 18px; transform: none; }
    .item { width: 100%; left: 0 !important; text-align: left !important; padding: 0 0 0 48px; }
    .item.left .node, .item.right .node { left: 11px; right: auto; transform: none; }
    .card .cat-tag { margin-left: 0; }
}

/* ===========================================
   頁尾返回連結
   =========================================== */
.foot a.back-home {

    font-family: var(--font-sans); font-size: 0.85rem; font-weight: 500;

}
.foot a.back-home:hover {
    background: linear-gradient(120deg, var(--gold-bright), var(--gold));
    color: #0a1226; border-color: transparent;
}

/* 頁尾 */
.foot {
    position: relative; z-index: 2; text-align: center;
    padding: 2rem 1.5rem 4rem; color: var(--text-faint);
    font-size: 0.8rem; letter-spacing: 0.08em; line-height: 2;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 0.2s !important; }
    .item { opacity: 1 !important; transform: none !important; }
}
</style>

/* 年代分隔（依年份起點插入） */
const ERAS = [
  { from: 1991, label: '1991 – 1997　草創・奠基' },
  { from: 2010, label: '2012 – 2019　全面開展' },
  { from: 2020, label: '2020 – 2026　創新・醫學中心時代' },
];

/* ===========================================
   渲染
   =========================================== */
const tl = document.getElementById('timeline');
let visualIndex = 0;        // 用於左右交替
const yearNum = (y) => parseInt(y, 10) || 9999;

DATA.forEach((e, i) => {
    // 找出此事件所屬年代（最後一個 from <= 年份的年代），首次出現時插入分隔標籤
    const yn = yearNum(e.y);
    let eIdx = -1;
    for (let k = 0; k < ERAS.length; k++) { if (yn >= ERAS[k].from) eIdx = k; }
    if (eIdx >= 0 && !ERAS[eIdx].used) {
        ERAS[eIdx].used = true;
        const era = document.createElement('div');
        era.className = 'era';
        era.innerHTML = `<span>${ERAS[eIdx].label}</span>`;
        tl.appendChild(era);
    }

    const cat = CATS[e.c];
    const side = (visualIndex % 2 === 0) ? 'left' : 'right';
    visualIndex++;

    const item = document.createElement('article');
    item.className = `item ${side}${e.m ? ' milestone' : ''}`;
    item.dataset.cat = e.c;
    item.style.setProperty('--cc', cat.color);

    const dayHtml = e.d ? `<span class="day">${e.d}</span>` : '';
    const badge = e.m ? `<div class="badge">★ 里程碑</div>` : '';

    item.innerHTML = `
        <div class="node"></div>
        <div class="card">
            <div class="date">
                <span class="yr">${e.y}</span>${dayHtml}
                <span class="cat-tag">${cat.name}</span>
            </div>
            <h3>${e.t}</h3>
            <div class="note">${e.n}</div>
            <div class="people"><b>參與：</b>${e.p}</div>
            ${badge}
        </div>
    `;
    tl.appendChild(item);
});

/* 統計數字 */
document.getElementById('statTotal').textContent = DATA.length;
document.getElementById('statMile').textContent = DATA.filter(e => e.m).length;

/* ===========================================
   進場動畫（IntersectionObserver）
   =========================================== */
const items = document.querySelectorAll('.item');
const io = new IntersectionObserver((entries) => {
    entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('show'); io.unobserve(en.target); } });
}, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
items.forEach(it => io.observe(it));

/* ===========================================
   捲動進度 + 脊線充能
   =========================================== */
const bar = document.getElementById('progressBar');
const spineFill = document.getElementById('spineFill');
const tlEl = document.getElementById('timeline');

function onScroll() {
    const st = window.scrollY || document.documentElement.scrollTop;
    const docH = document.documentElement.scrollHeight - window.innerHeight;
    const pct = docH > 0 ? (st / docH) * 100 : 0;
    bar.style.width = pct + '%';

    // 脊線：依時間軸區塊在視窗中的進度填充
    const rect = tlEl.getBoundingClientRect();
    const total = rect.height;
    const passed = Math.min(Math.max(window.innerHeight * 0.5 - rect.top, 0), total);
    spineFill.style.height = (total > 0 ? (passed / total) * 100 : 0) + '%';
}
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', onScroll);
onScroll();

/* ===========================================
   分類篩選
   =========================================== */
const chips = document.querySelectorAll('.chip');
chips.forEach(chip => {
    chip.addEventListener('click', () => {
        chips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        const cat = chip.dataset.cat;
        items.forEach(it => {
            const match = (cat === 'all') ||
                          (cat === 'milestone' ? it.classList.contains('milestone') : it.dataset.cat === cat);
            it.classList.toggle('dim', !match);
        });
        setTimeout(onScroll, 50);
    });
});
</script>
