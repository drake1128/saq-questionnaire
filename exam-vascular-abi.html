    <script type="text/babel">
        const { useState, useEffect } = React;

        const teachingContent = [
            {
                title: "ABI 踝肱指數概論", icon: "📊",
                content: [
                    { subtitle: "什麼是 ABI？", text: "踝肱指數 (Ankle-Brachial Index, ABI) 是評估下肢動脈血流的簡便非侵入性方法。計算方式為踝部收縮壓除以肱動脈收縮壓。" },
                    { subtitle: "臨床意義", text: "ABI 可用於診斷周邊動脈疾病 (PAD)、評估下肢動脈阻塞程度、預測心血管事件風險。" }
                ],
                table: { headers: ["ABI 值", "臨床意義"], rows: [["0.9-1.3", "正常"], ["0.7-0.89", "輕度阻塞"], ["0.4-0.69", "中度阻塞"], ["< 0.4", "重度阻塞"], ["> 1.3", "血管鈣化"]] },
                keyPoints: ["ABI = 踝部收縮壓 ÷ 肱動脈收縮壓", "正常值：0.9 - 1.3", "< 0.9：周邊動脈疾病", "> 1.3：血管鈣化（糖尿病常見）"]
            },
            {
                title: "ABI 測量步驟", icon: "🩺",
                content: [
                    { subtitle: "測量前準備", text: "病人平躺休息 10 分鐘。確保環境溫暖。使用標準成人血壓計袖帶。" },
                    { subtitle: "測量步驟", text: "1. 測量雙上臂血壓，取較高值\n2. 測量雙側踝部血壓（脛後動脈或足背動脈）\n3. 計算 ABI = 踝部收縮壓 ÷ 肱動脈收縮壓" }
                ],
                keyPoints: ["測量前休息 10 分鐘", "使用標準成人袖帶", "踝部測量：脛後動脈或足背動脈", "雙側皆需測量"]
            },
            {
                title: "下肢動脈超音波", icon: "🦵",
                content: [
                    { subtitle: "適應症", text: "間歇性跛行、休息時下肢疼痛、下肢皮膚溫度改變、足部潰瘍不癒合。注意：下肢水腫是靜脈問題，非動脈超音波適應症。" },
                    { subtitle: "檢查體位", text: "病人採平躺仰臥位，下肢水平或略高於心臟。" },
                    { subtitle: "動脈硬化特徵", text: "血管壁增厚、鈣化斑塊、管腔狹窄、狹窄處血流加速。" }
                ],
                keyPoints: ["體位：平躺仰臥位", "適應症：跛行、休息痛", "下肢水腫非動脈超音波適應症", "硬化特徵：壁增厚、斑塊、狹窄"]
            },
            {
                title: "DVT 深部靜脈血栓", icon: "🔬",
                content: [
                    { subtitle: "好發位置", text: "DVT 最常發生在股靜脈（約 50%），其次是膕靜脈。DVT 是肺栓塞的主要來源。" },
                    { subtitle: "超音波特徵", text: "1. 血管不可壓縮（最重要）\n2. 血管內血栓回聲\n3. 血流訊號消失或減弱\n4. 靜脈擴張" },
                    { subtitle: "檢查體位", text: "半坐臥位 30-45 度，使靜脈擴張利於檢測。" }
                ],
                keyPoints: ["最常見：股靜脈", "最重要標準：不可壓縮", "體位：半坐臥位 30-45°", "風險：可能導致肺栓塞"]
            },
            {
                title: "靜脈瓣膜功能評估", icon: "🫀",
                content: [
                    { subtitle: "瓦氏操作法 (Valsalva)", text: "病人屏氣用力增加腹內壓，觀察靜脈逆流。逆流 > 0.5 秒表示瓣膜功能不全。" },
                    { subtitle: "其他試驗", text: "腓腸肌壓迫試驗：評估 DVT。Allen's test：評估手部動脈，非下肢檢查。" }
                ],
                keyPoints: ["Valsalva：評估瓣膜功能", "逆流 > 0.5 秒：瓣膜不全", "腓腸肌壓迫：評估 DVT", "Allen's test：手部動脈，非下肢"]
            },
            {
                title: "病人安全", icon: "⚠️",
                content: [
                    { subtitle: "檢查前", text: "避免使用潤膚乳（影響探頭接觸）。可用清水清洗。" },
                    { subtitle: "協助上下檢查台", text: "一手扶手臂、一手托腰部。下台前先坐起觀察頭暈，確認站穩才放手。" }
                ],
                keyPoints: ["避免潤膚乳", "協助：扶臂托腰", "下台前先坐起觀察", "確認站穩才放手"]
            }
        ];

        const quizQuestions = [
            { id: 1, question: "ABI 的正常值範圍為何？", options: ["0.7-0.9", "0.9-1.3", "1.3-1.5", "0.5-0.7"], correct: 1, explanation: "正常 ABI 為 0.9-1.3。< 0.9 表示 PAD，> 1.3 提示血管鈣化。" },
            { id: 2, question: "ABI 檢查前，病人應休息多久？", options: ["5 分鐘", "10 分鐘", "15 分鐘", "20 分鐘"], correct: 1, explanation: "病人應平躺休息 10 分鐘使血流穩定。" },
            { id: 3, question: "測量踝部血壓通常選擇哪條動脈？", options: ["脛後動脈", "股動脈", "腓動脈", "腸骨動脈"], correct: 0, explanation: "通常選擇脛後動脈或足背動脈，脛後動脈較易觸及。" },
            { id: 4, question: "ABI < 0.9 表示什麼？", options: ["正常", "動脈阻塞", "動脈鈣化", "靜脈曲張"], correct: 1, explanation: "ABI < 0.9 表示周邊動脈疾病 (PAD)。" },
            { id: 5, question: "DVT 最常發生在哪條血管？", options: ["股靜脈", "膕靜脈", "腓靜脈", "脛前靜脈"], correct: 0, explanation: "DVT 最常發生在股靜脈（約 50%）。" },
            { id: 6, question: "評估靜脈瓣膜功能應使用？", options: ["腓腸肌壓迫試驗", "瓦氏操作法", "普克坦試驗", "阿倫試驗"], correct: 1, explanation: "Valsalva maneuver 可觀察靜脈逆流，評估瓣膜功能。" },
            { id: 7, question: "下肢動脈超音波檢查的體位？", options: ["平躺仰臥位", "左側臥位", "立位", "坐位"], correct: 0, explanation: "動脈超音波採平躺仰臥位。" },
            { id: 8, question: "下肢靜脈超音波檢查的體位？", options: ["平躺抬腿", "半坐臥位30-45°", "立位", "側臥位"], correct: 1, explanation: "靜脈超音波採半坐臥位，利於靜脈擴張和血栓檢測。" },
            { id: 9, question: "下列何者不是動脈超音波的適應症？", options: ["間歇性跛行", "皮膚溫度改變", "下肢水腫", "休息痛"], correct: 2, explanation: "下肢水腫是靜脈問題，非動脈超音波適應症。" },
            { id: 10, question: "檢查前應避免使用？", options: ["潤膚乳", "肥皂", "清水", "毛巾"], correct: 0, explanation: "潤膚乳油脂會影響探頭接觸。" },
            { id: 11, question: "動脈硬化的超音波特徵？", options: ["血管壁增厚", "血流減慢", "血管擴張", "阻力降低"], correct: 0, explanation: "動脈硬化特徵：血管壁增厚、斑塊、狹窄。" },
            { id: 12, question: "下列何者不是靜脈曲張症狀？", options: ["下肢腫脹", "色素沉著", "夜間抽筋", "皮膚發紺"], correct: 3, explanation: "發紺是動脈供血不足，非靜脈曲張。" },
            { id: 13, question: "協助病人上下檢查台的正確方式？", options: ["讓病人自行", "一手扶臂一手托腰", "口頭指導", "需要時再幫"], correct: 1, explanation: "標準方式：一手扶臂、一手托腰，預防跌倒。" },
            { id: 14, question: "下列何者不是 DVT 的超音波特徵？", options: ["不可壓縮", "血栓回聲", "血流增強", "靜脈擴張"], correct: 2, explanation: "DVT 血流訊號消失或減弱，非增強。" },
            { id: 15, question: "ABI > 1.3 提示什麼？", options: ["正常", "輕度阻塞", "血管鈣化", "靜脈血栓"], correct: 2, explanation: "ABI > 1.3 提示血管鈣化，常見於糖尿病。" }
        ];

            .quiz-btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 16px; background: linear-gradient(135deg, #06b6d4, #10b981); color: white; }
            .quiz-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(6, 182, 212, 0.3); }
            .result-container { text-align: center; padding: 40px 20px; }
            .result-icon { font-size: 4rem; margin-bottom: 16px; }
            .result-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
            .result-score { font-size: 3rem; font-weight: 700; background: linear-gradient(135deg, #06b6d4, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
            .result-message { color: #94a3b8; margin-bottom: 24px; }
            .result-details { display: flex; justify-content: center; gap: 24px; margin-bottom: 24px; }
            .result-stat-value { font-size: 1.5rem; font-weight: 700; }
            .result-stat-value.correct { color: #10b981; }
            .result-stat-value.incorrect { color: #ef4444; }
            .result-stat-label { font-size: 0.8rem; color: #64748b; }
            .progress-container { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px 20px; margin-bottom: 24px; }
            .progress-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
            .progress-title { font-size: 0.9rem; }
            .progress-percentage { font-size: 0.9rem; font-weight: 600; color: #06b6d4; }
            .progress-bar { height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; }
            .progress-fill { height: 100%; background: linear-gradient(90deg, #06b6d4, #10b981); border-radius: 4px; transition: width 0.3s; }
            .footer { text-align: center; padding: 20px; color: #64748b; font-size: 0.8rem; border-top: 1px solid #334155; margin-top: 40px; }
        `;

        const TeachingSection = ({ data, isOpen, onToggle }) => (
            <div className="section-card fade-in">
                <div className="section-header" onClick={onToggle}>
                    <span className="section-icon">{data.icon}</span>
                    <span className="section-title">{data.title}</span>
                    <span className={`expand-icon ${isOpen ? 'expanded' : ''}`}>▼</span>
                </div>
                {isOpen && (
                    <div className="section-content">
                        {data.content.map((block, idx) => (
                            <div key={idx} className="content-block">
                                <div className="content-subtitle">{block.subtitle}</div>
                                <div className="content-text">{block.text}</div>
                            </div>
                        ))}
                        {data.table && (
                            <table className="criteria-table">
                                <thead><tr>{data.table.headers.map((h, i) => <th key={i}>{h}</th>)}</tr></thead>
                                <tbody>{data.table.rows.map((row, i) => <tr key={i}>{row.map((cell, j) => <td key={j}>{cell}</td>)}</tr>)}</tbody>
                            </table>
                        )}
                        <div className="key-points">
                            <div className="key-points-title">💡 重點整理</div>
                            {data.keyPoints.map((point, idx) => <div key={idx} className="key-point-item">{point}</div>)}
                        </div>
                    </div>
                )}
            </div>
        );

        const Quiz = ({ onComplete }) => {
            const [currentQ, setCurrentQ] = useState(0);
            const [selected, setSelected] = useState(null);
            const [showExp, setShowExp] = useState(false);
            const [score, setScore] = useState(0);
            const [finished, setFinished] = useState(false);

            const handleSelect = (idx) => {
                if (showExp) return;
                setSelected(idx);
                setShowExp(true);
                if (idx === quizQuestions[currentQ].correct) setScore(s => s + 1);
            };

            const handleNext = () => {
                if (currentQ < quizQuestions.length - 1) {
                    setCurrentQ(currentQ + 1);
                    setSelected(null);
                    setShowExp(false);
                } else {
                    setFinished(true);
                    const finalScore = Math.round((score / quizQuestions.length) * 100);
                    localStorage.setItem('exam-vascular-abi-score', finalScore);
                    onComplete(finalScore);

                    // Track achievement
                    if (window.AchievementTracker) {
                        window.AchievementTracker.trackQuizComplete('exam-vascular-abi', finalScore);
                    }
                }
            };

            const handleRestart = () => {
                setCurrentQ(0); setSelected(null); setShowExp(false); setScore(0); setFinished(false);
            };

            if (finished) {
                const pct = Math.round((score / quizQuestions.length) * 100);
                const icon = pct >= 80 ? "🎉" : pct >= 60 ? "👍" : "📚";
                const msg = pct >= 80 ? "太棒了！你對血管超音波有很好的掌握！" : pct >= 60 ? "不錯！建議複習重點內容。" : "建議重新閱讀教學內容！";
                return (
                    <div className="quiz-container">
                        <div className="result-container">
                            <div className="result-icon">{icon}</div>
                            <div className="result-title">測驗完成！</div>
                            <div className="result-score">{pct}%</div>
                            <div className="result-message">{msg}</div>
                            <div className="result-details">
                                <div><div className="result-stat-value correct">{score}</div><div className="result-stat-label">答對</div></div>
                                <div><div className="result-stat-value incorrect">{quizQuestions.length - score}</div><div className="result-stat-label">答錯</div></div>
                            </div>
                            <button className="quiz-btn" onClick={handleRestart}>重新測驗</button>
                        </div>
                    </div>
                );
            }

            const q = quizQuestions[currentQ];
            return (
                <div>
                    <div className="progress-container">
                        <div className="progress-header">
                            <span className="progress-title">測驗進度</span>
                            <span className="progress-percentage">{currentQ + 1} / {quizQuestions.length}</span>
                        </div>
                        <div className="progress-bar">
                            <div className="progress-fill" style={{ width: `${((currentQ + 1) / quizQuestions.length) * 100}%` }}></div>
                        </div>
                    </div>
                    <div className="quiz-container fade-in">
                        <div className="quiz-header">
                            <span className="quiz-progress">第 {currentQ + 1} 題</span>
                            <span className="quiz-progress">得分：{score}</span>
                        </div>
                        <div className="quiz-question">{q.question}</div>
                        <div className="quiz-options">
                            {q.options.map((opt, idx) => {
                                let cls = "quiz-option";
                                if (showExp) {
                                    cls += " disabled";
                                    if (idx === q.correct) cls += " correct";
                                    else if (idx === selected) cls += " incorrect";
                                }
                                return <button key={idx} className={cls} onClick={() => handleSelect(idx)}>{String.fromCharCode(65 + idx)}. {opt}</button>;
                            })}
                        </div>
                        {showExp && (
                            <div className="quiz-explanation">
                                <div className="quiz-explanation-title">💡 解析</div>
                                <div className="quiz-explanation-text">{q.explanation}</div>
                            </div>
                        )}
                        {showExp && <button className="quiz-btn" onClick={handleNext}>{currentQ < quizQuestions.length - 1 ? '下一題' : '完成測驗'}</button>}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('teaching');
            const [openSections, setOpenSections] = useState({ 0: true });
            const [quizScore, setQuizScore] = useState(null);

            useEffect(() => {
                const saved = localStorage.getItem('exam-vascular-abi-score');
                if (saved) setQuizScore(parseInt(saved));
            }, []);

            return (
                <div className="app-container">
                    <style>{styles}</style>
                    <a href="exam.html" className="back-link">← 返回訓練中心</a>
                    <header className="header">
                        <div className="header-icon">🦵</div>
                        <h1>ABI 與下肢血管超音波</h1>
                        <p>Vascular Ultrasound & ABI Assessment</p>
                    </header>
                    <div className="tabs">
                        <button className={`tab ${activeTab === 'teaching' ? 'active' : ''}`} onClick={() => setActiveTab('teaching')}>📚 教學內容</button>
                        <button className={`tab ${activeTab === 'quiz' ? 'active' : ''}`} onClick={() => setActiveTab('quiz')}>✍️ 測驗 ({quizScore !== null ? `${quizScore}%` : '未完成'})</button>
                    </div>
                    {activeTab === 'teaching' && (
                        <div className="fade-in">
                            {teachingContent.map((section, idx) => (
                                <TeachingSection key={idx} data={section} isOpen={openSections[idx] || false} onToggle={() => setOpenSections(prev => ({ ...prev, [idx]: !prev[idx] }))} />
                            ))}
                        </div>
                    )}
                    {activeTab === 'quiz' && <Quiz onComplete={setQuizScore} />}
                    <footer className="footer">
                        <p>心血管中心教育訓練 | ABI 與下肢血管超音波</p>
                        <p>台大醫院新竹分院 | 2025</p>
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>

    <script>
        function initShareButtons() {
            const pageUrl = window.location.href;
            const pageTitle = document.title;
            const encodedUrl = encodeURIComponent(pageUrl);
            const qrCodeImg = document.getElementById('qrCode');
            if (qrCodeImg) qrCodeImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodedUrl}`;
            const lineShare = document.getElementById('lineShare');
            if (lineShare) lineShare.href = `https://social-plugins.line.me/lineit/share?url=${encodedUrl}`;
            const emailShare = document.getElementById('emailShare');
            if (emailShare) {
                const emailSubject = encodeURIComponent(`分享：${pageTitle}`);
                const emailBody = encodeURIComponent(`我想和您分享這個頁面：\n\n${pageTitle}\n\n${pageUrl}`);
                emailShare.href = `mailto:?subject=${emailSubject}&body=${emailBody}`;
            }
        }
        function toggleShareMenu() {
            const menu = document.getElementById('shareMenu');
            if (menu) menu.classList.toggle('active');
        }
        function copyPageUrl() {
            const pageUrl = window.location.href;
            navigator.clipboard.writeText(pageUrl).then(() => {
                alert('連結已複製到剪貼簿！');
            }).catch(() => {
                const textArea = document.createElement('textarea');
                textArea.value = pageUrl;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('連結已複製到剪貼簿！');
            });
        }
        document.addEventListener('click', function(event) {
            const shareButton = document.querySelector('.share-button');
            const shareMenu = document.getElementById('shareMenu');
            if (shareButton && shareMenu && !shareButton.contains(event.target) && shareMenu.classList.contains('active')) {
                shareMenu.classList.remove('active');
            }
        });
        document.addEventListener('DOMContentLoaded', initShareButtons);
    </script>

    <!-- Achievement System Scripts -->
    <script src="achievements-config.js"></script>
    <script src="achievements.js"></script>
</body>
</html>
