<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F97316">
  <title>主動脈瓣疾病 - TSOC Echo Learning</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans TC', 'Inter', sans-serif; }
    .font-mono { font-family: 'SF Mono', 'Consolas', monospace; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fade-in 0.3s ease-out; }
    body { margin: 0; padding: 0; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const Icon = ({ name, className = "", size = 20, ...props }) => {
      const [svg, setSvg] = React.useState('');
      React.useEffect(() => {
        if (lucide.icons[name]) {
          setSvg(lucide.icons[name].toSvg({ width: size, height: size, class: className }));
        }
      }, [name, className, size]);
      return <span dangerouslySetInnerHTML={{ __html: svg }} {...props} />;
    };

    const chapters = {
      as: {
        id: 'as',
        title: 'Chapter 09: 主動脈瓣狹窄',
        titleEn: 'Aortic Stenosis',
        icon: '🔴',
        color: '#F97316',
        sections: [
          {
            id: 'as-overview',
            title: 'AS 概述',
            content: [
              { type: 'heading', text: '病因' },
              { type: 'table', headers: ['年齡', '常見病因'],
                rows: [
                  ['< 50 歲', '先天性雙葉瓣 (Bicuspid)'],
                  ['50-70 歲', '雙葉瓣退化或風濕性'],
                  ['> 70 歲', '退化性鈣化'],
                ]
              },
              { type: 'heading', text: '病理生理' },
              { type: 'point', text: '瓣膜開口縮小 → 跨瓣壓差增加' },
              { type: 'point', text: '壓力負荷 → LV 同心性肥厚' },
              { type: 'point', text: '舒張功能障礙 → 症狀出現' },
              { type: 'warning', text: '⚠️ AS 三聯症：心絞痛、昏厥、心衰' },
            ]
          },
          {
            id: 'as-severity',
            title: 'AS 嚴重度分級',
            content: [
              { type: 'heading', text: '標準分級（高流量狀態）' },
              { type: 'table', headers: ['參數', '輕度', '中度', '重度'],
                rows: [
                  ['Vmax', '< 3.0 m/s', '3.0-4.0 m/s', '> 4.0 m/s'],
                  ['Mean PG', '< 20 mmHg', '20-40 mmHg', '> 40 mmHg'],
                  ['AVA', '> 1.5 cm²', '1.0-1.5 cm²', '< 1.0 cm²'],
                  ['AVAi', '> 0.85 cm²/m²', '-', '< 0.6 cm²/m²'],
                ]
              },
              { type: 'formula', text: 'AVA = (LVOT 面積 × LVOT VTI) / AV VTI' },
              { type: 'formula', text: 'LVOT 面積 = π × (LVOT 直徑/2)²' },
              { type: 'tip', text: '💡 LVOT 直徑測量最關鍵，誤差會被平方放大' },
            ]
          },
          {
            id: 'as-low-flow',
            title: '低流量 AS',
            content: [
              { type: 'heading', text: '經典型低流量低梯度 AS' },
              { type: 'point', text: 'LVEF < 50%' },
              { type: 'point', text: 'AVA < 1.0 cm²，Mean PG < 40 mmHg' },
              { type: 'point', text: 'SV index < 35 mL/m²' },
              { type: 'heading', text: 'Dobutamine 負荷測試' },
              { type: 'table', headers: ['反應', 'SV 增加', 'AVA', 'Mean PG', '診斷'],
                rows: [
                  ['真性重度 AS', '> 20%', '仍 < 1.0', '> 40', '手術適應症'],
                  ['假性重度 AS', '> 20%', '> 1.0', '< 40', '觀察'],
                  ['無收縮儲備', '< 20%', '不變', '不變', '預後差'],
                ]
              },
              { type: 'heading', text: '矛盾型低流量 AS' },
              { type: 'point', text: 'LVEF ≥ 50% 但 SV index < 35 mL/m²' },
              { type: 'point', text: '常見於老年、高血壓、小 LV 腔' },
              { type: 'point', text: '使用 CT 評估瓣膜鈣化量確認嚴重度' },
              { type: 'warning', text: '⚠️ 矛盾型需排除測量誤差和其他原因' },
            ]
          },
        ],
        quiz: [
          {
            q: '重度 AS 的 Vmax 標準是？',
            options: ['> 3.0 m/s', '> 3.5 m/s', '> 4.0 m/s', '> 5.0 m/s'],
            correct: 2,
            explanation: '重度 AS：Vmax > 4.0 m/s'
          },
          {
            q: '重度 AS 的 AVA 標準是？',
            options: ['< 1.5 cm²', '< 1.2 cm²', '< 1.0 cm²', '< 0.8 cm²'],
            correct: 2,
            explanation: '重度 AS：AVA < 1.0 cm²'
          },
          {
            q: '低流量低梯度 AS 的 SV index 標準是？',
            options: ['< 25 mL/m²', '< 30 mL/m²', '< 35 mL/m²', '< 40 mL/m²'],
            correct: 2,
            explanation: '低流量定義為 SV index < 35 mL/m²'
          },
        ]
      },
      ar: {
        id: 'ar',
        title: 'Chapter 10: 主動脈瓣逆流',
        titleEn: 'Aortic Regurgitation',
        icon: '🟠',
        color: '#EA580C',
        sections: [
          {
            id: 'ar-overview',
            title: 'AR 概述',
            content: [
              { type: 'heading', text: '病因' },
              { type: 'table', headers: ['瓣膜病變', '主動脈根部病變'],
                rows: [
                  ['雙葉瓣', '馬凡氏症候群'],
                  ['風濕性', '主動脈瘤'],
                  ['感染性心內膜炎', '主動脈剝離'],
                  ['退化性', '高血壓'],
                ]
              },
              { type: 'heading', text: '分類' },
              { type: 'point', text: '慢性 AR：逐漸適應，LV 擴大' },
              { type: 'point', text: '急性 AR：緊急情況，血流動力學不穩定' },
              { type: 'warning', text: '⚠️ 急性 AR 可能無顯著 LV 擴大' },
            ]
          },
          {
            id: 'ar-severity',
            title: 'AR 嚴重度評估',
            content: [
              { type: 'heading', text: '定性評估' },
              { type: 'table', headers: ['參數', '輕度', '中度', '重度'],
                rows: [
                  ['Jet/LVOT 比', '< 25%', '25-65%', '> 65%'],
                  ['Vena Contracta', '< 3 mm', '3-6 mm', '> 6 mm'],
                  ['PHT', '> 500 ms', '200-500 ms', '< 200 ms'],
                ]
              },
              { type: 'heading', text: '定量評估' },
              { type: 'table', headers: ['參數', '輕度', '中度', '重度'],
                rows: [
                  ['EROA', '< 0.10 cm²', '0.10-0.29 cm²', '≥ 0.30 cm²'],
                  ['RVol', '< 30 mL', '30-59 mL', '≥ 60 mL'],
                  ['RF', '< 30%', '30-49%', '≥ 50%'],
                ]
              },
              { type: 'heading', text: 'PHT 測量' },
              { type: 'step', text: '使用 CW Doppler 從 A5C 或 A3C' },
              { type: 'step', text: '追蹤 AR jet 的減速斜率' },
              { type: 'step', text: 'PHT = 從峰值降至峰值一半所需時間' },
              { type: 'formula', text: 'PHT 短 = 舒張壓快速平衡 = AR 嚴重' },
            ]
          },
          {
            id: 'ar-lv',
            title: 'LV 反應評估',
            content: [
              { type: 'heading', text: 'LV 擴大指標' },
              { type: 'table', headers: ['參數', '手術考慮閾值'],
                rows: [
                  ['LVEDD', '> 70 mm'],
                  ['LVESD', '> 50 mm 或 > 25 mm/m²'],
                  ['LVEF', '< 55%'],
                ]
              },
              { type: 'heading', text: '其他評估' },
              { type: 'point', text: '主動脈根部直徑（可能需手術）' },
              { type: 'point', text: '降主動脈舒張期逆流（全舒張期 = 重度）' },
              { type: 'tip', text: '💡 無症狀重度 AR：定期追蹤 LV 尺寸和功能' },
            ]
          },
        ],
        quiz: [
          {
            q: 'AR 的 Vena Contracta > 6 mm 代表什麼？',
            options: ['輕度 AR', '中度 AR', '重度 AR', '無法判斷'],
            correct: 2,
            explanation: 'Vena Contracta > 6 mm = 重度 AR'
          },
          {
            q: 'AR 的 PHT < 200 ms 代表什麼？',
            options: ['輕度 AR', '中度 AR', '重度 AR', '正常'],
            correct: 2,
            explanation: 'PHT < 200 ms = 重度 AR（快速壓力平衡）'
          },
          {
            q: '慢性 AR 建議手術的 LVESD 閾值是？',
            options: ['> 40 mm', '> 45 mm', '> 50 mm', '> 55 mm'],
            correct: 2,
            explanation: 'LVESD > 50 mm 或 > 25 mm/m² 考慮手術'
          },
        ]
      },
    };

    const abbreviations = [
      { abbr: 'AS', full: 'Aortic Stenosis', chinese: '主動脈瓣狹窄' },
      { abbr: 'AR', full: 'Aortic Regurgitation', chinese: '主動脈瓣逆流' },
      { abbr: 'AVA', full: 'Aortic Valve Area', chinese: '主動脈瓣面積' },
      { abbr: 'AVAi', full: 'AVA indexed to BSA', chinese: '體表面積校正瓣膜面積' },
      { abbr: 'Vmax', full: 'Maximum velocity', chinese: '最大速度' },
      { abbr: 'PG', full: 'Pressure Gradient', chinese: '壓力梯度' },
      { abbr: 'VTI', full: 'Velocity Time Integral', chinese: '速度時間積分' },
      { abbr: 'LVOT', full: 'LV Outflow Tract', chinese: '左心室流出道' },
      { abbr: 'SV', full: 'Stroke Volume', chinese: '每搏輸出量' },
      { abbr: 'VC', full: 'Vena Contracta', chinese: '縮流頸' },
      { abbr: 'PHT', full: 'Pressure Half Time', chinese: '壓力半衰時間' },
      { abbr: 'EROA', full: 'Effective Regurgitant Orifice Area', chinese: '有效逆流口面積' },
      { abbr: 'RVol', full: 'Regurgitant Volume', chinese: '逆流容積' },
      { abbr: 'RF', full: 'Regurgitant Fraction', chinese: '逆流分率' },
      { abbr: 'LVEDD', full: 'LV End-Diastolic Diameter', chinese: '左心室舒張末期直徑' },
      { abbr: 'LVESD', full: 'LV End-Systolic Diameter', chinese: '左心室收縮末期直徑' },
    ];

    function AorticValveApp() {
      const [currentView, setCurrentView] = useState('home');
      const [selectedChapter, setSelectedChapter] = useState(null);
      const [selectedSection, setSelectedSection] = useState(0);
      const [quizMode, setQuizMode] = useState(false);
      const [quizIndex, setQuizIndex] = useState(0);
      const [quizAnswer, setQuizAnswer] = useState(null);
      const [quizScore, setQuizScore] = useState(0);
      const [quizComplete, setQuizComplete] = useState(false);
      const [showAbbrModal, setShowAbbrModal] = useState(false);

      const chapterList = Object.values(chapters);

      const startQuiz = (chapter) => { setSelectedChapter(chapter); setQuizMode(true); setQuizIndex(0); setQuizAnswer(null); setQuizScore(0); setQuizComplete(false); };
      const handleQuizAnswer = (index) => { if (quizAnswer !== null) return; setQuizAnswer(index); if (index === selectedChapter.quiz[quizIndex].correct) setQuizScore(prev => prev + 1); };
      const nextQuestion = () => { if (quizIndex < selectedChapter.quiz.length - 1) { setQuizIndex(prev => prev + 1); setQuizAnswer(null); } else setQuizComplete(true); };

      const renderContentItem = (item, idx) => {
        switch (item.type) {
          case 'heading': return <h3 key={idx} className="text-lg font-bold text-slate-800 mt-6 mb-3 flex items-center gap-2"><div className="w-1 h-5 bg-gradient-to-b from-orange-500 to-red-500 rounded-full"></div>{item.text}</h3>;
          case 'step': return <div key={idx} className="flex gap-3 my-2 items-start"><div className="w-6 h-6 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">{idx + 1}</div><p className="text-slate-700 leading-relaxed">{item.text}</p></div>;
          case 'point': return <p key={idx} className="my-2 text-slate-700 pl-4 border-l-2 border-orange-200">{item.text}</p>;
          case 'formula': return <div key={idx} className="my-3 bg-gradient-to-r from-amber-50 to-orange-50 p-4 rounded-xl border border-amber-200 font-mono text-sm text-amber-900 overflow-x-auto">{item.text}</div>;
          case 'tip': return <div key={idx} className="my-3 bg-gradient-to-r from-emerald-50 to-teal-50 p-4 rounded-xl border border-emerald-200 text-emerald-800">{item.text}</div>;
          case 'warning': return <div key={idx} className="my-3 bg-gradient-to-r from-red-50 to-rose-50 p-4 rounded-xl border border-red-200 text-red-800">{item.text}</div>;
          case 'table': return (
            <div key={idx} className="my-4 overflow-x-auto rounded-xl border border-slate-200 shadow-sm">
              <table className="w-full text-sm"><thead className="bg-gradient-to-r from-orange-50 to-red-50"><tr>{item.headers.map((h, i) => <th key={i} className="px-4 py-3 text-left font-semibold text-slate-700 border-b border-slate-200">{h}</th>)}</tr></thead>
              <tbody>{item.rows.map((row, i) => <tr key={i} className="hover:bg-orange-50/50 transition-colors">{row.map((cell, j) => <td key={j} className="px-4 py-3 border-b border-slate-100 text-slate-700">{cell}</td>)}</tr>)}</tbody></table>
            </div>
          );
          default: return null;
        }
      };

      const renderHome = () => (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 via-orange-50 to-red-50">
          <div className="bg-gradient-to-r from-orange-600 via-orange-500 to-red-500 text-white px-4 py-6 shadow-lg">
            <div className="flex items-center justify-between mb-2">
              <a href="tsoc-echo-learning-2025.html" className="p-2 hover:bg-white/10 rounded-lg transition-colors flex items-center gap-2"><Icon name="arrow-left" size={20} /><span className="text-sm">返回主頁</span></a>
              <button onClick={() => setShowAbbrModal(true)} className="p-2 hover:bg-white/10 rounded-lg transition-colors"><Icon name="bookmark" size={24} /></button>
            </div>
            <h1 className="text-2xl font-bold text-center">🔴 主動脈瓣疾病</h1>
            <p className="text-orange-100 text-sm text-center mt-1">Chapters 09-10: AS & AR</p>
          </div>
          <div className="px-4 py-6 space-y-4">
            <h2 className="text-lg font-bold text-slate-800 mb-4">選擇章節</h2>
            {chapterList.map((chapter) => (
              <button key={chapter.id} onClick={() => { setSelectedChapter(chapter); setSelectedSection(0); setCurrentView('chapter'); }} className="w-full bg-white rounded-2xl p-4 shadow-sm hover:shadow-lg transition-all border border-slate-100 text-left group">
                <div className="flex items-center gap-4">
                  <div className="w-14 h-14 rounded-xl flex items-center justify-center text-2xl shadow-sm" style={{ backgroundColor: `${chapter.color}15` }}>{chapter.icon}</div>
                  <div className="flex-1"><h3 className="font-bold text-slate-800 group-hover:text-orange-600 transition-colors">{chapter.title}</h3><p className="text-sm text-slate-500">{chapter.titleEn}</p><div className="flex items-center gap-4 mt-2 text-xs text-slate-400"><span>📄 {chapter.sections.length} 小節</span><span>🏆 {chapter.quiz.length} 題測驗</span></div></div>
                  <Icon name="chevron-right" className="text-slate-400 group-hover:text-orange-600" size={20} />
                </div>
              </button>
            ))}
          </div>
          <div className="px-4 pb-6">
            <h2 className="text-lg font-bold text-slate-800 mb-4">🔗 相關主題</h2>
            <div className="grid grid-cols-2 gap-3">
              <a href="echo-mitral-valve.html" className="bg-white rounded-xl p-3 shadow-sm hover:shadow-md transition-all border border-slate-100 flex items-center gap-2"><span className="text-lg">🟣</span><span className="text-sm font-medium text-slate-700">二尖瓣疾病</span></a>
              <a href="echo-prosthetics-endocarditis.html" className="bg-white rounded-xl p-3 shadow-sm hover:shadow-md transition-all border border-slate-100 flex items-center gap-2"><span className="text-lg">⚙️</span><span className="text-sm font-medium text-slate-700">人工瓣膜</span></a>
            </div>
          </div>
        </div>
      );

      const renderChapter = () => {
        if (!selectedChapter) return null;
        const section = selectedChapter.sections[selectedSection];
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-50 via-orange-50 to-red-50">
            <div className="sticky top-0 z-10 px-4 py-4 shadow-lg" style={{ background: `linear-gradient(135deg, ${selectedChapter.color}, ${selectedChapter.color}dd)` }}>
              <div className="flex items-center justify-between text-white"><button onClick={() => setCurrentView('home')} className="p-2 hover:bg-white/10 rounded-lg transition-colors flex items-center gap-1"><Icon name="chevron-left" size={20} /><span className="text-sm">返回</span></button><h1 className="font-bold text-lg flex-1 text-center px-2 truncate">{selectedChapter.title}</h1><a href="tsoc-echo-learning-2025.html" className="p-2 hover:bg-white/10 rounded-lg transition-colors"><Icon name="home" size={20} /></a></div>
            </div>
            <div className="overflow-x-auto bg-white border-b border-slate-100 shadow-sm"><div className="flex p-2 gap-2 min-w-max">{selectedChapter.sections.map((sec, idx) => (<button key={sec.id} onClick={() => setSelectedSection(idx)} className={`px-4 py-2 rounded-full text-sm whitespace-nowrap transition-all ${selectedSection === idx ? 'text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`} style={selectedSection === idx ? { backgroundColor: selectedChapter.color } : {}}>{sec.title}</button>))}</div></div>
            <div className="px-4 py-6"><h2 className="text-xl font-bold text-slate-800 mb-4">{section.title}</h2><div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">{section.content.map((item, idx) => renderContentItem(item, idx))}</div></div>
            <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-3 flex items-center justify-between shadow-lg">
              <button onClick={() => setSelectedSection(prev => Math.max(0, prev - 1))} disabled={selectedSection === 0} className="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-100 text-slate-700 disabled:opacity-50 hover:bg-slate-200 transition-colors"><Icon name="chevron-left" size={20} />上一節</button>
              <button onClick={() => startQuiz(selectedChapter)} className="flex items-center gap-2 px-4 py-2 rounded-xl text-white shadow-md hover:shadow-lg transition-all" style={{ backgroundColor: selectedChapter.color }}>🏆 測驗</button>
              <button onClick={() => setSelectedSection(prev => Math.min(selectedChapter.sections.length - 1, prev + 1))} disabled={selectedSection === selectedChapter.sections.length - 1} className="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-100 text-slate-700 disabled:opacity-50 hover:bg-slate-200 transition-colors">下一節<Icon name="chevron-right" size={20} /></button>
            </div>
            <div className="h-20"></div>
          </div>
        );
      };

      const renderQuiz = () => {
        if (!selectedChapter?.quiz) return null;
        const currentQuestion = selectedChapter.quiz[quizIndex];
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-50 via-purple-50 to-indigo-50">
            <div className="bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-4 py-4 shadow-lg">
              <div className="flex items-center justify-between"><button onClick={() => { setQuizMode(false); setCurrentView('chapter'); }} className="p-2 hover:bg-white/10 rounded-lg transition-colors"><Icon name="x" size={24} /></button><h1 className="font-bold text-lg">{selectedChapter.title} - 測驗</h1><div className="w-10"></div></div>
              <div className="mt-4 flex items-center gap-2"><div className="flex-1 h-2 bg-white/20 rounded-full overflow-hidden"><div className="h-full bg-white rounded-full transition-all duration-300" style={{ width: `${((quizIndex + 1) / selectedChapter.quiz.length) * 100}%` }}></div></div><span className="text-sm text-white/80">{quizIndex + 1}/{selectedChapter.quiz.length}</span></div>
            </div>
            {quizComplete ? (
              <div className="px-4 py-8 text-center">
                <div className="w-24 h-24 mx-auto mb-6 rounded-full bg-gradient-to-br from-purple-500 to-indigo-500 flex items-center justify-center shadow-lg text-4xl">🏆</div>
                <h2 className="text-2xl font-bold text-slate-800 mb-2">測驗完成！</h2><p className="text-slate-600 mb-6">你的得分：<span className="text-3xl font-bold text-purple-600 mx-2">{quizScore}</span>/ {selectedChapter.quiz.length}</p>
                <div className="space-y-3"><button onClick={() => { setQuizIndex(0); setQuizAnswer(null); setQuizScore(0); setQuizComplete(false); }} className="w-full py-3 rounded-xl bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-semibold shadow-md">🔄 重新測驗</button><button onClick={() => { setQuizMode(false); setCurrentView('chapter'); }} className="w-full py-3 rounded-xl bg-slate-100 text-slate-700 font-semibold">返回章節</button></div>
              </div>
            ) : (
              <div className="px-4 py-6">
                <div className="bg-white rounded-2xl p-6 shadow-lg border border-slate-100 mb-6"><h3 className="text-lg font-bold text-slate-800 mb-6 leading-relaxed">{currentQuestion.q}</h3><div className="space-y-3">{currentQuestion.options.map((option, idx) => { const isCorrect = idx === currentQuestion.correct; const isSelected = quizAnswer === idx; let buttonStyle = 'bg-slate-50 border-slate-200 text-slate-700'; if (quizAnswer !== null) { if (isCorrect) buttonStyle = 'bg-emerald-50 border-emerald-500 text-emerald-700'; else if (isSelected) buttonStyle = 'bg-red-50 border-red-500 text-red-700'; } return (<button key={idx} onClick={() => handleQuizAnswer(idx)} disabled={quizAnswer !== null} className={`w-full p-4 rounded-xl border-2 text-left transition-all ${buttonStyle} ${quizAnswer === null ? 'hover:border-purple-300 hover:bg-purple-50' : ''}`}><div className="flex items-center gap-3"><div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm ${quizAnswer !== null && isCorrect ? 'bg-emerald-500 text-white' : quizAnswer !== null && isSelected ? 'bg-red-500 text-white' : 'bg-slate-200 text-slate-600'}`}>{quizAnswer !== null && isCorrect ? '✓' : quizAnswer !== null && isSelected ? '✗' : String.fromCharCode(65 + idx)}</div><span className="font-medium">{option}</span></div></button>); })}</div></div>
                {quizAnswer !== null && (<><div className="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-2xl p-5 border border-blue-200 mb-6 animate-fade-in"><h4 className="font-bold text-blue-800 mb-2">💡 解釋</h4><p className="text-blue-700">{currentQuestion.explanation}</p></div><button onClick={nextQuestion} className="w-full py-4 rounded-xl bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-bold shadow-md">{quizIndex < selectedChapter.quiz.length - 1 ? '下一題 →' : '查看結果 →'}</button></>)}
              </div>
            )}
          </div>
        );
      };

      const renderAbbrModal = () => (
        <div className={`fixed inset-0 z-50 transition-all duration-300 ${showAbbrModal ? 'visible' : 'invisible'}`}>
          <div className={`absolute inset-0 bg-black/50 transition-opacity ${showAbbrModal ? 'opacity-100' : 'opacity-0'}`} onClick={() => setShowAbbrModal(false)}></div>
          <div className={`absolute inset-4 md:inset-10 bg-white rounded-2xl shadow-2xl transition-transform ${showAbbrModal ? 'scale-100' : 'scale-95'} flex flex-col`}>
            <div className="bg-gradient-to-r from-orange-600 to-red-600 text-white p-4 rounded-t-2xl flex items-center justify-between"><h2 className="font-bold text-lg">📖 縮寫對照表</h2><button onClick={() => setShowAbbrModal(false)} className="p-2 hover:bg-white/10 rounded-lg transition-colors"><Icon name="x" size={24} /></button></div>
            <div className="flex-1 overflow-y-auto p-4"><div className="grid gap-2">{abbreviations.map((item, idx) => (<div key={idx} className="flex items-center gap-4 p-3 bg-slate-50 rounded-xl"><span className="font-mono font-bold text-orange-600 w-16 text-sm">{item.abbr}</span><div className="flex-1"><p className="text-slate-800 text-sm">{item.full}</p><p className="text-slate-500 text-xs">{item.chinese}</p></div></div>))}</div></div>
          </div>
        </div>
      );

      return (<div className="font-sans">{quizMode ? renderQuiz() : currentView === 'chapter' ? renderChapter() : renderHome()}{renderAbbrModal()}</div>);
    }

    ReactDOM.render(<AorticValveApp />, document.getElementById('root'));
  </script>
</body>
</html>
