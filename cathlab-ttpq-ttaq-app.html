<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心導管室團隊評估表單｜T-TPQ／T-TAQ（院內情境化版）</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1e3a5f; --primary-light:#2d5a87; --accent:#e74c3c;
  --success:#27ae60; --warning:#f39c12;
  --bg-cream:#faf8f5; --bg-card:#ffffff;
  --text-dark:#2c3e50; --text-muted:#7f8c8d; --border:#ecf0f1;
  --shadow:0 4px 20px rgba(0,0,0,.08);
}
html.dark-theme{
  --bg-cream:#1a1a2e; --bg-card:#16213e; --text-dark:#eaeaea;
  --text-muted:#a0a0a0; --border:#2d3748; --shadow:0 4px 20px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg-cream);color:var(--text-dark);
  font-family:'Noto Sans TC',-apple-system,'Segoe UI',sans-serif;line-height:1.7}
.app{max-width:900px;margin:0 auto;padding:0 14px env(safe-area-inset-bottom)}
header.hd{background:var(--primary);color:#fff;padding:18px 16px;border-radius:0 0 10px 10px;margin:0 -14px 14px}
header.hd .kicker{font-size:12px;letter-spacing:1.5px;opacity:.85}
header.hd h1{font-size:19px;margin:6px 0 4px;font-weight:600}
header.hd .sub{font-size:12.5px;opacity:.8}
.themebtn{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.15);
  color:#fff;border:0;border-radius:6px;padding:7px 10px;font-size:12px;cursor:pointer}
.wrap{position:relative}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 4px;color:var(--primary-light)}
.card h2 .en{font-size:12px;color:var(--text-muted);font-weight:400;margin-left:6px}
.note{font-size:12.5px;color:var(--text-muted);margin:0 0 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tab{flex:0 0 auto;min-height:44px;padding:9px 14px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg-card);color:var(--text-muted);font-size:13.5px;cursor:pointer;font-family:inherit}
.tab.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--success);margin-left:6px}
.bar{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar>div{height:100%;background:var(--success);transition:width .3s}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
input,select,textarea{width:100%;font-size:16px;font-family:inherit;padding:10px;
  border:1px solid var(--border);border-radius:7px;background:var(--bg-card);color:var(--text-dark)}
textarea{min-height:88px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.item{padding:12px 0;border-bottom:1px dashed var(--border)}
.item:last-child{border-bottom:0}
.item .q{font-size:14px;margin-bottom:9px;display:flex;gap:8px}
.item .q .n{color:var(--primary-light);font-weight:600;flex:0 0 auto}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.lk{min-height:48px;border:1px solid var(--border);border-radius:7px;background:var(--bg-card);
  color:var(--text-muted);font-size:11.5px;font-family:inherit;cursor:pointer;padding:4px 2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.15s}
.lk b{font-size:14px}
.lk.on{background:var(--primary);border-color:var(--primary);color:#fff}
.lk.na.on{background:var(--text-muted);border-color:var(--text-muted)}
.dimhead{background:var(--primary);color:#fff;padding:8px 12px;border-radius:6px;
  font-size:14px;font-weight:600;margin:18px 0 2px}
.dimhead:first-of-type{margin-top:4px}
.dimhead .en{font-weight:400;font-size:11.5px;opacity:.8;margin-left:6px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{min-height:48px;padding:11px 18px;border-radius:8px;border:0;background:var(--primary);
  color:#fff;font-size:14px;font-family:inherit;cursor:pointer;font-weight:500}
.btn.alt{background:var(--bg-card);color:var(--primary-light);border:1px solid var(--primary-light)}
.btn.warn{background:var(--bg-card);color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.qrbox{text-align:center;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:14px}
.qrbox img{width:210px;height:210px;max-width:82%;border-radius:8px;background:#fff;padding:8px}
.qrbox p{font-size:12.5px;color:var(--text-muted);margin:10px 0 0}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{border:1px solid var(--border);padding:8px;text-align:left}
th{background:var(--primary);color:#fff;font-weight:500}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;color:#fff}
.warnbox{border-left:4px solid var(--warning);background:rgba(243,156,18,.08);
  padding:11px 13px;border-radius:0 7px 7px 0;font-size:13px;margin-bottom:12px}
.foot{font-size:11.5px;color:var(--text-muted);border-top:1px solid var(--border);
  padding:14px 2px 28px;line-height:1.75}
.foot b{color:var(--text-dark)}
@media print{
  .tabs,.themebtn,.btnrow,.bar{display:none!important}
  body{background:#fff}.card{box-shadow:none;page-break-inside:avoid}
}
</style>
</head>

const ROLES = ['心臟內科主治醫師','心臟內科住院醫師／fellow','專科護理師 (NP)',
  '導管室護理師','放射師','醫事技術員','其他'];
const YEARS = ['< 1 年','1–3 年','3–5 年','5–10 年','> 10 年'];
const FREQ  = ['每週 ≥ 4 天','每週 2–3 天','每週 ≤ 1 天','僅支援／不定期'];
const PHASE = ['前測 (baseline，訓練前)','後測 (post，訓練後)','追蹤 (follow-up，6–12 個月)'];

const OPENQ = [
  '在心導管室的團隊溝通中，你認為目前最需要優先改善的一件事是什麼？',
  '請描述一次「因為團隊溝通良好而避免了問題」或「因為溝通不良而差點出事」的實際情境（請勿寫入可辨識病人身分之資訊）。',
  '哪些制度或流程上的障礙，讓 SBAR／check-back／CUS 等工具在導管室不容易被實際使用？',
];

/* ================================ 元件 ================================ */
const Likert = ({val,onPick,idBase}) => (
  <div className="likert">
    {SCALE.map(s=>(
      <button key={s.v} className={'lk'+(val===s.v?' on':'')}
        onClick={()=>onPick(val===s.v?null:s.v)}
        aria-pressed={val===s.v} aria-label={idBase+' '+s.zh}>
        <b>{s.v}</b><span>{s.zh}</span>
      </button>
    ))}
  </div>
);

const Scale = ({prefix,bank,ans,setAns,title,en,intro}) => (
  <div className="card">
    <h2>{title}<span className="en">{en}</span></h2>
    <p className="note">{intro}</p>
    {DIMS.map(d=>(
      <div key={d.k}>
        <div className="dimhead">{d.zh}<span className="en">{d.en}</span></div>
        {bank[d.k].map((q,i)=>{
          const id = prefix+'_'+d.k+'_'+(i+1);
          return (
            <div className="item" key={id}>
              <div className="q"><span className="n">{i+1}.</span><span>{q}</span></div>
              <Likert idBase={id} val={ans[id]??null}
                onPick={v=>setAns(a=>({...a,[id]:v}))}/>
            </div>
          );
        })}
      </div>
    ))}
  </div>
);

/* 雷達圖 */
const Radar = ({tpq,taq}) => {
  const R=78, cx=110, cy=105;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/5;
    return [cx+r*Math.cos(a), cy+r*Math.sin(a)];};
  const poly=(vals,)=>vals.map((v,i)=>{
    const r = v==null?0:R*(v-1)/4; const[x,y]=pt(i,r); return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  return (
    <svg viewBox="0 0 220 215" style={{width:'100%',maxWidth:340,display:'block',margin:'0 auto'}}>
      {[.25,.5,.75,1].map(f=>(
        <polygon key={f} points={DIMS.map((_,i)=>{const[x,y]=pt(i,R*f);return x.toFixed(1)+','+y.toFixed(1);}).join(' ')}
          fill="none" stroke="var(--border)" strokeWidth="1"/>
      ))}
      {DIMS.map((d,i)=>{const[x,y]=pt(i,R);
        return <line key={d.k} x1={cx} y1={cy} x2={x} y2={y} stroke="var(--border)"/>;})}
      <polygon points={poly(DIMS.map(d=>tpq[d.k]))} fill="rgba(30,58,95,.28)" stroke="#1e3a5f" strokeWidth="2"/>
      <polygon points={poly(DIMS.map(d=>taq[d.k]))} fill="rgba(231,76,60,.18)" stroke="#e74c3c" strokeWidth="2" strokeDasharray="4 3"/>
      {DIMS.map((d,i)=>{const[x,y]=pt(i,R+18);
        return <text key={d.k} x={x} y={y} textAnchor="middle" dominantBaseline="middle"
          fontSize="10.5" fill="var(--text-muted)">{d.zh}</text>;})}
      <text x="8" y="207" fontSize="10" fill="#1e3a5f">■ T-TPQ 知覺</text>
      <text x="82" y="207" fontSize="10" fill="#e74c3c">▨ T-TAQ 態度</text>
      <text x="160" y="207" fontSize="9.5" fill="var(--text-muted)">刻度 1–5</text>
    </svg>
  );
};

/* ================================ 主程式 ================================ */
const App = () => {
  const [tab,setTab]   = useState('info');
  const [dark,setDark] = useState(false);
  const [info,setInfo] = useState({});
  const [ans,setAns]   = useState({});
  const [open,setOpen] = useState({});

  useEffect(()=>{try{
    const s=localStorage.getItem('cathlab-tstepps-v1');
    if(s){const d=JSON.parse(s); setInfo(d.info||{}); setAns(d.ans||{}); setOpen(d.open||{});}
  }catch(e){}},[]);
  useEffect(()=>{try{
    localStorage.setItem('cathlab-tstepps-v1',JSON.stringify({info,ans,open}));
  }catch(e){}},[info,ans,open]);
  useEffect(()=>{document.documentElement.classList.toggle('dark-theme',dark);},[dark]);

  const total = 35+30;
  const done  = Object.values(ans).filter(v=>v!=null).length;

  const dimScore = (prefix,bank) => {
    const out={};
    DIMS.forEach(d=>{
      const vals = bank[d.k].map((_,i)=>ans[prefix+'_'+d.k+'_'+(i+1)]).filter(v=>v!=null);
      out[d.k] = vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    });
    return out;
  };
  const tpqS = useMemo(()=>dimScore('TPQ',TPQ),[ans]);
  const taqS = useMemo(()=>dimScore('TAQ',TAQ),[ans]);
  const agree = (prefix,bank,k)=>{
    const vals = bank[k].map((_,i)=>ans[prefix+'_'+k+'_'+(i+1)]).filter(v=>v!=null);
    if(!vals.length) return null;
    return 100*vals.filter(v=>v>=4).length/vals.length;
  };
  const mean = o => {const v=Object.values(o).filter(x=>x!=null);
    return v.length? v.reduce((a,b)=>a+b,0)/v.length : null;};
  const f2 = v => v==null?'—':v.toFixed(2);
  const f0 = v => v==null?'—':v.toFixed(0)+'%';

  const flagColor = (tp,ta)=>{
    if(tp==null||ta==null) return null;
    if(tp>=4 && ta>=4) return {c:'var(--success)',t:'維持'};
    if(tp<3.5 && ta>=4) return {c:'var(--warning)',t:'能力／流程落差'};
    if(ta<3.5) return {c:'var(--accent)',t:'態度落差'};
    return {c:'var(--primary-light)',t:'觀察'};
  };

  const rows = () => {
    const r=[];
    Object.entries(info).forEach(([k,v])=>r.push(['基本資料',k,'',v]));
    ['TPQ','TAQ'].forEach(p=>{const bank=p==='TPQ'?TPQ:TAQ;
      DIMS.forEach(d=>bank[d.k].forEach((q,i)=>{
        const id=p+'_'+d.k+'_'+(i+1);
        r.push([p,d.zh,q.replace(/[",\n]/g,' '),ans[id]??'']);
      }));});
    OPENQ.forEach((q,i)=>r.push(['開放題','Q'+(i+1),q.replace(/[",\n]/g,' '),(open['o'+i]||'').replace(/[",\n]/g,' ')]));
    DIMS.forEach(d=>{
      r.push(['分數','TPQ_'+d.en,'構面平均',f2(tpqS[d.k])]);
      r.push(['分數','TAQ_'+d.en,'構面平均',f2(taqS[d.k])]);
    });
    r.push(['分數','TPQ_TOTAL','整體平均',f2(mean(tpqS))]);
    r.push(['分數','TAQ_TOTAL','整體平均',f2(mean(taqS))]);
    return r;
  };

  const dl = (name,text,type) => {
    const b=new Blob(['\uFEFF'+text],{type:type}); const u=URL.createObjectURL(b);
    const a=document.createElement('a'); a.href=u; a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(u),1500);
  };
  const expCSV = () => {
    const head='區塊,題項代碼／構面,題目,作答\n';
    const body=rows().map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
    dl('TTPQ_TTAQ_'+(info.code||'anon')+'_'+new Date().toISOString().slice(0,10)+'.csv',
       head+body,'text/csv;charset=utf-8');
  };
  const expJSON = () => dl('TTPQ_TTAQ_'+(info.code||'anon')+'.json',
    JSON.stringify({info,answers:ans,open,scores:{tpq:tpqS,taq:taqS}},null,2),'application/json');

  const TABS=[{k:'info',n:'基本資料'},{k:'tpq',n:'T-TPQ 知覺'},
    {k:'taq',n:'T-TAQ 態度'},{k:'open',n:'開放題'},{k:'res',n:'結果'},{k:'share',n:'分享'}];

  return (
  <div className="app">
    <div className="wrap">
      <header className="hd">
        <div className="kicker">TEAMSTEPPS · 心導管室團隊評估</div>
        <h1>T-TPQ 團隊知覺／T-TAQ 團隊態度量表</h1>
        <div className="sub">Cath Lab Adapted Version · Kirkpatrick Level 2 評估工具</div>
        <button className="themebtn" onClick={()=>setDark(d=>!d)}>{dark?'☀ 亮色':'🌙 暗色'}</button>
      </header>
    </div>

    <div className="tabs">
      {TABS.map(t=>(
        <button key={t.k} className={'tab'+(tab===t.k?' on':'')} onClick={()=>{setTab(t.k);window.scrollTo(0,0);}}>
          {t.n}{t.k==='tpq'&&Object.keys(ans).filter(k=>k.startsWith('TPQ')&&ans[k]).length===35&&<span className="dot"/>}
          {t.k==='taq'&&Object.keys(ans).filter(k=>k.startsWith('TAQ')&&ans[k]).length===30&&<span className="dot"/>}
        </button>
      ))}
    </div>
    <div className="bar"><div style={{width:(100*done/total)+'%'}}/></div>

    {tab==='info' && (
      <div className="card">
        <h2>基本資料<span className="en">Demographics</span></h2>
        <p className="note">本問卷採匿名填答。請自訂一組僅自己知道的代碼（例如生日末四碼＋姓名縮寫），
        以便前後測配對比較；不會用於辨識個人身分。</p>
        <div className="warnbox">
          填答說明：以下題目請就<b>「你在心導管室實際的觀察與看法」</b>作答，
          沒有標準答案。T-TPQ 問的是「現況如何」，T-TAQ 問的是「你認為應該如何」，兩者請分開判斷。
        </div>
        <div className="fld"><label>配對代碼 Pairing code</label>
          <input value={info.code||''} onChange={e=>setInfo({...info,code:e.target.value})}
            placeholder="例：1128MY"/></div>
        <div className="grid2">
          <div className="fld"><label>評估時間點</label>
            <select value={info.phase||''} onChange={e=>setInfo({...info,phase:e.target.value})}>
              <option value="">請選擇</option>{PHASE.map(p=><option key={p}>{p}</option>)}</select></div>
          <div className="fld"><label>填答日期</label>
            <input type="date" value={info.date||''} onChange={e=>setInfo({...info,date:e.target.value})}/></div>
          <div className="fld"><label>職類 Role（分層分析用）</label>
            <select value={info.role||''} onChange={e=>setInfo({...info,role:e.target.value})}>
              <option value="">請選擇</option>{ROLES.map(r=><option key={r}>{r}</option>)}</select></div>
          <div className="fld"><label>導管室相關年資</label>
            <select value={info.years||''} onChange={e=>setInfo({...info,years:e.target.value})}>
              <option value="">請選擇</option>{YEARS.map(y=><option key={y}>{y}</option>)}</select></div>
          <div className="fld"><label>進入導管室頻率</label>
            <select value={info.freq||''} onChange={e=>setInfo({...info,freq:e.target.value})}>
              <option value="">請選擇</option>{FREQ.map(f=><option key={f}>{f}</option>)}</select></div>
          <div className="fld"><label>是否曾接受 TeamSTEPPS 訓練</label>
            <select value={info.trained||''} onChange={e=>setInfo({...info,trained:e.target.value})}>
              <option value="">請選擇</option><option>未曾接受</option>
              <option>曾接受（1 次）</option><option>曾接受（≥ 2 次）</option>
              <option>擔任院內 coach／champion</option></select></div>
        </div>
        <div className="fld"><label>是否參與 on-call primary PCI 團隊</label>
          <select value={info.oncall||''} onChange={e=>setInfo({...info,oncall:e.target.value})}>
            <option value="">請選擇</option><option>是</option><option>否</option></select></div>
        <div className="btnrow"><button className="btn" onClick={()=>{setTab('tpq');window.scrollTo(0,0);}}>開始填答 T-TPQ →</button></div>
      </div>
    )}

    {tab==='tpq' && (<>
      <Scale prefix="TPQ" bank={TPQ} ans={ans} setAns={setAns}
        title="T-TPQ 團隊知覺量表" en="Teamwork Perceptions Questionnaire · 35 題"
        intro="以下描述請就「我所在的心導管室團隊目前實際的運作情形」評分。"/>
      <div className="btnrow"><button className="btn" onClick={()=>{setTab('taq');window.scrollTo(0,0);}}>下一部分：T-TAQ →</button></div>
    </>)}

    {tab==='taq' && (<>
      <Scale prefix="TAQ" bank={TAQ} ans={ans} setAns={setAns}
        title="T-TAQ 團隊態度量表" en="Teamwork Attitudes Questionnaire · 30 題"
        intro="以下描述請就「你個人對團隊合作的看法與認同程度」評分，與單位現況無關。"/>
      <div className="btnrow"><button className="btn" onClick={()=>{setTab('open');window.scrollTo(0,0);}}>下一部分：開放題 →</button></div>
    </>)}

    {tab==='open' && (
      <div className="card">
        <h2>開放式問題<span className="en">Open-ended</span></h2>
        <p className="note">選填。這部分往往比量表分數更能指出下一步該補哪裡。</p>
        {OPENQ.map((q,i)=>(
          <div className="fld" key={i}>
            <label>{i+1}. {q}</label>
            <textarea value={open['o'+i]||''} onChange={e=>setOpen({...open,['o'+i]:e.target.value})}/>
          </div>
        ))}
        <div className="btnrow"><button className="btn" onClick={()=>{setTab('res');window.scrollTo(0,0);}}>查看結果 →</button></div>
      </div>
    )}

    {tab==='res' && (
      <div className="card">
        <h2>個人結果摘要<span className="en">Summary</span></h2>
        <p className="note">已完成 {done} / {total} 題。分數為各構面題目之算術平均（1–5），
        「同意率」為勾選 4 或 5 的比例。個人分數僅供自我參照，單位層級的判讀應以群體平均與職類分層為準。</p>
        <Radar tpq={tpqS} taq={taqS}/>
        <table>
          <thead><tr><th>構面</th><th>T-TPQ 知覺</th><th>同意率</th><th>T-TAQ 態度</th><th>同意率</th><th>初步判讀</th></tr></thead>
          <tbody>
          {DIMS.map(d=>{const fl=flagColor(tpqS[d.k],taqS[d.k]);return(
            <tr key={d.k}>
              <td>{d.zh}<br/><span style={{fontSize:11,color:'var(--text-muted)'}}>{d.en}</span></td>
              <td className="num">{f2(tpqS[d.k])}</td>
              <td className="num">{f0(agree('TPQ',TPQ,d.k))}</td>
              <td className="num">{f2(taqS[d.k])}</td>
              <td className="num">{f0(agree('TAQ',TAQ,d.k))}</td>
              <td>{fl? <span className="pill" style={{background:fl.c}}>{fl.t}</span> : '—'}</td>
            </tr>);})}
          <tr><td><b>整體平均</b></td><td className="num"><b>{f2(mean(tpqS))}</b></td><td className="num">—</td>
            <td className="num"><b>{f2(mean(taqS))}</b></td><td className="num">—</td><td>—</td></tr>
          </tbody>
        </table>
        <div className="warnbox" style={{marginTop:14}}>
          <b>判讀邏輯（對應永續決策樹）：</b><br/>
          · <b>T-TAQ 低</b>（不認同）→ 屬態度／文化問題，需從領導示範與制度誘因著手，補訓練效果有限。<br/>
          · <b>T-TAQ 高但 T-TPQ 低</b>（認同但做不到）→ 屬能力與流程障礙，需補演練、in-situ 模擬與流程再設計。<br/>
          · <b>兩者皆高但行為稽核（L3）不佳</b>→ 屬教學轉移問題，且提示自陳量表可能受社會期許影響，
          務必與客觀行為觀察並用。
        </div>
        <div className="btnrow">
          <button className="btn" onClick={expCSV}>匯出 CSV</button>
          <button className="btn alt" onClick={expJSON}>匯出 JSON</button>
          <button className="btn alt" onClick={()=>window.print()}>列印／存 PDF</button>
          <button className="btn warn" onClick={()=>{if(confirm('確定清除本機所有填答內容？'))
            {setAns({});setOpen({});setInfo({});}}}>清除重填</button>
        </div>
      </div>
    )}

    {tab==='share' && (
      <div className="card">
        <h2>分享此表單<span className="en">Share</span></h2>
        <p className="note">下方 QR Code 已<b>離線內嵌</b>於本頁，不需連網服務；掃描即可在手機開啟本表單，供團隊於訓練前後測填答。</p>
        <div className="qrbox">
          <img src={QR_DATA} alt="本表單 QR Code" width="210" height="210"/>
          <p>掃描開啟：T-TPQ／T-TAQ 心導管室團隊評估</p>
        </div>
        <div className="fld"><label>頁面連結 Page URL</label>
          <input readOnly value={PAGE_URL} onFocus={e=>e.target.select()}/></div>
        <div className="btnrow">
          <button className="btn" onClick={e=>{if(navigator.clipboard)navigator.clipboard.writeText(PAGE_URL);const b=e.currentTarget,o=b.textContent;b.textContent='✓ 已複製';setTimeout(()=>{b.textContent=o;},1500);}}>複製連結</button>
          <a className="btn alt" href={'mailto:?subject='+encodeURIComponent('分享：心導管室團隊評估表單 T-TPQ／T-TAQ')+'&body='+encodeURIComponent('我想和您分享這個心導管室團隊 TeamSTEPPS 評估表單：\n\n'+PAGE_URL)}>Email 分享</a>
          <a className="btn alt" href={'https://social-plugins.line.me/lineit/share?url='+encodeURIComponent(PAGE_URL)} target="_blank" rel="noopener noreferrer">LINE 分享</a>
        </div>
      </div>
    )}

    <div className="foot">
      <b>版本說明｜請務必保留</b><br/>
      本表單為依 AHRQ TeamSTEPPS 之 T-TPQ (Teamwork Perceptions Questionnaire) 與
      T-TAQ (Teamwork Attitudes Questionnaire) 五大構面架構，改寫為<b>心導管室情境的院內版本
      (in-house context-adapted version)</b>。題幹經在地化改寫，非原始驗證版之逐題翻譯；
      Keebler 等人 (BMJ Qual Saf 2014;23:718-26, PMID 24652512) 所報告之建構效度與
      Cronbach α=0.978 係針對<b>原始英文版</b>，不可直接外推至本改寫版。
      若用於發表或正式評鑑，建議另行取得原始量表授權版本，或先進行在地信效度檢驗。<br/>
      本版所有題目均為<b>正向敘述、無反向計分題</b>，計分時請勿套用原版之反向題規則。<br/><br/>
      本量表為自陳式 (self-report) 工具，易受社會期許影響且職類間常有系統性差異，
      應與 Kirkpatrick L3 之客觀行為觀察（交班稽核、in-situ 模擬評分）並用。<br/><br/>
      <b>讀書會共筆整理人</b><br/>
      謝慕揚 醫師 MD, PhD, FESC<br/>
      結構性心臟病與介入心臟學<br/><br/>
      · 本內容為讀書會共筆整理，未必涵蓋所有相關文獻<br/>
      · 僅供學術與教育用途，不代表任何單位之官方立場<br/>
      · 本內容未涉及任何利益衝突
    </div>
  </div>);
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
