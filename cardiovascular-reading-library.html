<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心血管教學資源中心</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Crimson+Pro:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a5f7a;
            --primary-dark: #0d3d4d;
            --accent: #c23a22;
            --bg: #faf9f7;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-hover: 0 8px 24px rgba(0,0,0,0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            color: white;
            padding: 3rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
        }

        .header-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        .header h1 {
            font-family: 'Crimson Pro', 'Noto Sans TC', serif;
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: 0.02em;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .toolbar {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
        }

        .search-row {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1rem;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 95, 122, 0.1);
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.5;
        }

        .clear-btn {
            padding: 0.5rem 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: white;
            font-size: 0.875rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            color: var(--text-light);
        }

        .clear-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-section {
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }

        .filter-label {
            font-size: 0.875rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-btn {
            padding: 0.4rem 0.875rem;
            border: 2px solid var(--border);
            border-radius: 20px;
            background: white;
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .filter-btn .count {
            font-size: 0.75rem;
            opacity: 0.7;
        }

        .stats {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            color: var(--text-light);
            font-size: 0.9rem;
            padding: 0.5rem 0;
            flex-wrap: wrap;
        }

        .stats-count {
            font-weight: 700;
            color: var(--primary);
        }

        .active-filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-left: 1rem;
        }

        .active-filter-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.2rem 0.5rem;
            background: var(--primary);
            color: white;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .active-filter-tag button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 0;
            font-size: 1rem;
            line-height: 1;
            opacity: 0.8;
        }

        .active-filter-tag button:hover {
            opacity: 1;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.25rem;
        }

        .file-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 1.25rem;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            text-decoration: none;
            color: inherit;
            border: 1px solid transparent;
        }

        .file-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary);
        }

        .file-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent) 0%, #e74c3c 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: white;
            font-weight: 700;
            font-size: 0.75rem;
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-title {
            font-weight: 500;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .file-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.375rem;
            align-items: center;
        }

        .file-category {
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            background: #e8f4f8;
            color: var(--primary);
            border-radius: 4px;
            font-weight: 500;
        }

        .file-date {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-left: 0.25rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-light);
            grid-column: 1 / -1;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .error-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--accent);
            grid-column: 1 / -1;
        }

        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-light);
            font-size: 0.875rem;
            border-top: 1px solid var(--border);
            margin-top: 3rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-light);
            grid-column: 1 / -1;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .highlight {
            background: #fef08a;
            padding: 0 2px;
            border-radius: 2px;
        }

        @media (max-width: 640px) {
            .header h1 {
                font-size: 1.75rem;
            }
            
            .container {
                padding: 1rem;
            }

            .toolbar {
                padding: 1rem;
            }

            .search-row {
                flex-direction: column;
                align-items: stretch;
            }

            .file-grid {
                grid-template-columns: 1fr;
            }

            .filter-buttons {
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 0.5rem;
                -webkit-overflow-scrolling: touch;
            }

            .active-filters {
                margin-left: 0;
                margin-top: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>心血管教學資源中心</h1>
            <p>Cardiovascular Teaching Resources</p>
        </div>
    </header>

    <main class="container">
        <div class="toolbar">
            <div class="search-row">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜尋檔案名稱或分類...">
                </div>
                <button class="clear-btn" id="clearAll">清除篩選</button>
            </div>
            <div class="filter-section">
                <div class="filter-label">
                    <span>📁 分類篩選</span>
                    <span style="font-size: 0.75rem;">（可多選）</span>
                </div>
                <div class="filter-buttons" id="filterButtons"></div>
            </div>
        </div>

        <div class="stats">
            <span>顯示 <span class="stats-count" id="displayCount">0</span> / <span id="totalCount">0</span> 份文件</span>
            <div class="active-filters" id="activeFilters"></div>
        </div>

        <div class="file-grid" id="fileGrid">
            <div class="loading">載入中</div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 NTUH Hsinchu Cardiovascular Center | 國立臺灣大學醫學院附設醫院新竹臺大分院 心血管中心</p>
    </footer>

    <script>
        // ============================================================
        // 設定：JSON 檔案路徑（加入時間戳記防止瀏覽器快取）
        // ============================================================
        const JSON_FILE = 'files.json?v=' + Date.now();

        // ============================================================
        // 程式邏輯
        // ============================================================
        let FILES = [];
        let activeFilters = new Set();
        let searchTerm = '';

        async function loadFiles() {
            try {
                const response = await fetch(JSON_FILE);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                FILES = await response.json();
                
                FILES = FILES.map(file => ({
                    ...file,
                    category: Array.isArray(file.category) ? file.category : [file.category]
                }));
                
                init();
            } catch (error) {
                console.error('載入檔案清單失敗:', error);
                document.getElementById('fileGrid').innerHTML = `
                    <div class="error-state">
                        <div class="empty-state-icon">⚠️</div>
                        <p>無法載入檔案清單</p>
                        <p style="font-size: 0.875rem; margin-top: 0.5rem;">
                            請確認 ${JSON_FILE} 檔案存在且格式正確
                        </p>
                    </div>
                `;
            }
        }

        function getCategoriesWithCount() {
            const categoryCount = {};
            FILES.forEach(file => {
                file.category.forEach(cat => {
                    categoryCount[cat] = (categoryCount[cat] || 0) + 1;
                });
            });
            return Object.entries(categoryCount).sort((a, b) => b[1] - a[1]);
        }

        function renderFilterButtons() {
            const container = document.getElementById('filterButtons');
            const categories = getCategoriesWithCount();
            
            let html = '';
            categories.forEach(([cat, count]) => {
                const isActive = activeFilters.has(cat);
                html += `
                    <button class="filter-btn ${isActive ? 'active' : ''}" data-category="${cat}">
                        ${cat}
                        <span class="count">(${count})</span>
                    </button>
                `;
            });
            
            container.innerHTML = html;

            container.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const category = btn.dataset.category;
                    
                    if (activeFilters.has(category)) {
                        activeFilters.delete(category);
                        btn.classList.remove('active');
                    } else {
                        activeFilters.add(category);
                        btn.classList.add('active');
                    }
                    
                    renderActiveFilters();
                    renderFiles();
                });
            });
        }

        function renderActiveFilters() {
            const container = document.getElementById('activeFilters');
            
            if (activeFilters.size === 0) {
                container.innerHTML = '';
                return;
            }
            
            let html = '';
            activeFilters.forEach(cat => {
                html += `
                    <span class="active-filter-tag">
                        ${cat}
                        <button onclick="removeFilter('${cat}')" title="移除">×</button>
                    </span>
                `;
            });
            
            container.innerHTML = html;
        }

        function removeFilter(category) {
            activeFilters.delete(category);
            renderFilterButtons();
            renderActiveFilters();
            renderFiles();
        }

        function clearAllFilters() {
            activeFilters.clear();
            searchTerm = '';
            document.getElementById('searchInput').value = '';
            renderFilterButtons();
            renderActiveFilters();
            renderFiles();
        }

        function getFilteredFiles() {
            return FILES.filter(file => {
                const matchCategory = activeFilters.size === 0 || 
                    [...activeFilters].some(filter => file.category.includes(filter));
                
                const searchLower = searchTerm.toLowerCase();
                const matchSearch = searchTerm === '' || 
                    file.title.toLowerCase().includes(searchLower) ||
                    file.category.some(cat => cat.toLowerCase().includes(searchLower));
                
                return matchCategory && matchSearch;
            });
        }

        function getDriveLink(fileId) {
            return `https://drive.google.com/file/d/${fileId}/view`;
        }

        function highlightText(text, term) {
            if (!term) return text;
            const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        function renderFiles() {
            const container = document.getElementById('fileGrid');
            const filtered = getFilteredFiles();
            
            document.getElementById('displayCount').textContent = filtered.length;
            document.getElementById('totalCount').textContent = FILES.length;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>找不到符合條件的檔案</p>
                        <button onclick="clearAllFilters()" style="margin-top: 1rem; padding: 0.5rem 1rem; border: 1px solid var(--border); border-radius: 6px; background: white; cursor: pointer;">
                            清除所有篩選
                        </button>
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach(file => {
                const titleHtml = highlightText(file.title, searchTerm);
                const categoriesHtml = file.category
                    .map(cat => `<span class="file-category">${highlightText(cat, searchTerm)}</span>`)
                    .join('');
                
                html += `
                    <a href="${getDriveLink(file.fileId)}" target="_blank" rel="noopener" class="file-card">
                        <div class="file-icon">PDF</div>
                        <div class="file-info">
                            <div class="file-title">${titleHtml}</div>
                            <div class="file-meta">
                                ${categoriesHtml}
                                ${file.date ? `<span class="file-date">${file.date}</span>` : ''}
                            </div>
                        </div>
                    </a>
                `;
            });

            container.innerHTML = html;
        }

        function init() {
            renderFilterButtons();
            renderFiles();
            
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchTerm = e.target.value;
                renderFiles();
            });

            document.getElementById('clearAll').addEventListener('click', clearAllFilters);
        }

        loadFiles();
    </script>
</body>
</html>
