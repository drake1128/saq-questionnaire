<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STEMI 急診處置與 ECG 早期判讀 | ER STEMI Protocol</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-dark: #0f172a; --bg-card: #1e293b; --bg-card-alt: #1a2340;
            --accent-red: #DC2626; --accent-blue: #3b82f6; --accent-cyan: #06b6d4;
            --accent-green: #10b981; --accent-yellow: #f59e0b; --accent-orange: #f97316;
            --accent-purple: #8b5cf6; --accent-pink: #ec4899;
            --text-primary: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #64748b;
            --border: #1e293b; --border-light: #334155;
        }
        body { font-family: 'Noto Sans TC', 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1a1033 50%, #0f172a 100%); min-height: 100vh; color: var(--text-primary); line-height: 1.6; }
        #root { min-height: 100vh; padding-bottom: 80px; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--bg-dark); } ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .pulse { animation: pulse 2s infinite; }

        .share-button { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .share-toggle { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #3B82F6, #60A5FA); border: none; color: white; font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 15px rgba(59,130,246,0.4); transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; }
        .share-toggle:hover { transform: scale(1.1); }
        .share-menu { position: absolute; top: 60px; right: 0; background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); padding: 20px; min-width: 280px; display: none; }
        .share-menu.active { display: block; }
        .share-menu h4 { color: #1e293b; margin: 0 0 15px 0; font-size: 1rem; }
        .qr-container { background: #f8fafc; border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 15px; }
        .qr-container img { max-width: 150px; border-radius: 8px; }
        .qr-container p { font-size: 0.75rem; color: #64748b; margin: 8px 0 0 0; }
        .share-buttons { display: flex; flex-direction: column; gap: 10px; }
        .share-btn { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: none; border-radius: 10px; cursor: pointer; font-size: 0.95rem; font-weight: 500; transition: all 0.2s ease; text-decoration: none; color: white; }
        .share-btn.line { background: #00B900; } .share-btn.email { background: #EA4335; } .share-btn.copy { background: #3B82F6; }
        .share-btn:hover { transform: translateX(5px); }
        .share-close { position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #64748b; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="share-button">
        <button class="share-toggle" onclick="toggleShareMenu()" title="Share">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
        </button>
        <div class="share-menu" id="shareMenu">
            <button class="share-close" onclick="toggleShareMenu()">&times;</button>
            <h4>Share</h4>
            <div class="qr-container">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://drake1128.github.io/saq-questionnaire/stemi-er-protocol.html" alt="QR Code">
                <p>Scan QR Code</p>
            </div>
            <div class="share-buttons">
                <a class="share-btn line" href="https://social-plugins.line.me/lineit/share?url=https://drake1128.github.io/saq-questionnaire/stemi-er-protocol.html" target="_blank">LINE</a>
                <a class="share-btn email" href="mailto:?subject=STEMI%20ER%20Protocol&body=https://drake1128.github.io/saq-questionnaire/stemi-er-protocol.html">Email</a>
                <button class="share-btn copy" onclick="navigator.clipboard.writeText('https://drake1128.github.io/saq-questionnaire/stemi-er-protocol.html').then(()=>this.textContent='Copied!')">Copy Link</button>
            </div>
        </div>
    </div>
    <div id="root"></div>
    <script>function toggleShareMenu(){document.getElementById('shareMenu').classList.toggle('active')}</script>
    <script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ==================== DATA ====================

const tabs = [
    { id: 'sop', label: '急診SOP', icon: '⏱️' },
    { id: 'ecg', label: 'ECG判讀', icon: '📊' },
    { id: 'coronary', label: '冠脈定位', icon: '🗺️' },
    { id: 'pitfalls', label: '陷阱', icon: '⚠️' },
    { id: 'meds', label: '藥物', icon: '💊' },
    { id: 'ddx', label: '鑑別', icon: '🔍' },
    { id: 'advanced', label: '進階', icon: '📋' },
    { id: 'quiz', label: '測驗', icon: '🏆' },
];

const quizQuestions = [
    {
        q: 'Q1: 65歲男性，胸痛2小時到達急診。ECG 顯示 V3-V4 ST 段上升 3mm，V1-V2 輕微上升，II、III、aVF ST 段下降 1mm。最可能的診斷與責任血管為何？',
        options: ['前壁 AMI，LAD 阻塞', '下壁 AMI，RCA 阻塞', '側壁 AMI，LCX 阻塞', '後壁 AMI，RCA 阻塞'],
        answer: 0,
        explain: '前壁 AMI，責任血管為 LAD。V3-V4 ST 段上升為前壁梗塞的典型表現，II、III、aVF ST 段下降為交互變化（reciprocal change），進一步支持前壁 STEMI 的診斷。需緊急啟動心導管進行 PCI。'
    },
    {
        q: 'Q2: 55歲女性，胸痛到急診。ECG: II、III、aVF ST 段上升（III 導程 4mm，II 導程 2mm），V5-V6 ST 上升 2mm。最可能的責任血管？',
        options: ['RCA 近端阻塞', 'LCX 阻塞', 'LAD 阻塞', 'RCA 遠端阻塞'],
        answer: 1,
        explain: '雖然 III > II 通常提示 RCA，但 V5-V6 ST 上升提示側壁受累，這更傾向 LCX 阻塞。LCX 支配下壁及側壁時，可出現 inferior + lateral ST elevation。應進一步檢查 V7-V9（後壁）及 V3R-V6R（右室）以完整評估。'
    },
    {
        q: 'Q3: 70歲男性，已知有 LBBB 病史，胸痛4小時到院。在 LBBB 背景下，哪些 ECG 變化提示急性心肌梗塞？',
        options: ['任何 ST 段變化', 'Sgarbossa 準則：同向 ST ≥1mm、V1-V3 ST↓≥1mm、反向 ST ≥5mm', '僅看 Troponin 升高', 'LBBB 下無法判斷 AMI'],
        answer: 1,
        explain: 'Sgarbossa 準則用於 LBBB 背景下診斷 AMI：(1) QRS 同向 ST 抬高 ≥1mm（5分）；(2) V1-V3 ST 下降 ≥1mm（3分）；(3) QRS 反向 ST 抬高 ≥5mm（2分）。總分 ≥3 分高度提示 AMI。修正 Sgarbossa（ST/QRS 比值 ≥ -0.25）可進一步提高敏感性。'
    },
    {
        q: 'Q4: 45歲男性，胸痛1小時，ECG 顯示 V1-V3 ST 段下降 2mm，R 波增高，T 波直立。下一步應如何處置？',
        options: ['診斷為前壁缺血，給予 NTG', '加做 V7-V9 導程，排除後壁 AMI', '觀察等待 Troponin 結果', '診斷為 NSTEMI，安排 24-72 小時 PCI'],
        answer: 1,
        explain: 'V1-V3 ST 下降 + R 波增高 + T 波直立，這是後壁 MI 的鏡像變化（mirror image）！必須加做 V7-V9 導程確認後壁 ST 抬高。後壁梗塞常被誤認為前壁缺血而延誤治療。責任血管通常為 LCX 或 RCA。'
    },
    {
        q: 'Q5: 80歲女性，胸悶6小時到院。ECG 顯示 II、III、aVF ST 抬高，加做右胸導程 V4R 也有 ST 抬高。這提示什麼？治療上有何注意事項？',
        options: ['下壁 + 右室 AMI，禁用硝酸鹽，需容積管理', '下壁 AMI，標準治療即可', '下壁 + 後壁 AMI，加強利尿', '單純右室 AMI，給予 NTG 降低前負荷'],
        answer: 0,
        explain: '下壁 + 右室 AMI。V4R ST 抬高是右室梗塞最具診斷價值的指標。右室梗塞的血流動力學依賴前負荷（preload-dependent），因此：(1) 禁用硝酸鹽（NTG）——會降低前負荷導致嚴重低血壓；(2) 需積極輸液（volume resuscitation）維持血壓；(3) 責任血管為 RCA 近端阻塞。'
    },
    {
        q: 'Q6: 35歲男性，運動後胸痛，ECG 顯示 V2-V5 ST 上升 1-2mm，ST 段凹面向上，無交互變化。最可能的診斷？',
        options: ['急性前壁 STEMI', '早期再極化症候群（Early Repolarization）', '急性心包炎', 'Brugada 症候群'],
        answer: 1,
        explain: '早期再極化症候群。關鍵鑑別點：(1) ST 段凹面向上（concave upward）而非凸面（convex/tombstone）；(2) 無交互變化（reciprocal change）；(3) 年輕男性運動後常見。但仍需監測 Troponin 及連續 ECG 以排除真正的 AMI。若有疑慮，寧可啟動 STEMI protocol。'
    },
    {
        q: 'Q7: 60歲糖尿病患者，胸痛8小時到院。ECG 顯示 V3-V4 QS 波，ST 段已回到基線，T 波倒置。這代表什麼階段？需要緊急再灌流嗎？',
        options: ['超急性期，需立即 PCI', '急性期，需立即 PCI', '亞急性期，不符合緊急再灌流指徵', '慢性期，無需處理'],
        answer: 2,
        explain: '亞急性前壁 AMI。QS 波 + ST 段回復基線 + T 波倒置 = 亞急性期表現（數天至數週）。此階段不符合緊急再灌流治療（PCI/thrombolysis）的適應症。治療重點在藥物治療：DAPT、Statin、ACEI/ARB、Beta-blocker，並評估殘餘缺血決定是否擇期 PCI。'
    },
    {
        q: 'Q8: 50歲女性，胸痛2小時到院。ECG: I、aVL、V5-V6 ST 下降 1-2mm，T 波倒置。Troponin 15 ng/mL（正常 <0.04）。最佳處置策略？',
        options: ['立即緊急 PCI', 'GRACE 評分後 24-72 小時內 PCI', '僅藥物治療，門診追蹤', '加做 V7-V9 確認是否為 STEMI'],
        answer: 1,
        explain: 'NSTEMI。Troponin 明顯升高 + ST 下降 + T 波倒置 = 高危險 NSTEMI。根據指引，應進行 GRACE 風險評估，高危險群建議 24-72 小時內進行介入治療（early invasive strategy）。不符合 STEMI 標準（無 ST 抬高），因此不需立即緊急 PCI。'
    },
    {
        q: 'Q9: 下壁 AMI 患者，ECG: II ST 抬高 2mm，III ST 抬高 5mm，aVF ST 抬高 3mm，aVL ST 下降 3mm。責任血管為 RCA 或 LCX？',
        options: ['RCA 阻塞', 'LCX 阻塞', '無法區分', 'LAD 阻塞'],
        answer: 0,
        explain: 'RCA 阻塞。判斷依據：(1) III > II（5mm > 2mm）→ 強烈提示 RCA；(2) aVL 明顯 ST 壓低（3mm）→ RCA 的特徵性交互變化。若為 LCX 阻塞，通常 II ≥ III，且常伴隨 V5-V6 ST 抬高（側壁受累）。'
    },
    {
        q: 'Q10: 65歲男性，ECG 顯示廣泛性 ST 抬高，無交互變化，PR 段下降。最可能的診斷？',
        options: ['廣泛性前壁 STEMI', '急性心包炎', '主動脈剝離', 'Takotsubo 心肌病變'],
        answer: 1,
        explain: '急性心包炎。三大鑑別要點：(1) 瀰漫性 ST 抬高（非特定血管領域分布）；(2) 無交互變化（reciprocal change）——AMI 幾乎都有交互變化；(3) PR 段下降（PR depression）——心包炎的特異性表現。此外，心包炎的 ST 抬高通常為凹面向上，且胸痛隨體位變化（前傾減輕）。'
    },
];

// ==================== REUSABLE COMPONENTS ====================

function DataTable({ headers, rows, headerBg }) {
    const bg = headerBg || 'linear-gradient(135deg, #1e3a5f, #2563eb)';
    return (
        <div style={{overflowX:'auto',margin:'12px 0',borderRadius:'12px',border:'1px solid var(--border-light)'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.85rem'}}>
                <thead>
                    <tr>{headers.map((h,i)=><th key={i} style={{background:bg,color:'white',padding:'10px 12px',textAlign:'left',fontWeight:600,borderBottom:'2px solid rgba(255,255,255,0.2)',whiteSpace:'nowrap'}}>{h}</th>)}</tr>
                </thead>
                <tbody>
                    {rows.map((row,i)=><tr key={i} style={{background:i%2===0?'rgba(30,58,95,0.15)':'transparent'}}>
                        {row.map((cell,j)=><td key={j} style={{padding:'8px 12px',borderBottom:'1px solid var(--border)',color:'var(--text-primary)',lineHeight:1.5}} dangerouslySetInnerHTML={{__html:cell}}/>)}
                    </tr>)}
                </tbody>
            </table>
        </div>
    );
}

function InfoBox({ type, children }) {
    const colors = {
        warning: { bg: 'rgba(220,38,38,0.12)', border: '#DC2626', icon: '⚠️' },
        danger: { bg: 'rgba(220,38,38,0.18)', border: '#DC2626', icon: '🚨' },
        info: { bg: 'rgba(59,130,246,0.12)', border: '#3b82f6', icon: 'ℹ️' },
        success: { bg: 'rgba(16,185,129,0.12)', border: '#10b981', icon: '✅' },
        highlight: { bg: 'rgba(245,158,11,0.12)', border: '#f59e0b', icon: '💡' },
        emergency: { bg: 'rgba(220,38,38,0.2)', border: '#DC2626', icon: '🔴' }
    };
    const c = colors[type] || colors.info;
    return <div style={{background:c.bg,borderLeft:`4px solid ${c.border}`,padding:'14px 16px',borderRadius:'0 12px 12px 0',margin:'12px 0',fontSize:'0.9rem',lineHeight:1.7}}>{c.icon} {children}</div>;
}

function Card({ title, icon, children, accentColor, style }) {
    const accent = accentColor || '#3b82f6';
    return (
        <div className="fade-in" style={{background:'rgba(30,41,59,0.8)',backdropFilter:'blur(12px)',borderRadius:'16px',padding:'20px',marginBottom:'16px',border:`1px solid ${accent}33`,boxShadow:`0 4px 20px ${accent}15`,...(style||{})}}>
            {title && <h3 style={{fontSize:'1.1rem',fontWeight:700,marginBottom:'12px',color:accent,display:'flex',alignItems:'center',gap:'8px'}}>{icon && <span>{icon}</span>}{title}</h3>}
            {children}
        </div>
    );
}

function SectionTitle({ children, icon }) {
    return <h2 style={{fontSize:'1.3rem',fontWeight:700,margin:'24px 0 16px',color:'var(--text-primary)',display:'flex',alignItems:'center',gap:'10px',borderBottom:'2px solid var(--accent-red)',paddingBottom:'8px'}}>{icon && <span style={{fontSize:'1.4rem'}}>{icon}</span>}{children}</h2>;
}

function ImageFigure({ src, caption, alt }) {
    const [zoomed, setZoomed] = useState(false);
    return (
        <div style={{margin:'16px 0',textAlign:'center'}}>
            <img
                src={src}
                alt={alt || caption || ''}
                onClick={() => setZoomed(!zoomed)}
                style={{maxWidth:'100%',borderRadius:'12px',border:'1px solid var(--border-light)',cursor:'pointer',transition:'transform 0.3s',transform:zoomed?'scale(1.5)':'scale(1)',zIndex:zoomed?100:1,position:'relative'}}
            />
            {caption && <p style={{fontSize:'0.8rem',color:'var(--text-secondary)',marginTop:'8px',fontStyle:'italic'}}>{caption}</p>}
        </div>
    );
}

function ChecklistItem({ text, subItems, checked, onChange }) {
    return (
        <div style={{marginBottom:'8px'}}>
            <label style={{display:'flex',alignItems:'flex-start',gap:'10px',cursor:'pointer',padding:'8px 12px',borderRadius:'8px',background:checked?'rgba(16,185,129,0.12)':'rgba(30,41,59,0.5)',border:`1px solid ${checked?'#10b981':'var(--border-light)'}`,transition:'all 0.2s'}}>
                <input type="checkbox" checked={checked} onChange={onChange} style={{marginTop:'4px',width:'18px',height:'18px',accentColor:'#10b981',flexShrink:0}} />
                <span style={{fontSize:'0.9rem',lineHeight:1.6,color:checked?'#10b981':'var(--text-primary)'}}>{text}</span>
            </label>
            {subItems && subItems.map((sub,i) => (
                <div key={i} style={{marginLeft:'36px',marginTop:'4px',fontSize:'0.82rem',color:'var(--text-secondary)',lineHeight:1.5}}>• {sub}</div>
            ))}
        </div>
    );
}

function TimeTarget({ label, value, unit }) {
    return (
        <div style={{textAlign:'center',padding:'16px',background:'linear-gradient(135deg, rgba(220,38,38,0.2), rgba(220,38,38,0.05))',borderRadius:'12px',border:'2px solid #DC2626',minWidth:'140px'}}>
            <div style={{fontSize:'0.85rem',color:'var(--text-secondary)',marginBottom:'4px'}}>{label}</div>
            <div className="pulse" style={{fontSize:'2.2rem',fontWeight:700,color:'#DC2626'}}>{value}</div>
            <div style={{fontSize:'0.8rem',color:'var(--text-muted)'}}>{unit}</div>
        </div>
    );
}

// ==================== TAB CONTENT COMPONENTS ====================

// ===== TAB 1: SOP =====
function TabSOP() {
    const [checklist, setChecklist] = useState(() => {
        try { return JSON.parse(localStorage.getItem('stemi-sop-checklist') || '{}'); } catch(e) { return {}; }
    });

    const toggle = (key) => {
        const next = {...checklist, [key]: !checklist[key]};
        setChecklist(next);
        localStorage.setItem('stemi-sop-checklist', JSON.stringify(next));
    };

    const resetChecklist = () => {
        setChecklist({});
        localStorage.removeItem('stemi-sop-checklist');
    };

    return (
        <div className="fade-in">
            <SectionTitle icon="⏱️">STEMI 急診處置流程</SectionTitle>

            <InfoBox type="emergency">
                <strong>時間就是心肌！</strong> STEMI 診斷不應等待心肌酵素結果。每延遲 30 分鐘，死亡率上升 7.5%。
            </InfoBox>

            <div style={{display:'flex',justifyContent:'flex-end',marginBottom:'12px'}}>
                <button onClick={resetChecklist} style={{padding:'6px 16px',borderRadius:'8px',border:'1px solid var(--border-light)',background:'transparent',color:'var(--text-secondary)',cursor:'pointer',fontSize:'0.8rem'}}>重置清單</button>
            </div>

            {/* Section A */}
            <Card title="A. 第一現場（急診/病房/CCU）" icon="🏥" accentColor="#DC2626">
                <ChecklistItem text="心電圖：10 分鐘內完成 12-lead ECG" checked={!!checklist['a1']} onChange={() => toggle('a1')} />
                <ChecklistItem
                    text="立即判讀（注意機器自動判讀結果），並給專家判讀"
                    checked={!!checklist['a2']}
                    onChange={() => toggle('a2')}
                    subItems={['機器警訊關鍵字：ACUTE MI / STEMI / MEETS ST ELEVATION MI CRITERIA / CONSIDER ACUTE INFARCT']}
                />
                <ChecklistItem text="白天：CCU 專責主治醫師" checked={!!checklist['a3']} onChange={() => toggle('a3')} />

                    <h4 style={{color:'#3b82f6',marginBottom:'8px',fontSize:'1rem'}}>3. 交互變化（Reciprocal Change）</h4>
                    <ul style={{fontSize:'0.88rem',lineHeight:1.8,paddingLeft:'20px',color:'var(--text-primary)'}}>
                        <li>對側導聯出現 ST 段壓低或 T 波倒置</li>
                        <li>大幅增強 STEMI 診斷的<strong>特異性</strong></li>
                        <li>前壁（V1-V4 抬高）→ II, III, aVF 壓低</li>

                    </ul>
                </div>
            </Card>

            <ImageFigure src="images-stemi/fig ST elevation ECG.png" caption="歷年新竹台大分院急診經導管確診 STEMI 心電圖收集。越往左邊越難辨認，但都是血管急性全阻塞。" alt="STEMI ECG collection" />

            <InfoBox type="emergency">
                <strong style={{fontSize:'1.1rem'}}>STEMI 診斷不應等待心肌酵素結果！時間就是心肌。</strong>
            </InfoBox>
        </div>
    );
}

// ===== TAB 4: Pitfalls =====
function TabPitfalls() {
    return (
        <div className="fade-in">
            <SectionTitle icon="⚠️">特殊情況下的 AMI 判讀</SectionTitle>

            {/* 4.1 LBBB + AMI */}
            <Card title="4.1 LBBB + AMI：Sgarbossa 準則" icon="🔑" accentColor="#DC2626">
                <p style={{fontSize:'0.9rem',marginBottom:'12px',color:'var(--text-secondary)'}}>
                    左束支傳導阻滯（LBBB）會大幅改變 ST-T 波形態，使 AMI 診斷困難。Sgarbossa 準則為此情境提供評分依據：
                </p>
                <DataTable
                    headerBg="linear-gradient(135deg, #DC2626, #991b1b)"
                    headers={['Sgarbossa 準則', '分數', '說明']}
                    rows={[
                        ['QRS 同向 ST 抬高 ≥1mm', '<strong>5 分</strong>', '最具特異性，ST 抬高方向與 QRS 主波方向相同'],
                        ['V1-V3 ST 下降 ≥1mm', '<strong>3 分</strong>', 'V1-V3 通常 QRS 負向，ST 下降為異常'],
                        ['QRS 反向 ST 抬高 ≥5mm', '<strong>2 分</strong>', '特異性較低，但幅度過大仍提示 AMI'],
                    ]}
                />
                <InfoBox type="highlight">
                    <strong>總分 ≥ 3 分 → 高度提示 AMI。</strong><br/>
                    <strong>修正 Sgarbossa 準則：</strong>ST 偏移 / QRS 振幅比值 ≥ -0.25（即 ST 偏移至少為 QRS 振幅的 25%），可進一步提高敏感性至 91%。
                </InfoBox>
            </Card>

            {/* 4.2 RBBB + STEMI */}
            <Card title="4.2 RBBB + STEMI（重要！）" icon="🚨" accentColor="#DC2626">
                <InfoBox type="danger">
                    <strong style={{fontSize:'1.05rem'}}>RBBB STEMI = LAD proximal 病變 = 預後差！</strong><br/>
                    看到 RBBB 別放鬆，可能正在梗塞中！新發生的 RBBB 本身就是缺血的警訊。
                </InfoBox>

                <p style={{fontSize:'0.9rem',marginBottom:'12px',color:'var(--text-secondary)',lineHeight:1.7}}>
                    RBBB 本身會改變 ST-T 波形態（特別是 V1-V3），使 STEMI 診斷更具挑戰性。但 RBBB 並不會完全掩蓋 STEMI 的 ST 段變化。
                </p>

                <DataTable
                    headerBg="linear-gradient(135deg, #f59e0b, #d97706)"
                    headers={['導程', 'RBBB + STEMI 判讀要點']}
                    rows={[
                        ['<strong>V1-V3</strong>', 'ST elevation 可能被 RBBB 混淆（V1-V3 本來就有次發性 ST-T 變化），但若 ST 抬高程度 excessive，仍高度懷疑 STEMI'],
                        ['<strong>V4-V6, I, aVL</strong>', 'ST elevation 不受 RBBB 影響，<strong>最有診斷價值</strong>，強烈提示 STEMI'],
                        ['<strong>II, III, aVF</strong>', 'ST elevation 不受 RBBB 影響，可能為 inferior MI'],
                    ]}
                />

                <div style={{background:'rgba(220,38,38,0.1)',borderRadius:'12px',padding:'16px',marginTop:'12px'}}>
                    <h4 style={{color:'#DC2626',marginBottom:'8px'}}>RBBB + STEMI 處置要點：</h4>
                    <ol style={{fontSize:'0.88rem',lineHeight:1.8,paddingLeft:'20px'}}>
                        <li><strong>RBBB + 胸痛 = 高度警覺</strong>，不可掉以輕心</li>
                        <li><strong>新發 RBBB + 胸痛 → 極可能 STEMI</strong>，應按 STEMI protocol 處理</li>
                        <li><strong>不確定時：寧可 over-call，不可 miss-call</strong></li>
                        <li><strong>準備 TCP</strong>（體外暫時性節律器）：RBBB STEMI 容易進展成 Complete AV block</li>
                    </ol>
                </div>

                <ImageFigure src="images-stemi/fig LBBB RBBB ACS.png" caption="LBBB 與 RBBB 背景下的 ACS 心電圖判讀" alt="LBBB RBBB ACS ECG" />
            </Card>

            {/* 4.3 Posterior MI */}
            <Card title="4.3 後壁 MI（容易被漏掉！）" icon="🔄" accentColor="#8b5cf6">
                <ul style={{fontSize:'0.88rem',lineHeight:1.8,paddingLeft:'20px'}}>
                    <li>V1-V3 ST 下降 + R 波增高 = 後壁梗塞的<strong>鏡像變化</strong>（mirror image）</li>
                    <li>必須加做 <strong>V7-V9</strong> 確認（V7-V9 ST 抬高 ≥ 0.5mm）</li>
                    <li>責任血管通常為 LCX 或 RCA 後降支</li>
                    <li>常合併下壁或側壁梗塞</li>
                </ul>
                <InfoBox type="warning">
                    V1-V3 ST 下降常被誤認為「前壁缺血」而延誤診斷！看到 V1-V3 ST 下降 + R 波增高，第一反應應該是：<strong>加做 V7-V9！</strong>
                </InfoBox>
            </Card>

            {/* 4.4 RV Infarction */}
            <Card title="4.4 右室梗塞" icon="❤️" accentColor="#f59e0b">
                <ul style={{fontSize:'0.88rem',lineHeight:1.8,paddingLeft:'20px'}}>
                    <li>下壁 MI + 低血壓 → <strong>立即加做右胸導程 V3R-V6R</strong></li>
                    <li>V4R ST 抬高 ≥ 1mm → 診斷 RV infarction（敏感性 88%，特異性 78%）</li>
                    <li>責任血管：RCA 近端閉塞（marginal branch 之前）</li>
                </ul>
                <InfoBox type="danger">
                    <strong>禁用 NTG！</strong>右室梗塞的血行動力學完全依賴前負荷（preload-dependent）。硝化甘油會降低靜脈回流，導致嚴重低血壓甚至心因性休克。需積極輸液（500-1000mL NS bolus）維持血壓。
                </InfoBox>
            </Card>

            {/* 4.5 Pacemaker */}
            <Card title="4.5 起搏器患者" icon="🔋" accentColor="#06b6d4">
                <ul style={{fontSize:'0.88rem',lineHeight:1.8,paddingLeft:'20px'}}>
                    <li>起搏器節律（ventricular pacing）的 ECG 類似 LBBB，ST-T 波形態改變</li>
                    <li>觀察自身心律窗口（若有 native beats），評估 ST 段變化</li>
                    <li>注意起搏器感知異常（sensing failure）可能掩蓋 ST 變化</li>
                    <li><strong>比較先前 ECG</strong>，任何新變化都值得警覺</li>
                    <li>主要依賴臨床症狀與肌鈣蛋白（Troponin）變化做診斷</li>
                    <li>可嘗試 Sgarbossa 準則（但在起搏器節律下準確度較低）</li>
                </ul>
                <ImageFigure src="images-stemi/fig pacemaker ECG.png" caption="起搏器節律下的 ECG 判讀：注意 ST 段變化可能被掩蓋" alt="Pacemaker ECG" />
            </Card>
        </div>
    );
}

}

                    <h4 style={{color:'#3b82f6',marginBottom:'8px',display:'flex',alignItems:'center',gap:'8px'}}>
                        Pattern 4 — S1 遠端 / D1 近端
                        <span style={{background:'#3b82f6',color:'white',padding:'2px 8px',borderRadius:'4px',fontSize:'0.75rem'}}>中等風險</span>
                    </h4>
                    <ul style={{fontSize:'0.88rem',lineHeight:1.8,paddingLeft:'20px'}}>
                        <li><strong>aVL, I, V5, V6 ST 抬高</strong>（對角枝受累 → 側壁受累）</li>
                        <li><strong>III ST 壓低 {'>'} II</strong>（與側壁抬高對應的交互變化）</li>
                        <li>對角枝受累但間隔支未受累</li>
                    </ul>
                    <ImageFigure src="images-stemi/fig_ACS ECG LAD 4.png" caption="Pattern 4：S1 遠端 / D1 近端 ECG 範例" alt="LAD Pattern 4" />
                </div>
            </Card>

            {/* 7.4 Left Main */}
            <Card title="7.4 左主幹阻塞線索" icon="🔴" accentColor="#DC2626">
                <InfoBox type="danger">
                    <strong>當 aVR ST 抬高 {'>'} V1 ST 抬高 → 高度懷疑左主幹（LM）阻塞！</strong><br/>
                    左主幹阻塞造成廣泛性心肌缺血，預後極差。需要緊急手術或 PCI 介入。
                </InfoBox>
                <ul style={{fontSize:'0.88rem',lineHeight:1.8,paddingLeft:'20px',marginBottom:'12px'}}>
                    <li>aVR ST 抬高為全域缺血的指標</li>
                    <li>多導聯瀰漫性 ST 下降 + aVR ST 抬高 = LM 或 LAD 近端重度病變</li>
                    <li>常合併血行動力學不穩定（心因性休克）</li>
                    <li>需要 IABP 或 ECMO 支持</li>
                </ul>
                <ImageFigure src="images-stemi/fig_ACS ECG LM.png" caption="左主幹阻塞 ECG：注意 aVR ST 抬高 > V1 ST 抬高" alt="Left Main ECG" />
            </Card>

            {/* Killip Classification */}
            <Card title="7.5 Killip 分類與預後" icon="📊" accentColor="#8b5cf6">
                <DataTable
                    headerBg="linear-gradient(135deg, #8b5cf6, #6d28d9)"
                    headers={['Killip Class', '臨床表現', '院內死亡率']}
                    rows={[
                        ['<strong>Class I</strong>', '無心衰竭徵象<br/>無肺囉音、無 S3', '<strong style="color:#10b981">6%</strong>'],
                        ['<strong>Class II</strong>', '輕度心衰竭<br/>肺底囉音、S3、頸靜脈怒張', '<strong style="color:#f59e0b">17%</strong>'],
                        ['<strong>Class III</strong>', '肺水腫<br/>瀰漫性肺囉音、呼吸困難', '<strong style="color:#f97316">38%</strong>'],
                        ['<strong>Class IV</strong>', '心因性休克<br/>SBP < 90mmHg、末梢灌流不足', '<strong style="color:#DC2626">81%</strong>'],
                    ]}
                />
            </Card>

            {/* Mechanical Complications */}
            <Card title="7.6 機械性併發症" icon="⚙️" accentColor="#DC2626">
                <DataTable
                    headerBg="linear-gradient(135deg, #DC2626, #991b1b)"
                    headers={['併發症', '發生時間', '臨床特徵', '處置']}
                    rows={[
                        ['<strong>心室中隔穿孔</strong><br/>(VSD)', '梗塞後 2-7 天', '新出現全收縮期雜音<br/>Echo 可見 shunt flow<br/>急性血行動力學惡化', '緊急手術修補<br/>IABP 支持<br/>Afterload reduction'],
                        ['<strong>二尖瓣逆流</strong><br/>(MR)', '急性或亞急性', '乳頭肌缺血 / 斷裂<br/>急性肺水腫<br/>新出現收縮期雜音', '緊急手術（嚴重 MR）<br/>IABP + Vasodilator<br/>PCI 改善缺血'],
                        ['<strong>游離壁破裂</strong><br/>(Free Wall Rupture)', '梗塞後 3-5 天', '突發心包填塞<br/>電氣機械解離（PEA）<br/>致命率極高', '緊急心包穿刺引流<br/>緊急開胸手術<br/>多數不及搶救'],
                    ]}
                />
                <InfoBox type="warning">
                    機械性併發症好發於梗塞後 2-7 天，注意此「危險窗口期」。CCU 照護期間若突發血行動力學變化，應立即 Echo 排除機械性併發症。
                </InfoBox>
            </Card>
        </div>
    );
}

// ===== TAB 8: Quiz =====
function TabQuiz() {
    const [answers, setAnswers] = useState(() => {
        try { return JSON.parse(localStorage.getItem('stemi-quiz-answers') || '{}'); } catch(e) { return {}; }
    });
    const [revealed, setRevealed] = useState({});

    const selectAnswer = (qIdx, aIdx) => {
        const next = {...answers, [qIdx]: aIdx};
        setAnswers(next);
        localStorage.setItem('stemi-quiz-answers', JSON.stringify(next));
    };

    const revealAnswer = (qIdx) => {
        setRevealed(prev => ({...prev, [qIdx]: true}));
    };

    const resetQuiz = () => {
        setAnswers({});
        setRevealed({});
        localStorage.removeItem('stemi-quiz-answers');
    };

    const totalAnswered = Object.keys(answers).length;
    const totalCorrect = Object.entries(answers).filter(([k,v]) => v === quizQuestions[parseInt(k)].answer).length;

    return (
        <div className="fade-in">
            <SectionTitle icon="🏆">臨床教育考題</SectionTitle>

            {/* Score Tracker */}
            <Card title="學習進度" icon="📊" accentColor="#8b5cf6">
                <div style={{display:'flex',alignItems:'center',gap:'16px',flexWrap:'wrap'}}>
                    <div style={{flex:1,minWidth:'200px'}}>
                        <div style={{display:'flex',justifyContent:'space-between',marginBottom:'4px',fontSize:'0.85rem'}}>
                            <span>已完成：{totalAnswered} / {quizQuestions.length}</span>
                            <span>正確：{totalCorrect} / {totalAnswered || 0}</span>
                        </div>
                        <div style={{height:'8px',background:'var(--border)',borderRadius:'4px',overflow:'hidden'}}>
                            <div style={{height:'100%',width:`${(totalAnswered/quizQuestions.length)*100}%`,background:'linear-gradient(90deg, #8b5cf6, #3b82f6)',borderRadius:'4px',transition:'width 0.3s'}} />
                        </div>
                    </div>
                    <button onClick={resetQuiz} style={{padding:'8px 16px',borderRadius:'8px',border:'1px solid var(--border-light)',background:'transparent',color:'var(--text-secondary)',cursor:'pointer',fontSize:'0.8rem'}}>重新測驗</button>
                </div>
                {totalAnswered === quizQuestions.length && (
                    <div style={{marginTop:'12px',textAlign:'center',padding:'12px',background:totalCorrect >= 8 ? 'rgba(16,185,129,0.15)' : totalCorrect >= 6 ? 'rgba(245,158,11,0.15)' : 'rgba(220,38,38,0.15)',borderRadius:'8px'}}>
                        <span style={{fontSize:'1.1rem',fontWeight:700,color:totalCorrect >= 8 ? '#10b981' : totalCorrect >= 6 ? '#f59e0b' : '#DC2626'}}>
                            {totalCorrect >= 8 ? '太棒了！你已經掌握 STEMI 急診處置的核心知識！' : totalCorrect >= 6 ? '不錯！建議再複習錯誤的題目加強記憶。' : '加油！建議回頭複習各個章節內容再重新測驗。'}
                        </span>
                    </div>
                )}
            </Card>

            {/* Questions */}
            {quizQuestions.map((q, qIdx) => {
                const userAnswer = answers[qIdx];
                const isRevealed = revealed[qIdx];
                const isCorrect = userAnswer === q.answer;

                return (
                    <Card key={qIdx} accentColor={isRevealed ? (isCorrect ? '#10b981' : '#DC2626') : '#3b82f6'} style={{marginBottom:'16px'}}>
                        <div style={{fontSize:'0.95rem',fontWeight:600,marginBottom:'12px',lineHeight:1.6,color:'var(--text-primary)'}}>
                            {q.q}
                        </div>

                        <div style={{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'12px'}}>
                            {q.options.map((opt, aIdx) => {
                                const isSelected = userAnswer === aIdx;
                                const isCorrectOption = q.answer === aIdx;
                                let optBg = 'rgba(30,41,59,0.6)';
                                let optBorder = 'var(--border-light)';
                                let optColor = 'var(--text-primary)';

                                if (isRevealed) {
                                    if (isCorrectOption) {
                                        optBg = 'rgba(16,185,129,0.2)';
                                        optBorder = '#10b981';
                                        optColor = '#10b981';
                                    } else if (isSelected && !isCorrectOption) {
                                        optBg = 'rgba(220,38,38,0.2)';
                                        optBorder = '#DC2626';
                                        optColor = '#DC2626';
                                    }
                                } else if (isSelected) {
                                    optBg = 'rgba(59,130,246,0.2)';
                                    optBorder = '#3b82f6';
                                    optColor = '#3b82f6';
                                }

                                return (
                                    <button
                                        key={aIdx}
                                        onClick={() => !isRevealed && selectAnswer(qIdx, aIdx)}
                                        disabled={isRevealed}
                                        style={{
                                            display:'flex',alignItems:'center',gap:'10px',
                                            padding:'10px 14px',borderRadius:'8px',
                                            background:optBg,border:`1px solid ${optBorder}`,
                                            color:optColor,cursor:isRevealed?'default':'pointer',
                                            fontSize:'0.88rem',textAlign:'left',
                                            transition:'all 0.2s',lineHeight:1.5
                                        }}
                                    >
                                        <span style={{fontWeight:600,flexShrink:0}}>{String.fromCharCode(65+aIdx)}.</span>
                                        <span>{opt}</span>
                                        {isRevealed && isCorrectOption && <span style={{marginLeft:'auto',flexShrink:0}}>&#10003;</span>}
                                        {isRevealed && isSelected && !isCorrectOption && <span style={{marginLeft:'auto',flexShrink:0}}>&#10007;</span>}
                                    </button>
                                );
                            })}
                        </div>

                        {!isRevealed && userAnswer !== undefined && (
                            <button
                                onClick={() => revealAnswer(qIdx)}
                                style={{
                                    padding:'8px 20px',borderRadius:'8px',
                                    background:'linear-gradient(135deg, #3b82f6, #2563eb)',
                                    border:'none',color:'white',cursor:'pointer',
                                    fontSize:'0.88rem',fontWeight:600
                                }}
                            >
                                顯示答案
                            </button>
                        )}

                        {isRevealed && (
                            <div className="fade-in" style={{
                                marginTop:'12px',padding:'14px',borderRadius:'10px',
                                background:isCorrect ? 'rgba(16,185,129,0.1)' : 'rgba(220,38,38,0.1)',
                                borderLeft:`4px solid ${isCorrect ? '#10b981' : '#DC2626'}`
                            }}>
                                <div style={{fontWeight:700,marginBottom:'6px',color:isCorrect ? '#10b981' : '#DC2626'}}>
                                    {isCorrect ? '正確！' : '不正確'}
                                </div>
                                <div style={{fontSize:'0.88rem',lineHeight:1.7,color:'var(--text-primary)'}}>
                                    {q.explain}
                                </div>
                            </div>
                        )}
                    </Card>
                );
            })}
        </div>
    );
}

// ==================== MAIN APP ====================

function App() {
    const [activeTab, setActiveTab] = useState('sop');

    const renderTab = () => {
        switch(activeTab) {
            case 'sop': return <TabSOP />;
            case 'ecg': return <TabECG />;
            case 'coronary': return <TabCoronary />;
            case 'pitfalls': return <TabPitfalls />;
            case 'meds': return <TabMeds />;
            case 'ddx': return <TabDDx />;
            case 'advanced': return <TabAdvanced />;
            case 'quiz': return <TabQuiz />;
            default: return <TabSOP />;
        }
    };

    return (
        <div>
            {/* Header */}
            <div style={{
                background:'linear-gradient(135deg, #1e3a5f 0%, #DC2626 100%)',
                padding:'30px 20px 24px',
                textAlign:'center',
                borderBottom:'3px solid #DC2626'
            }}>
                <div style={{fontSize:'0.75rem',color:'rgba(255,255,255,0.7)',marginBottom:'4px',letterSpacing:'1px'}}>
                    國立臺灣大學醫學院附設醫院新竹臺大分院 心血管中心
                </div>
                <h1 style={{fontSize:'1.6rem',fontWeight:700,color:'white',marginBottom:'6px',lineHeight:1.3}}>
                    STEMI 急診處置與 ECG 早期判讀
                </h1>
                <div style={{fontSize:'0.85rem',color:'rgba(255,255,255,0.8)',marginBottom:'8px'}}>
                    ER STEMI Protocol &amp; Early ECG Diagnosis
                </div>
                <div style={{fontSize:'0.7rem',color:'rgba(255,255,255,0.5)'}}>
                    適用對象：急診科、心臟內科醫師、住院醫師、專科護理師、實習醫師
                </div>
            </div>

            {/* Content */}
            <div style={{maxWidth:'800px',margin:'0 auto',padding:'16px'}}>
                {renderTab()}
            </div>

            {/* Tab Bar */}
            <div style={{
                position:'fixed',bottom:0,left:0,right:0,
                background:'rgba(15,23,42,0.95)',
                backdropFilter:'blur(12px)',
                borderTop:'1px solid var(--border-light)',
                display:'flex',
                overflowX:'auto',
                zIndex:999,
                padding:'4px 0',
                WebkitOverflowScrolling:'touch'
            }}>
                {tabs.map(tab => (
                    <button
                        key={tab.id}
                        onClick={() => { setActiveTab(tab.id); window.scrollTo({top:0,behavior:'smooth'}); }}
                        style={{
                            flex:'1 0 auto',
                            minWidth:'70px',
                            display:'flex',
                            flexDirection:'column',
                            alignItems:'center',
                            gap:'2px',
                            padding:'8px 6px',
                            border:'none',
                            background: activeTab === tab.id ? 'rgba(220,38,38,0.15)' : 'transparent',
                            color: activeTab === tab.id ? '#DC2626' : 'var(--text-muted)',
                            cursor:'pointer',
                            transition:'all 0.2s',
                            borderTop: activeTab === tab.id ? '2px solid #DC2626' : '2px solid transparent',
                            fontSize:'0.65rem',
                            fontFamily:'Noto Sans TC, sans-serif'
                        }}
                    >
                        <span style={{fontSize:'1.2rem'}}>{tab.icon}</span>
                        <span style={{fontWeight: activeTab === tab.id ? 600 : 400, whiteSpace:'nowrap'}}>{tab.label}</span>
                    </button>
                ))}
            </div>
        </div>
    );
}

ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
